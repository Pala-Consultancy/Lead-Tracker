<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATRACK - Email campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#3730B3; --teal-deep:#191659;
    --success:#1F6F5C; --success-soft:#DCEEE8;
    --fail:#B43B32; --fail-soft:#FAE1DE;
    --amber:#C97C00; --amber-soft:#FFF1DC;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 2px 6px rgba(16,24,40,0.05), 0 10px 24px -8px rgba(16,24,40,0.09);
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.05);
    --shadow-lg: 0 4px 10px rgba(16,24,40,0.06), 0 20px 40px -12px rgba(16,24,40,0.16);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appRoot{display:none;height:100vh;}
  #appRoot.reveal{animation:pageFade .4s ease both;}
  @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .seq-sidebar{
    width:200px;flex-shrink:0;height:100%;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;
  }
  .seq-sidebar-logo{
    width:34px;height:34px;border-radius:10px;overflow:hidden;
    margin-bottom:20px;box-shadow:0 3px 8px rgba(28,91,158,0.28);
  }
  .seq-sidebar-user{display:flex;align-items:center;gap:9px;padding:6px 8px;margin-bottom:22px;}
  .seq-sidebar-avatar{
    width:30px;height:30px;border-radius:50%;background:var(--panel-alt);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0;
  }
  .seq-sidebar-user span{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seq-sidebar-nav{display:flex;flex-direction:column;gap:2px;}
  .seq-sidebar-link{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
    text-decoration:none;color:var(--slate);font-size:13px;font-weight:600;transition:background .12s, color .12s;
  }
  .seq-sidebar-link .icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
  .seq-sidebar-link:hover{background:var(--panel-alt);color:var(--ink);}
  .seq-sidebar-link.active{background:var(--panel-alt);color:var(--teal);}
  /* Section labels in the shared side panel */
  .seq-sidebar-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-light,#8CA0B3);padding:14px 10px 4px;}
  .seq-sidebar-nav .seq-sidebar-label:first-child{padding-top:0;}
  .seq-sidebar-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}

  .seq-main{flex:1;min-width:0;height:100%;overflow-y:auto;}
  .shell{max-width:820px;margin:0 auto;padding:36px 22px 90px;}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:none;margin:0 0 18px;transition:color .12s, transform .12s;}
  .back-link:hover{color:var(--teal);transform:translateX(-2px);}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .page-title{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;margin:0 0 4px;}
  .page-sub{font-size:13.5px;color:var(--slate);margin:0;}
  .new-seq-btn{
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));color:#fff;border:none;border-radius:10px;padding:12px 20px;
    font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;
    box-shadow:0 4px 14px rgba(28,91,158,0.32);transition:transform .12s ease, box-shadow .12s ease;
  }
  .new-seq-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(28,91,158,0.4);}
  .new-seq-btn:active{transform:translateY(0) scale(.98);}
  .new-seq-btn.secondary{background:var(--panel);color:var(--teal);border:1.5px solid var(--teal);box-shadow:none;}
  .new-seq-btn.secondary:hover{background:var(--panel-alt);box-shadow:none;}

  .reply-stats-strip{
    display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:14px 20px;margin-bottom:18px;box-shadow:var(--shadow);flex-wrap:wrap;
  }
  .reply-stat{display:flex;flex-direction:column;gap:2px;}
  .reply-stat-value{font-family:'Sora',sans-serif;font-size:19px;font-weight:800;color:var(--ink);}
  .reply-stat-value.highlight{color:var(--success);}
  .reply-stat-label{font-size:11.5px;color:var(--slate);white-space:nowrap;}
  .reply-stat-divider{width:1px;height:30px;background:var(--border);}
  .reply-stat-bar{flex:1;min-width:140px;height:8px;border-radius:20px;background:var(--border-soft);overflow:hidden;}
  .reply-stat-bar-fill{height:100%;background:linear-gradient(90deg, var(--success), #164F41);border-radius:20px;transition:width .4s ease;}

  .status-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .status-chip{padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--slate);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
  .status-chip:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px);}
  .status-chip.active{background:linear-gradient(135deg, var(--teal), var(--teal-deep));border-color:var(--teal);color:#fff;box-shadow:0 3px 10px rgba(28,91,158,0.28);}

  @keyframes seqCardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .seq-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;
    box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:16px;
    transition:border-color .15s, transform .15s, box-shadow .15s;
    animation:seqCardIn .3s cubic-bezier(.2,.8,.3,1) both;
  }
  .seq-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 8px 22px -8px rgba(28,91,158,0.3);}
  .seq-card-icon{
    width:42px;height:42px;border-radius:50%;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    box-shadow:0 2px 8px rgba(28,91,158,0.3);
  }
  .seq-card-body{flex:1;min-width:0;}
  .seq-card-name{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;}
  .seq-card-meta{font-size:12px;color:var(--slate);margin-top:3px;}
  .seq-card-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap;}
  .seq-card-badge.draft{background:var(--border-soft);color:var(--slate);}
  .seq-card-badge.paused{background:var(--amber-soft);color:var(--amber);}
  .seq-card-badge.active{background:var(--amber-soft);color:var(--amber);}
  .seq-card-badge.completed{background:var(--success-soft);color:var(--success);}
  .seq-card-badge.stopped_replied{background:var(--success-soft);color:var(--success);}
  .seq-card-badge.stopped_status_change{background:var(--success-soft);color:var(--success);}
  .seq-card-badge.needs_attention{background:var(--fail-soft);color:var(--fail);}
  .seq-card-chevron{color:var(--slate-light);flex-shrink:0;transition:transform .15s;}
  .seq-card:hover .seq-card-chevron{transform:translateX(3px);color:var(--teal);}
  .seq-customize-btn{
    flex-shrink:0;background:none;border:1px solid transparent;border-radius:8px;font-size:15px;
    padding:6px 8px;cursor:pointer;opacity:0;transition:opacity .12s, border-color .12s, background .12s;
  }
  .seq-card:hover .seq-customize-btn{opacity:1;}
  .seq-customize-btn:hover{border-color:var(--border);background:var(--panel-alt);}

  .seq-card.trashed{cursor:default;opacity:.85;}
  .seq-card.trashed:hover{transform:none;box-shadow:var(--shadow);border-color:var(--border);}
  .seq-card.trashed .seq-card-icon{background:var(--border-soft);color:var(--slate);}
  .seq-card-trash-actions{display:flex;gap:8px;flex-shrink:0;}
  .seq-trash-btn{
    font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;
    border:1px solid var(--border);background:var(--panel);transition:all .12s;
  }
  .seq-trash-btn.restore:hover{border-color:var(--success);color:var(--success);background:var(--success-soft);}
  .seq-trash-btn.forever{color:var(--fail);border-color:var(--fail);}
  .seq-trash-btn.forever:hover{background:var(--fail-soft);}
  .seq-trash-btn:disabled{opacity:.6;cursor:default;}

  .empty-state{text-align:center;padding:70px 20px;color:var(--slate);border:1px dashed var(--border);border-radius:16px;}

  .detail-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .detail-section-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;margin:24px 0 12px;}
  .detail-lead-row{
    display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
    transition:border-color .15s, transform .15s;
  }
  .detail-lead-row:hover{border-color:var(--teal);transform:translateY(-1px);}
  .detail-lead-avatar{
    width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg, var(--teal), var(--teal-deep));color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;
  }
  .detail-lead-body{flex:1;min-width:0;}
  .detail-lead-name{font-weight:700;font-size:13.5px;}
  .detail-lead-email{font-size:12px;color:var(--slate);}
  .empty-state h3{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;color:var(--ink);margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0 0 16px;}

  /* ---------- In-app confirm modal (replaces native browser confirm) ---------- */
  .app-confirm-overlay{
    position:fixed;inset:0;background:rgba(16,32,55,0.45);z-index:300;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .18s ease, visibility 0s linear .18s;
  }
  .app-confirm-overlay.open{opacity:1;visibility:visible;transition:opacity .18s ease;}
  .app-confirm-box{
    width:400px;max-width:90vw;background:var(--panel);border-radius:16px;padding:24px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.28);transform:scale(.94);transition:transform .18s ease;
  }
  .app-confirm-overlay.open .app-confirm-box{transform:scale(1);}
  .app-confirm-box h3{margin:0 0 10px;font-family:'Sora',sans-serif;font-size:17px;}
  .app-confirm-box p{margin:0;font-size:13.5px;color:var(--slate);line-height:1.55;}
  .app-confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .app-confirm-btn{
    padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);background:var(--panel);font-family:'Inter',sans-serif;transition:all .12s;
  }
  .app-confirm-btn:hover{border-color:var(--slate);}
  .app-confirm-btn.primary{background:var(--fail);border-color:var(--fail);color:#fff;}
  .app-confirm-btn.primary:hover{background:#96302A;}

  /* ---------- Lead picker modal ---------- */
  .picker-overlay{
    position:fixed;inset:0;background:rgba(16,32,55,0.4);z-index:200;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .18s ease, visibility 0s linear .18s;
  }
  .picker-overlay.open{opacity:1;visibility:visible;transition:opacity .18s ease;}
  .picker-modal{
    width:440px;max-width:92vw;max-height:78vh;background:var(--panel);border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);display:flex;flex-direction:column;
    transform:scale(.96);transition:transform .18s ease;
  }
  .picker-overlay.open .picker-modal{transform:scale(1);}
  .picker-head{padding:20px 22px 14px;border-bottom:1px solid var(--border-soft);}
  .picker-head h3{margin:0 0 4px;font-family:'Sora',sans-serif;font-size:17px;}
  .picker-head p{margin:0 0 12px;font-size:12.5px;color:var(--slate);}
  .picker-search{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:9px;font:inherit;font-size:13.5px;}
  .picker-search:focus{outline:none;border-color:var(--teal);}
  .picker-list{overflow-y:auto;padding:8px;flex:1;}
  .picker-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;
  }
  .picker-item:hover{background:var(--panel-alt);}
  .picker-item-avatar{
    width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg, var(--teal), var(--teal-deep));color:#fff;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .picker-item-name{font-size:13.5px;font-weight:600;}
  .picker-item-email{font-size:11.5px;color:var(--slate);}
  .picker-empty{padding:30px;text-align:center;color:var(--slate);font-size:13px;}
  .picker-close{padding:14px 22px;border-top:1px solid var(--border-soft);text-align:right;}
  .picker-close button{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}

  .toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.danger{background:var(--fail);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--c-border-alt, var(--border));border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--slate-light);background-clip:padding-box;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .board-picker-overlay{
    position:fixed;inset:0;background:rgba(15,22,32,0.6);z-index:200;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:32px;
  }
  .board-picker-overlay.open{display:flex;}
  .board-picker-modal{
    background:var(--panel);border-radius:20px;
    box-shadow:0 40px 90px -20px rgba(0,0,0,0.5);
    width:100%;max-width:880px;max-height:min(760px, 86vh);display:flex;flex-direction:column;overflow:hidden;
    animation:board-picker-in .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes board-picker-in{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  .board-picker-header{
    display:flex;align-items:center;justify-content:space-between;padding:26px 30px 20px;
    flex-shrink:0;
  }
  .board-picker-header-text h3{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.015em;}
  .board-picker-header-text p{font-size:13px;color:var(--slate);margin:4px 0 0;}
  .board-picker-close{
    width:34px;height:34px;border-radius:10px;border:none;background:var(--c-blue-tint);color:var(--slate);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:background .12s ease, color .12s ease, transform .12s ease;
  }
  .board-picker-close:hover{background:var(--c-red-bg);color:var(--red);transform:rotate(90deg);}
  .board-picker-search-row{
    position:relative;padding:0 30px 18px;flex-shrink:0;
  }

      fx.appendChild(s);

    ring.gain.value = 0; mod.connect(ring.gain); carrier.connect(ring);
    var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.3, dur * 0.2, dur * 0.5);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan * 0.5, t + dur); g.connect(pn); out = pn; }
    ring.connect(hp); hp.connect(g); out.connect(ac.master); send(ac, out, 0.7);

  }
  // A warp "zip" for each shooting star: an FM sweep that phases past from one side to the other.
  function warp(ac, t, level, pan){
    var car = ac.createOscillator(), mod = ac.createOscillator(), idx = ac.createGain();
    car.type = 'sine'; mod.type = 'sine';
    car.frequency.setValueAtTime(420, t); car.frequency.exponentialRampToValueAtTime(140, t + 0.55);
    mod.frequency.setValueAtTime(420 * 2.47, t); mod.frequency.exponentialRampToValueAtTime(140 * 2.47, t + 0.55);
    idx.gain.setValueAtTime(900, t); idx.gain.exponentialRampToValueAtTime(30, t + 0.55);
    mod.connect(idx); idx.connect(car.frequency);
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(2400, t); bp.frequency.exponentialRampToValueAtTime(500, t + 0.55);
    var g = ac.createGain(); env(ac, g, t, level, 0.04, 0.08, 0.45);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan, t + 0.55); g.connect(pn); out = pn; }
    car.connect(bp); bp.connect(g); out.connect(ac.master); send(ac, out, 0.8);
    car.start(t); mod.start(t); car.stop(t + 0.65); mod.stop(t + 0.65);
  }
  // An alien choir: synthetic "voices" (saws through two moving formant filters)
  // singing an off-kilter chord, their vowel morphing from "ooh" to "aah".
  var VOWELS = {oo:[300, 870], aa:[730, 1090], ee:[290, 2250], ah:[650, 1400]};
  function alienChoir(ac, t, dur, freqs, level, from, to){
    var mix = ac.createGain(); mix.gain.value = 1;
    var f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter();
    [f1, f2].forEach(function(f, k){ f.type = 'bandpass'; f.Q.value = k ? 9 : 7;
      f.frequency.setValueAtTime(VOWELS[from][k], t); f.frequency.exponentialRampToValueAtTime(VOWELS[to][k], t + dur * 0.8); });
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.35, dur * 0.25, dur * 0.4);
    mix.connect(f1); mix.connect(f2); f1.connect(g); f2.connect(g); g.connect(ac.master); send(ac, g, 0.9);
    freqs.forEach(function(f){
      [-14, 0, 13].forEach(function(c){
        var o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = c;
        var vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 4.6 + Math.random(); vg.gain.value = 3.5;
        vib.connect(vg); vg.connect(o.detune);
        o.connect(mix); o.start(t); o.stop(t + dur + 0.1); vib.start(t); vib.stop(t + dur + 0.1);
      });
    });
  }
  // A theremin wail: a pure tone gliding with a wide, wavering vibrato (1950s UFO).
  function theremin(ac, t, dur, fFrom, fTo, level, pan){
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(fFrom, t); o.frequency.exponentialRampToValueAtTime(fTo, t + dur * 0.7);
    var vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.setValueAtTime(4.2, t); vib.frequency.linearRampToValueAtTime(6.8, t + dur);
    vg.gain.setValueAtTime(fFrom * 0.012, t); vg.gain.linearRampToValueAtTime(fTo * 0.035, t + dur); vib.connect(vg); vg.connect(o.frequency);
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.3, dur * 0.3, dur * 0.4);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan * 0.3, t + dur); g.connect(pn); out = pn; }
    o.connect(g); out.connect(ac.master); send(ac, out, 1.0);
    o.start(t); vib.start(t); o.stop(t + dur + 0.1); vib.stop(t + dur + 0.1);
  }
  // A sub drop: a very low tone sinking like a ship touching down.
  function subDrop(ac, t, level){
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(92, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.9);
    var g = ac.createGain(); env(ac, g, t, level, 0.06, 0.25, 0.8);
    o.connect(g); g.connect(ac.master); o.start(t); o.stop(t + 1.2);
  }
  function playThemeSound(toDark, x){
    if(!soundOn()) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + 0.02, pan = Math.max(-0.8, Math.min(0.8, (x / innerWidth) * 2 - 1));
    if(toDark){
      whoosh(ac, t, 1.3, 2600, 240, 0.22, pan);                                     // night rolls in
      pad(ac, t + 0.35, [110, 164.81, 220, 261.63], 0.04, 0.6, 0.5, 1.4, false);   // the deep, warm swell
      alienChoir(ac, t + 0.3, 2.3, [110, 155.56, 233.08, 311.13], 0.042, 'oo', 'aa'); // alien voices, an off-kilter chord
      alienHum(ac, t + 0.55, 1.9, 55, 0.03, 140, 1500, 320);                         // an alien energy hum wakes up
      subDrop(ac, t + 1.0, 0.11);                                                     // the ship touches down as the wave lands
      ringShimmer(ac, t + 0.85, 1.3, 740, 1130, 0.04, -pan);                         // metallic, otherworldly shimmer as the stars appear
      theremin(ac, t + 1.15, 1.5, 520, 880, 0.028, pan * 0.6);                       // a wavering theremin wail rises
      warp(ac, t + 1.05, 0.045, 0.7); warp(ac, t + 1.47, 0.035, 0.5);                // the two shooting stars phase past
    } else {
      whoosh(ac, t, 0.95, 280, 2800, 0.18, pan);                                    // morning rushes in
      pad(ac, t + 0.2, [261.63, 329.63, 392, 523.25], 0.045, 0.35, 0.4, 1.1, true); // bright, warm C-major sunrise
      alienHum(ac, t + 0.15, 1.1, 110, 0.028, 220, 3200, 1800);                      // a rising power-up
      alienChoir(ac, t + 0.1, 1.3, [261.63, 369.99, 466.16], 0.04, 'oo', 'ee');       // alien voices opening up into the light
      theremin(ac, t + 0.3, 0.9, 440, 990, 0.022, pan * 0.6);                         // a quick upward theremin glide
      ringShimmer(ac, t + 0.45, 0.8, 1180, 1710, 0.035, pan);                        // a bright metallic glint
    }
  }
  // Speaker button next to the light/dark switch (remembered per browser).
  function addSoundButton(){
    var light = document.getElementById('themeLightBtn');
    if(!light || document.getElementById('ptSoundBtn')) return;
    var b = document.createElement('button'); b.type = 'button'; b.id = 'ptSoundBtn';
    b.className = (light.className || '').replace(/\bactive\b/g, '').trim() + ' pt-sound-btn';
    var on = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
    var off = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
    function render(){ var s = soundOn(); b.innerHTML = s ? on : off; b.setAttribute('aria-pressed', s ? 'true' : 'false');
      b.title = s ? 'Transition sound on (click to mute)' : 'Transition sound off (click to turn on)'; b.setAttribute('aria-label', b.title); }
    b.addEventListener('click', function(e){
      e.stopPropagation();
      try{ localStorage.setItem(SOUND_KEY, soundOn() ? 'off' : 'on'); }catch(err){}
      render();
      if(soundOn()){ var ac = audio(); if(ac) bell(ac, ac.currentTime + 0.02, 1318.51, 0.03, 0); }  // a little "on" chime
    });
    render();
    (document.getElementById('themeDarkBtn') || light).insertAdjacentElement('afterend', b);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addSoundButton); else addSoundButton();

  // Going dark, the finale: two shooting stars streak across the sky.
  function meteors(){
    var fx = layer();
    for(var i = 0; i < 2; i++){
      var m = document.createElement('i'); m.className = 'pt-meteor';
      var sx = innerWidth * (0.55 + Math.random() * 0.4), sy = innerHeight * (0.05 + Math.random() * 0.3), ang = 155 + Math.random() * 15;
      m.style.cssText = 'left:' + (sx - 170) + 'px;top:' + sy + 'px;';
      fx.appendChild(m);
      var dx = Math.cos(ang * Math.PI / 180) * 420, dy = Math.sin(ang * Math.PI / 180) * 420;
      m.animate([
        {transform:'rotate(' + ang + 'deg) translateX(0) scaleX(.3)', opacity:0},
        {opacity:1, offset:.2},
        {transform:'translate(' + dx + 'px,' + dy + 'px) rotate(' + ang + 'deg) scaleX(1)', opacity:0}
      ], {duration:900, delay:350 + i * 420, easing:'cubic-bezier(.3,.6,.4,1)', fill:'both'});
    }
    setTimeout(function(){ fx.remove(); }, 2200);
  }
  // Going light: a warm sunrise glow blooms out from the button.
  function sunrise(x, y){
    var fx = layer(), sun = document.createElement('i'), R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) * 1.1;
    sun.className = 'pt-sun';
    sun.style.cssText = 'left:' + (x - R) + 'px;top:' + (y - R) + 'px;width:' + (R * 2) + 'px;height:' + (R * 2) + 'px;';
    fx.appendChild(sun);
    sun.animate([{opacity:0, transform:'scale(.15)'}, {opacity:1, transform:'scale(.7)', offset:.45}, {opacity:0, transform:'scale(1.05)'}],
      {duration:1300, easing:'cubic-bezier(.2,.7,.2,1)', fill:'both'}).onfinish = function(){ fx.remove(); };
  }
  document.addEventListener('click', function(e){
    var btn = e.target && e.target.closest && e.target.closest('#themeDarkBtn,#themeLightBtn');
    if(!btn || btn.__ptReplay) return;
    var toDark = btn.id === 'themeDarkBtn';
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(toDark === isDark || reduced()) return;           // nothing to animate: let the page handle it
    e.stopImmediatePropagation(); e.preventDefault();
    var r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    // A button without a position on screen (e.g. inside a panel that's closing):
    // start from where the click happened, or else from the middle of the screen.
    if(!r.width && !r.height){ x = e.clientX || innerWidth / 2; y = e.clientY || innerHeight / 2; }
    var radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 200;
    var replay = function(){ btn.__ptReplay = true; btn.click(); btn.__ptReplay = false; };
    var after = function(){ if(toDark){ starfield(x, y); meteors(); } else sunrise(x, y); };
    try{ playThemeSound(toDark, x); }catch(err){}
    if(document.startViewTransition){
      var root = document.documentElement;
      root.classList.add('pt-wave');
      root.style.setProperty('--pt-x', x + 'px'); root.style.setProperty('--pt-y', y + 'px');
      // A square mask centred on the button, growing until its soft edge is past every corner.
      var S = (radius / 0.86) * 2;
      var grow = function(size){ return [
        {WebkitMaskSize:'0px 0px', maskSize:'0px 0px', WebkitMaskPosition:x + 'px ' + y + 'px', maskPosition:x + 'px ' + y + 'px'},
        {WebkitMaskSize:size + 'px ' + size + 'px', maskSize:size + 'px ' + size + 'px',
         WebkitMaskPosition:(x - size / 2) + 'px ' + (y - size / 2) + 'px', maskPosition:(x - size / 2) + 'px ' + (y - size / 2) + 'px'}]; };
      var aurora = null, WAVE = toDark ? 1300 : 950;
      var t = document.startViewTransition(function(){
        replay();
        if(toDark){ aurora = document.createElement('div'); aurora.id = 'ptAurora'; aurora.setAttribute('aria-hidden', 'true'); document.body.appendChild(aurora); }
      });
      t.ready.then(function(){
        var ease = toDark ? 'cubic-bezier(.55,.08,.35,1)' : 'cubic-bezier(.4,0,.25,1)';   // night rolls in steadily; morning a little quicker
        // fill:'forwards' keeps the new theme fully shown until the transition ends (no flash of the old page).
        root.animate(grow(S), {duration:WAVE, easing:ease, fill:'forwards', pseudoElement:'::view-transition-new(root)'});
        if(toDark){
          // Dusk: the light page dims and cools as night rolls in.
          root.animate({filter:['brightness(1) saturate(1)', 'brightness(.62) saturate(.75) hue-rotate(-8deg)']},
            {duration:WAVE, easing:'ease-in', fill:'forwards', pseudoElement:'::view-transition-old(root)'});
          // The aurora band rides the front of the wave.
          root.animate(grow(S), {duration:WAVE, easing:ease, fill:'forwards', pseudoElement:'::view-transition-new(pt-aurora)'});
          setTimeout(function(){ if(aurora) aurora.style.opacity = '0'; }, WAVE - 120); // gone before the page shows again
        }
        setTimeout(after, toDark ? 700 : 420);  // stars / sunrise start while the wave is still rolling
      });
      t.finished.then(function(){ root.classList.remove('pt-wave'); root.style.removeProperty('--pt-x'); root.style.removeProperty('--pt-y'); if(aurora) aurora.remove(); });
    } else {
      var wipe = document.createElement('div'); wipe.className = 'pt-theme-wipe';
      wipe.style.background = toDark ? '#0D0F1F' : '#EFF5FC';
      document.body.appendChild(wipe);
      wipe.animate({clipPath:['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)']},
        {duration:650, easing:'cubic-bezier(.65,0,.25,1)', fill:'forwards'}).onfinish = function(){
          replay();
          wipe.animate({opacity:[1, 0]}, {duration:340, fill:'forwards'}).onfinish = function(){ wipe.remove(); };
          after();
        };
    }
  }, true);
})();

      Back to campaigns

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

  function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function initials(name){
    const parts = (name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  function showToast(message, danger){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast' + (danger ? ' danger' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'opacity .2s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 200);
    }, 3200);
  }

  // In-app replacement for the native browser confirm() dialog — matches
  // the rest of the app's styling instead of showing the browser's own
  // "this site says" popup. Returns a Promise<boolean>.
  function showConfirmModal({title, message, confirmLabel = 'OK'}){
    return new Promise(resolve=>{
      document.getElementById('appConfirmTitle').textContent = title;
      document.getElementById('appConfirmMessage').textContent = message;
      const okBtn = document.getElementById('appConfirmOkBtn');
      const cancelBtn = document.getElementById('appConfirmCancelBtn');
      const overlay = document.getElementById('appConfirmOverlay');
      okBtn.textContent = confirmLabel;
      overlay.classList.add('open');
      function cleanup(result){
        overlay.classList.remove('open');
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        overlay.removeEventListener('click', onBackdrop);
        resolve(result);
      }
      function onOk(){ cleanup(true); }
      function onCancel(){ cleanup(false); }
      function onBackdrop(e){ if(e.target === overlay) cleanup(false); }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      overlay.addEventListener('click', onBackdrop);
    });
  }

  const params = new URLSearchParams(location.search);
  const boardId = params.get('board');
  const campaignIdParam = params.get('campaignId');
  if(params.get('from') === 'home'){ try{ sessionStorage.setItem('ptFromHome', '1'); }catch(e){} }
  let cameFromHome = params.get('from') === 'home';
  try{ cameFromHome = cameFromHome || sessionStorage.getItem('ptFromHome') === '1'; }catch(e){}
  document.getElementById('backBtn').href = boardId ? `dashboard.html?board=${encodeURIComponent(boardId)}` : 'boards.html';
  document.getElementById('backBtn').onclick = function(){ if(history.length>1){ history.back(); return false; } };
  document.getElementById('detailBackLink').href = boardId ? `campaigns.html?board=${encodeURIComponent(boardId)}` : 'campaigns.html';
  const boardQS = boardId ? `?board=${encodeURIComponent(boardId)}` : '';
  let currentBoardName = '';   // shown in the empty state, e.g. "No campaigns yet for LinkedIn | London"
  document.getElementById('navDashboard').href = `dashboard.html${boardQS}`;
  document.getElementById('navSequences').href = `sequences.html${boardQS}`;
  document.getElementById('navScheduled').href = `scheduled-emails.html${boardQS}`;
  document.getElementById('navTrash').href = `trash.html${boardQS}`;

  let currentWorkspaceId = null;
  let updateCampaignStatusFn = null;
  let allSequenceDocs = []; // every /sequences doc for this board, used to compute per-campaign reply stats
  let activeFilter = 'all';
  let leadNames = {}; // leadId -> {name, email}, for the detail view's lead list

  function getLeadInfo(bId, lId){
    const key = `${bId}/${lId}`;
    if(leadNames[key]) return Promise.resolve(leadNames[key]);
    return db.doc(`workspaces/${currentWorkspaceId}/boards/${bId}/leads/${lId}`).get().then(doc=>{
      leadNames[key] = doc.exists ? {name: doc.data().name || 'Unnamed lead', email: doc.data().email || ''} : {name:'Deleted lead', email:''};
      return leadNames[key];
    }).catch(()=>({name:'Unknown lead', email:''}));
  }

  const STATUS_LABEL = {
    draft:'Draft', paused:'Paused', active:'Active', completed:'Completed',
    stopped_replied:'They replied', stopped_status_change:'Lead won/lost', needs_attention:'Needs attention'
  };

  // A campaign's own `status` field is the source of truth for draft/
  // paused/deleted — but "active" needs refining the same way a single
  // sequence's does: once every member sequence has stopped one way or
  // another (replied, ran out of steps, lead status changed, failed),
  // the campaign itself should read as "Completed" instead of forever
  // showing "Active" with nothing left actually running.
  function deriveCampaignStatus(campaign, memberSequences){
    if(campaign.status !== 'active') return campaign.status;
    const stillRunning = memberSequences.some(s => s.status === 'active');
    return stillRunning ? 'active' : 'completed';
  }

  function buildCampaignList(allCampaigns){
    const sequencesByCampaign = {};
    allSequenceDocs.forEach(seq=>{
      if(!seq.campaignId) return;
      if(!sequencesByCampaign[seq.campaignId]) sequencesByCampaign[seq.campaignId] = [];
      sequencesByCampaign[seq.campaignId].push(seq);
    });
    return allCampaigns.map(c=>{
      const members = sequencesByCampaign[c.id] || [];
      const repliedCount = members.filter(s => s.status === 'stopped_replied').length;
      return {
        campaignId: c.id, boardId: c.boardId, name: c.name || 'Untitled campaign',
        createdByName: c.createdByName,
        updatedAt: c.updatedAt || c.createdAt,
        stepCount: Array.isArray(c.steps) ? c.steps.length : 0,
        leadCount: c.leadCount || members.length,
        repliedCount,
        status: deriveCampaignStatus(c, members),
        previousStatus: c.previousStatus,
        members: members.map(s => ({sequenceId: s.id, leadId: s.leadId, status: s.status}))
      };
    }).sort((a,b)=>{
      const at = a.updatedAt ? a.updatedAt.toMillis() : 0;
      const bt = b.updatedAt ? b.updatedAt.toMillis() : 0;
      return bt - at;
    });
  }

  function renderReplyStatsStrip(campaignList){
    const strip = document.getElementById('replyStatsStrip');
    const live = campaignList.filter(c => c.status !== 'deleted');
    const started = live.filter(c => c.status !== 'draft');
    const totalLeads = started.reduce((sum, c) => sum + c.leadCount, 0);
    const totalReplied = started.reduce((sum, c) => sum + c.repliedCount, 0);
    const pct = totalLeads > 0 ? Math.round((totalReplied / totalLeads) * 100) : 0;
    const activeN = live.filter(c => c.status === 'active').length;
    strip.innerHTML = `
      <div class="cx-kpi"><span class="ic blue" aria-hidden="true">🚀</span><div><b>${activeN}</b><span>${activeN === 1 ? 'campaign' : 'campaigns'} running</span></div></div>
      <div class="cx-kpi"><span class="ic purple" aria-hidden="true">👥</span><div><b>${totalLeads}</b><span>leads reached</span></div></div>
      <div class="cx-kpi"><span class="ic green" aria-hidden="true">💬</span><div><b>${totalReplied}</b><span>${totalReplied === 1 ? 'reply' : 'replies'}</span></div></div>
      <div class="cx-kpi"><span class="ic amber" aria-hidden="true">📈</span><div><b>${pct}%</b><span>reply rate</span></div></div>`;
    // counts on the status filters
    const counts = {all: live.length, trash: campaignList.length - live.length};
    ['draft', 'active', 'paused', 'completed'].forEach(k=> counts[k] = live.filter(c=> c.status === k).length);
    document.querySelectorAll('[data-count]').forEach(el=> el.textContent = counts[el.dataset.count] || '');
  }


  function runCampaignAction(campaignId, action, btn, busyLabel){
    btn.disabled = true;
    const originalLabel = btn.textContent;
    btn.textContent = busyLabel;
    return updateCampaignStatusFn({workspaceId: currentWorkspaceId, campaignId, action}).catch(err=>{
      console.error(err);
      showToast('Could not update that campaign: ' + (err.message || 'please try again.'), true);
      btn.disabled = false;
      btn.textContent = originalLabel;
      throw err;
    });
  }

  function renderList(){
    const holder = document.getElementById('listHolder');
    const campaigns = buildCampaignList(allCampaignDocs);
    renderReplyStatsStrip(campaigns);
    const isTrash = activeFilter === 'trash';
    const q = (document.getElementById('cxSearch').value || '').trim().toLowerCase();
    const filtered = campaigns.filter(c=>{
      if(q && !(c.name + ' ' + (boardNames[c.boardId] || '') + ' ' + (c.createdByName || '')).toLowerCase().includes(q)) return false;
      if(isTrash) return c.status === 'deleted';
      if(c.status === 'deleted') return false;
      if(activeFilter === 'all') return true;
      return c.status === activeFilter;
    });
    if(filtered.length === 0){
      holder.innerHTML = `<div class="cx-empty">
        <div class="big" aria-hidden="true">${isTrash ? '🗑️' : '🎯'}</div>
        <h3>${q ? 'No campaigns match your search' : `No campaigns ${activeFilter === 'all' ? 'yet' : 'here'}${currentBoardName ? ` for ${esc(currentBoardName)}` : ''}`}</h3>
        <p>${q ? 'Try another word, or clear the search.' : isTrash ? "Nothing in the trash right now." : (activeFilter === 'all' ? 'Send one sequence to a group of leads at once, and follow every reply in one place.' : "No campaigns match this filter.")}</p>
        ${!q && !isTrash && activeFilter === 'all' ? '<button type="button" class="cx-new" onclick="document.getElementById(\'newCampaignBtn\').click()">🎯 Create your first campaign</button>' : ''}
      </div>`;
      return;
    }
    holder.innerHTML = `<div class="cx-grid">` + filtered.map((c, idx)=>{
      const pct = c.leadCount ? Math.round(c.repliedCount / c.leadCount * 100) : 0;
      const started = !isTrash && c.status !== 'draft';
      return `
      <article class="cx-card ${esc(c.status)}${isTrash ? ' trashed' : ''}" data-idx="${idx}" style="animation-delay:${Math.min(idx, 8) * 40}ms" ${isTrash ? '' : 'tabindex="0" role="link"'} aria-label="${esc(c.name)}">
        <div class="cx-top">
          <span class="seq-card-badge ${esc(c.status)}">${esc(STATUS_LABEL[c.status] || c.status)}</span>
          ${!boardId && boardNames[c.boardId] ? `<span class="cx-boardchip" title="Board">${esc(boardNames[c.boardId])}</span>` : ''}
        </div>
        <h3 class="cx-name">${esc(c.name)}</h3>
        <div class="cx-meta">${c.stepCount} step${c.stepCount === 1 ? '' : 's'} · ${c.leadCount} lead${c.leadCount === 1 ? '' : 's'} · by ${esc(c.createdByName || 'someone')}</div>
        ${started ? `<div class="cx-reply"><div class="cx-reply-row"><span><b>${c.repliedCount}</b> of ${c.leadCount} replied</span><b>${pct}%</b></div>
          <div class="cx-bar-track" aria-hidden="true"><i style="width:${pct}%"></i></div></div>`
          : `<div class="cx-reply muted">${isTrash ? 'In the trash' : 'Not started yet'}</div>`}
        <div class="cx-foot">
          ${isTrash ? `
            <button type="button" class="seq-trash-btn restore" data-ref="${idx}">Restore</button>
            <button type="button" class="seq-trash-btn forever" data-ref="${idx}">Delete forever</button>` : `
            ${c.status === 'active' ? `<button type="button" class="seq-trash-btn" data-action="pause" data-ref="${idx}">⏸ Pause</button>` : ''}
            ${c.status === 'paused' ? `<button type="button" class="seq-trash-btn restore" data-action="resume" data-ref="${idx}">▶ Resume</button>` : ''}
            <button type="button" class="seq-trash-btn forever" data-action="trash" data-ref="${idx}" title="${c.status === 'draft' ? 'Discard' : 'Move to trash'}">${c.status === 'draft' ? 'Discard' : '🗑️'}</button>
            <span class="cx-open">Open →</span>`}
        </div>
      </article>`;
    }).join('') + `</div>`;

    if(!isTrash){
      holder.querySelectorAll('.cx-card:not(.trashed)').forEach(card=>{
        const open = ()=>{ const c = filtered[Number(card.dataset.idx)]; location.href = `campaigns.html?board=${encodeURIComponent(c.boardId)}&campaignId=${encodeURIComponent(c.campaignId)}`; };
        card.addEventListener('click', (e)=>{ if(e.target.closest('.seq-trash-btn')) return; open(); });
        card.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !e.target.closest('.seq-trash-btn')) open(); });
      });
    }

    if(isTrash){
      holder.querySelectorAll('.seq-trash-btn.restore').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const c = filtered[Number(btn.dataset.ref)];
          runCampaignAction(c.campaignId, 'restore', btn, 'Restoring...')
            .then(()=> showToast('Campaign restored.'))
            .catch(()=>{});
        });
      });
      holder.querySelectorAll('.seq-trash-btn.forever').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const c = filtered[Number(btn.dataset.ref)];
          showConfirmModal({
            title: 'Delete this campaign forever?',
            message: `This removes the campaign and all ${c.leadCount} of its sequences completely, along with anything still scheduled. Emails already sent stay in each lead's history. This can't be undone.`,
            confirmLabel: 'Delete forever'
          }).then(ok=>{
            if(!ok) return;
            runCampaignAction(c.campaignId, 'delete_forever', btn, 'Deleting...')
              .then(()=> showToast('Deleted for good.'))
              .catch(()=>{});
          });
        });
      });
    } else {
      holder.querySelectorAll('[data-action="pause"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const c = filtered[Number(btn.dataset.ref)];
          runCampaignAction(c.campaignId, 'pause', btn, 'Pausing...')
            .then(()=> showToast('Campaign paused — nothing more will send from it until resumed.'))
            .catch(()=>{});
        });
      });
      holder.querySelectorAll('[data-action="resume"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const c = filtered[Number(btn.dataset.ref)];
          runCampaignAction(c.campaignId, 'resume', btn, 'Resuming...')
            .then(()=> showToast('Campaign resumed.'))
            .catch(()=>{});
        });
      });
      holder.querySelectorAll('[data-action="trash"]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const c = filtered[Number(btn.dataset.ref)];
          const isDraft = c.status === 'draft';
          showConfirmModal({
            title: isDraft ? 'Discard this campaign?' : 'Move this campaign to trash?',
            message: isDraft
              ? "This draft campaign hasn't been started — discarding removes it for good."
              : `It'll stop sending anything further to all ${c.leadCount} leads and move to Trash, where you can restore it or delete it for good later.`,
            confirmLabel: isDraft ? 'Discard' : 'Move to trash'
          }).then(ok=>{
            if(!ok) return;
            runCampaignAction(c.campaignId, isDraft ? 'delete_forever' : 'trash', btn, 'Working...')
              .then(()=> showToast(isDraft ? 'Discarded.' : 'Moved to trash.'))
              .catch(()=>{});
          });
        });
      });
    }
  }

  document.querySelectorAll('.status-chip[data-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeFilter = chip.dataset.filter;
      document.querySelectorAll('.status-chip[data-filter]').forEach(c=>c.classList.toggle('active', c===chip));
      renderList();
    });
  });

  document.getElementById('newCampaignBtn').addEventListener('click', ()=>{
    if(boardId){ location.href = `sequence-builder.html?board=${encodeURIComponent(boardId)}&campaign=1`; return; }
    window.__pickBoardForNewCampaign = true;
    if(window.__openBoardPicker) window.__openBoardPicker();
  });
  document.getElementById('cxSearch').addEventListener('input', ()=> renderList());
  document.getElementById('cxBoardSelect').addEventListener('change', e=>{
    location.href = 'campaigns.html' + (e.target.value ? '?board=' + encodeURIComponent(e.target.value) : '');
  });
  let boardNames = {};

  let unsubscribeCampaigns = null;
  let unsubscribeSequences = null;
  let allCampaignDocs = [];
  let campaignsLoaded = false, sequencesLoaded = false;

  function renderDetailView(){
    const campaign = allCampaignDocs.find(c => c.id === campaignIdParam);
    if(!campaign){
      document.getElementById('detailCampaignName').textContent = 'Campaign not found';
      document.getElementById('detailCampaignMeta').textContent = '';
      document.getElementById('detailActions').innerHTML = '';
      document.getElementById('detailStatsStrip').style.display = 'none';
      document.getElementById('detailLeadsList').innerHTML = '<div class="empty-state"><h3>Not found</h3><p>This campaign may have been deleted.</p></div>';
      return;
    }
    const members = allSequenceDocs.filter(s => s.campaignId === campaignIdParam);
    const status = deriveCampaignStatus(campaign, members);
    const repliedCount = members.filter(s => s.status === 'stopped_replied').length;
    const leadCount = campaign.leadCount || members.length;
    const stepCount = Array.isArray(campaign.steps) ? campaign.steps.length : 0;

    document.getElementById('detailCampaignName').textContent = campaign.name || 'Untitled campaign';
    document.getElementById('detailCampaignMeta').textContent =
      `${stepCount} step${stepCount===1?'':'s'} · ${leadCount} lead${leadCount===1?'':'s'} · started by ${campaign.createdByName || 'Someone'}`;

    const statsStrip = document.getElementById('detailStatsStrip');
    if(status === 'draft' || status === 'deleted'){
      statsStrip.style.display = 'none';
    } else {
      const pct = leadCount > 0 ? Math.round((repliedCount / leadCount) * 100) : 0;
      statsStrip.style.display = 'flex';
      statsStrip.innerHTML = `
        <div class="reply-stat"><div class="reply-stat-value">${leadCount}</div><div class="reply-stat-label">Total leads</div></div>
        <div class="reply-stat-divider"></div>
        <div class="reply-stat"><div class="reply-stat-value highlight">${repliedCount}</div><div class="reply-stat-label">Got a reply</div></div>
        <div class="reply-stat-divider"></div>
        <div class="reply-stat"><div class="reply-stat-value highlight">${pct}%</div><div class="reply-stat-label">Reply rate</div></div>
        <div class="reply-stat-bar"><div class="reply-stat-bar-fill" style="width:${pct}%;"></div></div>
      `;
    }

    const actionsEl = document.getElementById('detailActions');
    if(status === 'deleted'){
      actionsEl.innerHTML = `
        <button type="button" class="seq-trash-btn restore" id="detailRestoreBtn">Restore</button>
        <button type="button" class="seq-trash-btn forever" id="detailForeverBtn">Delete forever</button>
      `;
      document.getElementById('detailRestoreBtn').addEventListener('click', (e)=>{
        runCampaignAction(campaign.id, 'restore', e.currentTarget, 'Restoring...')
          .then(()=> showToast('Campaign restored.')).catch(()=>{});
      });
      document.getElementById('detailForeverBtn').addEventListener('click', (e)=>{
        showConfirmModal({
          title: 'Delete this campaign forever?',
          message: `This removes the campaign and all ${leadCount} of its sequences completely, along with anything still scheduled. This can't be undone.`,
          confirmLabel: 'Delete forever'
        }).then(ok=>{
          if(!ok) return;
          runCampaignAction(campaign.id, 'delete_forever', e.currentTarget, 'Deleting...').then(()=>{
            showToast('Deleted for good.');
            location.href = boardId ? `campaigns.html?board=${encodeURIComponent(boardId)}` : 'campaigns.html';
          }).catch(()=>{});
        });
      });
    } else {
      let btns = `<a class="seq-trash-btn" id="detailEditBtn" href="sequence-builder.html?board=${encodeURIComponent(campaign.boardId)}&campaign=1&campaignId=${encodeURIComponent(campaign.id)}" style="text-decoration:none;display:inline-flex;align-items:center;">✏️ Edit content</a>`;
      if(status === 'active') btns += `<button type="button" class="seq-trash-btn" id="detailPauseBtn">⏸ Pause all</button>`;
      if(status === 'paused') btns += `<button type="button" class="seq-trash-btn restore" id="detailResumeBtn">▶ Resume all</button>`;
      btns += `<button type="button" class="seq-trash-btn forever" id="detailTrashBtn">🗑️ ${status === 'draft' ? 'Discard' : 'Move to trash'}</button>`;
      actionsEl.innerHTML = btns;
      const pauseBtn = document.getElementById('detailPauseBtn');
      if(pauseBtn) pauseBtn.addEventListener('click', (e)=>{
        runCampaignAction(campaign.id, 'pause', e.currentTarget, 'Pausing...')
          .then(()=> showToast('Campaign paused — nothing more will send from it until resumed.')).catch(()=>{});
      });
      const resumeBtn = document.getElementById('detailResumeBtn');
      if(resumeBtn) resumeBtn.addEventListener('click', (e)=>{
        runCampaignAction(campaign.id, 'resume', e.currentTarget, 'Resuming...')
          .then(()=> showToast('Campaign resumed.')).catch(()=>{});
      });
      const trashBtn = document.getElementById('detailTrashBtn');
      if(trashBtn) trashBtn.addEventListener('click', (e)=>{
        const isDraft = status === 'draft';
        showConfirmModal({
          title: isDraft ? 'Discard this campaign?' : 'Move this campaign to trash?',
          message: isDraft
            ? "This draft campaign hasn't been started — discarding removes it for good."
            : `It'll stop sending anything further to all ${leadCount} leads and move to Trash, where you can restore it or delete it for good later.`,
          confirmLabel: isDraft ? 'Discard' : 'Move to trash'
        }).then(ok=>{
          if(!ok) return;
          runCampaignAction(campaign.id, isDraft ? 'delete_forever' : 'trash', e.currentTarget, 'Working...')
            .then(()=>{
              showToast(isDraft ? 'Discarded.' : 'Moved to trash.');
              if(isDraft) location.href = boardId ? `campaigns.html?board=${encodeURIComponent(boardId)}` : 'campaigns.html';
            }).catch(()=>{});
        });
      });
    }

    const listEl = document.getElementById('detailLeadsList');
    if(members.length === 0){
      listEl.innerHTML = `<div class="empty-state"><h3>No leads</h3><p>This campaign has no leads — they may have been skipped when it was created (no email on file, or already had a sequence running).</p></div>`;
      return;
    }
    listEl.innerHTML = members.map((m, idx)=>`
      <a class="detail-lead-row" href="sequence-builder.html?board=${encodeURIComponent(m.boardId)}&lead=${encodeURIComponent(m.leadId)}&sequenceId=${encodeURIComponent(m.id)}">
        <div class="detail-lead-avatar" data-avatar="${idx}">?</div>
        <div class="detail-lead-body">
          <div class="detail-lead-name" data-name="${idx}">Loading…</div>
          <div class="detail-lead-email" data-email="${idx}"></div>
        </div>
        <span class="seq-card-badge ${esc(m.status)}">${esc(STATUS_LABEL[m.status] || m.status)}</span>
      </a>
    `).join('');
    members.forEach((m, idx)=>{
      getLeadInfo(m.boardId, m.leadId).then(info=>{
        const nameEl = listEl.querySelector(`[data-name="${idx}"]`);
        const emailEl = listEl.querySelector(`[data-email="${idx}"]`);
        const avatarEl = listEl.querySelector(`[data-avatar="${idx}"]`);
        if(nameEl) nameEl.textContent = info.name;
        if(emailEl) emailEl.textContent = info.email;
        if(avatarEl) avatarEl.textContent = initials(info.name);
      });
    });
  }

  function revealAndRender(){
    if(!campaignsLoaded || !sequencesLoaded) return;
    document.getElementById('pageLoader').style.display = 'none';
    const appRoot = document.getElementById('appRoot');
    appRoot.style.display = 'flex';
    appRoot.classList.add('reveal');
    if(campaignIdParam){
      document.getElementById('listView').style.display = 'none';
      document.getElementById('detailView').style.display = '';
      renderDetailView();
    } else {
      document.getElementById('listView').style.display = '';
      document.getElementById('detailView').style.display = 'none';
      renderList();
    }
  }

  function startListening(workspaceId){
    currentWorkspaceId = workspaceId;
    // One board, or (without a board in the link) every board — sorted here, so no extra index.
    const campQ = boardId
      ? db.collection('campaigns').where('workspaceId', '==', workspaceId).where('boardId', '==', boardId).orderBy('updatedAt', 'desc').limit(300)
      : db.collection('campaigns').where('workspaceId', '==', workspaceId).limit(500);
    unsubscribeCampaigns = campQ
      .onSnapshot(snap=>{
        allCampaignDocs = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
        campaignsLoaded = true;
        revealAndRender();
      }, err=>{
        console.error('Could not load campaigns', err);
        campaignsLoaded = true;
        revealAndRender();
      });
    // Needed to compute each campaign's reply stats (how many of its
    // member sequences have stopped_replied) — same board-wide sequences
    // collection sequences.html already reads, just for reply counting
    // here rather than listing sequences individually.
    const seqQ = boardId
      ? db.collection('sequences').where('workspaceId', '==', workspaceId).where('boardId', '==', boardId).orderBy('updatedAt', 'desc').limit(1000)
      : db.collection('sequences').where('workspaceId', '==', workspaceId).limit(2000);
    unsubscribeSequences = seqQ
      .onSnapshot(snap=>{
        allSequenceDocs = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
        sequencesLoaded = true;
        revealAndRender();
      }, err=>{
        console.error('Could not load sequences', err);
        sequencesLoaded = true;
        revealAndRender();
      });
  }

  auth.onAuthStateChanged(user=>{
    if(!user){
      location.href = 'home.html';
      return;
    }
    // The sidebar's own name/avatar has nothing to do with which board is
    // selected, so load it right away instead of leaving the "?" / "…"
    // placeholders stuck forever on the "pick a board first" screen.
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const wsId = doc.exists ? doc.data().workspaceId : null;
      if(!wsId) return;
      return db.doc(`workspaces/${wsId}/members/${user.uid}`).get().then(memberDoc=>{
        const myName = (memberDoc.exists && memberDoc.data().name) || user.email || 'You';
        document.getElementById('seqSidebarUserName').textContent = myName;
        document.getElementById('seqSidebarAvatar').textContent = initials(myName);
      });
    }).catch(()=>{});
    updateCampaignStatusFn = firebase.functions().httpsCallable('updateCampaignStatus');
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const workspaceId = doc.exists ? doc.data().workspaceId : null;
      if(!workspaceId){
        showToast('Could not find your workspace.', true);
        return;
      }
      startListening(workspaceId);
      // Boards: the picker at the top, and board names on the cards.
      db.collection('workspaces').doc(workspaceId).collection('boards').get().then(snap=>{
        const list = snap.docs.map(d=>({id: d.id, ...d.data()})).filter(b=> b.deleted !== true).sort((a, b)=> (a.name || '').localeCompare(b.name || ''));
        boardNames = Object.fromEntries(list.map(b=> [b.id, b.name || 'Board']));
        document.getElementById('cxBoardSelect').innerHTML = '<option value="">All boards</option>' + list.map(b=> `<option value="${esc(b.id)}" ${b.id === boardId ? 'selected' : ''}>${esc(b.name || 'Board')}</option>`).join('');
        if(!boardId) renderList();
      }).catch(()=>{});
      if(!boardId){ document.getElementById('cxSub').textContent = 'One sequence sent to a group of leads at once, tracked and controlled together. Showing all boards.'; return; }
      // The chosen board's name, for the empty state and the subtitle.
      db.doc(`workspaces/${workspaceId}/boards/${boardId}`).get().then(b=>{
        currentBoardName = b.exists ? (b.data().name || '') : '';
        if(currentBoardName){
          const sub = document.getElementById('cxSub');
          if(sub) sub.textContent = `One sequence sent to a group of leads at once, tracked and controlled together. Showing ${currentBoardName}.`;
          const h = document.querySelector('.empty-state h3');
          if(h && /^No campaigns (yet|here)$/.test(h.textContent.trim())) h.textContent = h.textContent.trim() + ' for ' + currentBoardName;
        }
      }).catch(()=>{});
    }).catch(err=>{
      console.error(err);
      showToast('Could not load your workspace.', true);
    });
  });
  window.__openBoardPicker = function(){
    const overlay = document.getElementById('boardPickerOverlay');
    const list = document.getElementById('boardPickerList');
    const searchInput = document.getElementById('boardPickerSearch');
    overlay.classList.add('open');
    searchInput.value = '';
    list.innerHTML = '<div class="board-picker-loading">Loading your boards…</div>';
    const user = auth.currentUser;
    if(!user){ return; }
    let allBoards = [];
    let visibleBoards = [];
    let focusIdx = -1;
    let pickerWorkspaceId = null;
    const ACCENTS = [
      'linear-gradient(135deg, var(--c-blue-fg), var(--c-purple-fg))',
      'linear-gradient(135deg, var(--c-purple-fg), var(--c-amber-fg))',
      'linear-gradient(135deg, var(--c-amber-fg), var(--c-green-fg))',
      'linear-gradient(135deg, var(--c-green-fg), var(--c-blue-fg))',
      'linear-gradient(135deg, var(--c-red-fg), var(--c-amber-fg))'
    ];
    function setFocus(idx){
      const cards = list.querySelectorAll('.board-picker-card');
      cards.forEach(c=>c.classList.remove('kbd-focus'));
      if(idx < 0 || idx >= cards.length){ focusIdx = -1; return; }
      focusIdx = idx;
      cards[idx].classList.add('kbd-focus');
      cards[idx].scrollIntoView({block:'nearest'});
    }
    function goToBoard(id){
      if(window.__pickBoardForNewCampaign){ location.href = 'sequence-builder.html?board=' + encodeURIComponent(id) + '&campaign=1'; return; }
      location.href = 'campaigns.html?board=' + encodeURIComponent(id);
    }
    function renderPickerList(filter){
      const q = (filter || '').trim().toLowerCase();
      visibleBoards = q ? allBoards.filter(b=>(b.name||'').toLowerCase().includes(q)) : allBoards;
      focusIdx = -1;
      if(visibleBoards.length === 0){
        list.innerHTML = `<div class="board-picker-empty">${q ? 'No boards match "'+esc(filter)+'".' : "You don't have any boards yet."}</div>`;
        return;
      }
      list.innerHTML = visibleBoards.map((b,i)=>{
        const icon = b.customIcon ? esc(b.customIcon) : '📋';
        const accent = b.customAccent ? `linear-gradient(135deg, ${b.customAccent})` : ACCENTS[i % ACCENTS.length];
        const tags = [b.defaultCountry, b.defaultCity, b.defaultIndustry, b.defaultSource].filter(Boolean).slice(0,3);
        const tagsHTML = tags.length ? `<div class="board-picker-tags">${tags.map(tg=>`<span class="board-picker-tag">${esc(tg)}</span>`).join('')}</div>` : '';
        return `<div class="board-picker-card" style="--card-accent:${accent};animation-delay:${Math.min(i,10)*25}ms" onclick="window.__goToPickerBoard('${b.id}')" tabindex="0">
          <div class="board-picker-icon">${icon}</div>
          <div class="board-picker-name">${esc(b.name || 'Untitled board')}</div>
          ${tagsHTML}
          <div class="board-picker-foot">
            <span class="board-picker-count" id="pickerCount-${b.id}">···</span>
            <span class="board-picker-arrow">→</span>
          </div>
        </div>`;
      }).join('');
      visibleBoards.forEach(b=>{
        if(!pickerWorkspaceId) return;
        db.collection('workspaces').doc(pickerWorkspaceId).collection('boards').doc(b.id).collection('leads').get().then(snap=>{
          const el = document.getElementById(`pickerCount-${b.id}`);
          if(!el) return;
          const n = snap.docs.filter(d=>!d.data().deleted).length;
          el.textContent = `${n} ${n===1?'lead':'leads'}`;
        }).catch(()=>{
          const el = document.getElementById(`pickerCount-${b.id}`);
          if(el) el.textContent = '';
        });
      });
    }
    window.__goToPickerBoard = goToBoard;
    searchInput.oninput = ()=> renderPickerList(searchInput.value);
    searchInput.onkeydown = (e)=>{
      const cols = Math.max(1, Math.floor(list.clientWidth / 244));
      if(e.key === 'ArrowDown'){ e.preventDefault(); setFocus(focusIdx < 0 ? 0 : Math.min(focusIdx + cols, visibleBoards.length - 1)); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); setFocus(Math.max(focusIdx - cols, 0)); }
      else if(e.key === 'ArrowRight'){ e.preventDefault(); setFocus(focusIdx < 0 ? 0 : Math.min(focusIdx + 1, visibleBoards.length - 1)); }
      else if(e.key === 'ArrowLeft'){ e.preventDefault(); setFocus(Math.max(focusIdx - 1, 0)); }
      else if(e.key === 'Enter'){ e.preventDefault(); if(focusIdx >= 0 && visibleBoards[focusIdx]) goToBoard(visibleBoards[focusIdx].id); }
    };
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const wsId = doc.exists ? doc.data().workspaceId : null;
      if(!wsId){ list.innerHTML = '<div class="board-picker-empty">Could not find your workspace.</div>'; return null; }
      pickerWorkspaceId = wsId;
      return db.collection('workspaces').doc(wsId).collection('boards').orderBy('createdAt','desc').get();
    }).then(snap=>{
      if(!snap) return;
      allBoards = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(b=>b.deleted !== true);
      renderPickerList('');
      setTimeout(()=>searchInput.focus(), 50);
    }).catch(err=>{
      console.error('Could not load boards for picker', err);
      list.innerHTML = '<div class="board-picker-empty">Could not load your boards.</div>';
    });
  };
  function closeBoardPicker(){
    document.getElementById('boardPickerOverlay').classList.remove('open');
  }
  document.getElementById('boardPickerClose').addEventListener('click', closeBoardPicker);
  document.getElementById('boardPickerOverlay').addEventListener('click', (e)=>{
    if(!e.target.closest('.board-picker-modal')) closeBoardPicker();
  });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeBoardPicker();
  });
})();
</script>

<script>
// Shared side panel: the same links on every page. The current board (if the
// page was opened for one) is carried along, the same way these pages always did.
(function(){
  var board = new URLSearchParams(location.search).get('board');
  var q = board ? '?board=' + encodeURIComponent(board) : '';
  var links = {
    navHome: 'home.html',

    navScheduled: 'scheduled-emails.html' + q,
    navLinkedinSeq: 'linkedin-sequence-builder.html' + q,
    navLinkedinPost: 'linkedin-post-composer.html' + q,
    navChat: 'chat.html',
    navTrash: 'trash.html' + q,
    navSettings: 'account.html'
  };
  Object.keys(links).forEach(function(id){
    var a = document.getElementById(id);
    if(a) a.setAttribute('href', links[id]);
  });
})();
</script>

<!-- LinkedIn badge: how many LinkedIn messages are due now (like an app badge on a phone) -->
<style>
  .pt-li-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#FF3B30;color:#fff;
    font:700 11px/20px -apple-system,BlinkMacSystemFont,'Inter',sans-serif;text-align:center;box-shadow:0 0 0 2px var(--panel,#fff);flex-shrink:0;
    animation:ptLiPop .45s cubic-bezier(.3,1.6,.5,1) both;}
  [data-li-badge]{position:relative;}
  [data-li-badge] > .pt-li-badge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;line-height:24px;font-size:12.5px;box-shadow:0 0 0 3px var(--paper,#EFF5FC),0 4px 10px -2px rgba(255,59,48,.55);}
  @keyframes ptLiPop{from{transform:scale(0);}to{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .pt-li-badge{animation:none;} }
</style>
<script>
(function(){
  function paint(n){
    document.querySelectorAll('#navLinkedinSeq, [data-li-badge]').forEach(function(el){
      var b = el.querySelector(':scope > .pt-li-badge');
      if(!n){ if(b) b.remove(); return; }
      if(!b){ b = document.createElement('span'); b.className = 'pt-li-badge'; el.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
      b.setAttribute('aria-label', n + (n === 1 ? ' LinkedIn message' : ' LinkedIn messages') + ' to send now');
      b.title = b.getAttribute('aria-label');
    });
  }
  function start(){
    if(!window.firebase || !firebase.apps || !firebase.apps.length) return;
    var db = firebase.firestore();
    firebase.auth().onAuthStateChanged(function(u){
      if(!u) return;
      db.doc('userDirectory/' + u.uid).get().then(function(d){
        var ws = d.exists && d.data().workspaceId; if(!ws) return;
        function load(){
          db.collection('linkedinSequenceRuns').where('workspaceId', '==', ws).where('status', '==', 'active').get().then(function(snap){
            var now = Date.now();
            paint(snap.docs.filter(function(x){
              var r = x.data(), t = r.nextDueAt && typeof r.nextDueAt.toMillis === 'function' ? r.nextDueAt.toMillis() : 0;
              return (r.currentStepIndex || 0) < (r.steps || []).length && t <= now;
            }).length);
          }).catch(function(){});
        }
        load(); setInterval(load, 5 * 60 * 1000);
        window.ptRefreshLinkedinBadge = load;
      }).catch(function(){});
    });
  }
  if(document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>

<!-- Tasks badge: unread task notifications (assigned, mentioned, due today, automations) -->
<script>
(function(){
  function paint(n){
    document.querySelectorAll('#navTasks, [data-tasks-badge]').forEach(function(el){
      var b = el.querySelector(':scope > .pt-li-badge');
      if(!n){ if(b) b.remove(); return; }
      if(!b){ b = document.createElement('span'); b.className = 'pt-li-badge'; el.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
      b.setAttribute('aria-label', n + (n === 1 ? ' unread task notification' : ' unread task notifications'));
      b.title = b.getAttribute('aria-label');
    });
  }
  function start(){
    if(!window.firebase || !firebase.apps || !firebase.apps.length) return;
    firebase.auth().onAuthStateChanged(function(u){
      if(!u) return;
      firebase.firestore().collection('userNotifications').where('uid', '==', u.uid).where('read', '==', false).limit(100)
        .onSnapshot(function(snap){ paint(snap.size); }, function(){});
    });
  }
  if(document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>
