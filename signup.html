  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 14% 0%, rgba(55,48,179,0.05) 0%, transparent 40%),
      radial-gradient(circle at 100% 30%, rgba(122,79,181,0.04) 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  /* ---------- Page loader ---------- */
  #pageLoader{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:radial-gradient(circle at 50% 0%, var(--c-blue-bg) 0%, var(--paper) 65%);
  }
  .loader-logo{
    width:64px;height:64px;border-radius:16px;overflow:hidden;
    box-shadow:0 8px 20px rgba(55,48,179,0.3);
    display:flex;align-items:center;justify-content:center;
    animation:loader-pulse 1.4s ease-in-out infinite;
  }
  .loader-logo img{width:100%;height:100%;display:block;}
  .loader-spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--c-border-alt);border-top-color:var(--teal);
    animation:loader-spin .8s linear infinite;
  }
  @keyframes loader-pulse{
    0%, 100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }
  @keyframes loader-spin{
    to{transform:rotate(360deg);}
  }
  .fade-in{animation:fade-in-up .35s ease both;}
  @keyframes fade-in-up{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ---------- Login screen ---------- */
  #loginScreen{
    min-height:100vh;display:none;align-items:center;justify-content:center;
    padding:24px;position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 0%, var(--c-blue-bg) 0%, var(--paper) 65%);
  }
  .login-bg-dotgrid{
    position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(55,48,179,0.16) 1.4px, transparent 1.4px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse 75% 75% at 50% 40%, #000 30%, transparent 80%);
    mask-image:radial-gradient(ellipse 75% 75% at 50% 40%, #000 30%, transparent 80%);
  }
  [data-theme="dark"] .login-bg-dotgrid{background-image:radial-gradient(rgba(122,79,181,0.22) 1.4px, transparent 1.4px);}
  .login-bg-orb{position:absolute;border-radius:50%;opacity:.55;pointer-events:none;z-index:0;will-change:transform;}
  .login-bg-orb.o1{width:280px;height:280px;background:radial-gradient(circle, var(--c-blue-fg) 0%, transparent 70%);top:-80px;left:-60px;animation:login-orb-float 11s ease-in-out infinite;}
  .login-bg-orb.o2{width:320px;height:320px;background:radial-gradient(circle, var(--c-purple-fg, #7A4FB5) 0%, transparent 70%);bottom:-100px;right:-80px;animation:login-orb-float 13s ease-in-out infinite 2s;}
  .login-bg-orb.o3{width:200px;height:200px;background:radial-gradient(circle, var(--c-amber-fg) 0%, transparent 70%);top:55%;right:8%;animation:login-orb-float 9s ease-in-out infinite 4s;}
  @keyframes login-orb-float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-26px) scale(1.12);}}
  @media (prefers-reduced-motion: reduce){.login-bg-orb{animation:none;}}
  .login-card{
    background:var(--panel);border:1px solid var(--border);border-radius:18px;
    box-shadow:0 20px 50px rgba(36,31,122,0.14), var(--shadow);
    padding:0 0 32px;width:100%;max-width:400px;overflow:hidden;position:relative;z-index:1;
  }
  .login-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;z-index:2;
    background:linear-gradient(90deg, var(--c-blue-fg), var(--c-purple-fg), var(--c-amber-fg), var(--c-blue-fg));
    background-size:200% 100%;animation:login-shimmer 4s linear infinite;
  }
  @keyframes login-shimmer{0%{background-position:0% 0;}100%{background-position:200% 0;}}
  @media (prefers-reduced-motion: reduce){.login-card::before{animation:none;}}
  .login-brand{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:38px 34px 8px;
  }
  .login-logo-circle{
    width:64px;height:64px;border-radius:16px;overflow:hidden;
    box-shadow:0 8px 20px rgba(55,48,179,0.3);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    margin-bottom:16px;animation:login-logo-glow 3s ease-in-out infinite;
  }
  @keyframes login-logo-glow{
    0%,100%{box-shadow:0 8px 20px rgba(55,48,179,0.3);}
    50%{box-shadow:0 10px 28px rgba(55,48,179,0.5), 0 0 24px rgba(122,79,181,0.25);}
  }
  @media (prefers-reduced-motion: reduce){.login-logo-circle{animation:none;}}
  .login-logo-circle img{width:100%;height:100%;display:block;}
  .login-eyebrow{
    font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--slate-light);margin-bottom:6px;
  }
  .login-title{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;color:var(--ink);line-height:1.25;}
  .login-sub{font-size:13px;color:var(--slate);margin-top:5px;}
  #loginForm, #resetForm, #signupForm{padding:22px 34px 0;}

  /* ---------- Signup interactivity ---------- */
  .signup-progress{
    height:4px;background:var(--border);border-radius:2px;margin:0 34px 4px;overflow:hidden;
  }
  .signup-progress-fill{
    height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg, var(--c-blue-fg), var(--c-purple-fg));
    transition:width .3s ease;
  }
  .field-hint{font-size:11px;color:var(--slate-light);min-height:14px;margin-top:2px;}
  .field-hint.active{color:var(--teal);font-weight:600;}
  .input-with-icon{position:relative;display:flex;align-items:center;}
  .input-with-icon input{padding-right:38px !important;}
  .field-check{
    position:absolute;right:12px;width:16px;height:16px;color:var(--c-green-fg, #2BC17A);
    opacity:0;transform:scale(.6);transition:opacity .2s ease, transform .2s ease;pointer-events:none;
  }
  .field-check.show{opacity:1;transform:scale(1);}
  .field-eye-btn{
    position:absolute;right:8px;background:none;border:none;padding:6px;cursor:pointer;
    color:var(--slate-light);display:flex;align-items:center;justify-content:center;
  }
  .field-eye-btn:hover{color:var(--slate);}
  .field-eye-btn svg{width:18px;height:18px;}
  .pw-strength{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .pw-strength-bar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;}
  .pw-strength-fill{height:100%;width:0%;border-radius:2px;transition:width .25s ease, background .25s ease;}
  .pw-strength-label{font-size:11px;font-weight:700;color:var(--slate-light);min-width:44px;text-align:right;}
  #loginForm .field, #resetForm .field, #signupForm .field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  #loginForm label, #resetForm label, #signupForm label{
    font-size:11.5px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;
  }
  #loginForm input, #resetForm input, #signupForm input{
    font-family:'Inter',sans-serif;font-size:14.5px;padding:11px 13px;
    border:1px solid var(--border);border-radius:6px;background:var(--c-blue-tint2);color:var(--ink);width:100%;
  }
  #loginForm input:focus, #resetForm input:focus, #signupForm input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(55,48,179,0.14);}
  .login-error{
    margin:0 34px 16px;
    background:var(--c-red-bg);color:var(--c-red-fg);font-size:12.5px;font-weight:600;
    padding:10px 13px;border-radius:8px;display:none;
  }
  .login-error.show{display:block;}
  #loginForm .btn-primary, #resetForm .btn-primary, #signupForm .btn-primary{
    width:100%;justify-content:center;padding:12px;margin-top:6px;
    background:var(--teal);color:#fff;border:1px solid var(--teal);border-radius:8px;
    font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  }
  .login-forgot-row{text-align:right;margin:-10px 0 16px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;min-width:0;}
  .login-divider{
    display:flex;align-items:center;gap:12px;margin:18px 34px 16px;
    font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:var(--slate-light);letter-spacing:.05em;
  }
  .login-divider::before, .login-divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .btn-google{
    display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 68px);margin:0 34px 18px;
    padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
    font-family:'Inter',sans-serif;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-google:hover{background:var(--c-blue-tint2);border-color:var(--slate-light);}
  .btn-google:disabled{opacity:.6;cursor:not-allowed;}
  .login-forgot-link{
    background:none;border:none;padding:0;font-size:12.5px;font-weight:600;color:var(--teal);
    cursor:pointer;text-decoration:underline;font-family:'Inter',sans-serif;
  }
  .login-forgot-link:hover{opacity:.8;}
  #resetForm .login-sub{margin:-4px 0 16px;text-align:left;}
  #resetForm .login-forgot-link{display:block;margin:14px auto 0;text-align:center;width:100%;}
  #signupForm .login-forgot-link{display:block;margin:14px auto 0;text-align:center;width:100%;}
  .signup-terms-row{
    display:flex;align-items:flex-start;gap:9px;margin-bottom:16px;cursor:pointer;
  }
  #signupForm .signup-terms-row input[type="checkbox"]{
    width:16px;height:16px;flex-shrink:0;margin-top:1px;padding:0;border-radius:3px;
    accent-color:var(--teal);cursor:pointer;background:none;border:1px solid var(--border);
  }
  .signup-terms-row span{font-size:12.5px;color:var(--slate);line-height:1.5;}
  .signup-terms-row a{color:var(--teal);font-weight:600;text-decoration:none;}
  .signup-terms-row a:hover{text-decoration:underline;}
  .login-success{
    background:var(--c-green-bg);color:var(--c-green-fg);font-size:13px;line-height:1.5;
    padding:12px 14px;border-radius:8px;text-align:center;margin:0 34px 16px;
  }
  .login-footer-note{
    text-align:center;font-size:12px;color:var(--slate-light);margin-top:20px;padding:0 34px;
  }
  .login-lang-switcher{
    position:absolute;top:14px;right:14px;z-index:2;
  }
  .login-lang-switcher select{
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--slate);
    background:var(--c-blue-tint2);border:1px solid var(--border);border-radius:20px;
    padding:5px 10px;cursor:pointer;appearance:auto;
  }
  .login-lang-switcher select:focus{outline:none;border-color:var(--teal);}
  .login-back-home{
    position:absolute;top:14px;left:14px;z-index:2;
    display:flex;align-items:center;gap:4px;
    font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:var(--slate);
    background:var(--c-blue-tint2);border:1px solid var(--border);border-radius:20px;
    padding:6px 12px;text-decoration:none;transition:background .15s, color .15s;
  }
  .login-back-home:hover{background:var(--c-hover-bg);color:var(--teal);}
  #appRoot{display:none;}

  /* ---------- Header ---------- */
  header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:26px;flex-wrap:wrap;gap:16px;
  }
  .title-block{
    background:linear-gradient(135deg, var(--c-blue-fg) 0%, var(--c-blue-dark) 100%);
    padding:18px 26px;border-radius:14px;
    display:inline-block;box-shadow:0 4px 16px rgba(36,31,122,0.3), var(--shadow);
  }
  .title-row{display:flex;align-items:center;gap:16px;}
  .logo-badge{
    width:64px;height:64px;border-radius:16px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-logo{width:100%;height:100%;flex-shrink:0;display:block;}
  .title-divider{width:1px;height:44px;background:rgba(255,255,255,0.18);flex-shrink:0;}
  .title-text{display:flex;flex-direction:column;gap:3px;}
  .eyebrow{
    font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);
  }
  h1{
    font-family:'Sora',sans-serif;
    font-size:24px;font-weight:800;margin:0;
    letter-spacing:-0.015em;line-height:1.2;
    color:#fff;
  }
  .sub{
    color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;margin-top:3px;
  }
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .live-badge{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    color:var(--slate);background:var(--c-blue-tint);border:1px solid var(--border);
    padding:6px 12px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;background:#2BC17A;flex-shrink:0;
    box-shadow:0 0 0 0 rgba(43,193,122,0.6);
    animation:live-pulse 1.8s ease-in-out infinite;
  }
  @keyframes live-pulse{
    0%{opacity:0.4;box-shadow:0 0 0 0 rgba(43,193,122,0.5);}
    50%{opacity:1;box-shadow:0 0 0 5px rgba(43,193,122,0);}
    100%{opacity:0.4;box-shadow:0 0 0 0 rgba(43,193,122,0);}
  }
  .count-pill{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--slate);
    background:var(--c-neutral-bg);padding:6px 10px;border-radius:20px;
  }
  .pill-settings-link{color:var(--teal);font-weight:700;text-decoration:underline;}
  .pill-settings-link:hover{color:var(--teal-dark, var(--teal));}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  .btn{
    padding:9px 17px;border-radius:9px;font-size:13.5px;font-weight:600;
    background:var(--panel);border:1px solid var(--border);color:var(--ink);
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease, border-color .15s ease;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
    font-family:'Inter',sans-serif;
  }
  .btn:hover{background:var(--c-blue-soft);border-color:var(--slate-light);}

  .btn-primary{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 2px 8px rgba(55,48,179,.25);}

  /* ---------- Create board ---------- */
  .create-board-card{

  }
  .create-board-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;

  }
  #createBoardForm{display:grid;grid-template-columns:repeat(4, 1fr);gap:14px;align-items:end;}

  #createBoardForm .span-full{grid-column:1/-1;}
  #createBoardForm label{
    font-size:11.5px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;

  .optional-tag{text-transform:none;font-weight:500;color:var(--slate-light);letter-spacing:normal;}
  #createBoardForm input, #createBoardForm select{
    font-family:'Inter',sans-serif;font-size:14.5px;padding:10px 13px;
    border:1px solid var(--border);border-radius:7px;background:var(--c-blue-tint2);color:var(--ink);width:100%;
  }
  #createBoardForm input:focus, #createBoardForm select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(55,48,179,0.14);}

    #createBoardForm{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:560px){
    #createBoardForm{grid-template-columns:1fr;}
  }

  /* ---------- Board grid ---------- */
  .section-title{
    font-family:'Sora',sans-serif;font-size:16.5px;font-weight:700;color:var(--ink);
    margin:0 0 14px;
  }
  .boards-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:14px;
  }
  .board-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px 20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
    text-decoration:none;color:inherit;display:block;
  }
  .board-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(27,36,48,0.14);}
  .board-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--board-accent, linear-gradient(90deg, var(--c-blue-fg), var(--c-purple-fg)));
  }
  .board-icon{
    width:38px;height:38px;border-radius:9px;background:var(--c-blue-bg);color:var(--c-blue-fg);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .board-icon svg{width:19px;height:19px;}
  .board-name{
    font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:var(--ink);
    margin-bottom:4px;word-break:break-word;
  }
  .board-meta{font-size:12px;color:var(--slate-light);font-family:'IBM Plex Mono',monospace;}
  .board-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .board-tag{
    font-size:10.5px;font-weight:600;color:var(--slate);background:var(--c-blue-tint);
    border:1px solid var(--border);padding:2px 8px;border-radius:20px;
  }
  .board-tag.source-tag{
    display:inline-flex;align-items:center;gap:4px;border-color:transparent;
  }
  .source-tag-icon{width:13px;height:13px;flex-shrink:0;display:flex;}
  .source-tag-icon svg{width:100%;height:100%;}
  .board-count{
    display:inline-flex;align-items:center;gap:5px;margin-top:12px;
    font-size:12px;font-weight:700;color:var(--teal-dark);background:var(--c-blue-bg);
    padding:4px 10px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
  }
  .board-card-actions{
    position:absolute;top:14px;right:14px;display:flex;gap:4px;
    opacity:0;transition:opacity .15s;

  .board-action-btn{
    background:none;border:none;color:var(--slate-light);

  .board-action-btn:hover{background:var(--c-blue-bg);color:var(--teal);}
  .board-action-btn.danger:hover{background:var(--c-red-bg);color:var(--red);}

  .icon-btn-settings{font-size:15px;padding:9px 12px;}

  /* ---------- Settings slide panel ---------- */
  .settings-overlay{
    position:fixed;inset:0;background:rgba(27,36,48,0.4);z-index:95;
    opacity:0;visibility:hidden;transition:opacity .2s ease;
  }
  .settings-overlay.open{opacity:1;visibility:visible;}
  .settings-panel{
    position:fixed;top:0;right:0;height:100%;width:340px;max-width:90vw;
    background:var(--panel);z-index:96;box-shadow:-8px 0 30px rgba(27,36,48,0.18);
    transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .settings-panel.open{transform:translateX(0);}
  .settings-panel-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 22px;border-bottom:1px solid var(--border);
  }
  .settings-panel-header h3{font-family:'Sora',sans-serif;font-size:17px;margin:0;color:var(--ink);}
  .settings-panel-body{padding:22px;}
    .theme-toggle-row{
    display:flex;gap:8px;margin-bottom:16px;
  }
  .theme-toggle-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 12px;border-radius:9px;border:1px solid var(--border);
    background:none;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s;font-family:'Inter',sans-serif;
  }
  .theme-toggle-btn:hover{background:var(--c-blue-tint);}
  [data-theme="dark"] .theme-toggle-btn:hover{background:#22303F;}
  .theme-toggle-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.settings-user-block{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .settings-avatar{
    width:46px;height:46px;border-radius:50%;background:var(--c-blue-bg);color:var(--teal);

    font-size:16px;font-weight:700;flex-shrink:0;overflow:hidden;
  }
  .settings-avatar img{width:100%;height:100%;object-fit:cover;}
  .settings-user-name{font-weight:700;font-size:14px;color:var(--ink);}
  .settings-user-email{font-size:12px;color:var(--slate);word-break:break-word;}
  .settings-user-role{font-size:11.5px;color:var(--teal);font-weight:600;margin:1px 0;}
  .settings-item{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:13px 14px;border-radius:9px;background:none;border:1px solid var(--border);
    font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer;
    margin-bottom:10px;transition:background .15s;
  }
  .settings-item:hover{background:var(--c-blue-tint);}
  .settings-item.danger{color:var(--red);}

  .settings-item-icon{font-size:16px;}
  .settings-item-arrow{margin-left:auto;color:var(--slate-light);}

  .settings-item-arrow.chevron.open{transform:rotate(180deg);}

    display:none;flex-direction:column;gap:6px;
    margin:-4px 0 10px 14px;padding:6px 0 6px 20px;border-left:2px solid var(--border);
  }
  .help-submenu.open{display:flex;}
  .help-submenu-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
    font-size:13px;font-weight:600;color:var(--slate);text-decoration:none;transition:background .15s, color .15s;
  }
  .help-submenu-item:hover{background:var(--c-blue-tint);color:var(--teal);}

  /* ---------- Edit board modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(27,36,48,0.45);z-index:90;

  .modal-card{
    background:var(--panel);border-radius:var(--radius-lg, 16px);box-shadow:0 24px 60px -12px rgba(36,31,122,0.25);

    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, var(--c-blue-fg), var(--c-purple-fg), var(--c-amber-fg));
  }
  .modal-header{
    padding:22px 26px 4px;display:flex;justify-content:space-between;align-items:center;
  }
  .modal-header h3{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin:0;}
  .modal-close{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:8px;border:1px solid var(--border);

    cursor:pointer;transition:background .15s, color .15s, border-color .15s;
  }
  .modal-close:hover{background:var(--c-red-bg);color:var(--c-red-fg);border-color:var(--c-red-fg);}
  #editBoardForm{padding:16px 26px 26px;display:grid;grid-template-columns:repeat(2, 1fr);gap:14px;}
  #editBoardForm .span-full{grid-column:1/-1;}
  #editBoardForm .field{display:flex;flex-direction:column;gap:6px;}
  #editBoardForm label{
    font-size:11.5px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;
  }
  #editBoardForm input, #editBoardForm select{
    font-family:'Inter',sans-serif;font-size:14.5px;padding:10px 13px;
    border:1px solid var(--border);border-radius:7px;background:var(--c-blue-tint2);color:var(--ink);width:100%;
  }
  #editBoardForm input:focus, #editBoardForm select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(55,48,179,0.14);}
  .modal-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
  @media (max-width:560px){
    #editBoardForm{grid-template-columns:1fr;}
  }

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--slate);
    background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  }
  .empty-state h3{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0;}

  footer{text-align:center;color:var(--slate-light);font-size:12px;margin-top:36px;}

  /* ---------- Toasts ---------- */
  /* ---------- In-app confirm modal (never use native browser confirm()) ---------- */
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(15,23,32,0.55);z-index:500;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-modal{
    background:var(--panel);border-radius:16px;padding:28px 26px;max-width:400px;width:100%;
    box-shadow:0 30px 60px rgba(0,0,0,0.3);text-align:center;
  }
  .confirm-modal-icon{
    width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;
  }
  .confirm-modal-icon.warn{background:var(--c-red-bg);color:var(--c-red-fg);}
  .confirm-modal-icon svg{width:22px;height:22px;}
  .confirm-modal h3{font-family:'Sora',sans-serif;font-size:17px;margin:0 0 8px;}
  .confirm-modal p{font-size:13.5px;color:var(--slate);line-height:1.55;margin:0 0 20px;}
  .confirm-modal-actions{display:flex;gap:10px;justify-content:center;}
  .btn-danger{background:var(--c-red-fg);color:#fff;border-color:var(--c-red-fg);}
  .btn-danger:hover{background:#A9241C;}

  .toast-stack{
    position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;
  }
  .toast{
    background:var(--c-toast-bg);color:#fff;font-size:13px;font-weight:500;padding:12px 16px;
    border-radius:10px;box-shadow:0 8px 24px rgba(27,36,48,0.28);
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    animation:toast-in .2s ease;max-width:340px;
  }
  .toast.danger{background:var(--red);}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:640px){
    .boards-grid{grid-template-columns:1fr 1fr;}
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--c-border-alt, var(--border));border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--slate-light);background-clip:padding-box;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  /* the username field */
  .un-wrap{position:relative;display:flex;align-items:center;}
  .un-wrap span{position:absolute;left:14px;font-weight:700;color:var(--slate);pointer-events:none;}
  .un-wrap input{width:100%;padding-left:30px !important;}
  .un-hint.ok{color:#1E9E74;} .un-hint.bad{color:#C2410C;} .un-hint.wait{color:var(--slate);}
</style>

  let currentLang = 'en';
  function t(key){
    return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key] || key;
  }
  function applyTranslations(){
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if(el.children.length === 0){
        el.textContent = t(key);
      } else {
        let textNode = null;
        for(const node of el.childNodes){
          if(node.nodeType === Node.TEXT_NODE){ textNode = node; break; }
        }
        if(textNode){
          textNode.textContent = t(key) + ' ';
        } else {
          el.insertBefore(document.createTextNode(t(key) + ' '), el.firstChild);
        }
      }
    });
    document.documentElement.lang = currentLang;
  }
  function setLanguage(lang){
    currentLang = TRANSLATIONS[lang] ? lang : 'en';
    try{ window.localStorage.setItem('preferredLanguage', currentLang); }catch(e){}
    applyTranslations();
  }
  try{
    const cached = window.localStorage.getItem('preferredLanguage');
    if(cached && TRANSLATIONS[cached]) currentLang = cached;
  }catch(e){}
  applyTranslations();

  // Shared by both password signup and Google signup: given an already-authenticated
  // Firebase user and a company name, create their workspace (or roll back on conflict).
  function createWorkspaceForUser(cred, name, company){
    const slug = company.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const dirRef = db.collection('workspaceDirectory').doc(slug);
    const newWorkspaceRef = db.collection('workspaces').doc();
    return db.runTransaction(tx=>{
      return tx.get(dirRef).then(dirDoc2=>{
        if(dirDoc2.exists){
          throw {code: 'company-race'};
        }
        tx.set(newWorkspaceRef, {
          name: company, plan: 'free', ownerId: cred.user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        tx.set(newWorkspaceRef.collection('members').doc(cred.user.uid), {
          name, company, isAdmin: true, language: currentLang,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        tx.set(dirRef, {workspaceId: newWorkspaceRef.id, companyName: company});
      });
    }).then(()=>{
      return db.collection('userDirectory').doc(cred.user.uid).set({workspaceId: newWorkspaceRef.id});
    }).catch(err=>{
      if(err && err.code === 'company-race'){
        return cred.user.delete().then(()=>{ throw {code: 'company-race'}; });
      }
      throw err;
    });
  }

  function reportSignupError(err){
    console.error('Signup error:', err);
    if(err && err.code === 'company-exists'){
      showLoginError(`${t('companyAlreadyExistsMessage')} "${err.companyName}"`);
      return;
    }
    if(err && err.code === 'company-race'){
      showLoginError(t('companyTakenRaceMessage'));
      return;
    }
    const code = err && err.code;
    const FRIENDLY = {
      'auth/email-already-in-use': 'emailAlreadyInUseMessage',
      'auth/invalid-email': 'invalidEmailMessage',
      'auth/weak-password': 'weakPasswordMessage',
      'auth/network-request-failed': 'networkErrorMessage',
      'auth/too-many-requests': 'tooManyRequestsMessage',
      'auth/operation-not-allowed': 'operationNotAllowedMessage',
      'auth/popup-closed-by-user': 'signInCancelledMessage',
      'auth/cancelled-popup-request': 'signInCancelledMessage',
      'auth/popup-blocked': 'popupBlockedMessage',
      'auth/user-disabled': 'accountDisabledMessage',
      'auth/internal-error': 'genericErrorMessage'
    };
    showLoginError(t(FRIENDLY[code] || 'genericErrorMessage'));
  }

  // ---------- Live signup interactivity ----------
  (function(){
    const firstNameEl = document.getElementById('signupFirstName');
    const lastNameEl = document.getElementById('signupLastName');
    const companyEl = document.getElementById('signupCompany');
    const emailEl = document.getElementById('signupEmail');
    const passwordEl = document.getElementById('signupPassword');
    const progressFill = document.getElementById('signupProgressFill');
    const companyHint = document.getElementById('companySlugHint');
    const emailCheck = document.getElementById('emailCheckIcon');
    const pwFill = document.getElementById('pwStrengthFill');
    const pwLabel = document.getElementById('pwStrengthLabel');
    const toggleBtn = document.getElementById('togglePasswordBtn');

    function updateProgress(){
      const fields = [firstNameEl.value.trim(), lastNameEl.value.trim(), companyEl.value.trim(), emailEl.value.trim(), passwordEl.value];
      const filled = fields.filter(v=>v.length > 0).length;
      progressFill.style.width = ((filled / fields.length) * 100) + '%';
    }

    companyEl.addEventListener('input', ()=>{
      const slug = companyEl.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      if(slug){
        companyHint.textContent = `${t('yourWorkspaceWillBe')} "${slug}"`;
        companyHint.classList.add('active');
      } else {
        companyHint.textContent = '\u00A0';
        companyHint.classList.remove('active');
      }
      updateProgress();
    });

    emailEl.addEventListener('input', ()=>{
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value.trim());
      emailCheck.classList.toggle('show', valid);
      updateProgress();
    });

    function passwordStrength(pw){
      if(!pw) return {pct:0, label:'', color:''};
      let score = 0;
      if(pw.length >= 6) score++;
      if(pw.length >= 10) score++;
      if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if(/[0-9]/.test(pw)) score++;
      if(/[^A-Za-z0-9]/.test(pw)) score++;
      if(score <= 1) return {pct:25, label:t('pwWeak'), color:'#E0453A'};
      if(score <= 2) return {pct:50, label:t('pwFair'), color:'#FF9D00'};
      if(score <= 3) return {pct:75, label:t('pwGood'), color:'#2BC17A'};
      return {pct:100, label:t('pwStrong'), color:'#1F5C4F'};
    }
    passwordEl.addEventListener('input', ()=>{
      const s = passwordStrength(passwordEl.value);
      pwFill.style.width = s.pct + '%';
      pwFill.style.background = s.color;
      pwLabel.textContent = s.label || '\u00A0';
      updateProgress();
    });

    toggleBtn.addEventListener('click', ()=>{
      const isPw = passwordEl.type === 'password';
      passwordEl.type = isPw ? 'text' : 'password';
      toggleBtn.innerHTML = isPw
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    });

    firstNameEl.addEventListener('input', updateProgress);
    lastNameEl.addEventListener('input', updateProgress);
  })();

  document.getElementById('signupForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const firstName = document.getElementById('signupFirstName').value.trim();
    const lastName = document.getElementById('signupLastName').value.trim();
    const name = `${firstName} ${lastName}`.trim();
    const company = document.getElementById('signupCompany').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    clearLoginError();

    if(!document.getElementById('signupAcceptTerms').checked){
      showLoginError(t('pleaseAcceptTermsMessage'));
      return;
    }

    const slug = company.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if(!slug){
      showLoginError(t('pleaseEnterCompany'));
      return;
    }
    if(!firebaseConnected){
      showLoginError('Could not connect. Please try again later.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = t('creatingAccount');
    signingUp = true;
    const dirRef = db.collection('workspaceDirectory').doc(slug);
    let username = '';

    unReady().then((v)=>{ username = v; return dirRef.get(); }).then(dirDoc=>{
      if(dirDoc.exists){
        throw {code: 'company-exists', companyName: dirDoc.data().companyName};
      }
      return auth.createUserWithEmailAndPassword(email, password);
    }).then(cred=>{
      // Also set this at the Firebase Auth level, not just in Firestore —
      // account.html's Full Name field already prefers the Firestore
      // value, but falls back to this if that read is ever momentarily
      // unavailable, so both should actually hold the name, not just one.
      return cred.user.updateProfile({displayName: name}).then(()=>cred);
    }).then(cred=>{
      return createWorkspaceForUser(cred, name, company).then(()=> claimUsername(cred.user.uid, username, name, company));
    }).then(()=>{
      afterSignup(submitBtn);
    }).catch(err=>{
      signingUp = false;
      if(err && err.code === 'username-invalid'){ showLoginError('Choose a username: 3–24 characters, lowercase letters, numbers, dots and underscores.'); unEl.focus(); }
      else if(err && err.code === 'username-taken'){ showLoginError('@' + err.name + ' is already taken. Choose another username.'); unCheck(); unEl.focus(); }
      else reportSignupError(err);
      submitBtn.disabled = false;
      submitBtn.textContent = t('createAccountBtn');
    });
  });

  document.getElementById('googleSignupBtn').addEventListener('click', ()=>{
    clearLoginError();
    if(!document.getElementById('signupAcceptTerms').checked){
      showLoginError(t('pleaseAcceptTermsMessage'));
      return;
    }
    const company = document.getElementById('signupCompany').value.trim();
    const slug = company.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    if(!slug){
      showLoginError(t('pleaseEnterCompanyBeforeGoogle'));
      return;
    }
    if(!firebaseConnected){
      showLoginError('Could not connect. Please try again later.');
      return;
    }

    const googleBtn = document.getElementById('googleSignupBtn');
    googleBtn.disabled = true;
    signingUp = true;
    const dirRef = db.collection('workspaceDirectory').doc(slug);
    const provider = new firebase.auth.GoogleAuthProvider();
    let username = '';

    unReady().then((v)=>{ username = v; return dirRef.get(); }).then(dirDoc=>{
      if(dirDoc.exists){
        throw {code: 'company-exists', companyName: dirDoc.data().companyName};
      }
      return auth.signInWithPopup(provider);
    }).then(cred=>{
      const name = cred.user.displayName || '';
      return createWorkspaceForUser(cred, name, company).then(()=> claimUsername(cred.user.uid, username, name, company));
    }).then(()=>{
      afterSignup(googleBtn);
    }).catch(err=>{
      signingUp = false;
      if(err && err.code === 'username-invalid'){ showLoginError('Choose a username: 3–24 characters, lowercase letters, numbers, dots and underscores.'); unEl.focus(); }
      else if(err && err.code === 'username-taken'){ showLoginError('@' + err.name + ' is already taken. Choose another username.'); unCheck(); unEl.focus(); }
      else reportSignupError(err);
      googleBtn.disabled = false;
    });
  });

  // ---------- the username: chosen while signing up (so no pop-up asks for it later) ----------
  const UN_RE = /^[a-z0-9](?:[a-z0-9._]{1,22})[a-z0-9]$/;
  const unClean = (v)=> String(v || '').toLowerCase().replace(/^@+/, '').replace(/[^a-z0-9._]/g, '');
  const unEl = document.getElementById('signupUsername'), unHint = document.getElementById('usernameHint');
  let unOk = '', unTouched = false, unTimer = null;
  function unSay(cls, text){ unHint.className = 'field-hint un-hint ' + cls; unHint.textContent = text; }
  function unCheck(){
    const v = unClean(unEl.value); if(unEl.value !== v) unEl.value = v; unOk = ''; clearTimeout(unTimer);
    if(!v){ unSay('', 'Others in PalaTrack can find and message you with this.'); return; }
    if(!UN_RE.test(v)){ unSay('bad', v.length < 3 ? 'At least 3 characters.' : 'Lowercase letters, numbers, dots and underscores; start and end with a letter or number.'); return; }
    unSay('wait', 'Checking…');
    unTimer = setTimeout(()=>{ if(!firebaseConnected){ unSay('', ''); return; }
      db.doc('usernames/' + v).get().then((d)=>{ if(unClean(unEl.value) !== v) return;
        if(d.exists){ unSay('bad', '@' + v + ' is taken. Try another one.'); } else { unOk = v; unSay('ok', '@' + v + ' is available.'); }
      }).catch(()=> unSay('', 'We’ll check it when you create your account.')); }, 350);
  }
  unEl.addEventListener('input', ()=>{ unTouched = true; unCheck(); });
  // a suggestion from your name, until you type your own
  function unSuggest(){ if(unTouched) return; const f = document.getElementById('signupFirstName').value, l = document.getElementById('signupLastName').value;
    const v = unClean((f + ' ' + l).trim().replace(/\s+/g, '.')).replace(/\.{2,}/g, '.').replace(/^\.|\.$/g, '').slice(0, 24);
    if(v.length >= 3 && v !== unEl.value){ unEl.value = v; unCheck(); } }
  ['signupFirstName', 'signupLastName'].forEach((id)=> document.getElementById(id).addEventListener('input', unSuggest));
  // is the username free? (checked again right before the account is created)
  function unReady(){ const v = unClean(unEl.value);
    if(!UN_RE.test(v)) return Promise.reject({code: 'username-invalid'});
    return db.doc('usernames/' + v).get().then((d)=>{ if(d.exists) throw {code: 'username-taken', name: v}; return v; }, ()=> v); }
  function claimUsername(uid, v, name, company){
    const b = db.batch(), now = firebase.firestore.FieldValue.serverTimestamp(), nm = String(name || '').trim();
    b.set(db.doc('usernames/' + v), {uid, createdAt: now});
    b.set(db.doc('profiles/' + uid), {uid, username: v, name: nm, nameLower: nm.toLowerCase(), photoURL: '', headline: String(company || '').slice(0, 120), updatedAt: now}, {merge: true});
    return b.commit().catch(()=>{ /* taken at the very last moment: they can pick another one in PalaTrack */ });
  }
  // after the account exists: straight to payment for the chosen plan (and back to the home page after), otherwise home
  function afterSignup(btn){
    if(!BUY){ location.href = 'home.html'; return; }
    if(btn) btn.textContent = 'Taking you to secure payment…';
    try {
      firebase.functions().httpsCallable('createCheckoutSession')({plan: BUY, siteUrl: location.origin, locale: currentLang, returnTo: 'home'})
        .then((r)=>{ location.href = r.data.url; })
        .catch(()=>{ location.href = 'billing.html?buy=' + BUY; });     // the billing page tries again
    } catch(e){ location.href = 'billing.html?buy=' + BUY; }
  }

  // the plan someone picked on the pricing page: after creating their account, they go straight to payment
  var BUY = (function(){ try { var p = new URLSearchParams(location.search).get('plan'); return p === 'starter' || p === 'premium' ? p : ''; } catch(e){ return ''; } })();
  var signingUp = false;
  if(BUY){
    var sub = document.querySelector('[data-i18n="signupSub"]'), price = BUY === 'premium' ? '$57' : '$49', nm = BUY === 'premium' ? 'Premium' : 'Starter';
    if(sub){ sub.removeAttribute('data-i18n'); sub.innerHTML = 'You chose <b>' + nm + '</b> (' + price + '/month). Create your account first, then you’ll go straight to secure payment.'; }
    var li = document.querySelector('a[href="boards.html?login=1"]'); if(li) li.href = 'boards.html?login=1&buy=' + BUY;
  }
  if(firebaseConnected){
    auth.onAuthStateChanged(user=>{
      if(user){
        if(signingUp) return;          // just created: the sign-up itself moves on once the workspace exists
        // Already signed in — no reason to see a signup form: to payment for the chosen plan, otherwise home.
        location.href = BUY ? 'billing.html?buy=' + BUY : 'home.html';
      } else {
        document.getElementById('pageLoader').style.display = 'none';
        const screen = document.getElementById('loginScreen');
        screen.style.display = 'flex';
        screen.classList.add('fade-in');
      }
    });
  }
})();
</script>
