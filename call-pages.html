<title>PALATRACK - Pre Call Conversion System</title>
<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#3730B3; --success:#1F6F5C; --success-soft:#DCEEE8; --fail:#B43B32; --fail-soft:#FAE1DE;
    --brand:linear-gradient(135deg,#1B59A5 0%,#3730B3 55%,#7B3FE4 100%);
    --shadow:0 1px 2px rgba(16,24,40,0.04),0 2px 6px rgba(16,24,40,0.05),0 10px 24px -8px rgba(16,24,40,0.09);
    --shadow-lg:0 4px 10px rgba(16,24,40,0.06),0 20px 40px -12px rgba(16,24,40,0.16);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0D0F1F; --panel:#161934; --panel-alt:#1C2042; --ink:#ECEEFF;
    --border:#2B3060; --border-soft:#22264A; --slate:#A3A8CC; --slate-light:#767CA6;
    --teal:#6D65F6; --teal-dark:#5A52EE; --teal-deep:#4038C8; --purple:#A77BFF;
    --amber:#FFB547; --red:#FF7F75;
    --success:#5FD3A8; --success-soft:rgba(95,211,168,.14);
    --fail:#FF7F75; --fail-soft:rgba(255,127,117,.14); --amber-soft:rgba(255,181,71,.14);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.45), 0 14px 34px -14px rgba(0,0,0,.7);
    --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset, 0 6px 16px rgba(0,0,0,.45), 0 28px 56px -16px rgba(0,0,0,.75);
    --c-blue-fg:#7DB7FF; --c-blue2-fg:#7DB7FF; --c-blue-bg:rgba(125,183,255,.14); --c-blue-dark:#A9CFFF;
    --c-blue-soft:#1F2446; --c-blue-tint:#1A1E3C; --c-blue-tint2:#181B38; --c-blue-tint3:#1D2143; --c-blue-hover:rgba(125,183,255,.2);
    --c-amber-fg:#FFB547; --c-amber-bg:rgba(255,181,71,.14); --c-amber-light:#FFC878; --c-amber-dark-text:#FFE2B3;
    --c-amber-border:rgba(255,181,71,.35); --c-amber-text2:#FFD28F;
    --c-tan-fg:#F0B070; --c-tan-bg:rgba(240,176,112,.14);
    --c-green-fg:#5FD3A8; --c-green-bg:rgba(95,211,168,.14); --c-green-mid:#4BBF95;
    --c-red-fg:#FF8C82; --c-red-bg:rgba(255,127,117,.14); --c-red-hover:rgba(255,127,117,.22);
    --c-purple-fg:#C4A3FF; --c-purple-bg:rgba(167,123,255,.16); --c-purple-hover:rgba(167,123,255,.24);
    --c-pink-fg:#FF93D6; --c-pink-bg:rgba(255,147,214,.14);
    --c-dark-fg:#ECEEFF; --c-gray-bg:#232850; --c-slate-fg:#A3A8CC; --c-border-alt:#2B3060;
    --c-tiktok-bg:#2A2D4E; --c-hover-bg:#1F2446; --c-zebra-bg:#181B38; --c-stat-fallback-bg:#1C2042;
    --c-ring-track:#2B3060; --c-live-red:#FF6B6B; --c-neutral-bg:#1C2042; --c-toast-bg:#232850; --toast-bg:#232850;
    --clay:#FF9A7A; --clay-soft:rgba(255,154,122,.14);
    --map-nodata-fill:#232850; --map-ocean-start:#10132A; --map-ocean-end:#0D0F1F; --map-graticule:#22264A;
    --map-mid-fill:#4A44B8; --map-hidata-fill:#8E88FF; --map-country-stroke:#0D0F1F; --map-legend-text:#A3A8CC;
    --lk-line:#2B3060; --lk-text:#ECEEFF; --lk-muted:#A3A8CC;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden;}
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  .hidden{display:none !important;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appRoot{display:none;height:100vh;}
  #appRoot.reveal{animation:pageFade .4s ease both;}
  @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .seq-main{flex:1;min-width:0;height:100%;overflow-y:auto;}
  .toast-stack{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
  .toast{background:#16202C;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:pageFade .25s ease both;max-width:380px;}
  .toast.danger{background:var(--fail);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap;}
  .btn:hover{border-color:var(--slate-light);}
  .btn.primary{border:none;background:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(55,48,179,.5);}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px;}
  .btn.danger{color:var(--fail);}
  .btn:disabled{opacity:.5;cursor:default;}

  /* the list of pages */
  .shell{max-width:1060px;margin:0 auto;padding:34px 26px 90px;}
  .ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .ph h1{font:800 28px Sora,sans-serif;margin:0;letter-spacing:-.02em;}
  .ph p{margin:6px 0 0;color:var(--slate);font-size:14px;max-width:600px;line-height:1.5;}
  .ph .acts{margin-left:auto;display:flex;gap:8px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--border-soft);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
  .card .thumb{height:150px;overflow:hidden;position:relative;cursor:pointer;background:#0A0B0E;}
  .card .thumb .cpv{position:absolute;left:0;top:0;width:1100px;transform:scale(.29);transform-origin:0 0;pointer-events:none;}
  .card .meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;}
  .card .meta b{font-size:15px;}
  .card .meta small{color:var(--slate);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pill{display:inline-flex;align-items:center;gap:6px;width:max-content;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--panel-alt);color:var(--slate);border:1px solid var(--border-soft);}
  .pill.live{background:var(--success-soft);color:var(--success);border-color:transparent;}
  .pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .lock{background:var(--panel);border:1px solid var(--border-soft);border-radius:18px;padding:46px 24px;text-align:center;box-shadow:var(--shadow);}
  .lock-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:var(--panel-alt);display:flex;align-items:center;justify-content:center;font-size:28px;}
  .lock h2{font:700 21px Sora,sans-serif;margin:0 0 8px;} .lock p{color:var(--slate);max-width:540px;margin:0 auto 20px;line-height:1.6;font-size:14.5px;}
  .empty{background:var(--panel);border:1px dashed var(--border);border-radius:18px;padding:46px 24px;text-align:center;}
  .empty h2{font:700 20px Sora,sans-serif;margin:0 0 8px;} .empty p{color:var(--slate);max-width:520px;margin:0 auto 18px;line-height:1.55;font-size:14.5px;}

  /* the editor */
  .ed{display:none;height:100%;flex-direction:column;}
  .ed.open{display:flex;}
  .ed-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-soft);background:var(--panel);flex-wrap:wrap;}
  .ed-top .name{flex:1;min-width:180px;font:700 17px Sora,sans-serif;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent;color:var(--ink);}
  .ed-top .name:hover,.ed-top .name:focus{border-color:var(--border);outline:none;background:var(--panel-alt);}
  .saved{font-size:12.5px;color:var(--slate);min-width:70px;}
  .ed-body{flex:1;min-height:0;display:grid;grid-template-columns:440px minmax(0,1fr);}
  .form{overflow-y:auto;padding:16px 16px 60px;border-right:1px solid var(--border-soft);background:var(--paper);}
  .sec{background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .sec > h3{margin:0 0 10px;font:700 14px Sora,sans-serif;display:flex;align-items:center;gap:8px;}
  .sec > h3 small{font:500 12px Inter,sans-serif;color:var(--slate);margin-left:auto;}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--slate);margin:10px 0 5px;}
  label.f:first-of-type{margin-top:0;}
  .in,textarea.in{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--panel-alt);color:var(--ink);padding:9px 11px;font-size:13.5px;outline:none;}
  textarea.in{resize:vertical;min-height:64px;line-height:1.5;}
  .in:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(55,48,179,.12);}
  .hint{font-size:11.5px;color:var(--slate);margin-top:5px;line-height:1.45;}
  .hint.bad{color:var(--fail);} .hint.ok{color:var(--success);}
  .slug{display:flex;align-items:center;border:1px solid var(--border);border-radius:9px;background:var(--panel-alt);overflow:hidden;}
  .slug span{padding:0 4px 0 11px;font-size:13px;color:var(--slate);white-space:nowrap;}
  .slug input{flex:1;min-width:0;border:0;background:transparent;padding:9px 11px 9px 0;font-size:13.5px;color:var(--ink);outline:none;}
  .live-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel-alt);}
  .live-row b{font-size:13.5px;} .live-row small{display:block;font-size:12px;color:var(--slate);margin-top:2px;}
  .sw{margin-left:auto;position:relative;width:44px;height:26px;flex-shrink:0;}
  .sw input{opacity:0;width:0;height:0;} .sw i{position:absolute;inset:0;border-radius:99px;background:#C9D3E0;transition:.2s;} .sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .sw input:checked + i{background:#1E9E74;} .sw input:checked + i::after{transform:translateX(18px);}
  .colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--border);}
  .colors button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink);}
  .colors input[type=color]{width:34px;height:30px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--panel);}
  .seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel-alt);border:1px solid var(--border-soft);}
  .seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--slate);}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .blk{border:1px solid var(--border-soft);border-radius:12px;padding:12px;margin-top:10px;background:var(--panel);}
  .blk-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .blk-h b{font-size:13.5px;} .blk-h .n{font:700 11px Inter,sans-serif;color:#fff;background:var(--teal);border-radius:99px;padding:2px 8px;}
  .blk-h .sp{flex:1;}
  .ic{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--slate);font-size:13px;display:inline-flex;align-items:center;justify-content:center;}
  .ic:hover{color:var(--ink);border-color:var(--slate-light);} .ic.del:hover{color:var(--fail);}
  .item{display:grid;grid-template-columns:1fr 28px;gap:6px;align-items:start;margin-top:8px;padding:8px;border-radius:10px;background:var(--panel-alt);}
  .item .in{background:var(--panel);}
  .item .two{display:grid;gap:6px;}
  .add-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
  .imgs div{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--panel-alt);}
  .imgs img{width:100%;height:100%;object-fit:cover;display:block;}
  .imgs button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;}
  .drop{margin-top:8px;border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--slate);cursor:pointer;}
  .drop:hover,.drop.over{border-color:var(--teal);color:var(--teal);}
  .pv-wrap{display:flex;flex-direction:column;min-height:0;background:var(--panel-alt);}
  .pv-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-soft);font-size:12.5px;color:var(--slate);}
  .pv-bar .sp{flex:1;}
  .pv-scroll{flex:1;overflow:auto;padding:18px;}
  .pv-frame{margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg);transition:width .25s;}
  .pv-frame.phone{width:390px;}
  .pv-frame.desk{width:100%;}
  .pv-frame .cpv .cp-in{padding-top:56px;}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal .box{background:var(--panel);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);}
  .modal h3{margin:0 0 8px;font:700 18px Sora,sans-serif;} .modal p{color:var(--slate);font-size:14px;line-height:1.5;margin:0 0 16px;}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;}
  /* the background tiles and fonts */
  .bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .bg-t{position:relative;height:48px;border-radius:10px;border:0;padding:0;box-shadow:0 0 0 1px var(--border);cursor:pointer;overflow:hidden;display:flex;align-items:flex-end;}
  .bg-t.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--teal);}
  .bg-t span{display:block;width:100%;padding:3px 6px;font-size:10.5px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bg-t span.dark{color:#fff;} .bg-t span.light{color:#16202C;}
  .bg-own input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
  .fonts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  /* editing text in the preview */
  .rt-bar{position:fixed;z-index:450;display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;background:#16202C;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);--rt-acc:#E5463A;}
  .rt-bar button{height:32px;min-width:32px;padding:0 9px;border:0;border-radius:8px;background:none;color:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px;}
  .rt-bar button:hover{background:rgba(255,255,255,.12);}
  .rt-bar .rt-done{background:#fff;color:#16202C;margin-left:4px;} .rt-bar .rt-done:hover{background:#E8ECF4;}
  .rt-sep{width:1px;height:20px;background:rgba(255,255,255,.18);margin:0 3px;}
  .rt-swatch{display:inline-block;width:12px;height:4px;border-radius:2px;background:var(--rt-acc);}
  .rt-menu{position:relative;}
  .rt-pop{display:none;position:absolute;top:38px;left:0;padding:6px;border-radius:10px;background:#16202C;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);gap:4px;}
  .rt-menu.open .rt-pop{display:flex;}
  .rt-pop.rt-fonts{flex-direction:column;align-items:stretch;min-width:190px;max-height:320px;overflow-y:auto;}
  .rt-pop.rt-fonts button{justify-content:flex-start;font-size:15px;font-weight:500;}
  .rt-pop button.sw{width:26px;min-width:26px;height:26px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);}
  .rich-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border-radius:9px;background:rgba(122,79,181,.08);border:1px dashed rgba(122,79,181,.35);font-size:12.5px;color:var(--ink);}
  .rich-note button{margin-left:auto;border:0;background:none;color:var(--teal);font-weight:600;font-size:12px;text-decoration:underline;padding:0;}
  .pv-tip{font-size:12px;color:var(--slate);}
  @media (max-width:1100px){ .ed-body{grid-template-columns:1fr;} .pv-wrap{display:none;} .pv-wrap.show{display:flex;position:fixed;inset:0;z-index:200;} }

  /* Bookings & reminders */
  .bk-box{max-width:780px !important;max-height:88vh;overflow:auto;padding:0 !important;}
  .bk-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:var(--panel);border-bottom:1px solid var(--border-soft);}
  .bk-top h3{margin:0 !important;}
  #bkBody{padding:6px 22px 22px;}
  .bk-sec{padding:16px 0;border-bottom:1px solid var(--border-soft);} .bk-sec:last-child{border-bottom:0;}
  .bk-sec h4{margin:0 0 8px;font:700 15.5px Sora,sans-serif;} .bk-sec h4 small{font-weight:500;color:var(--slate);}
  .bk-sec p{margin:6px 0;font-size:13.5px;line-height:1.5;}
  .bk-ok{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;}
  .bk-warn{padding:9px 12px;border-radius:10px;background:rgba(217,119,6,.1);color:#92400E;font-size:13.5px;}
  .bk-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;} .bk-row .in{flex:1;min-width:180px;}
  .bk-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;}
  .bk-steps{margin:8px 0 0 18px;padding:0;font-size:13.5px;line-height:1.55;} .bk-steps li{margin-bottom:8px;}
  .bk-checks{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;} .bk-chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin-top:8px;cursor:pointer;}
  .bk-how{margin-top:8px;font-size:13.5px;} .bk-how summary{cursor:pointer;font-weight:600;color:var(--teal);} .bk-how ol{margin:8px 0 0 18px;padding:0;line-height:1.55;}
  .bk-ta{min-height:120px;} .bk-ta.sm{min-height:64px;}
  .bk-tags code,.hint code{padding:1px 5px;border-radius:5px;background:var(--panel-alt);font-size:12px;}
  .bk-ev{margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--border-soft);}
  .bk-ev-h{display:flex;justify-content:space-between;font-size:14px;} .bk-ev-h span{color:var(--slate);font-size:12.5px;}
  .bk-link{display:flex;gap:8px;align-items:center;margin-top:8px;} .bk-link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 9px;border-radius:8px;background:var(--panel-alt);font-size:12px;}
  .bk-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}

  document.addEventListener('change', (e) => {

    const a = b.dataset.bk, busy = (on) => { b.disabled = on; };

  const bgOf = (t) => t.bg || (t.mode === 'light' ? 'light' : 'dark');

  const FONT_GROUPS = [['Modern', ['montserrat', 'inter', 'poppins', 'sora', 'outfit', 'space-grotesk', 'raleway']], ['Bold display', ['oswald', 'bebas-neue']], ['Elegant', ['playfair', 'dm-serif', 'lora']]];

  function renderBlocks() {

  // the look of a button: style, shape, size, width, colour, icon, new tab

      item.classList.add('cp-dragph'); document.body.classList.add('cp-dragging'); if (o.onLift) o.onLift();

    // at that moment, so a scroll since then is simply added

    let layout = new Map();
    const measure = (els) => { const st = scrollTop(); layout = new Map(els.map((x) => [x, {r: x.getBoundingClientRect(), st}])); };

      const me = rectOf(item);
      let over = others.find((x) => { const q = rectOf(x); return last.y >= q.top && last.y <= q.bottom && (o.axis === 'y' || (last.x >= q.left && last.x <= q.right)); });
      let ref = null;
      if (over) {
        const q = rectOf(over), after = all.indexOf(over) > all.indexOf(item);
        // only when the pointer is past the middle of that item (towards where it would go), so nothing flips back and forth
        const sameRow = o.axis !== 'y' && Math.abs(q.top - me.top) < Math.min(q.height, me.height) / 2;
        const past = sameRow ? (after ? last.x > q.left + q.width / 2 : last.x < q.left + q.width / 2)
                             : (after ? last.y > q.top + q.height / 2 : last.y < q.top + q.height / 2);
        if (!past) return;
        ref = after ? over.nextElementSibling : over;
      } else if (o.axis === 'y') {
        // above the first one: first place; below the last one: last place
        const f = rectOf(others[0]), l = rectOf(others[others.length - 1]);
        if (last.y < f.top && all[0] !== item) { over = others[0]; ref = others[0]; }
        else if (last.y > l.bottom && all[all.length - 1] !== item) { over = others[others.length - 1]; ref = over.nextElementSibling; }
        else return;
      } else return;
      if (ref === item || item.nextElementSibling === ref) return;
      // FLIP: where they are now (on screen, mid-slide or not), move the item, then slide everyone from there to their new place
      const was = new Map(all.map((x) => [x, x.getBoundingClientRect()]));
      all.forEach((x) => x.getAnimations && x.getAnimations().forEach((a) => a.cancel()));
      over.parentElement.insertBefore(item, ref);
      measure(all);                                                   // the settled places, for the next check
      all.forEach((x) => { if (x === item) return; const a = was.get(x), b = layout.get(x).r, dx = a.left - b.left, dy = a.top - b.top;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) x.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'none'}], {duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)'}); });

    // near the top or bottom edge of the panel, it scrolls by itself
    const tick = () => {
      if (!lifted || !ghost) return;
      const box = scroller === document.scrollingElement ? {top: 0, bottom: innerHeight} : scroller.getBoundingClientRect();
      const sr = {top: Math.max(0, box.top), bottom: Math.min(innerHeight, box.bottom)}, edge = 80;     // the part you can see
      const v = last.y < sr.top + edge ? -Math.ceil((sr.top + edge - last.y) / 5) : last.y > sr.bottom - edge ? Math.ceil((last.y - (sr.bottom - edge)) / 5) : 0;

    };

      if (ev.pointerId !== id) return; last = {x: ev.clientX, y: ev.clientY};

      setTimeout(() => { ghost.remove(); item.classList.remove('cp-dragph'); document.body.classList.remove('cp-dragging'); cardDrag = null; if (o.onEnd) o.onEnd(); o.onDone(items()); }, 190);

  $('pv').addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;

        const blk = cur.blocks[+bi], next = blk && reorder(blk[list], els.map((x) => Number(x.dataset.di)));
        if (next) { blk[list] = next; renderBlocks(); changed(); showToast('Moved'); } else renderPreview(); }});
    } else if (mv) {
      e.preventDefault(); e.stopPropagation();

        onLift: () => $('pv').classList.add('cp-sorting'), onEnd: () => $('pv').classList.remove('cp-sorting'),
        onDone: (els) => { const next = reorder(cur.blocks, els.map((x) => Number(x.dataset.bi))); if (next) { cur.blocks = next; renderBlocks(); changed(); showToast('Step moved'); } else renderPreview(); }});
    }

        onDone: (els) => { const next = reorder(cur.blocks, els.map((x) => Number(x.dataset.bi))); if (next) { cur.blocks = next; changed(); showToast('Step moved'); } renderBlocks(); }});

        const blk = cur.blocks[bi], next = blk && reorder(blk.images || [], els.map((x) => Number(x.dataset.ii)));

  $('pvBkOff').addEventListener('click', () => { pvBooking = false; $('pvBkOff').classList.add('on'); $('pvBkOn').classList.remove('on'); renderPreview(); });
  $('pvDesk').addEventListener('click', () => { $('pvFrame').className = 'pv-frame desk'; $('pvDesk').classList.add('on'); $('pvPhone').classList.remove('on'); });
  $('pvPhone').addEventListener('click', () => { $('pvFrame').className = 'pv-frame phone'; $('pvPhone').classList.add('on'); $('pvDesk').classList.remove('on'); });

  $('pvBtn').addEventListener('click', () => $('pvWrap').classList.add('show')); $('pvClose').addEventListener('click', () => $('pvWrap').classList.remove('show'));
  addEventListener('resize', smallScreen); smallScreen();

  // ---------- start ----------
  auth.onAuthStateChanged(async (user) => {
    if (!user) { location.href = 'home.html'; return; }
    uid = user.uid;
