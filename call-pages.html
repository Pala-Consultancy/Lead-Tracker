<title>PALATRACK - Call pages</title>
<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#3730B3; --success:#1F6F5C; --success-soft:#DCEEE8; --fail:#B43B32; --fail-soft:#FAE1DE;
    --brand:linear-gradient(135deg,#1B59A5 0%,#3730B3 55%,#7B3FE4 100%);
    --shadow:0 1px 2px rgba(16,24,40,0.04),0 2px 6px rgba(16,24,40,0.05),0 10px 24px -8px rgba(16,24,40,0.09);
    --shadow-lg:0 4px 10px rgba(16,24,40,0.06),0 20px 40px -12px rgba(16,24,40,0.16);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0D0F1F; --panel:#161934; --panel-alt:#1C2042; --ink:#ECEEFF;
    --border:#2B3060; --border-soft:#22264A; --slate:#A3A8CC; --slate-light:#767CA6;
    --teal:#6D65F6; --teal-dark:#5A52EE; --teal-deep:#4038C8; --purple:#A77BFF;
    --amber:#FFB547; --red:#FF7F75;
    --success:#5FD3A8; --success-soft:rgba(95,211,168,.14);
    --fail:#FF7F75; --fail-soft:rgba(255,127,117,.14); --amber-soft:rgba(255,181,71,.14);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.45), 0 14px 34px -14px rgba(0,0,0,.7);
    --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset, 0 6px 16px rgba(0,0,0,.45), 0 28px 56px -16px rgba(0,0,0,.75);
    --c-blue-fg:#7DB7FF; --c-blue2-fg:#7DB7FF; --c-blue-bg:rgba(125,183,255,.14); --c-blue-dark:#A9CFFF;
    --c-blue-soft:#1F2446; --c-blue-tint:#1A1E3C; --c-blue-tint2:#181B38; --c-blue-tint3:#1D2143; --c-blue-hover:rgba(125,183,255,.2);
    --c-amber-fg:#FFB547; --c-amber-bg:rgba(255,181,71,.14); --c-amber-light:#FFC878; --c-amber-dark-text:#FFE2B3;
    --c-amber-border:rgba(255,181,71,.35); --c-amber-text2:#FFD28F;
    --c-tan-fg:#F0B070; --c-tan-bg:rgba(240,176,112,.14);
    --c-green-fg:#5FD3A8; --c-green-bg:rgba(95,211,168,.14); --c-green-mid:#4BBF95;
    --c-red-fg:#FF8C82; --c-red-bg:rgba(255,127,117,.14); --c-red-hover:rgba(255,127,117,.22);
    --c-purple-fg:#C4A3FF; --c-purple-bg:rgba(167,123,255,.16); --c-purple-hover:rgba(167,123,255,.24);
    --c-pink-fg:#FF93D6; --c-pink-bg:rgba(255,147,214,.14);
    --c-dark-fg:#ECEEFF; --c-gray-bg:#232850; --c-slate-fg:#A3A8CC; --c-border-alt:#2B3060;
    --c-tiktok-bg:#2A2D4E; --c-hover-bg:#1F2446; --c-zebra-bg:#181B38; --c-stat-fallback-bg:#1C2042;
    --c-ring-track:#2B3060; --c-live-red:#FF6B6B; --c-neutral-bg:#1C2042; --c-toast-bg:#232850; --toast-bg:#232850;
    --clay:#FF9A7A; --clay-soft:rgba(255,154,122,.14);
    --map-nodata-fill:#232850; --map-ocean-start:#10132A; --map-ocean-end:#0D0F1F; --map-graticule:#22264A;
    --map-mid-fill:#4A44B8; --map-hidata-fill:#8E88FF; --map-country-stroke:#0D0F1F; --map-legend-text:#A3A8CC;
    --lk-line:#2B3060; --lk-text:#ECEEFF; --lk-muted:#A3A8CC;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden;}
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  .hidden{display:none !important;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appRoot{display:none;height:100vh;}
  #appRoot.reveal{animation:pageFade .4s ease both;}
  @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .seq-main{flex:1;min-width:0;height:100%;overflow-y:auto;}
  .toast-stack{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
  .toast{background:#16202C;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:pageFade .25s ease both;max-width:380px;}
  .toast.danger{background:var(--fail);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:none;white-space:nowrap;}
  .btn:hover{border-color:var(--slate-light);}
  .btn.primary{border:none;background:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(55,48,179,.5);}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px;}
  .btn.danger{color:var(--fail);}
  .btn:disabled{opacity:.5;cursor:default;}

  /* the list of pages */
  .shell{max-width:1060px;margin:0 auto;padding:34px 26px 90px;}
  .ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .ph h1{font:800 28px Sora,sans-serif;margin:0;letter-spacing:-.02em;}
  .ph p{margin:6px 0 0;color:var(--slate);font-size:14px;max-width:600px;line-height:1.5;}
  .ph .acts{margin-left:auto;display:flex;gap:8px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--border-soft);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
  .card .thumb{height:150px;overflow:hidden;position:relative;cursor:pointer;background:#0A0B0E;}
  .card .thumb .cpv{position:absolute;left:0;top:0;width:1100px;transform:scale(.29);transform-origin:0 0;pointer-events:none;}
  .card .meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;}
  .card .meta b{font-size:15px;}
  .card .meta small{color:var(--slate);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pill{display:inline-flex;align-items:center;gap:6px;width:max-content;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--panel-alt);color:var(--slate);border:1px solid var(--border-soft);}
  .pill.live{background:var(--success-soft);color:var(--success);border-color:transparent;}
  .pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
  .empty{background:var(--panel);border:1px dashed var(--border);border-radius:18px;padding:46px 24px;text-align:center;}
  .empty h2{font:700 20px Sora,sans-serif;margin:0 0 8px;} .empty p{color:var(--slate);max-width:520px;margin:0 auto 18px;line-height:1.55;font-size:14.5px;}

  /* the editor */
  .ed{display:none;height:100%;flex-direction:column;}
  .ed.open{display:flex;}
  .ed-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-soft);background:var(--panel);flex-wrap:wrap;}
  .ed-top .name{flex:1;min-width:180px;font:700 17px Sora,sans-serif;border:1px solid transparent;border-radius:8px;padding:6px 8px;background:transparent;color:var(--ink);}
  .ed-top .name:hover,.ed-top .name:focus{border-color:var(--border);outline:none;background:var(--panel-alt);}
  .saved{font-size:12.5px;color:var(--slate);min-width:70px;}
  .ed-body{flex:1;min-height:0;display:grid;grid-template-columns:440px minmax(0,1fr);}
  .form{overflow-y:auto;padding:16px 16px 60px;border-right:1px solid var(--border-soft);background:var(--paper);}
  .sec{background:var(--panel);border:1px solid var(--border-soft);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .sec > h3{margin:0 0 10px;font:700 14px Sora,sans-serif;display:flex;align-items:center;gap:8px;}
  .sec > h3 small{font:500 12px Inter,sans-serif;color:var(--slate);margin-left:auto;}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--slate);margin:10px 0 5px;}
  label.f:first-of-type{margin-top:0;}
  .in,textarea.in{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--panel-alt);color:var(--ink);padding:9px 11px;font-size:13.5px;outline:none;}
  textarea.in{resize:vertical;min-height:64px;line-height:1.5;}
  .in:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(55,48,179,.12);}
  .hint{font-size:11.5px;color:var(--slate);margin-top:5px;line-height:1.45;}
  .hint.bad{color:var(--fail);} .hint.ok{color:var(--success);}
  .slug{display:flex;align-items:center;border:1px solid var(--border);border-radius:9px;background:var(--panel-alt);overflow:hidden;}
  .slug span{padding:0 4px 0 11px;font-size:13px;color:var(--slate);white-space:nowrap;}
  .slug input{flex:1;min-width:0;border:0;background:transparent;padding:9px 11px 9px 0;font-size:13.5px;color:var(--ink);outline:none;}
  .live-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel-alt);}
  .live-row b{font-size:13.5px;} .live-row small{display:block;font-size:12px;color:var(--slate);margin-top:2px;}
  .sw{margin-left:auto;position:relative;width:44px;height:26px;flex-shrink:0;}
  .sw input{opacity:0;width:0;height:0;} .sw i{position:absolute;inset:0;border-radius:99px;background:#C9D3E0;transition:.2s;} .sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .sw input:checked + i{background:#1E9E74;} .sw input:checked + i::after{transform:translateX(18px);}
  .colors{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--border);}
  .colors button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink);}
  .colors input[type=color]{width:34px;height:30px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--panel);}
  .seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--panel-alt);border:1px solid var(--border-soft);}
  .seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--slate);}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .blk{border:1px solid var(--border-soft);border-radius:12px;padding:12px;margin-top:10px;background:var(--panel);}
  .blk-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .blk-h b{font-size:13.5px;} .blk-h .n{font:700 11px Inter,sans-serif;color:#fff;background:var(--teal);border-radius:99px;padding:2px 8px;}
  .blk-h .sp{flex:1;}
  .ic{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--slate);font-size:13px;display:inline-flex;align-items:center;justify-content:center;}
  .ic:hover{color:var(--ink);border-color:var(--slate-light);} .ic.del:hover{color:var(--fail);}
  .item{display:grid;grid-template-columns:1fr 28px;gap:6px;align-items:start;margin-top:8px;padding:8px;border-radius:10px;background:var(--panel-alt);}
  .item .in{background:var(--panel);}
  .item .two{display:grid;gap:6px;}
  .add-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
  .imgs div{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--panel-alt);}
  .imgs img{width:100%;height:100%;object-fit:cover;display:block;}
  .imgs button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;}
  .drop{margin-top:8px;border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--slate);cursor:pointer;}
  .drop:hover,.drop.over{border-color:var(--teal);color:var(--teal);}
  .pv-wrap{display:flex;flex-direction:column;min-height:0;background:var(--panel-alt);}
  .pv-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border-soft);font-size:12.5px;color:var(--slate);}
  .pv-bar .sp{flex:1;}
  .pv-scroll{flex:1;overflow:auto;padding:18px;}
  .pv-frame{margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg);transition:width .25s;}
  .pv-frame.phone{width:390px;}
  .pv-frame.desk{width:100%;}
  .pv-frame .cpv .cp-in{padding-top:56px;}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal .box{background:var(--panel);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);}
  .modal h3{margin:0 0 8px;font:700 18px Sora,sans-serif;} .modal p{color:var(--slate);font-size:14px;line-height:1.5;margin:0 0 16px;}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;}
  @media (max-width:1100px){ .ed-body{grid-template-columns:1fr;} .pv-wrap{display:none;} .pv-wrap.show{display:flex;position:fixed;inset:0;z-index:200;} }
</style>
</head>
<body>
<div id="pageLoader"><div class="loader-spinner"></div></div>
<div class="toast-stack" id="toastStack"></div>

<div id="appRoot" style="display:none;">
  <div class="seq-sidebar" data-pt-sidebar></div>
  <script src="sidebar.js"></script>
  <div class="seq-main" id="main">
    <!-- the list of call pages -->
    <div class="shell" id="listView">
      <div class="ph">
        <div><h1>Call pages</h1><p>The page your leads see right after booking a call: your main video, short answers to common questions, client stories and results. Share the link in your booking confirmation, so leads show up prepared.</p></div>
        <div class="acts"><button class="btn primary" id="newBtn">+ New call page</button></div>
      </div>
      <div class="cards" id="cards"></div>
    </div>
    <!-- the editor -->
    <div class="ed" id="edView">
      <div class="ed-top">
        <button class="btn sm" id="backBtn">← All pages</button>
        <input class="name" id="fName" aria-label="Page name" placeholder="Page name">
        <span class="saved" id="saved"></span>
        <span class="pill" id="statusPill">Draft</span>
        <button class="btn sm" id="copyBtn">🔗 Copy link</button>
        <a class="btn sm" id="openBtn" target="_blank" rel="noopener">Open ↗</a>
        <button class="btn sm" id="pvBtn" style="display:none">👁 Preview</button>
        <button class="btn sm danger" id="delBtn" title="Delete this page">🗑</button>
      </div>
      <div class="ed-body">
        <div class="form" id="form"></div>
        <div class="pv-wrap" id="pvWrap">
          <div class="pv-bar"><b>Live preview</b><span class="sp"></span><span class="seg"><button id="pvDesk" class="on" type="button">🖥 Desktop</button><button id="pvPhone" type="button">📱 Phone</button></span><button class="btn sm" id="pvClose" style="display:none">✕ Close</button></div>
          <div class="pv-scroll"><div class="pv-frame desk" id="pvFrame"><div id="pv"></div></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="callpage.js"></script>
<script>
  firebase.initializeApp({apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM", authDomain: "lead-tracker-c5c3a.firebaseapp.com", projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app", messagingSenderId: "720572896285", appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"});
  const db = firebase.firestore(), auth = firebase.auth(), storage = firebase.storage();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const uidGen = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function showToast(m, danger) { const el = document.createElement('div'); el.className = 'toast' + (danger ? ' danger' : ''); el.textContent = m; $('toastStack').appendChild(el); setTimeout(() => el.remove(), 3200); }
  const PUBLIC = new URL(location.protocol === 'file:' ? 'call.html' : 'call', location.href).href;   // the shared link: palatrack.com/call?p=…
  const linkFor = (slug) => PUBLIC + '?p=' + encodeURIComponent(slug);
  const SLUG_RE = /^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/;
  const slugify = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
  const ACCENTS = ['#E5463A', '#F59E0B', '#10B981', '#2563EB', '#7C3AED', '#EC4899', '#111827'];
  const TYPES = {video: ['🎬', 'Main video'], questions: ['❓', 'Question videos'], clients: ['⭐', 'Client videos'], results: ['🖼️', 'Results wall'], text: ['📝', 'Text'], button: ['👉', 'Button']};
  let uid = null, wsId = null, pages = [], cur = null, saveTimer = null, saving = false, pvMode = 'desk';

  // a new page starts as a complete example, so it's quick to fill in
  function template(name) {
    return {name: name || 'Call confirmed', slug: '', live: false,
      theme: {accent: '#E5463A', mode: 'dark'},
      hero: {title: 'Your Call Is Confirmed!', highlight: 'Confirmed!', subtitle: 'Please review the important steps below, so you’re fully prepared and we get the most out of our call.'},
      blocks: [
        {id: uidGen(), type: 'video', title: 'Watch This Video Before Your Call', text: 'This is the most important step. Watch the full video below, so you know exactly what to expect on our call and how to get the most from it.', url: ''},
        {id: uidGen(), type: 'questions', title: 'Important Before Our Call', text: 'Watch the short videos below, where I answer the most common questions, so you feel fully prepared.',
          items: [{q: 'Who is this for, and who is it not for?', url: ''}, {q: 'How does the process work?', url: ''}, {q: 'What makes this different?', url: ''}, {q: 'How much time do I need?', url: ''}, {q: 'What happens in the first 90 days?', url: ''}, {q: 'Do I need an audience to start?', url: ''}]},
        {id: uidGen(), type: 'clients', title: 'Hear It From My Clients Themselves', text: 'These are real results my clients got.', urls: ['', '', '', '']},
        {id: uidGen(), type: 'results', title: 'Check all these results out below', images: []}
      ]};
  }
  const pageData = (p) => ({theme: p.theme, hero: p.hero, blocks: p.blocks});

  // ---------- the list ----------
  function renderList() {
    const box = $('cards');
    if (!pages.length) {
      box.outerHTML = '<div class="cards" id="cards"></div>';
      $('cards').innerHTML = '<div class="empty" style="grid-column:1/-1"><h2>Make your first call page</h2><p>Leads who watch your videos before the call show up warmer, better informed and readier to buy. Start from a ready-made example and just add your videos.</p><button class="btn primary" onclick="newPage()">+ New call page</button></div>';
      return;
    }
    box.innerHTML = pages.map((p) => `<div class="card"><div class="thumb" data-open="${p.id}"><div class="cpv-thumb" data-pv="${p.id}"></div></div>
      <div class="meta"><b>${esc(p.name || 'Untitled')}</b>${p.live ? '<span class="pill live">Live</span>' : '<span class="pill">Draft</span>'}
      <small>${p.slug ? esc(linkFor(p.slug).replace(/^https?:\/\//, '')) : 'No link yet'}</small>
      <div class="row"><button class="btn sm" data-open="${p.id}">✏️ Edit</button>${p.live ? `<button class="btn sm" data-copy="${esc(p.slug)}">🔗 Copy link</button><a class="btn sm" href="${esc(linkFor(p.slug))}" target="_blank" rel="noopener">Open ↗</a>` : ''}</div></div></div>`).join('');
    pages.forEach((p) => { const el = box.querySelector(`[data-pv="${p.id}"]`); if (el) CallPage.render(pageData(p), el); });
  }
  $('cards').addEventListener('click', (e) => {
    const o = e.target.closest('[data-open]'); if (o) { openPage(o.dataset.open); return; }
    const c = e.target.closest('[data-copy]'); if (c) copyLink(c.dataset.copy);
  });
  function copyLink(slug) { const l = linkFor(slug); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => showToast('Link copied: ' + l), () => prompt('Copy this link:', l)); }

  // ---------- new, open, delete ----------
  async function newPage() {
    const ref = db.collection('callPages').doc();
    const p = template('Call confirmed'); p.slug = (slugify(window.__wsName || '') || 'call') + '-' + Math.random().toString(36).slice(2, 6);
    const now = firebase.firestore.FieldValue.serverTimestamp();
    try { await ref.set({...p, workspaceId: wsId, createdBy: uid, createdAt: now, updatedAt: now}); }
    catch (e) { showToast('Could not create the page. Please try again.', true); return; }
    pages.unshift({id: ref.id, ...p}); openPage(ref.id);
  }
  window.newPage = newPage;
  $('newBtn').addEventListener('click', newPage);
  function openPage(id) {
    const p = pages.find((x) => x.id === id); if (!p) return;
    cur = JSON.parse(JSON.stringify(p)); cur.id = id; cur._publishedSlug = p.live ? p.slug : '';
    $('listView').classList.add('hidden'); $('edView').classList.add('open');
    $('fName').value = cur.name || ''; $('saved').textContent = '';
    history.replaceState(null, '', '#' + id);
    renderForm(); renderPreview(); renderTop();
  }
  function closeEditor() { flushSave(); cur = null; $('edView').classList.remove('open'); $('listView').classList.remove('hidden'); history.replaceState(null, '', location.pathname); renderList(); }
  $('backBtn').addEventListener('click', closeEditor);
  $('delBtn').addEventListener('click', () => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box"><h3>Delete this call page?</h3><p>“${esc(cur.name || 'Untitled')}” will be removed${cur.live ? ', and its public link stops working' : ''}. This can’t be undone.</p><div class="row"><button class="btn" data-x>Cancel</button><button class="btn primary" style="background:var(--fail)" data-del>Delete</button></div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', async (e) => {
      if (e.target === m || e.target.closest('[data-x]')) { m.remove(); return; }
      if (!e.target.closest('[data-del]')) return;
      m.remove(); clearTimeout(saveTimer);
      const id = cur.id, slug = cur._publishedSlug;
      try { if (slug) await db.doc('publicCallPages/' + slug).delete(); await db.doc('callPages/' + id).delete(); }
      catch (err) { showToast('Could not delete the page.', true); return; }
      pages = pages.filter((x) => x.id !== id); cur = null; $('edView').classList.remove('open'); $('listView').classList.remove('hidden'); history.replaceState(null, '', location.pathname); renderList(); showToast('Page deleted');
    });
  });

  // ---------- the form ----------
  function renderForm() {
    const p = cur, t = p.theme, h = p.hero;
    let html = `
      <div class="sec"><h3>🔗 Link and publishing</h3>
        <label class="f">Page link</label>
        <div class="slug"><span>${esc(PUBLIC.replace(/^https?:\/\//, ''))}?p=</span><input id="fSlug" value="${esc(p.slug || '')}" spellcheck="false" autocomplete="off"></div>
        <div class="hint" id="slugHint">Lowercase letters, numbers and dashes. Put this link in your booking confirmation.</div>
        <div class="live-row"><div><b>Live</b><small id="liveHint">${p.live ? 'Anyone with the link can see this page. Changes go live as you edit.' : 'Only you can see this page. Turn it on to share the link.'}</small></div>
          <label class="sw"><input type="checkbox" id="fLive" ${p.live ? 'checked' : ''}><i></i></label></div>
      </div>
      <div class="sec"><h3>🎨 Style</h3>
        <label class="f">Accent colour</label>
        <div class="colors">${ACCENTS.map((c) => `<button type="button" data-accent="${c}" class="${t.accent.toLowerCase() === c.toLowerCase() ? 'on' : ''}" style="background:${c}" aria-label="Accent ${c}"></button>`).join('')}<input type="color" id="fAccent" value="${esc(t.accent)}" title="Your own colour"></div>
        <label class="f" style="margin-top:12px">Background</label>
        <div class="seg"><button type="button" data-mode="dark" class="${t.mode !== 'light' ? 'on' : ''}">🌙 Dark</button><button type="button" data-mode="light" class="${t.mode === 'light' ? 'on' : ''}">☀️ Light</button></div>
      </div>
      <div class="sec"><h3>✨ Header</h3>
        <label class="f">Headline</label><input class="in" data-k="hero.title" value="${esc(h.title)}">
        <label class="f">Underlined words</label><input class="in" data-k="hero.highlight" value="${esc(h.highlight)}">
        <div class="hint">Word(s) from the headline that get the coloured underline, like “Confirmed!”.</div>
        <label class="f">Intro</label><textarea class="in" data-k="hero.subtitle">${esc(h.subtitle)}</textarea>
      </div>
      <div class="sec"><h3>🧱 Steps <small>numbered automatically</small></h3><div id="blocks"></div>
        <div class="add-row">${Object.entries(TYPES).map(([k, [ic, l]]) => `<button type="button" class="btn sm" data-add="${k}">${ic} ${l}</button>`).join('')}</div>
      </div>`;
    $('form').innerHTML = html;
    renderBlocks();
  }
  function renderBlocks() {
    let step = 0;
    $('blocks').innerHTML = cur.blocks.map((b, i) => {
      const [ic, label] = TYPES[b.type] || ['•', b.type];
      const n = b.type === 'results' ? '' : `<span class="n">Step ${++step}</span>`;
      let f = '';
      if (b.type !== 'button') f += `<label class="f">Title</label><input class="in" data-b="${i}" data-k="title" value="${esc(b.title || '')}">`;
      if (['video', 'questions', 'clients', 'text'].includes(b.type)) f += `<label class="f">Text</label><textarea class="in" data-b="${i}" data-k="text">${esc(b.text || '')}</textarea>`;
      if (b.type === 'video') f += `<label class="f">Video link</label><input class="in" data-b="${i}" data-k="url" value="${esc(b.url || '')}" placeholder="https://youtube.com/watch?v=…">${vhint(b.url)}`;
      if (b.type === 'questions') {
        f += (b.items || []).map((it, j) => `<div class="item"><div class="two"><input class="in" data-b="${i}" data-item="${j}" data-k="q" value="${esc(it.q || '')}" placeholder="The question"><input class="in" data-b="${i}" data-item="${j}" data-k="url" value="${esc(it.url || '')}" placeholder="Video link">${vhint(it.url)}</div><button type="button" class="ic del" data-rmitem="${i}:${j}" title="Remove">✕</button></div>`).join('');
        f += `<div class="add-row"><button type="button" class="btn sm" data-additem="${i}">+ Add a question</button></div>`;
      }
      if (b.type === 'clients') {
        f += (b.urls || []).map((u, j) => `<div class="item"><div class="two"><input class="in" data-b="${i}" data-url="${j}" value="${esc(u || '')}" placeholder="Client video link (YouTube, Vimeo, Loom…)">${vhint(u)}</div><button type="button" class="ic del" data-rmurl="${i}:${j}" title="Remove">✕</button></div>`).join('');
        f += `<div class="add-row"><button type="button" class="btn sm" data-addurl="${i}">+ Add a client video</button></div>`;
      }
      if (b.type === 'results') {
        f += `<div class="imgs">${(b.images || []).map((src, j) => `<div><img src="${esc(src)}" alt=""><button type="button" data-rmimg="${i}:${j}" title="Remove">✕</button></div>`).join('')}</div>
          <div class="drop" data-drop="${i}">📤 Click or drop screenshots here (results, reviews, messages)</div><input type="file" accept="image/*" multiple hidden data-file="${i}">`;
      }
      if (b.type === 'button') f += `<label class="f">Button text</label><input class="in" data-b="${i}" data-k="label" value="${esc(b.label || '')}" placeholder="Add the call to your calendar"><label class="f">Button link</label><input class="in" data-b="${i}" data-k="href" value="${esc(b.href || '')}" placeholder="https://…">`;
      return `<div class="blk"><div class="blk-h"><span>${ic}</span><b>${label}</b>${n}<span class="sp"></span>
        <button type="button" class="ic" data-mv="${i}:-1" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button><button type="button" class="ic" data-mv="${i}:1" title="Move down" ${i === cur.blocks.length - 1 ? 'disabled' : ''}>↓</button><button type="button" class="ic del" data-rm="${i}" title="Remove this step">🗑</button></div>${f}</div>`;
    }).join('') || '<div class="hint" style="margin:6px 0 0">No steps yet. Add one below.</div>';
  }
  function vhint(u) { if (!String(u || '').trim()) return ''; const v = CallPage.parseVideo(u); return v ? `<div class="hint ok">✓ ${({youtube: 'YouTube', vimeo: 'Vimeo', loom: 'Loom', wistia: 'Wistia', drive: 'Google Drive', file: 'Video file'})[v.kind]} video</div>` : '<div class="hint bad">This link isn’t a supported video (YouTube, Vimeo, Loom, Wistia or Google Drive).</div>'; }

  // typing: update the page and the preview as you go (and re-draw the form only where needed)
  $('form').addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'fSlug') { el.value = el.value.toLowerCase().replace(/[^a-z0-9-]/g, ''); return; }
    if (el.id === 'fAccent') { cur.theme.accent = el.value; document.querySelectorAll('[data-accent]').forEach((b) => b.classList.remove('on')); changed(); return; }
    const k = el.dataset.k;
    if (el.dataset.url != null) { cur.blocks[+el.dataset.b].urls[+el.dataset.url] = el.value; refreshHint(el); changed(); return; }
    if (!k) return;
    if (k.startsWith('hero.')) cur.hero[k.slice(5)] = el.value;
    else if (el.dataset.item != null) { cur.blocks[+el.dataset.b].items[+el.dataset.item][k] = el.value; if (k === 'url') refreshHint(el); }
    else if (el.dataset.b != null) { cur.blocks[+el.dataset.b][k] = el.value; if (k === 'url') refreshHint(el); }
    changed();
  });
  function refreshHint(el) { const nx = el.nextElementSibling; if (nx && nx.classList.contains('hint')) nx.remove(); el.insertAdjacentHTML('afterend', vhint(el.value)); }
  $('form').addEventListener('change', (e) => {
    if (e.target.id === 'fSlug') checkSlug();
    if (e.target.id === 'fLive') setLive(e.target.checked);
    if (e.target.dataset.file != null) upload(+e.target.dataset.file, e.target.files);
  });
  $('form').addEventListener('click', (e) => {
    const t = e.target.closest('button,[data-drop]'); if (!t) return;
    const d = t.dataset;
    if (d.accent) { cur.theme.accent = d.accent; $('fAccent').value = d.accent; document.querySelectorAll('[data-accent]').forEach((b) => b.classList.toggle('on', b === t)); changed(); }
    else if (d.mode) { cur.theme.mode = d.mode; document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('on', b === t)); changed(); }
    else if (d.add) { const b = {id: uidGen(), type: d.add, title: ''};
      if (d.add === 'video') Object.assign(b, {title: 'Watch This Video', text: '', url: ''});
      if (d.add === 'questions') Object.assign(b, {title: 'Common Questions', text: '', items: [{q: '', url: ''}]});
      if (d.add === 'clients') Object.assign(b, {title: 'Client Stories', text: '', urls: ['', '']});
      if (d.add === 'results') Object.assign(b, {title: 'Check all these results out below', images: []});
      if (d.add === 'text') Object.assign(b, {title: 'What To Prepare', text: ''});
      if (d.add === 'button') Object.assign(b, {label: 'Add the call to your calendar', href: ''});
      cur.blocks.push(b); renderBlocks(); changed(); }
    else if (d.mv) { const [i, dir] = d.mv.split(':').map(Number), j = i + dir; if (j < 0 || j >= cur.blocks.length) return; [cur.blocks[i], cur.blocks[j]] = [cur.blocks[j], cur.blocks[i]]; renderBlocks(); changed(); }
    else if (d.rm) { cur.blocks.splice(+d.rm, 1); renderBlocks(); changed(); }
    else if (d.additem) { cur.blocks[+d.additem].items.push({q: '', url: ''}); renderBlocks(); changed(); }
    else if (d.rmitem) { const [i, j] = d.rmitem.split(':').map(Number); cur.blocks[i].items.splice(j, 1); renderBlocks(); changed(); }
    else if (d.addurl) { cur.blocks[+d.addurl].urls.push(''); renderBlocks(); changed(); }
    else if (d.rmurl) { const [i, j] = d.rmurl.split(':').map(Number); cur.blocks[i].urls.splice(j, 1); renderBlocks(); changed(); }
    else if (d.rmimg) { const [i, j] = d.rmimg.split(':').map(Number); cur.blocks[i].images.splice(j, 1); renderBlocks(); changed(); }
    else if (d.drop != null) { const f = document.querySelector(`[data-file="${d.drop}"]`); if (f) f.click(); }
  });
  ['dragover', 'dragleave', 'drop'].forEach((ev) => $('form').addEventListener(ev, (e) => {
    const z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault();
    z.classList.toggle('over', ev === 'dragover'); if (ev === 'drop') upload(+z.dataset.drop, e.dataTransfer.files);
  }));
  $('fName').addEventListener('input', () => { cur.name = $('fName').value; changed(); });

  // result screenshots: uploaded to this workspace's storage, shown on the page through their link
  async function upload(i, files) {
    const list = [...(files || [])].filter((f) => /^image\//.test(f.type));
    if (!list.length) return;
    const big = list.filter((f) => f.size > 10 * 1024 * 1024); if (big.length) showToast('Images must be smaller than 10 MB.', true);
    const ok = list.filter((f) => f.size <= 10 * 1024 * 1024); if (!ok.length) return;
    showToast('Uploading ' + ok.length + (ok.length === 1 ? ' image…' : ' images…'));
    for (const f of ok) {
      try {
        const name = Date.now() + '-' + f.name.replace(/[^\w.\-]+/g, '_').slice(-60);
        const ref = storage.ref(`workspaces/${wsId}/callPageImages/${cur.id}/${name}`);
        await ref.put(f, {contentType: f.type});
        const url = await ref.getDownloadURL();
        if (cur && cur.blocks[i]) { cur.blocks[i].images.push(url); renderBlocks(); changed(); }
      } catch (e) { showToast('Could not upload ' + f.name + '.', true); }
    }
  }

  // ---------- the link, going live, and saving ----------
  async function checkSlug() {
    const el = $('fSlug'), hint = $('slugHint'), v = el.value.trim();
    if (!SLUG_RE.test(v)) { hint.className = 'hint bad'; hint.textContent = 'Use 3–40 lowercase letters, numbers or dashes (no dash at the start or end).'; return false; }
    try {
      const d = await db.doc('publicCallPages/' + v).get();
      if (d.exists && d.data().pageId !== cur.id) { hint.className = 'hint bad'; hint.textContent = 'That link is already taken. Try another one.'; return false; }
    } catch (e) { /* offline: it's checked again when going live */ }
    hint.className = 'hint ok'; hint.textContent = '✓ ' + linkFor(v).replace(/^https?:\/\//, '');
    if (v !== cur.slug) { cur.slug = v; changed(); }
    return true;
  }
  async function setLive(on) {
    if (on) { if (!(await checkSlug())) { $('fLive').checked = false; return; } }
    cur.live = on; $('liveHint').textContent = on ? 'Anyone with the link can see this page. Changes go live as you edit.' : 'Only you can see this page. Turn it on to share the link.';
    renderTop(); await flushSave(true);
    if (on && cur.live) showToast('Your page is live! Copy the link to share it.');
  }
  function renderTop() {
    const p = $('statusPill'); p.className = 'pill' + (cur.live ? ' live' : ''); p.textContent = cur.live ? 'Live' : 'Draft';
    $('copyBtn').disabled = !cur.live; $('openBtn').href = cur.slug ? linkFor(cur.slug) : '#'; $('openBtn').style.display = cur.live ? '' : 'none';
  }
  $('copyBtn').addEventListener('click', () => cur && cur.live && copyLink(cur.slug));
  function changed() { renderPreview(); $('saved').textContent = 'Editing…'; clearTimeout(saveTimer); saveTimer = setTimeout(() => flushSave(), 900); }
  async function flushSave(force) {
    clearTimeout(saveTimer); if (!cur || (saving && !force)) return;
    saving = true; $('saved').textContent = 'Saving…';
    const p = cur, now = firebase.firestore.FieldValue.serverTimestamp();
    const data = {name: p.name || 'Untitled', slug: p.slug || '', live: !!p.live, theme: p.theme, hero: p.hero, blocks: p.blocks, updatedAt: now};
    try {
      await db.doc('callPages/' + p.id).update(data);
      // the public copy: what visitors of the link see
      if (p.live) {
        if (p._publishedSlug && p._publishedSlug !== p.slug) { try { await db.doc('publicCallPages/' + p._publishedSlug).delete(); } catch (e) {} }
        await db.doc('publicCallPages/' + p.slug).set({workspaceId: wsId, pageId: p.id, createdBy: uid, page: pageData(p), updatedAt: now});
        p._publishedSlug = p.slug;
      } else if (p._publishedSlug) { await db.doc('publicCallPages/' + p._publishedSlug).delete(); p._publishedSlug = ''; }
      const i = pages.findIndex((x) => x.id === p.id); if (i >= 0) pages[i] = {...pages[i], ...JSON.parse(JSON.stringify(data)), id: p.id};
      if (cur === p) $('saved').textContent = 'Saved ✓';
    } catch (e) {
      $('saved').textContent = 'Not saved'; showToast(e && e.code === 'permission-denied' ? 'That link is taken, or you don’t have access. Try another link.' : 'Could not save. Check your connection.', true);
      if (p.live && !p._publishedSlug) { p.live = false; const l = $('fLive'); if (l) l.checked = false; renderTop(); }
    }
    saving = false;
  }
  addEventListener('beforeunload', () => { if (cur) flushSave(); });

  // ---------- the preview ----------
  function renderPreview() { if (cur) CallPage.render(pageData(cur), $('pv')); }
  $('pvDesk').addEventListener('click', () => { $('pvFrame').className = 'pv-frame desk'; $('pvDesk').classList.add('on'); $('pvPhone').classList.remove('on'); });
  $('pvPhone').addEventListener('click', () => { $('pvFrame').className = 'pv-frame phone'; $('pvPhone').classList.add('on'); $('pvDesk').classList.remove('on'); });
  function smallScreen() { const s = innerWidth <= 1100; $('pvBtn').style.display = s ? '' : 'none'; $('pvClose').style.display = s ? '' : 'none'; if (!s) $('pvWrap').classList.remove('show'); }
  $('pvBtn').addEventListener('click', () => $('pvWrap').classList.add('show')); $('pvClose').addEventListener('click', () => $('pvWrap').classList.remove('show'));
  addEventListener('resize', smallScreen); smallScreen();

  // ---------- start ----------
  auth.onAuthStateChanged(async (user) => {
    if (!user) { location.href = 'home.html'; return; }
    uid = user.uid;
    try {
      const dir = await db.doc(`userDirectory/${uid}`).get();
      wsId = dir.exists ? dir.data().workspaceId : null;
      if (!wsId) { location.href = 'home.html'; return; }
      const w = await db.doc(`workspaces/${wsId}`).get(); window.__wsName = w.exists ? (w.data().name || '') : '';
      const snap = await db.collection('callPages').where('workspaceId', '==', wsId).get();
      pages = snap.docs.map((d) => ({id: d.id, ...d.data()})).sort((a, b) => ((b.updatedAt && b.updatedAt.toMillis ? b.updatedAt.toMillis() : 0) - (a.updatedAt && a.updatedAt.toMillis ? a.updatedAt.toMillis() : 0)));
    } catch (e) { showToast('Could not load your call pages.', true); }
    $('pageLoader').style.display = 'none'; const r = $('appRoot'); r.style.display = 'flex'; r.classList.add('reveal');
    renderList();
    const h = location.hash.slice(1); if (h && pages.find((p) => p.id === h)) openPage(h);
  });
</script>
</body>
</html>
