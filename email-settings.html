<style>
  :root{
    --ink:#1B2430;
    --paper:#EFF5FC;
    --panel:#FFFFFF;
    --border:#D3E0EF;
    --teal:#3730B3;
    --teal-dark:#241F7A;
    --amber:#FF9D00;
    --red:#C0392B;
    --slate:#647084;
    --slate-light:#8A93A3;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 2px 6px rgba(16,24,40,0.05), 0 10px 24px -8px rgba(16,24,40,0.09);
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.05);
    --shadow-lg: 0 4px 10px rgba(16,24,40,0.06), 0 20px 40px -12px rgba(16,24,40,0.16);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --c-blue-fg:#1B59A5;
    --c-blue-bg:#E3EEFA;
    --c-blue-dark:#123F78;
    --c-blue-tint2:#F6FAFE;
    --c-red-fg:#C0392B;
    --c-red-bg:#FBE4E2;
    --c-toast-bg:#1B2430;
  }
  [data-theme="dark"]{
    --ink:#EAF0F8;
    --paper:#0F1620;
    --panel:#1A2430;
    --border:#2C3A4A;
    --teal:#8C8FF5;
    --teal-dark:#B0B3FA;
    --amber:#FFB338;
    --red:#E0625A;
    --slate:#9AAAB8;
    --slate-light:#6B7A88;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 6px rgba(0,0,0,0.28), 0 10px 24px -8px rgba(0,0,0,0.4);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 4px 10px rgba(0,0,0,0.3), 0 20px 40px -12px rgba(0,0,0,0.5);
    --c-blue-fg:#6FA8E8;
    --c-blue-bg:#1E2E42;
    --c-blue-dark:#2A4A6E;
    --c-blue-tint2:#161F28;
    --c-red-fg:#E87A6E;
    --c-red-bg:#3A2220;
    --c-toast-bg:#1B2430;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{max-width:760px;margin:0 auto;padding:28px 24px 80px;}
  #pageLoader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  .loader-logo img{width:56px;height:56px;border-radius:14px;}
  .loader-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--c-blue-fg);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .title-row{display:flex;align-items:center;gap:14px;}
  .logo-badge img{width:40px;height:40px;border-radius:10px;display:block;}
  .title-divider{width:1px;height:34px;background:var(--border);}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--c-blue-fg);}
  h1{font-family:'Sora',sans-serif;font-size:21px;margin:2px 0 2px;color:var(--ink);}
  .sub{font-size:13px;color:var(--slate);}
  .btn{border:1px solid var(--border);background:var(--panel);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .12s, border-color .12s;}
  .btn:hover{background:var(--c-blue-tint2);border-color:var(--c-blue-fg);}
  .btn-primary{background:var(--c-blue-fg);border-color:var(--c-blue-fg);color:#fff;}
  .btn-primary:hover{background:var(--c-blue-dark);border-color:var(--c-blue-dark);}
  .btn:disabled{opacity:.6;cursor:default;}
  .toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--c-toast-bg);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.danger{background:var(--c-red-fg);}

  .es-section{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:26px 26px 24px;margin-bottom:20px;}
  .es-section-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;margin:0 0 4px;color:var(--ink);}
  .es-section-sub{font-size:13px;color:var(--slate);margin:0 0 18px;}
  .es-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .es-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--c-blue-tint2, var(--paper));width:fit-content;position:relative;}
  .es-toolbar button{width:36px;height:36px;border:none;background:transparent;border-radius:9px;color:var(--ink);font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .es-toolbar button:hover{background:var(--c-blue-bg);color:var(--c-blue-fg);}
  .es-toolbar-divider{width:1px;height:22px;background:var(--border);margin:0 4px;}
  .es-emoji-picker{position:absolute;top:48px;left:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 16px 40px rgba(0,0,0,.22);}
  .es-emoji-item{width:34px;height:34px;border:none;background:transparent;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .es-emoji-item:hover{background:var(--c-blue-bg);}
  .es-sig-body{min-height:120px;max-height:260px;overflow-y:auto;padding:14px 16px;border:1px solid var(--border);border-radius:12px;font-family:'Inter',sans-serif;font-size:14px;line-height:1.55;color:var(--ink);outline:none;background:var(--c-blue-tint2, var(--paper));margin-bottom:16px;}
  .es-sig-body:focus{border-color:var(--c-blue-fg);}
  .es-sig-body:empty:before{content:attr(data-placeholder);color:var(--slate);}
  .es-sig-body b, .es-sig-body strong{font-weight:700;}
  .es-sig-body i, .es-sig-body em{font-style:italic;}
  .es-sig-body u{text-decoration:underline;}
  .es-toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13.5px;color:var(--ink);cursor:pointer;}
  .es-switch{position:relative;width:40px;height:22px;flex-shrink:0;}
  .es-switch input{opacity:0;width:0;height:0;position:absolute;}
  .es-switch-track{position:absolute;inset:0;background:var(--border);border-radius:22px;cursor:pointer;transition:background .15s;}
  .es-switch-track:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;}
  .es-switch input:checked + .es-switch-track{background:var(--c-blue-fg);}
  .es-switch input:checked + .es-switch-track:before{transform:translateX(18px);}
  .es-saved-hint{font-size:12px;color:var(--slate);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--c-border-alt, var(--border));border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--slate-light);background-clip:padding-box;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
</style>

<style>
  /* The new theme flows out from the button as a soft, glowing wave: a round,
     soft-edged mask whose size and position are animated from the button. */

  html.pt-wave::view-transition-new(root){z-index:2;

            mask-image:radial-gradient(circle closest-side, #000 86%, transparent 100%);

  .pt-theme-wipe{position:fixed;inset:0;z-index:2147483646;pointer-events:none;}

  ::view-transition-group(pt-aurora){animation:none;}
  ::view-transition-new(pt-aurora){animation:none;z-index:3;mix-blend-mode:screen;

<script>
(function(){
  function reduced(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function layer(){ var d = document.createElement('div'); d.className = 'pt-theme-fx'; document.body.appendChild(d); return d; }
  // Going dark: stars come out across the whole screen, nearest to the button first.
  function starfield(x, y){
    var fx = layer(), n = Math.round(Math.min(90, (innerWidth * innerHeight) / 14000)), maxD = Math.hypot(innerWidth, innerHeight);
    for(var i = 0; i < n; i++){
      var s = document.createElement('i'), sx = Math.random() * innerWidth, sy = Math.random() * innerHeight;
      var size = Math.random() < 0.18 ? 3 : 1 + Math.random() * 1.6;
      s.className = 'pt-star' + (size >= 3 ? ' glow' : '');
      s.style.cssText = 'left:' + sx + 'px;top:' + sy + 'px;width:' + size + 'px;height:' + size + 'px;';
      fx.appendChild(s);
      var delay = (Math.hypot(sx - x, sy - y) / maxD) * 520 + Math.random() * 260;
      s.animate([{opacity:0, transform:'scale(.2)'}, {opacity:1, transform:'scale(1)', offset:.35}, {opacity:.85, offset:.7}, {opacity:0, transform:'scale(.6)'}],
        {duration:1300 + Math.random() * 700, delay:delay, easing:'ease-out', fill:'both'});
    }
    setTimeout(function(){ fx.remove(); }, 2700);
  }
  // ---------- Transition sounds (Web Audio, no files) ----------
  // Going dark: an airy whoosh sweeping down with the wave, a deep warm swell as
  // night settles, crystal twinkles timed with the stars and a shimmering glide
  // for each shooting star. Going light: a rising whoosh and a bright, warm
  // chord like the sunrise. Soft by design; the speaker button turns it off.
  var SOUND_KEY = 'ptThemeSound', AC = null, NOISE = null;
  function soundOn(){ try{ return localStorage.getItem(SOUND_KEY) !== 'off'; }catch(e){ return true; } }
  function audio(){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    if(!AC){
      AC = new C();
      var comp = AC.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
      AC.master = AC.createGain(); AC.master.gain.value = 0.9;
      AC.master.connect(comp); comp.connect(AC.destination);
      addSpace(AC, AC.master);
    }
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }
  // Deep space: a generated reverb (a long, dark, stereo tail) that voices can send into.
  function addSpace(ac, dest){
    var sec = 3.2, len = Math.floor(ac.sampleRate * sec), ir = ac.createBuffer(2, len, ac.sampleRate);
    for(var ch = 0; ch < 2; ch++){
      var d = ir.getChannelData(ch), lp = 0;
      for(var i = 0; i < len; i++){ lp = lp * 0.72 + (Math.random() * 2 - 1) * 0.28; d[i] = lp * Math.pow(1 - i / len, 3.2); }
    }
    var conv = ac.createConvolver(); conv.buffer = ir;
    ac.space = ac.createGain(); ac.space.gain.value = 0.55;
    ac.space.connect(conv); conv.connect(dest);
  }
  function send(ac, node, amount){   // also send a voice into the space reverb
    if(!ac.space) return;
    var g = ac.createGain(); g.gain.value = amount; node.connect(g); g.connect(ac.space);
  }
  function noise(ac){
    if(NOISE) return NOISE;
    var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return (NOISE = buf);
  }
  function env(ac, g, t, peak, attack, hold, release){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
  }
  function whoosh(ac, t, dur, from, to, level, panFrom){
    var src = ac.createBufferSource(); src.buffer = noise(ac); src.loop = true;
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(from, t); bp.frequency.exponentialRampToValueAtTime(to, t + dur);
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.35, dur * 0.15, dur * 0.6);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(panFrom, t); pn.pan.linearRampToValueAtTime(0, t + dur); g.connect(pn); out = pn; }
    src.connect(bp); bp.connect(g); out.connect(ac.master);
    src.start(t); src.stop(t + dur * 1.15);
  }
  function pad(ac, t, freqs, level, attack, hold, release, bright){
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = bright ? 2600 : 1100; lp.Q.value = 0.3;
    var g = ac.createGain(); env(ac, g, t, level, attack, hold, release);
    lp.connect(g); g.connect(ac.master);
    freqs.forEach(function(f, i){
      [-4, 4].forEach(function(cents){
        var o = ac.createOscillator(); o.type = i === 0 ? 'sine' : 'triangle';
        o.frequency.value = f; o.detune.value = cents;
        o.connect(lp); o.start(t); o.stop(t + attack + hold + release + 0.1);
      });
    });
  }
  function bell(ac, t, f, level, pan){
    var g = ac.createGain(); env(ac, g, t, level, 0.006, 0.02, 0.9);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.value = pan; g.connect(pn); out = pn; }
    out.connect(ac.master);
    [[1, 1], [2.01, 0.28], [3.98, 0.08]].forEach(function(p){
      var o = ac.createOscillator(), og = ac.createGain(); o.type = 'sine';
      o.frequency.value = f * p[0]; og.gain.value = p[1];
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.05);
    });
  }
  function glide(ac, t, level, pan){
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(2600, t); o.frequency.exponentialRampToValueAtTime(760, t + 0.55);
    var g = ac.createGain(); env(ac, g, t, level, 0.02, 0.05, 0.5);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan, t + 0.6); g.connect(pn); out = pn; }
    o.connect(g); out.connect(ac.master); o.start(t); o.stop(t + 0.7);
    whoosh(ac, t, 0.5, 6000, 2500, 0.05, pan);   // a faint hiss behind it
  }
  // Sci-fi voices (instead of fairy-tale chimes):
  // an alien energy hum: detuned saw drone through a resonant filter that slowly opens, with a warble.
  function alienHum(ac, t, dur, base, level, filterFrom, filterPeak, filterTo){
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 11;
    lp.frequency.setValueAtTime(filterFrom, t);
    lp.frequency.exponentialRampToValueAtTime(filterPeak, t + dur * 0.55);
    lp.frequency.exponentialRampToValueAtTime(filterTo, t + dur);
    var lfo = ac.createOscillator(), lfoGain = ac.createGain();       // the warble
    lfo.frequency.setValueAtTime(3.2, t); lfo.frequency.linearRampToValueAtTime(7.5, t + dur);
    lfoGain.gain.value = filterPeak * 0.12; lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.4, dur * 0.2, dur * 0.4);
    lp.connect(g); g.connect(ac.master); send(ac, g, 0.5);
    [[1, -9], [1, 11], [2, 5]].forEach(function(v){
      var o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = base * v[0]; o.detune.value = v[1];
      o.connect(lp); o.start(t); o.stop(t + dur + 0.1);
    });
    lfo.start(t); lfo.stop(t + dur + 0.1);
  }
  // A metallic, otherworldly shimmer: ring modulation (two tones multiplied) gives inharmonic partials.
  function ringShimmer(ac, t, dur, f1, f2, level, pan){
    var carrier = ac.createOscillator(), mod = ac.createOscillator(), ring = ac.createGain();
    carrier.type = 'sine'; mod.type = 'sine';
    carrier.frequency.setValueAtTime(f1, t); carrier.frequency.exponentialRampToValueAtTime(f1 * 0.94, t + dur);
    mod.frequency.setValueAtTime(f2, t); mod.frequency.exponentialRampToValueAtTime(f2 * 1.07, t + dur);
    ring.gain.value = 0; mod.connect(ring.gain); carrier.connect(ring);
    var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.3, dur * 0.2, dur * 0.5);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan * 0.5, t + dur); g.connect(pn); out = pn; }
    ring.connect(hp); hp.connect(g); out.connect(ac.master); send(ac, out, 0.7);
    carrier.start(t); mod.start(t); carrier.stop(t + dur + 0.1); mod.stop(t + dur + 0.1);
  }
  // A warp "zip" for each shooting star: an FM sweep that phases past from one side to the other.
  function warp(ac, t, level, pan){
    var car = ac.createOscillator(), mod = ac.createOscillator(), idx = ac.createGain();
    car.type = 'sine'; mod.type = 'sine';
    car.frequency.setValueAtTime(420, t); car.frequency.exponentialRampToValueAtTime(140, t + 0.55);
    mod.frequency.setValueAtTime(420 * 2.47, t); mod.frequency.exponentialRampToValueAtTime(140 * 2.47, t + 0.55);
    idx.gain.setValueAtTime(900, t); idx.gain.exponentialRampToValueAtTime(30, t + 0.55);
    mod.connect(idx); idx.connect(car.frequency);
    var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(2400, t); bp.frequency.exponentialRampToValueAtTime(500, t + 0.55);
    var g = ac.createGain(); env(ac, g, t, level, 0.04, 0.08, 0.45);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan, t + 0.55); g.connect(pn); out = pn; }
    car.connect(bp); bp.connect(g); out.connect(ac.master); send(ac, out, 0.8);
    car.start(t); mod.start(t); car.stop(t + 0.65); mod.stop(t + 0.65);
  }
  // An alien choir: synthetic "voices" (saws through two moving formant filters)
  // singing an off-kilter chord, their vowel morphing from "ooh" to "aah".
  var VOWELS = {oo:[300, 870], aa:[730, 1090], ee:[290, 2250], ah:[650, 1400]};
  function alienChoir(ac, t, dur, freqs, level, from, to){
    var mix = ac.createGain(); mix.gain.value = 1;
    var f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter();
    [f1, f2].forEach(function(f, k){ f.type = 'bandpass'; f.Q.value = k ? 9 : 7;
      f.frequency.setValueAtTime(VOWELS[from][k], t); f.frequency.exponentialRampToValueAtTime(VOWELS[to][k], t + dur * 0.8); });
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.35, dur * 0.25, dur * 0.4);
    mix.connect(f1); mix.connect(f2); f1.connect(g); f2.connect(g); g.connect(ac.master); send(ac, g, 0.9);
    freqs.forEach(function(f){
      [-14, 0, 13].forEach(function(c){
        var o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = c;
        var vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 4.6 + Math.random(); vg.gain.value = 3.5;
        vib.connect(vg); vg.connect(o.detune);
        o.connect(mix); o.start(t); o.stop(t + dur + 0.1); vib.start(t); vib.stop(t + dur + 0.1);
      });
    });
  }
  // A theremin wail: a pure tone gliding with a wide, wavering vibrato (1950s UFO).
  function theremin(ac, t, dur, fFrom, fTo, level, pan){
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(fFrom, t); o.frequency.exponentialRampToValueAtTime(fTo, t + dur * 0.7);
    var vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.setValueAtTime(4.2, t); vib.frequency.linearRampToValueAtTime(6.8, t + dur);
    vg.gain.setValueAtTime(fFrom * 0.012, t); vg.gain.linearRampToValueAtTime(fTo * 0.035, t + dur); vib.connect(vg); vg.connect(o.frequency);
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.3, dur * 0.3, dur * 0.4);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan * 0.3, t + dur); g.connect(pn); out = pn; }
    o.connect(g); out.connect(ac.master); send(ac, out, 1.0);

  }
  // A sub drop: a very low tone sinking like a ship touching down.
  function subDrop(ac, t, level){
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(92, t); o.frequency.exponentialRampToValueAtTime(34, t + 0.9);
    var g = ac.createGain(); env(ac, g, t, level, 0.06, 0.25, 0.8);
    o.connect(g); g.connect(ac.master); o.start(t); o.stop(t + 1.2);
  }
  function playThemeSound(toDark, x){
    if(!soundOn()) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + 0.02, pan = Math.max(-0.8, Math.min(0.8, (x / innerWidth) * 2 - 1));
    if(toDark){
      whoosh(ac, t, 1.3, 2600, 240, 0.22, pan);                                     // night rolls in
      pad(ac, t + 0.35, [110, 164.81, 220, 261.63], 0.04, 0.6, 0.5, 1.4, false);   // the deep, warm swell
      alienChoir(ac, t + 0.3, 2.3, [110, 155.56, 233.08, 311.13], 0.042, 'oo', 'aa'); // alien voices, an off-kilter chord
      alienHum(ac, t + 0.55, 1.9, 55, 0.03, 140, 1500, 320);                         // an alien energy hum wakes up
      subDrop(ac, t + 1.0, 0.11);                                                     // the ship touches down as the wave lands
      ringShimmer(ac, t + 0.85, 1.3, 740, 1130, 0.04, -pan);                         // metallic, otherworldly shimmer as the stars appear
      theremin(ac, t + 1.15, 1.5, 520, 880, 0.028, pan * 0.6);                       // a wavering theremin wail rises
      warp(ac, t + 1.05, 0.045, 0.7); warp(ac, t + 1.47, 0.035, 0.5);                // the two shooting stars phase past
    } else {
      whoosh(ac, t, 0.95, 280, 2800, 0.18, pan);                                    // morning rushes in
      pad(ac, t + 0.2, [261.63, 329.63, 392, 523.25], 0.045, 0.35, 0.4, 1.1, true); // bright, warm C-major sunrise
      alienHum(ac, t + 0.15, 1.1, 110, 0.028, 220, 3200, 1800);                      // a rising power-up
      alienChoir(ac, t + 0.1, 1.3, [261.63, 369.99, 466.16], 0.04, 'oo', 'ee');       // alien voices opening up into the light
      theremin(ac, t + 0.3, 0.9, 440, 990, 0.022, pan * 0.6);                         // a quick upward theremin glide
      ringShimmer(ac, t + 0.45, 0.8, 1180, 1710, 0.035, pan);                        // a bright metallic glint
    }
  }
  // Speaker button next to the light/dark switch (remembered per browser).
  function addSoundButton(){
    var light = document.getElementById('themeLightBtn');
    if(!light || document.getElementById('ptSoundBtn')) return;
    var b = document.createElement('button'); b.type = 'button'; b.id = 'ptSoundBtn';
    b.className = (light.className || '').replace(/\bactive\b/g, '').trim() + ' pt-sound-btn';
    var on = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
    var off = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
    function render(){ var s = soundOn(); b.innerHTML = s ? on : off; b.setAttribute('aria-pressed', s ? 'true' : 'false');
      b.title = s ? 'Transition sound on (click to mute)' : 'Transition sound off (click to turn on)'; b.setAttribute('aria-label', b.title); }
    b.addEventListener('click', function(e){
      e.stopPropagation();
      try{ localStorage.setItem(SOUND_KEY, soundOn() ? 'off' : 'on'); }catch(err){}
      render();
      if(soundOn()){ var ac = audio(); if(ac) bell(ac, ac.currentTime + 0.02, 1318.51, 0.03, 0); }  // a little "on" chime
    });
    render();
    (document.getElementById('themeDarkBtn') || light).insertAdjacentElement('afterend', b);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addSoundButton); else addSoundButton();

  // Going dark, the finale: two shooting stars streak across the sky.
  function meteors(){
    var fx = layer();
    for(var i = 0; i < 2; i++){
      var m = document.createElement('i'); m.className = 'pt-meteor';
      var sx = innerWidth * (0.55 + Math.random() * 0.4), sy = innerHeight * (0.05 + Math.random() * 0.3), ang = 155 + Math.random() * 15;
      m.style.cssText = 'left:' + (sx - 170) + 'px;top:' + sy + 'px;';
      fx.appendChild(m);
      var dx = Math.cos(ang * Math.PI / 180) * 420, dy = Math.sin(ang * Math.PI / 180) * 420;
      m.animate([
        {transform:'rotate(' + ang + 'deg) translateX(0) scaleX(.3)', opacity:0},
        {opacity:1, offset:.2},
        {transform:'translate(' + dx + 'px,' + dy + 'px) rotate(' + ang + 'deg) scaleX(1)', opacity:0}
      ], {duration:900, delay:350 + i * 420, easing:'cubic-bezier(.3,.6,.4,1)', fill:'both'});
    }
    setTimeout(function(){ fx.remove(); }, 2200);
  }
  // Going light: a warm sunrise glow blooms out from the button.
  function sunrise(x, y){
    var fx = layer(), sun = document.createElement('i'), R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) * 1.1;
    sun.className = 'pt-sun';
    sun.style.cssText = 'left:' + (x - R) + 'px;top:' + (y - R) + 'px;width:' + (R * 2) + 'px;height:' + (R * 2) + 'px;';
    fx.appendChild(sun);
    sun.animate([{opacity:0, transform:'scale(.15)'}, {opacity:1, transform:'scale(.7)', offset:.45}, {opacity:0, transform:'scale(1.05)'}],
      {duration:1300, easing:'cubic-bezier(.2,.7,.2,1)', fill:'both'}).onfinish = function(){ fx.remove(); };
  }
  document.addEventListener('click', function(e){
    var btn = e.target && e.target.closest && e.target.closest('#themeDarkBtn,#themeLightBtn');
    if(!btn || btn.__ptReplay) return;
    var toDark = btn.id === 'themeDarkBtn';
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(toDark === isDark || reduced()) return;           // nothing to animate: let the page handle it
    e.stopImmediatePropagation(); e.preventDefault();
    var r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    // A button without a position on screen (e.g. inside a panel that's closing):
    // start from where the click happened, or else from the middle of the screen.
    if(!r.width && !r.height){ x = e.clientX || innerWidth / 2; y = e.clientY || innerHeight / 2; }
    var radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 200;
    var replay = function(){ btn.__ptReplay = true; btn.click(); btn.__ptReplay = false; };
    var after = function(){ if(toDark){ starfield(x, y); meteors(); } else sunrise(x, y); };
    try{ playThemeSound(toDark, x); }catch(err){}
    if(document.startViewTransition){
      var root = document.documentElement;
      root.classList.add('pt-wave');
      root.style.setProperty('--pt-x', x + 'px'); root.style.setProperty('--pt-y', y + 'px');
      // A square mask centred on the button, growing until its soft edge is past every corner.
      var S = (radius / 0.86) * 2;
      var grow = function(size){ return [
        {WebkitMaskSize:'0px 0px', maskSize:'0px 0px', WebkitMaskPosition:x + 'px ' + y + 'px', maskPosition:x + 'px ' + y + 'px'},
        {WebkitMaskSize:size + 'px ' + size + 'px', maskSize:size + 'px ' + size + 'px',
         WebkitMaskPosition:(x - size / 2) + 'px ' + (y - size / 2) + 'px', maskPosition:(x - size / 2) + 'px ' + (y - size / 2) + 'px'}]; };
      var aurora = null, WAVE = toDark ? 1300 : 950;
      var t = document.startViewTransition(function(){
        replay();

      });
      t.ready.then(function(){
        var ease = toDark ? 'cubic-bezier(.55,.08,.35,1)' : 'cubic-bezier(.4,0,.25,1)';   // night rolls in steadily; morning a little quicker
        // fill:'forwards' keeps the new theme fully shown until the transition ends (no flash of the old page).
        root.animate(grow(S), {duration:WAVE, easing:ease, fill:'forwards', pseudoElement:'::view-transition-new(root)'});
        if(toDark){
          // Dusk: the light page dims and cools as night rolls in.
          root.animate({filter:['brightness(1) saturate(1)', 'brightness(.62) saturate(.75) hue-rotate(-8deg)']},
            {duration:WAVE, easing:'ease-in', fill:'forwards', pseudoElement:'::view-transition-old(root)'});
          // The aurora band rides the front of the wave.
          root.animate(grow(S), {duration:WAVE, easing:ease, fill:'forwards', pseudoElement:'::view-transition-new(pt-aurora)'});
          setTimeout(function(){ if(aurora) aurora.style.opacity = '0'; }, WAVE - 120); // gone before the page shows again
        }
        setTimeout(after, toDark ? 700 : 420);  // stars / sunrise start while the wave is still rolling
      });
      t.finished.then(function(){ root.classList.remove('pt-wave'); root.style.removeProperty('--pt-x'); root.style.removeProperty('--pt-y'); if(aurora) aurora.remove(); });
    } else {
      var wipe = document.createElement('div'); wipe.className = 'pt-theme-wipe';
      wipe.style.background = toDark ? '#0D0F1F' : '#EFF5FC';
      document.body.appendChild(wipe);
      wipe.animate({clipPath:['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)']},
        {duration:650, easing:'cubic-bezier(.65,0,.25,1)', fill:'forwards'}).onfinish = function(){
          replay();
          wipe.animate({opacity:[1, 0]}, {duration:340, fill:'forwards'}).onfinish = function(){ wipe.remove(); };
          after();
        };
    }
  }, true);
})();

      }
      tone(880, now, 0.12, 0.13);
      tone(1318.5, now + 0.09, 0.2, 0.13);
      setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 500);
    }catch(e){}
  }
  function showToast(message, danger){
    if(!danger) playSuccessSound();
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast' + (danger ? ' danger' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'opacity .2s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 200);
    }, 3200);
  }

  // ---------- Gmail connection (moved from account.html) ----------
  const GOOGLE_OAUTH_CLIENT_ID = '720572896285-l8cp5dl9a5povsdogivo1tbicd3rl9ik.apps.googleusercontent.com';
  const GMAIL_REDIRECT_URI = 'https://us-central1-lead-tracker-c5c3a.cloudfunctions.net/gmailOAuthCallback';
  let disconnectGmailFn = null;
  try{
    disconnectGmailFn = firebase.functions().httpsCallable('disconnectGmailAccount');
  }catch(err){
    console.error('Could not set up Gmail disconnect (this will not affect the rest of the app):', err);
  }

  function renderEmailConnectionStatus(connected, email){
    const statusEl = document.getElementById('emailConnectStatus');
    const connectBtn = document.getElementById('emailConnectBtn');
    const disconnectBtn = document.getElementById('emailDisconnectBtn');
    if(connected){
      statusEl.textContent = `Connected as ${email} — emails to leads send from this address.`;
      connectBtn.style.display = 'none';
      disconnectBtn.style.display = '';
    } else {
      statusEl.textContent = 'Connect your Gmail so emails to leads send from your own address instead of a shared one.';
      connectBtn.style.display = '';
      disconnectBtn.style.display = 'none';
    }
  }

  function initEmailConnectionUI(user){
    const params = new URLSearchParams(location.search);
    const connectResult = params.get('gmailConnect');
    if(connectResult){
      if(connectResult === 'success') showToast('Gmail connected!');
      else if(connectResult === 'denied') showToast('Gmail connection was cancelled.', true);
      else showToast('Could not connect Gmail. Please try again.', true);
      history.replaceState(null, '', location.pathname);
    }

    db.doc(`emailConnections/${user.uid}`).get().then(doc=>{
      renderEmailConnectionStatus(doc.exists, doc.exists ? doc.data().connectedEmail : null);
    }).catch(err=>{
      console.error('Could not load email connection status', err);
    });

    document.getElementById('emailConnectBtn').onclick = ()=>{
      const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
        client_id: GOOGLE_OAUTH_CLIENT_ID,
        redirect_uri: GMAIL_REDIRECT_URI,
        response_type: 'code',
        scope: 'https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.readonly',
        access_type: 'offline',
        prompt: 'consent',
        state: user.uid
      }).toString();
      location.href = authUrl;
    };

    document.getElementById('emailDisconnectBtn').onclick = ()=>{
      if(!disconnectGmailFn) return;
      const btn = document.getElementById('emailDisconnectBtn');
      btn.disabled = true;
      disconnectGmailFn().then(()=>{
        renderEmailConnectionStatus(false, null);
        showToast('Gmail disconnected.');
      }).catch(err=>{
        showToast('Could not disconnect: ' + (err.message || 'please try again.'), true);
      }).finally(()=>{
        btn.disabled = false;
      });
    };
  }

  // ---------- Signature editor ----------
  const sigBody = document.getElementById('sigBody');
  const sigAutoInsert = document.getElementById('sigAutoInsert');
  const sigSavedHint = document.getElementById('sigSavedHint');
  // Same reasoning as the compose window: avoid the browser wrapping each
  // line in its own <div>, since email clients add their own spacing
  // around block elements that isn't there in the editor.
  // Same reasoning as the compose window — intercept Enter directly rather
  // than rely on a browser setting that isn't consistently honored.
  sigBody.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      document.execCommand('insertLineBreak');
    }
  });

  // Pasting a screenshot/image directly into this box would otherwise let
  // the browser decide how to represent it — which is sometimes a "blob:"
  // reference that only means something inside this exact browser tab.
  // That looks fine here but turns into nothing once saved and sent, since
  // there's no actual image data behind it anywhere else. Intercepting the
  // paste and inserting a real embedded (base64) image guarantees there's
  // always actual portable image data, not just a local pointer.
  sigBody.addEventListener('paste', (e)=>{
    const items = Array.from(e.clipboardData?.items || []);
    const imageItem = items.find(item => item.type.startsWith('image/'));
    if(imageItem){
      e.preventDefault();
      const file = imageItem.getAsFile();
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        document.execCommand('insertHTML', false, `<img src="${reader.result}" style="max-width:100%;">`);
      };
      reader.readAsDataURL(file);
      return;
    }
    const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
    if(text){
      e.preventDefault();
      const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const html = escaped.replace(/\r\n/g, '\n').split('\n').join('<br>');
      document.execCommand('insertHTML', false, html);
    }
  });

  document.querySelectorAll('.es-toolbar [data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      sigBody.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    });
  });

  const EMOJI_LIST = ['😀','😄','😊','🙂','😉','😍','😂','🎉','👍','👏','🙏','👋','✅','⭐','🔥','💡','📌','📅','📞','📧','🤝','💼','📈','☕'];
  const sigEmojiPicker = document.getElementById('sigEmojiPicker');
  sigEmojiPicker.innerHTML = EMOJI_LIST.map(e=>`<button type="button" class="es-emoji-item">${e}</button>`).join('');
  document.getElementById('sigEmojiBtn').addEventListener('click', (e)=>{
    e.stopPropagation();
    sigEmojiPicker.style.display = sigEmojiPicker.style.display === 'none' ? 'grid' : 'none';
  });
  sigEmojiPicker.addEventListener('click', (e)=>{
    const item = e.target.closest('.es-emoji-item');
    if(!item) return;
    sigBody.focus();
    document.execCommand('insertText', false, item.textContent);
    sigEmojiPicker.style.display = 'none';
  });
  document.addEventListener('click', (e)=>{
    if(sigEmojiPicker.style.display !== 'none' && !sigEmojiPicker.contains(e.target) && e.target.id !== 'sigEmojiBtn'){
      sigEmojiPicker.style.display = 'none';
    }
  });

  function loadSignature(uid){
    db.doc(`emailSignatures/${uid}`).get().then(doc=>{
      if(doc.exists){
        const data = doc.data();
        sigBody.innerHTML = data.signatureHtml || '';
        sigAutoInsert.checked = !!data.autoInsert;
      }
    }).catch(err=>{
      console.error('Could not load signature', err);
    });
  }

  function saveSignature(uid){
    const btn = document.getElementById('sigSaveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    db.doc(`emailSignatures/${uid}`).set({
      signatureHtml: sigBody.innerHTML.trim(),
      autoInsert: sigAutoInsert.checked,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge: true}).then(()=>{
      showToast('Signature saved!');
      const now = new Date();
      sigSavedHint.textContent = 'Last saved just now';
    }).catch(err=>{
      console.error(err);
      showToast('Could not save signature: ' + (err.message || 'please try again.'), true);
    }).finally(()=>{
      btn.disabled = false;
      btn.textContent = 'Save signature';
    });
  }

  document.getElementById('sigSaveBtn').addEventListener('click', ()=>{
    const user = auth.currentUser;
    if(!user) return;
    saveSignature(user.uid);
  });

  // ---------- Auth ----------
  auth.onAuthStateChanged(user=>{
    document.getElementById('pageLoader').style.display = 'none';
    if(!user){
      location.href = 'home.html';
      return;
    }
    document.getElementById('appRoot').style.display = 'block';
    initEmailConnectionUI(user);
    loadSignature(user.uid);
  });
})();
</script>
</body>
</html>
