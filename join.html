<div class="trust">🔒 Secure, encrypted connection · PalaTrack</div></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  // Joining a team through an invitation: (1) accept, which signs in with the link and adds them to the workspace,
  // (2) their name and a password for next time, (3) into PalaTrack.
  firebase.initializeApp({
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  });
  const auth = firebase.auth(), db = firebase.firestore(), q = new URLSearchParams(location.search);
  const ws = q.get('workspace') || '', invitee = (q.get('invitee') || '').trim(), from = (q.get('from') || '').trim(), company = (q.get('company') || '').trim();
  const esc = (t) => String(t || '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  const brand = document.querySelector('.brand').outerHTML;
  const show = (html) => { document.getElementById('card').innerHTML = brand + html; };
  const steps = (n) => `<div class="steps" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
  const initials = (t) => String(t || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((x) => x[0]).join('').toUpperCase() || '?';
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const teamName = company || 'your team';
  let user = null;

  function problem(title, text) {
    show(`<div class="ic bad" aria-hidden="true">!</div><h1>${title}</h1><p class="sub">${text}</p><a class="btn" href="boards.html?login=1">Go to sign in</a>`);
  }

  // step 1: the invitation
  function stepAccept() {
    show(`${steps(1)}<h1>Join ${esc(teamName)} on PalaTrack</h1>
      ${from ? `<div class="who"><span class="av">${esc(initials(from))}</span><div><small>Invited by</small><b>${esc(from)}</b></div></div>` : ''}
      <p class="sub">Work together on leads, LinkedIn conversations and content.</p>
      ${invitee ? `<div class="center"><span class="pill">✉️ You’re joining as <b>${esc(invitee)}</b></span></div>` : `<label for="em">Your email address</label><input id="em" type="email" autocomplete="email" placeholder="you@company.com">`}
      <button class="btn" id="go" type="button">Accept invitation →</button><div class="err" id="err"></div>
      <p class="small">Not ${invitee ? esc(invitee) : 'you'}? Then you can simply close this page.</p>`);
    const go = document.getElementById('go');
    go.addEventListener('click', async () => {
      const email = invitee || (document.getElementById('em').value || '').trim();
      const err = document.getElementById('err'); err.textContent = '';
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Enter the email address the invitation was sent to.'; return; }
      go.disabled = true; go.innerHTML = '<span class="sp"></span>Joining…';
      let stage = 'signing in';
      try {
        // signed in as someone else in this browser (for example the person who sent the invite)? sign out first
        if (auth.currentUser && (auth.currentUser.email || '').toLowerCase() !== email.toLowerCase()) await auth.signOut();
        const cred = await auth.signInWithEmailLink(email, location.href);
        user = cred.user; try { localStorage.removeItem('emailForSignIn'); } catch (e) { /* ignore */ }
        history.replaceState({}, document.title, location.pathname + '?workspace=' + encodeURIComponent(ws) + (company ? '&company=' + encodeURIComponent(company) : ''));
        stage = 'joining the team';
        // add them to the workspace (unless they already have one), exactly as the boards page did
        if (ws) {
          const dir = await db.collection('userDirectory').doc(user.uid).get();
          if (!(dir.exists && dir.data().workspaceId)) {
            await db.collection('workspaces').doc(ws).collection('members').doc(user.uid).set({
              name: '', company: company || '', isAdmin: false, language: (localStorage.getItem('preferredLanguage') || 'en'),
              createdAt: firebase.firestore.FieldValue.serverTimestamp()});
            await db.collection('userDirectory').doc(user.uid).set({workspaceId: ws});
          }
        }
        stepProfile();
      } catch (e) {
        go.disabled = false; go.textContent = 'Accept invitation →';
        if (e && /invalid-action-code|expired-action-code/.test(e.code || '')) problem('This invitation has expired', `Invitation links work once, for a limited time. Ask ${esc(from || 'your teammate')} to send you a new one.`);
        else if (e && e.code === 'auth/invalid-email') err.textContent = 'That email doesn’t match the invitation. Use the address it was sent to.';
        else if (user) { console.error('join', e); stepProfile(); }    // signed in fine; joining the team is retried when they open PalaTrack
        else { console.error('join', stage, e); err.textContent = `Couldn’t join right now (${stage}: ${(e && (e.code || e.message)) || 'unknown error'}). Please try again, or send this message to whoever invited you.`; }
      }
    });
  }

  // step 2: their name and a password for next time
  function stepProfile() {
    show(`${steps(2)}<h1>Set up your account</h1><p class="sub">So your team knows who you are, and you can sign in with a password next time.</p>
      <label for="nm">Your full name</label><input id="nm" type="text" autocomplete="name" placeholder="Jane Doe">
      <label for="un">Username</label><div class="pw"><input id="un" type="text" autocomplete="username" spellcheck="false" placeholder="yourname" style="padding-left:32px"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:#94A3B8">@</span></div>
      <div class="hint" id="hu">Others in PalaTrack can find and message you with this.</div>
      <label for="p1">Choose a password</label><div class="pw"><input id="p1" type="password" autocomplete="new-password"><button type="button" class="eye" data-eye aria-label="Show password">${EYE}</button></div>
      <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="hint" id="h1">At least 6 characters.</div>
      <label for="p2">Confirm password</label><div class="pw"><input id="p2" type="password" autocomplete="new-password"><button type="button" class="eye" data-eye aria-label="Show password">${EYE}</button></div>
      <div class="hint" id="h2"></div>
      <button class="btn" id="save" type="button">Finish and open PalaTrack →</button><div class="err" id="err"></div>`);
    const nm = document.getElementById('nm'), p1 = document.getElementById('p1'), p2 = document.getElementById('p2'), meter = document.getElementById('meter'), h2 = document.getElementById('h2');
    nm.focus();
    const strength = () => { const v = p1.value; const n = !v ? 0 : Math.max(1, [v.length >= 8, /\d/.test(v), /[A-Z]/.test(v), /[^A-Za-z0-9]/.test(v)].filter(Boolean).length - (v.length < 6 ? 1 : 0)); meter.className = 'meter' + (n ? ' s' + n : ''); };
    const match = () => { if (!p2.value) { h2.className = 'hint'; h2.textContent = ''; return; } const ok = p1.value === p2.value; h2.className = 'hint ' + (ok ? 'ok' : 'bad'); h2.textContent = ok ? '✓ Passwords match' : 'Passwords don’t match yet'; };
    p1.addEventListener('input', () => { strength(); match(); }); p2.addEventListener('input', match);
    // the username, exactly as on the sign-up page: 3–24 characters, lowercase letters, numbers, dots and underscores
    const UN_RE = /^[a-z0-9](?:[a-z0-9._]{1,22})[a-z0-9]$/, un = document.getElementById('un'), hu = document.getElementById('hu');
    const clean = (v) => String(v || '').toLowerCase().replace(/^@+/, '').replace(/[^a-z0-9._]/g, '');
    let unOk = '', touched = false, tm = null;
    const say = (cls, t) => { hu.className = 'hint ' + cls; hu.textContent = t; };
    function check() {
      const v = clean(un.value); if (un.value !== v) un.value = v; unOk = ''; clearTimeout(tm);
      if (!v) { say('', 'Others in PalaTrack can find and message you with this.'); return; }
      if (!UN_RE.test(v)) { say('bad', '3–24 characters: lowercase letters, numbers, dots and underscores.'); return; }
      say('', 'Checking…');
      tm = setTimeout(() => db.doc('usernames/' + v).get().then((d) => { if (clean(un.value) !== v) return;
        if (d.exists && d.data().uid !== (user && user.uid)) say('bad', '@' + v + ' is already taken. Try another one.'); else { unOk = v; say('ok', '✓ @' + v + ' is available.'); } },
        () => say('bad', 'Couldn’t check right now. Try again in a moment.')), 350);
    }
    un.addEventListener('input', () => { touched = true; check(); });
    nm.addEventListener('input', () => { if (touched) return;
      const parts = nm.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/\s+/).map(clean).filter(Boolean);
      un.value = parts.slice(0, 2).join('.').slice(0, 24); check(); });
    document.querySelectorAll('[data-eye]').forEach((b) => b.addEventListener('click', () => { const t = p1.type === 'password' ? 'text' : 'password'; p1.type = t; p2.type = t; }));
    document.getElementById('save').addEventListener('click', async (ev) => {
      const b = ev.currentTarget, err = document.getElementById('err'); err.textContent = '';
      const name = nm.value.trim();
      if (name.replace(/[^\p{L}]/gu, '').length < 2 || /\d/.test(name)) { err.textContent = 'Please enter your real name.'; nm.focus(); return; }
      if (!unOk || unOk !== clean(un.value)) { err.textContent = 'Choose an available username first.'; un.focus(); return; }
      if (p1.value.length < 6) { err.textContent = 'Use at least 6 characters for your password.'; p1.focus(); return; }
      if (p1.value !== p2.value) { err.textContent = 'The two passwords don’t match. Type the same password twice.'; p2.focus(); return; }
      b.disabled = true; b.innerHTML = '<span class="sp"></span>Saving…';
      try {
        await user.updatePassword(p1.value);
        await user.updateProfile({displayName: name});
        if (ws) await db.collection('workspaces').doc(ws).collection('members').doc(user.uid).set({name, company: company || ''}, {merge: true});
        // the username: saved exactly like the sign-up page does (so the "choose your username" pop-up never appears)
        const now = firebase.firestore.FieldValue.serverTimestamp(), b2 = db.batch();
        b2.set(db.doc('usernames/' + unOk), {uid: user.uid, createdAt: now});
        b2.set(db.doc('profiles/' + user.uid), {uid: user.uid, username: unOk, name, nameLower: name.toLowerCase(), photoURL: '', headline: String(company || '').slice(0, 120), updatedAt: now}, {merge: true});
        try { await b2.commit(); }
        catch (e2) { b.disabled = false; b.textContent = 'Finish and open PalaTrack →'; unOk = ''; say('bad', '@' + clean(un.value) + ' was just taken. Choose another one.'); un.focus(); return; }
        stepDone(name);
      } catch (e) {
        b.disabled = false; b.textContent = 'Finish and open PalaTrack →';
        err.textContent = e && e.code === 'auth/weak-password' ? 'That password is too weak. Try a longer one.' : 'Couldn’t save it right now. Please try again.';
      }
    });
  }

  // step 3: in
  function stepDone(name) {
    show(`${steps(3)}<div class="ic" aria-hidden="true">✓</div><h1>You’re in, ${esc(String(name).split(' ')[0])} 🎉</h1>
      <p class="sub">Welcome to ${esc(teamName)} on PalaTrack. Taking you to your team now…</p><a class="btn" href="home.html">Open PalaTrack →</a>`);
    setTimeout(() => { location.href = 'home.html'; }, 2500);
  }

  if (!auth.isSignInWithEmailLink(location.href)) {
    auth.onAuthStateChanged((u) => { if (u) location.replace('home.html'); else problem('This invitation link isn’t complete', 'Open the link straight from your invitation email, or ask your teammate to send a new one.'); });
  } else stepAccept();
</script>
</body>
</html>
