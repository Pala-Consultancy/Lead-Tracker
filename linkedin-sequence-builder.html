<title>PALATRACK - LinkedIn DM log</title>
<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#3730B3; --teal-deep:#191659; --fail:#B43B32; --ok:#1E9E74;
    --li:#0A66C2; --me-bubble:#EEF3FB; --them-bubble:#FFFFFF;
    --shadow:0 1px 2px rgba(16,24,40,0.05),0 8px 24px -10px rgba(16,24,40,0.18);
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0D0F1F; --panel:#161934; --panel-alt:#1C2042; --ink:#ECEEFF;
    --border:#2B3060; --border-soft:#22264A; --slate:#A3A8CC; --slate-light:#767CA6;
    --teal:#6D65F6; --teal-dark:#5A52EE; --teal-deep:#4038C8; --purple:#A77BFF;
    --amber:#FFB547; --red:#FF7F75;
    --success:#5FD3A8; --success-soft:rgba(95,211,168,.14);
    --fail:#FF7F75; --fail-soft:rgba(255,127,117,.14); --amber-soft:rgba(255,181,71,.14);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.45), 0 14px 34px -14px rgba(0,0,0,.7);
    --shadow-sm:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset, 0 6px 16px rgba(0,0,0,.45), 0 28px 56px -16px rgba(0,0,0,.75);
    --c-blue-fg:#7DB7FF; --c-blue2-fg:#7DB7FF; --c-blue-bg:rgba(125,183,255,.14); --c-blue-dark:#A9CFFF;
    --c-blue-soft:#1F2446; --c-blue-tint:#1A1E3C; --c-blue-tint2:#181B38; --c-blue-tint3:#1D2143; --c-blue-hover:rgba(125,183,255,.2);
    --c-amber-fg:#FFB547; --c-amber-bg:rgba(255,181,71,.14); --c-amber-light:#FFC878; --c-amber-dark-text:#FFE2B3;
    --c-amber-border:rgba(255,181,71,.35); --c-amber-text2:#FFD28F;
    --c-tan-fg:#F0B070; --c-tan-bg:rgba(240,176,112,.14);
    --c-green-fg:#5FD3A8; --c-green-bg:rgba(95,211,168,.14); --c-green-mid:#4BBF95;
    --c-red-fg:#FF8C82; --c-red-bg:rgba(255,127,117,.14); --c-red-hover:rgba(255,127,117,.22);
    --c-purple-fg:#C4A3FF; --c-purple-bg:rgba(167,123,255,.16); --c-purple-hover:rgba(167,123,255,.24);
    --c-pink-fg:#FF93D6; --c-pink-bg:rgba(255,147,214,.14);
    --c-dark-fg:#ECEEFF; --c-gray-bg:#232850; --c-slate-fg:#A3A8CC; --c-border-alt:#2B3060;
    --c-tiktok-bg:#2A2D4E; --c-hover-bg:#1F2446; --c-zebra-bg:#181B38; --c-stat-fallback-bg:#1C2042;
    --c-ring-track:#2B3060; --c-live-red:#FF6B6B; --c-neutral-bg:#1C2042; --c-toast-bg:#232850; --toast-bg:#232850;
    --clay:#FF9A7A; --clay-soft:rgba(255,154,122,.14);
    --map-nodata-fill:#232850; --map-ocean-start:#10132A; --map-ocean-end:#0D0F1F; --map-graticule:#22264A;
    --map-mid-fill:#4A44B8; --map-hidata-fill:#8E88FF; --map-country-stroke:#0D0F1F; --map-legend-text:#A3A8CC;
    --lk-line:#2B3060; --lk-text:#ECEEFF; --lk-muted:#A3A8CC;
  }
  html[data-theme="dark"]{--li:#71B7FB;--me-bubble:#1F2550;--them-bubble:#191C3A;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  button,input,textarea,select{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  .hidden{display:none !important;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appRoot{display:none;height:100vh;overflow:hidden;}
  .seq-main{flex:1;min-width:0;height:100%;overflow:hidden;display:flex;flex-direction:column;}
  #appRoot > .seq-sidebar{height:100%;overflow-y:auto;overscroll-behavior:contain;flex-shrink:0;}
  .btn{height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:var(--ink);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
  .btn:hover{border-color:var(--slate-light);}
  .btn.primary{background:linear-gradient(135deg,#3730B3,#6A4EC4);border:none;color:#fff;box-shadow:0 10px 22px -12px rgba(55,48,179,.8);}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;}
  .btn.danger{color:var(--fail);}
  .in{width:100%;height:40px;border:1.5px solid var(--border);border-radius:11px;padding:0 12px;font-size:14px;background:var(--panel-alt);outline:none;}
  .in:focus{border-color:var(--teal);}
  .toast-stack{position:fixed;right:20px;bottom:20px;z-index:900;display:flex;flex-direction:column;gap:8px;}
  .toast{background:#16202C;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:380px;}
  .toast.danger{background:var(--fail);}

  /* ---------- the page ---------- */
  .dm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 28px 14px;flex-shrink:0;}
  .dm-head h1{margin:0;font:800 24px Sora,sans-serif;letter-spacing:-.02em;}
  .dm-head p{margin:4px 0 0;font-size:14px;color:var(--slate);}
  /* ===== LinkedIn Messaging's look ===== */
  .dm{--li-bg:#FFFFFF;--li-line:#E8E8E8;--li-ink:rgba(0,0,0,.9);--li-ink2:rgba(0,0,0,.6);--li-ink3:rgba(0,0,0,.45);--li-hover:#F3F2EF;--li-sel:#EBF3FB;--li-green:#01754F;--li-blue:#0A66C2;--li-blue-d:#004182;
    font-family:-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Fira Sans",Ubuntu,Oxygen,"Oxygen Sans",Cantarell,"Droid Sans","Apple Color Emoji","Segoe UI Emoji",sans-serif;
    flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr;margin:0 28px 24px;background:var(--li-bg);border:1px solid var(--li-line);border-radius:10px;box-shadow:0 0 0 1px rgba(140,140,140,.08),0 2px 4px rgba(0,0,0,.04);overflow:hidden;color:var(--li-ink);}
  html[data-theme="dark"] .dm{--li-bg:#1B1F23;--li-line:#38434F;--li-ink:rgba(255,255,255,.9);--li-ink2:rgba(255,255,255,.6);--li-ink3:rgba(255,255,255,.45);--li-hover:#262C31;--li-sel:#20303F;--li-green:#3FBF8F;--li-blue:#71B7FB;--li-blue-d:#A8D4FF;}
  /* the list */
  .dm-list{border-right:1px solid var(--li-line);display:flex;flex-direction:column;min-height:0;}
  .dm-lh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 16px;border-bottom:1px solid var(--li-line);}
  .dm-lh b{font-size:16px;font-weight:600;}
  .dm-lh button{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--li-ink2);display:flex;align-items:center;justify-content:center;} .dm-lh button:hover{background:var(--li-hover);}
  .dm-lh svg{width:20px;height:20px;}
  .dm-search{padding:8px 12px;border-bottom:1px solid var(--li-line);}
  .dm-search .sw{position:relative;} .dm-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--li-ink2);pointer-events:none;}
  .dm-search .in{height:34px;font-size:14px;padding-left:34px;border:none;border-radius:4px;background:var(--li-hover);color:var(--li-ink);}
  .dm-search .in:focus{box-shadow:0 0 0 2px var(--li-ink);}
  .dm-items{flex:1;overflow-y:auto;}
  .dm-item{position:relative;display:flex;gap:12px;align-items:center;width:100%;padding:12px 12px 12px 16px;border:none;background:none;text-align:left;color:inherit;}
  .dm-item::after{content:"";position:absolute;left:84px;right:0;bottom:0;height:1px;background:var(--li-line);}
  .dm-item:hover{background:var(--li-hover);}
  .dm-item.on{background:var(--li-sel);} .dm-item.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--li-green);}
  .dm-item .meta{flex:1;min-width:0;}
  .dm-item .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .dm-item b{font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dm-item time{font-size:12px;color:var(--li-ink2);flex-shrink:0;}
  .dm-item small{display:block;margin-top:2px;font-size:14px;color:var(--li-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dm-empty{padding:40px 22px;text-align:center;color:var(--li-ink2);font-size:14px;line-height:1.6;}
  .dm-empty b{display:block;color:var(--li-ink);font-size:16px;font-weight:600;margin-bottom:4px;}
  /* avatars */
  .av{width:56px;height:56px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;color:#fff;background:#8C8C8C;}
  .av img{width:100%;height:100%;object-fit:cover;display:block;}
  .av.sm{width:40px;height:40px;font-size:14px;} .av.xs{width:32px;height:32px;font-size:12px;}
  .av.me{background:#0A66C2;}
  /* the thread */
  .dm-thread{display:flex;flex-direction:column;min-height:0;}
  .th-head{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--li-line);min-height:60px;}
  .th-head .meta{flex:1;min-width:0;}
  .th-head b{display:block;font-size:16px;font-weight:600;} .th-head b a{color:inherit;text-decoration:none;} .th-head b a:hover{text-decoration:underline;}
  .th-head small{display:block;font-size:12px;color:var(--li-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .th-head .ib{width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--li-ink2);display:inline-flex;align-items:center;justify-content:center;font-size:15px;} .th-head .ib:hover{background:var(--li-hover);color:var(--li-ink);}
  .th-head .ib svg{width:20px;height:20px;}
  .th-chips{display:none;}
  .th-head .th-back{display:none;}
  .th-body{flex:1;overflow-y:auto;padding:8px 16px 12px;}
  .th-profile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 0 12px;border-bottom:1px solid var(--li-line);margin-bottom:6px;}
  .th-profile .av{width:72px;height:72px;font-size:24px;}
  .th-profile b{font-size:16px;font-weight:600;margin-top:4px;} .th-profile b a{color:inherit;text-decoration:none;} .th-profile b a:hover{text-decoration:underline;color:var(--li-blue);} .th-profile span{font-size:14px;color:var(--li-ink2);}
  .th-profile .pl{font-size:12px;color:var(--li-ink3);} .th-profile .pl a{color:var(--li-blue);font-weight:600;text-decoration:none;}
  .day{display:flex;align-items:center;gap:12px;margin:14px 0 8px;font-size:12px;font-weight:400;color:var(--li-ink2);text-transform:uppercase;letter-spacing:0;}
  .day::before,.day::after{content:"";flex:1;height:1px;background:var(--li-line);}
  .grp{display:flex;gap:8px;margin:4px 0;}
  .grp .who{flex:1;min-width:0;}
  .grp .nm{display:flex;align-items:baseline;gap:4px;font-size:14px;font-weight:600;line-height:20px;margin-bottom:0;}
  .grp .nm time{font-size:12px;font-weight:400;color:var(--li-ink2);} .grp .nm time::before{content:"• ";}
  .msg{position:relative;max-width:none;padding:2px 0;border-radius:0;margin:0;font-size:14px;line-height:20px;word-break:break-word;background:none;border:none;color:var(--li-ink);}
  .grp.me .msg{background:none;}
  .msg .tx{white-space:pre-wrap;}
  .msg .tools{position:absolute;top:-6px;right:0;display:none;gap:2px;background:var(--li-bg);border:1px solid var(--li-line);border-radius:16px;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.12);}
  .msg:hover{background:var(--li-hover);margin:0 -8px;padding:2px 8px;border-radius:4px;}
  .msg:hover .tools,.msg:focus-within .tools{display:flex;}
  .msg .tools button{border:none;background:none;width:26px;height:24px;border-radius:12px;font-size:12px;color:var(--li-ink2);} .msg .tools button:hover{background:var(--li-hover);color:var(--li-ink);}
  .msg .mt{display:none;}
  .msg textarea{width:100%;min-height:60px;border:1px solid var(--li-ink2);border-radius:4px;padding:6px 8px;font:inherit;background:var(--li-bg);resize:vertical;}
  .msg .edit-b{display:flex;gap:6px;margin-top:6px;}
  .th-none{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--li-ink2);padding:30px;}
  .th-none .ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--li-hover);color:var(--li-ink2);}
  .th-none .ic svg{width:30px;height:30px;}
  .th-none b{color:var(--li-ink);font-size:16px;font-weight:600;}
  /* the composer, like LinkedIn's "Write a message…" */
  .cmp{border-top:1px solid var(--li-line);padding:0;}
  .cmp-row{display:block;padding:12px 16px 4px;}
  .cmp-row textarea{width:100%;min-height:72px;max-height:200px;border:none;border-radius:8px;padding:12px;font:inherit;font-size:14px;line-height:20px;background:var(--li-hover);color:var(--li-ink);resize:none;outline:none;}
  .cmp-row textarea:focus{box-shadow:0 0 0 1px var(--li-ink2) inset;}
  .cmp-bar{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;border-top:1px solid var(--li-line);margin-top:8px;}
  .cmp-who{display:flex;align-items:center;gap:8px;margin:0;font-size:12px;font-weight:600;color:var(--li-ink2);}
  .seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--li-hover);border:none;}
  .seg button{display:inline-flex;align-items:center;gap:6px;border:none;background:none;padding:3px 12px 3px 3px;border-radius:999px;font-size:13px;font-weight:600;color:var(--li-ink2);}
  .seg button .av{width:22px;height:22px;font-size:9px;}
  .seg button.on{background:var(--li-bg);color:var(--li-ink);box-shadow:0 0 0 1px var(--li-line),0 1px 2px rgba(0,0,0,.1);}
  .cmp-when{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--li-ink2);} .cmp-when input{height:28px;border:1px solid var(--li-line);border-radius:4px;padding:0 6px;font-size:12px;background:var(--li-bg);color:var(--li-ink);}
  .cmp-send{margin-left:auto;height:28px;padding:0 16px;border:none;border-radius:999px;background:var(--li-blue);color:#fff;font-weight:600;font-size:14px;}
  html[data-theme="dark"] .cmp-send{color:#000;}
  .cmp-send:hover{background:var(--li-blue-d);}
  .cmp-hint{margin:0;padding:0 16px 10px;font-size:12px;color:var(--li-ink3);}
  /* the "new conversation" dialog */
  .ov{position:fixed;inset:0;z-index:800;background:rgba(15,22,38,.45);display:flex;align-items:center;justify-content:center;padding:20px;}
  .dlg{width:100%;max-width:520px;max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px;}
  .dlg h3{margin:0 0 4px;font:800 19px Sora,sans-serif;} .dlg > p{margin:0 0 14px;font-size:13.5px;color:var(--slate);}
  .tabs{display:flex;gap:4px;padding:3px;border-radius:11px;background:var(--panel-alt);margin-bottom:14px;}
  .tabs button{flex:1;border:none;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:13px;color:var(--slate);}
  .tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12);}
  .leads{max-height:300px;overflow:auto;margin-top:8px;border:1px solid var(--border-soft);border-radius:12px;}
  .lead{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;border-bottom:1px solid var(--border-soft);background:none;text-align:left;}
  .lead:last-child{border-bottom:none;} .lead:hover,.lead.on{background:rgba(10,102,194,.07);}
  .lead b{display:block;font-size:13.5px;} .lead small{display:block;font-size:12px;color:var(--slate);}
  .lead .bd{margin-left:auto;font-size:11px;font-weight:700;color:var(--slate-light);flex-shrink:0;}
  .fl{display:block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--slate);} .fl .in{margin-top:5px;}
  .ph{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px;border:1px dashed var(--border);border-radius:12px;}
  .ph small{display:block;font-size:12px;color:var(--slate);font-weight:500;}
  .dlg-b{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  @media (max-width:900px){
    .dm{grid-template-columns:1fr;margin:0 12px 12px;} .dm-head{padding:16px 14px 10px;} .cmp-bar{flex-wrap:wrap;}
    .dm.open .dm-list{display:none;} .dm:not(.open) .dm-thread{display:none;}
    .th-head .th-back{display:inline-flex;}
  }

  /* follow-ups */
  .dm-tabs{display:flex;gap:4px;padding:8px 12px 0;}
  .dm-tabs button{border:none;background:none;padding:6px 12px;border-radius:999px;font:600 13.5px inherit;color:var(--li-ink2);}
  .dm-tabs button.on{background:var(--li-green);color:#fff;} .dm-tabs button:not(.on):hover{background:var(--li-hover);}
  .dm-tabs span{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.08);font-size:11.5px;text-align:center;} .dm-tabs button.on span{background:rgba(255,255,255,.25);}
  .fu-tag{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(10,102,194,.1);color:var(--li-blue);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fu-tag.today{background:rgba(232,140,0,.14);color:#B26A00;} .fu-tag.late{background:rgba(204,16,22,.1);color:#CC1016;}
  html[data-theme="dark"] .fu-tag.today{color:#F5B14C;} html[data-theme="dark"] .fu-tag.late{color:#FF8A8A;}
  .fu-btn{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--li-ink2);background:none;color:var(--li-ink2);font:600 13.5px inherit;white-space:nowrap;}
  .fu-btn:hover{background:var(--li-hover);color:var(--li-ink);} .fu-btn.on{border-color:var(--li-blue);color:var(--li-blue);background:rgba(10,102,194,.06);}
  .fu-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;font-size:13.5px;background:rgba(10,102,194,.07);border-bottom:1px solid var(--li-line);color:var(--li-ink);}
  .fu-bar.today{background:rgba(232,140,0,.1);} .fu-bar.late{background:rgba(204,16,22,.08);}
  .fu-done{height:28px;padding:0 12px;border-radius:999px;border:none;background:var(--li-green);color:#fff;font:600 13px inherit;}
  .fu-menu{position:fixed;z-index:850;width:270px;padding:14px;border-radius:10px;background:var(--li-bg,#fff);border:1px solid var(--li-line,#e0e0e0);box-shadow:0 4px 18px rgba(0,0,0,.18);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);}
  .dm .fu-menu,.fu-menu{--li-bg:var(--panel);--li-line:var(--border);}
  .fu-menu b{display:block;font-size:14px;margin-bottom:10px;}
  .fu-quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
  .fu-quick button{height:32px;border-radius:999px;border:1px solid var(--border);background:var(--panel);font:600 13px inherit;color:var(--ink);} .fu-quick button:hover{border-color:#0A66C2;color:#0A66C2;}
  .fu-menu label{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--slate);} .fu-menu label span{font-weight:400;}
  .fu-menu input{display:block;width:100%;margin-top:4px;height:34px;border:1px solid var(--border);border-radius:6px;padding:0 8px;font:inherit;font-size:13.5px;background:var(--panel-alt);color:var(--ink);}
  .fu-b{display:flex;justify-content:flex-end;gap:6px;margin-top:12px;}
  .cmp-now{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--li-line);background:var(--li-bg);color:var(--li-blue);font:600 12px inherit;}
  .cmp-now:hover{background:var(--li-hover);}
</style>

<body>
<div id="pageLoader"><div class="spin"></div></div>
<div class="toast-stack" id="toastStack"></div>
<div id="appRoot" style="display:none;">
  <div class="seq-sidebar" data-pt-sidebar></div>
  <script src="sidebar.js"></script>
  <div class="seq-main">
    <div class="dm-head"><div><h1>LinkedIn DM log</h1><p>Log your LinkedIn conversations with prospects, and see them just like on LinkedIn.</p></div>
      <button type="button" class="btn primary" id="newBtn">＋ New conversation</button></div>
    <div class="dm" id="dm">
      <aside class="dm-list">
        <div class="dm-lh"><b>Messaging</b><button type="button" id="newBtn2" title="New conversation" aria-label="New conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>
        <div class="dm-tabs" id="listTabs"></div>
        <div class="dm-search"><div class="sw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="in" id="search" type="search" placeholder="Search messages" aria-label="Search messages"></div></div>
        <div class="dm-items" id="items"></div>
      </aside>
      <section class="dm-thread" id="thread" aria-live="polite"></section>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  'use strict';
  const $ = (id)=> document.getElementById(id);
  const esc = (s)=> String(s == null ? '' : s).replace(/[&<>"']/g, (c)=> ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  function toast(m, bad){ const t = document.createElement('div'); t.className = 'toast' + (bad ? ' danger' : ''); t.textContent = m; $('toastStack').appendChild(t); setTimeout(()=> t.remove(), 4200); }
  firebase.initializeApp({apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM", authDomain: "lead-tracker-c5c3a.firebaseapp.com", projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app", messagingSenderId: "720572896285", appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"});
  const db = firebase.firestore(), FV = firebase.firestore.FieldValue;
  // ---------------------------------------------------------------------------
  // The LinkedIn DM log: you log the conversation you're having on LinkedIn with a prospect, and see it like
  // LinkedIn Messaging. linkedinDmLogs/{id} = {workspaceId, createdBy, prospect: {name, headline, photo (a small
  // data image), linkedinUrl, lead: {boardId, leadId, boardName} | null}, messages: [{id, from: 'me'|'them', text,
  // at (ISO time)}], lastAt, lastText, createdAt, updatedAt}. Only you see your own conversations.
  // ---------------------------------------------------------------------------
  let me = null, wsId = null, myName = '', myPhoto = '', convs = [], openId = null, from = 'me', q = '', view = 'all';
  let atManual = false;                                                     // the time follows the clock until you change it yourself
  setInterval(()=>{ const n = document.getElementById('cmpAt'); if(n && !atManual && document.activeElement !== n){ const v = localInput(new Date()); if(n.value !== v) n.value = v; } }, 1000);
  // a follow-up: {due: 'YYYY-MM-DD', note} on the conversation, until you mark it done
  const todayStr = ()=> { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const addDays = (n)=> { const d = new Date(); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const daysUntil = (due)=> Math.round((new Date(due + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 864e5);
  function fuLabel(fu){ if(!fu || !fu.due) return null; const n = daysUntil(fu.due);
    if(n < 0) return {cls: 'late', text: `Overdue · ${-n} day${n === -1 ? '' : 's'}`};
    if(n === 0) return {cls: 'today', text: 'Today'}; if(n === 1) return {cls: '', text: 'Tomorrow'};
    if(n < 7) return {cls: '', text: new Date(fu.due + 'T00:00:00').toLocaleDateString([], {weekday: 'short'})};
    return {cls: '', text: new Date(fu.due + 'T00:00:00').toLocaleDateString([], {day: 'numeric', month: 'short'})}; }
  const SVG_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  const initials = (n)=> String(n || '?').trim().split(/\s+/).slice(0, 2).map((w)=> w[0] || '').join('').toUpperCase() || '?';
  const avatar = (name, photo, cls)=> `<span class="av ${cls || ''}">${photo ? `<img src="${esc(photo)}" alt="">` : esc(initials(name))}</span>`;
  const meAv = (cls)=> avatar(myName, myPhoto, 'me ' + (cls || ''));
  const first = (n)=> String(n || '').trim().split(/\s+/)[0] || 'Prospect';
  const tOf = (iso)=> new Date(iso);
  const sameDay = (a, b)=> a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const clock = (d)=> d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  function dayLabel(d){ const now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
    if(sameDay(d, now)) return 'Today'; if(sameDay(d, y)) return 'Yesterday';
    return d.toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric'}); }
  function shortWhen(iso){ if(!iso) return ''; const d = tOf(iso), now = new Date();
    if(sameDay(d, now)) return clock(d); if((now - d) < 6 * 864e5) return d.toLocaleDateString([], {weekday: 'short'});
    return d.toLocaleDateString([], {day: 'numeric', month: 'short'}); }
  const localInput = (d)=> { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); };
  const uid = ()=> Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const cur = ()=> convs.find((c)=> c.id === openId) || null;

  // ---------- the list ----------
  function renderList(){
    const fuCount = convs.filter((c)=> c.followUp && c.followUp.due).length;
    const tb = $('listTabs'); if(tb) tb.innerHTML = `<button type="button" data-view="all" class="${view === 'all' ? 'on' : ''}">All</button><button type="button" data-view="fu" class="${view === 'fu' ? 'on' : ''}">🔔 Follow-ups${fuCount ? ` <span>${fuCount}</span>` : ''}</button>`;
    const list = convs.filter((c)=> (view !== 'fu' || (c.followUp && c.followUp.due)) && (!q || (c.prospect.name + ' ' + (c.prospect.headline || '') + ' ' + (c.lastText || '')).toLowerCase().includes(q)))
      .sort(view === 'fu' ? (a, b)=> String(a.followUp.due).localeCompare(String(b.followUp.due))        // the most urgent first
        : (a, b)=> String(b.lastAt || b.created || '').localeCompare(String(a.lastAt || a.created || '')));
    $('items').innerHTML = list.length ? list.map((c)=> `<button type="button" class="dm-item${c.id === openId ? ' on' : ''}" data-open="${esc(c.id)}">${avatar(c.prospect.name, c.prospect.photo)}
        <span class="meta"><span class="row"><b>${esc(c.prospect.name)}</b><time>${esc(shortWhen(c.lastAt))}</time></span>
        <small>${c.lastText ? (c.lastFrom === 'me' ? 'You: ' : '') + esc(c.lastText) : esc(c.prospect.headline || 'No messages yet')}</small>
        ${(()=>{ const f = fuLabel(c.followUp); return f ? `<span class="fu-tag ${f.cls}">🔔 ${esc(f.text)}${c.followUp.note ? ' · ' + esc(c.followUp.note) : ''}</span>` : ''; })()}</span></button>`).join('')
      : `<div class="dm-empty">${view === 'fu' && convs.length ? '<b>No follow-ups</b>Mark someone with 🔔 Follow up at the top of a conversation.' : convs.length ? '<b>No matches</b>Try another name.' : '<b>No conversations yet</b>Click “New conversation” to log your first LinkedIn chat with a prospect.'}</div>`;
  }
  // ---------- the thread ----------
  function renderThread(keepComposer){
    const c = cur(), box = $('thread'); $('dm').classList.toggle('open', !!c);
    if(!c){ box.innerHTML = `<div class="th-none"><span class="ic">${SVG_CHAT}</span><b>Your LinkedIn conversations, in one place</b><span>Pick a conversation on the left, or start a new one.</span></div>`; return; }
    const p = c.prospect, msgs = (c.messages || []).slice().sort((a, b)=> String(a.at).localeCompare(String(b.at)));
    let html = '', last = null, lastDay = null;
    msgs.forEach((m)=>{
      const d = tOf(m.at), newDay = !lastDay || !sameDay(d, lastDay);
      if(newDay){ if(last) html += '</div></div>'; html += `<div class="day">${esc(dayLabel(d))}</div>`; last = null; lastDay = d; }
      const cont = last && last.from === m.from && (d - tOf(last.at)) < 15 * 60000;   // one group per person, like LinkedIn
      if(!cont){ if(last) html += '</div></div>';
        html += `<div class="grp ${m.from}">${m.from === 'me' ? meAv('sm') : avatar(p.name, p.photo, 'sm')}<div class="who"><div class="nm">${esc(m.from === 'me' ? (myName || 'You') : p.name)}<time>${esc(clock(d))}</time></div>`; }
      html += `<div class="msg" data-mid="${esc(m.id)}"><span class="tx">${esc(m.text)}</span>${cont ? `<span class="mt">${esc(clock(d))}</span>` : ''}
        <span class="tools"><button type="button" data-edit="${esc(m.id)}" title="Edit" aria-label="Edit message">✎</button><button type="button" data-del="${esc(m.id)}" title="Delete" aria-label="Delete message">✕</button></span></div>`;
      last = m;
    });
    if(last) html += '</div></div>';
    const keep = keepComposer && box.querySelector('#cmpText') ? box.querySelector('#cmpText').value : '';
    const keepAt = keepComposer && box.querySelector('#cmpAt') ? box.querySelector('#cmpAt').value : '';
    if(!keepComposer) atManual = false;
    const nameHTML = p.linkedinUrl ? `<a href="${esc(p.linkedinUrl)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
    box.innerHTML = `<div class="th-head"><button type="button" class="ib th-back" id="backBtn" aria-label="Back to conversations">←</button>
        <div class="meta"><b>${nameHTML}</b><small>${esc(p.headline || (p.lead ? p.lead.boardName : ''))}</small></div>
        ${p.linkedinUrl ? `<a class="ib" href="${esc(p.linkedinUrl)}" target="_blank" rel="noopener" title="Open their LinkedIn profile" aria-label="Open their LinkedIn profile"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg></a>` : ''}
        <button type="button" class="fu-btn${c.followUp && c.followUp.due ? ' on' : ''}" id="fuBtn" aria-haspopup="true">🔔 ${c.followUp && c.followUp.due ? esc(fuLabel(c.followUp).text) : 'Follow up'}</button>
        <button type="button" class="ib" id="editP" title="Edit prospect" aria-label="Edit prospect">✎</button><button type="button" class="ib" id="delC" title="Delete this conversation" aria-label="Delete this conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></div>
      ${c.followUp && c.followUp.due ? (()=>{ const f = fuLabel(c.followUp); return `<div class="fu-bar ${f.cls}"><span>🔔 <b>Follow up ${f.cls === 'late' ? '' : (f.text === 'Today' || f.text === 'Tomorrow' ? f.text.toLowerCase() : 'on ' + esc(f.text))}${f.cls === 'late' ? esc(f.text.toLowerCase()) : ''}</b>${c.followUp.note ? ' · ' + esc(c.followUp.note) : ''}</span><button type="button" class="fu-done" id="fuDone">✓ Done</button></div>`; })() : ''}
      <div class="th-body" id="thBody"><div class="th-profile">${avatar(p.name, p.photo)}<b>${nameHTML}</b>${p.headline ? `<span>${esc(p.headline)}</span>` : ''}
          <span class="pl">${p.lead ? `📋 ${esc(p.lead.boardName || 'Lead')}` : ''}${p.lead && p.linkedinUrl ? ' · ' : ''}${p.linkedinUrl ? `<a href="${esc(p.linkedinUrl)}" target="_blank" rel="noopener">View profile</a>` : ''}</span></div>
        ${html || `<div class="dm-empty" style="padding:28px 10px">Log your conversation with ${esc(first(p.name))}: your messages and ${esc(first(p.name))}’s replies, in order.</div>`}</div>
      <div class="cmp"><div class="cmp-row"><textarea id="cmpText" rows="3" placeholder="${from === 'me' ? 'Write a message…' : 'Write ' + esc(first(p.name)) + '’s reply…'}" aria-label="Message">${esc(keep)}</textarea></div>
        <div class="cmp-bar"><div class="cmp-who"><span class="seg" role="radiogroup" aria-label="Who sent this message"><button type="button" data-from="me" class="${from === 'me' ? 'on' : ''}" role="radio" aria-checked="${from === 'me'}">${meAv()}Me</button><button type="button" data-from="them" class="${from === 'them' ? 'on' : ''}" role="radio" aria-checked="${from === 'them'}">${avatar(p.name, p.photo)}${esc(first(p.name))}</button></span></div>
          <label class="cmp-when"><input type="datetime-local" id="cmpAt" value="${keepAt && atManual ? esc(keepAt) : localInput(new Date())}" aria-label="When it was sent"><button type="button" class="cmp-now${atManual ? '' : ' hidden'}" id="cmpNow" title="Back to the current time">↺ Now</button></label>
          <button type="button" class="cmp-send" id="logBtn">Log</button></div>
        <div class="cmp-hint">Press Enter to log · Shift+Enter for a new line · choose who sent each message with Me / ${esc(first(p.name))}</div></div>`;
    const b = $('thBody'); b.scrollTop = b.scrollHeight;
    const ta = $('cmpText'); grow(ta);
  }
  function grow(ta){ ta.style.height = 'auto'; ta.style.height = Math.max(72, Math.min(200, ta.scrollHeight + 2)) + 'px'; }
  const save = (c, data)=> db.collection('linkedinDmLogs').doc(c.id).update(Object.assign({updatedAt: FV.serverTimestamp()}, data)).catch((e)=>{ console.error(e); toast('Couldn’t save. Check your connection.', true); });
  function summary(msgs){ const s = msgs.slice().sort((a, b)=> String(a.at).localeCompare(String(b.at))), l = s[s.length - 1]; return {lastAt: l ? l.at : '', lastText: l ? l.text.slice(0, 140) : '', lastFrom: l ? l.from : ''}; }
  // a lead from your boards: the first message marks it as contacted, the first reply as replied
  function touchLead(c, who){
    const L = c.prospect.lead; if(!L || !L.boardId || !L.leadId) return;
    const already = (c.messages || []).some((m)=> m.from === who); if(already) return;
    db.doc(`workspaces/${wsId}/boards/${L.boardId}/leads/${L.leadId}`).update(who === 'me' ? {contacted: true} : {replied: true})
      .then(()=> toast(who === 'me' ? `${first(c.prospect.name)} is marked as contacted in your board.` : `${first(c.prospect.name)} is marked as replied in your board.`)).catch(()=>{});
  }
  function logMessage(){
    const c = cur(), ta = $('cmpText'); if(!c || !ta) return; const text = ta.value.trim(); if(!text){ ta.focus(); return; }
    const atIn = $('cmpAt').value, at = atManual && atIn ? new Date(atIn) : new Date();
    const msgs = (c.messages || []).slice(); touchLead(c, from);
    msgs.push({id: uid(), from, text: text.slice(0, 8000), at: (isNaN(at) ? new Date() : at).toISOString()});
    c.messages = msgs; Object.assign(c, summary(msgs)); save(c, Object.assign({messages: msgs}, summary(msgs)));
    ta.value = ''; atManual = false; renderThread(false); renderList();
    const nt = $('cmpText'); if(nt) nt.focus();

  }
  // ---------- clicks ----------
  document.addEventListener('click', (e)=>{
    const o = e.target.closest('[data-open]'); if(o){ openId = o.dataset.open; from = 'me'; renderList(); renderThread(); return; }
    if(e.target.closest('#backBtn')){ openId = null; renderList(); renderThread(); return; }
    const f = e.target.closest('[data-from]'); if(f){ from = f.dataset.from; const c = cur(); renderThread(true); const ta = $('cmpText'); if(ta) ta.focus(); return; }
    if(e.target.closest('#logBtn')){ logMessage(); return; }
    if(e.target.closest('#cmpNow')){ e.preventDefault(); atManual = false; $('cmpAt').value = localInput(new Date()); $('cmpNow').classList.add('hidden'); return; }
    if(e.target.closest('#newBtn') || e.target.closest('#newBtn2')){ openProspectDialog(null); return; }
    if(e.target.closest('#editP')){ openProspectDialog(cur()); return; }
    const tv = e.target.closest('[data-view]'); if(tv){ view = tv.dataset.view; renderList(); return; }
    if(e.target.closest('#fuBtn')){ openFollowUp(e.target.closest('#fuBtn')); return; }
    if(e.target.closest('#fuDone')){ const c = cur(); if(!c) return; c.followUp = null; save(c, {followUp: null}); renderThread(true); renderList(); toast('Follow-up done.'); return; }
    if(e.target.closest('#delC')){ const c = cur(); if(!c) return; if(!confirm(`Delete your conversation with ${c.prospect.name}? This can’t be undone.`)) return;
      db.collection('linkedinDmLogs').doc(c.id).delete().then(()=>{ openId = null; toast('Conversation deleted.'); }).catch(()=> toast('Couldn’t delete.', true)); return; }
    const del = e.target.closest('[data-del]'); if(del){ const c = cur(); if(!c) return; const msgs = (c.messages || []).filter((m)=> m.id !== del.dataset.del);
      c.messages = msgs; Object.assign(c, summary(msgs)); save(c, Object.assign({messages: msgs}, summary(msgs))); renderThread(true); renderList(); return; }
    const ed = e.target.closest('[data-edit]'); if(ed){ const c = cur(), m = c && (c.messages || []).find((x)=> x.id === ed.dataset.edit); if(!m) return;
      const box = document.querySelector(`.msg[data-mid="${CSS.escape(m.id)}"]`);
      box.innerHTML = `<textarea>${esc(m.text)}</textarea><div class="edit-b"><button type="button" class="btn sm primary" data-esave="${esc(m.id)}">Save</button><button type="button" class="btn sm" data-ecancel>Cancel</button></div>`;
      const t = box.querySelector('textarea'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); return; }
    const es = e.target.closest('[data-esave]'); if(es){ const c = cur(), m = c && (c.messages || []).find((x)=> x.id === es.dataset.esave); const v = es.closest('.msg').querySelector('textarea').value.trim();
      if(m && v){ m.text = v.slice(0, 8000); Object.assign(c, summary(c.messages)); save(c, Object.assign({messages: c.messages}, summary(c.messages))); } renderThread(true); renderList(); return; }
    if(e.target.closest('[data-ecancel]')){ renderThread(true); }
  });
  document.addEventListener('keydown', (e)=>{ if(e.target && e.target.id === 'cmpText' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); logMessage(); } });
  document.addEventListener('change', (e)=>{ if(e.target && e.target.id === 'cmpAt'){ atManual = true; const b = $('cmpNow'); if(b) b.classList.remove('hidden'); } });
  document.addEventListener('input', (e)=>{ if(e.target && e.target.id === 'cmpAt'){ atManual = true; const b = $('cmpNow'); if(b) b.classList.remove('hidden'); }
    if(e.target && e.target.id === 'cmpText') grow(e.target); if(e.target && e.target.id === 'search'){ q = e.target.value.trim().toLowerCase(); renderList(); } });

  // ---------- follow-ups: pick when ----------
  function openFollowUp(anchor){
    const c = cur(); if(!c) return; const old = document.getElementById('fuMenu'); if(old){ old.remove(); return; }
    const f = c.followUp || {}, r = anchor.getBoundingClientRect();
    const m = document.createElement('div'); m.id = 'fuMenu'; m.className = 'fu-menu'; m.setAttribute('role', 'dialog');
    m.style.top = (r.bottom + 6) + 'px'; m.style.right = Math.max(12, innerWidth - r.right) + 'px';
    m.innerHTML = `<b>Follow up with ${esc(first(c.prospect.name))}</b>
      <div class="fu-quick">${[['Today', 0], ['Tomorrow', 1], ['In 3 days', 3], ['Next week', 7]].map(([l, n])=> `<button type="button" data-fud="${addDays(n)}">${l}</button>`).join('')}</div>
      <label>Or a date<input type="date" id="fuDate" value="${esc(f.due || '')}" min="${todayStr()}"></label>
      <label>Note <span>(optional)</span><input id="fuNote" maxlength="80" value="${esc(f.note || '')}" placeholder="E.g. send the case study"></label>
      <div class="fu-b">${f.due ? '<button type="button" class="btn sm" data-fuclear>Remove</button>' : ''}<button type="button" class="btn sm primary" data-fusave>Save</button></div>`;
    document.body.appendChild(m);
    const set = (due)=>{ if(!due) return; const note = m.querySelector('#fuNote').value.trim().slice(0, 80); c.followUp = {due, note}; save(c, {followUp: c.followUp}); m.remove(); renderThread(true); renderList(); toast(`Follow-up set: ${fuLabel(c.followUp).text.toLowerCase()}.`); };
    m.addEventListener('click', (e)=>{ const q = e.target.closest('[data-fud]'); if(q) set(q.dataset.fud);
      if(e.target.closest('[data-fusave]')){ const d = m.querySelector('#fuDate').value; if(!d){ toast('Pick a day.', true); return; } set(d); }
      if(e.target.closest('[data-fuclear]')){ c.followUp = null; save(c, {followUp: null}); m.remove(); renderThread(true); renderList(); } });
    setTimeout(()=> document.addEventListener('mousedown', function off(ev){ if(!m.contains(ev.target) && ev.target !== anchor){ m.remove(); document.removeEventListener('mousedown', off); } }), 0);
  }

  // ---------- a new conversation (or editing the prospect) ----------
  let leadsCache = null;
  async function loadLeads(){
    if(leadsCache) return leadsCache;
    const boards = await db.collection('workspaces').doc(wsId).collection('boards').get();
    const all = [];
    await Promise.all(boards.docs.filter((b)=> !b.data().deleted).map(async (b)=>{
      const ls = await b.ref.collection('leads').limit(500).get().catch(()=> null); if(!ls) return;
      ls.docs.forEach((d)=>{ const x = d.data(); if(x.deleted || !x.name) return;
        all.push({boardId: b.id, boardName: b.data().name || 'Board', leadId: d.id, name: x.name, headline: [x.jobTitle, x.company].filter(Boolean).join(' · '), linkedinUrl: x.linkedinUrl || ''}); });
    }));
    leadsCache = all.sort((a, b)=> a.name.localeCompare(b.name)); return leadsCache;
  }
  function photoToData(file){                                              // a small, round-cropped photo (stored with the conversation)
    return new Promise((res, rej)=>{ if(!file || !/^image\//.test(file.type)) return rej(new Error('not an image'));
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = ()=>{ const S = 160, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'), m = Math.min(img.width, img.height);
        g.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85)); };
      img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); }; img.src = url; });
  }
  function openProspectDialog(edit){
    const P = edit ? Object.assign({}, edit.prospect) : {name: '', headline: '', linkedinUrl: '', photo: '', lead: null};
    let tab = edit ? 'manual' : 'board';
    const ov = document.createElement('div'); ov.className = 'ov';
    const paint = ()=>{
      ov.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${edit ? 'Edit prospect' : 'New conversation'}</h3><p>${edit ? 'Change the name, headline, link or photo.' : 'Who are you talking to on LinkedIn?'}</p>
        ${edit ? '' : `<div class="tabs" role="tablist"><button type="button" data-tab="board" class="${tab === 'board' ? 'on' : ''}">📋 From your boards</button><button type="button" data-tab="manual" class="${tab === 'manual' ? 'on' : ''}">✍️ Type a name</button></div>`}
        ${tab === 'board' ? `<input class="in" id="leadQ" type="search" placeholder="Search your leads by name or company"><div class="leads" id="leadList"><div class="dm-empty">Loading your leads…</div></div>` : ''}
        <div ${tab === 'board' && !P.lead ? 'class="hidden"' : ''} id="pFields">
          <label class="fl">Name<input class="in" id="pName" maxlength="80" value="${esc(P.name)}" placeholder="E.g. Emma Jansen"></label>
          <label class="fl">Headline <span style="font-weight:500">(optional)</span><input class="in" id="pHead" maxlength="140" value="${esc(P.headline || '')}" placeholder="E.g. Founder · Acme Studio"></label>
          <label class="fl">LinkedIn profile <span style="font-weight:500">(optional)</span><input class="in" id="pUrl" maxlength="300" value="${esc(P.linkedinUrl || '')}" placeholder="linkedin.com/in/…"></label>
          <div class="ph">${avatar(P.name || '?', P.photo)}<div style="flex:1"><b style="font-size:13.5px">Profile photo</b><small>Optional. Without one, their initials show.</small></div>
            <label class="btn sm">${P.photo ? 'Change' : 'Upload'}<input type="file" accept="image/*" class="hidden" id="pPhoto"></label>${P.photo ? '<button type="button" class="btn sm" id="pPhotoX">Remove</button>' : ''}</div>
        </div>
        <div class="dlg-b"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn primary" id="pSave">${edit ? 'Save' : 'Start conversation'}</button></div></div>`;
      if(tab === 'board' && !P.lead) loadLeads().then((L)=> drawLeads(L, '')).catch(()=>{ const ll = ov.querySelector('#leadList'); if(ll) ll.innerHTML = '<div class="dm-empty">Couldn’t load your leads.</div>'; });
      if(tab === 'board' && P.lead) loadLeads().then((L)=> drawLeads(L, '')).catch(()=>{});
    };
    const drawLeads = (L, s)=>{ const ll = ov.querySelector('#leadList'); if(!ll) return; s = s.toLowerCase();
      const f = L.filter((x)=> !s || (x.name + ' ' + x.headline).toLowerCase().includes(s)).slice(0, 200);
      ll.innerHTML = f.length ? f.map((x)=> `<button type="button" class="lead${P.lead && P.lead.leadId === x.leadId ? ' on' : ''}" data-lead="${esc(x.boardId + '|' + x.leadId)}">${avatar(x.name, '', 'xs')}<span><b>${esc(x.name)}</b><small>${esc(x.headline || ' ')}</small></span><span class="bd">${esc(x.boardName)}</span></button>`).join('')
        : `<div class="dm-empty">${L.length ? 'No leads match.' : 'No leads in your boards yet. Use “Type a name” instead.'}</div>`; };
    const readFields = ()=>{ const n = ov.querySelector('#pName'); if(!n) return; P.name = n.value.trim(); P.headline = ov.querySelector('#pHead').value.trim(); let u = ov.querySelector('#pUrl').value.trim();
      if(u && !/^https?:\/\//i.test(u)) u = 'https://' + u; P.linkedinUrl = /^https:\/\/([a-z]+\.)?linkedin\.com\//i.test(u) ? u : (u ? '' : ''); if(u && !P.linkedinUrl) toast('That doesn’t look like a LinkedIn link, so it’s left out.', true); };
    paint(); document.body.appendChild(ov);
    const close = ()=> ov.remove();
    ov.addEventListener('mousedown', (e)=>{ if(e.target === ov) close(); });
    ov.addEventListener('click', async (e)=>{
      if(e.target.closest('[data-x]')){ close(); return; }
      const t = e.target.closest('[data-tab]'); if(t){ readFields(); tab = t.dataset.tab; if(tab === 'manual') P.lead = null; paint(); return; }
      const l = e.target.closest('[data-lead]'); if(l){ const [bId, lId] = l.dataset.lead.split('|'); const L = (await loadLeads()).find((x)=> x.boardId === bId && x.leadId === lId); if(!L) return;
        Object.assign(P, {name: L.name, headline: L.headline, linkedinUrl: L.linkedinUrl, lead: {boardId: L.boardId, leadId: L.leadId, boardName: L.boardName}}); paint(); return; }
      if(e.target.closest('#pPhotoX')){ readFields(); P.photo = ''; paint(); return; }
      if(e.target.closest('#pSave')){ readFields(); if(!P.name){ toast('Add their name.', true); const n = ov.querySelector('#pName'); if(n) n.focus(); return; }
        const prospect = {name: P.name.slice(0, 80), headline: (P.headline || '').slice(0, 140), linkedinUrl: P.linkedinUrl || '', photo: P.photo || '', lead: P.lead || null};
        try {
          if(edit){ await db.collection('linkedinDmLogs').doc(edit.id).update({prospect, updatedAt: FV.serverTimestamp()}); toast('Saved.'); }
          else { const ref = await db.collection('linkedinDmLogs').add({workspaceId: wsId, createdBy: me, prospect, messages: [], lastAt: '', lastText: '', lastFrom: '', created: new Date().toISOString(), createdAt: FV.serverTimestamp(), updatedAt: FV.serverTimestamp()});
            openId = ref.id; from = 'me'; }
          close();
        } catch(err){ console.error(err); toast('Couldn’t save. Check your connection.', true); }
      }
    });
    ov.addEventListener('input', async (e)=>{ if(e.target.id === 'leadQ') drawLeads(await loadLeads(), e.target.value.trim()); });
    ov.addEventListener('change', async (e)=>{ if(e.target.id !== 'pPhoto') return; const f = e.target.files[0]; if(!f) return; readFields();
      try { P.photo = await photoToData(f); paint(); } catch(err){ toast('That file isn’t an image.', true); } });
  }

  // ---------- start ----------
  firebase.auth().onAuthStateChanged(async (u)=>{
    if(!u){ location.href = 'home.html'; return; }
    me = u.uid;
    try { const dir = await db.doc(`userDirectory/${me}`).get(); wsId = dir.exists ? dir.data().workspaceId : null;
      if(!wsId){ location.href = 'home.html'; return; }
      const [m, pr] = await Promise.all([db.doc(`workspaces/${wsId}/members/${me}`).get(), db.doc(`profiles/${me}`).get().catch(()=> null)]);
      myName = (m.exists && m.data().name) || u.displayName || (u.email || '').split('@')[0] || 'You';
      myPhoto = (pr && pr.exists && pr.data().photo) || (m.exists && (m.data().photo || m.data().photoURL)) || u.photoURL || '';
    } catch(e){ console.error(e); toast('Couldn’t load your workspace.', true); }
    db.collection('linkedinDmLogs').where('workspaceId', '==', wsId).where('createdBy', '==', me).onSnapshot((s)=>{
      convs = s.docs.map((d)=> Object.assign({id: d.id}, d.data(), {prospect: Object.assign({name: 'Prospect'}, d.data().prospect || {})}));
      if(openId && !convs.some((c)=> c.id === openId)) openId = null;
      const editing = document.querySelector('.msg textarea'); renderList(); if(!editing) renderThread(true);
    }, (e)=>{ console.error(e); toast('Couldn’t load your conversations.', true); });
    $('pageLoader').style.display = 'none'; $('appRoot').style.display = 'flex'; renderList(); renderThread();
  });
})();
</script>
</body>
