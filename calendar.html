<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATRACK - Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#3730B3; --teal-deep:#191659;
    --success:#1F6F5C; --success-soft:#DCEEE8;
    --fail:#B43B32; --fail-soft:#FAE1DE;
    --red:#C0392B; --c-red-bg:#FBE4E2;
    --amber:#C97C00; --amber-soft:#FFF1DC;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 2px 6px rgba(16,24,40,0.05), 0 10px 24px -8px rgba(16,24,40,0.09);
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.05);
    --shadow-lg: 0 4px 10px rgba(16,24,40,0.06), 0 20px 40px -12px rgba(16,24,40,0.16);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appRoot{display:none;height:100vh;}
  #appRoot.reveal{animation:pageFade .4s ease both;}
  @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .seq-sidebar{
    width:200px;flex-shrink:0;height:100%;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;
  }
  .seq-sidebar-logo{
    width:34px;height:34px;border-radius:10px;overflow:hidden;
    margin-bottom:20px;box-shadow:0 3px 8px rgba(28,91,158,0.28);
  }
  .seq-sidebar-user{display:flex;align-items:center;gap:9px;padding:6px 8px;margin-bottom:22px;}
  .seq-sidebar-avatar{
    width:30px;height:30px;border-radius:50%;background:var(--panel-alt);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0;
  }
  .seq-sidebar-user span{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seq-sidebar-nav{display:flex;flex-direction:column;gap:2px;}
  .seq-sidebar-link{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
    text-decoration:none;color:var(--slate);font-size:13px;font-weight:600;transition:background .12s, color .12s;
  }
  .seq-sidebar-link .icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
  .seq-sidebar-link:hover{background:var(--panel-alt);color:var(--ink);}
  .seq-sidebar-link.active{background:var(--panel-alt);color:var(--teal);}
  /* Section labels in the shared side panel */
  .seq-sidebar-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-light,#8CA0B3);padding:14px 10px 4px;}
  .seq-sidebar-nav .seq-sidebar-label:first-child{padding-top:0;}
  .seq-sidebar-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}

  .seq-main{flex:1;min-width:0;height:100%;overflow-y:auto;}
  .shell{max-width:1100px;margin:0 auto;padding:36px 22px 90px;}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:none;margin:0 0 18px;transition:color .12s, transform .12s;}
  .back-link:hover{color:var(--teal);transform:translateX(-2px);}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .page-title{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;margin:0 0 4px;}
  .page-sub{font-size:13.5px;color:var(--slate);margin:0;}
  .new-seq-btn{
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));color:#fff;border:none;border-radius:20px;padding:11px 22px;
    font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;
    box-shadow:0 4px 14px color-mix(in srgb, var(--teal) 35%, transparent);transition:transform .12s ease, box-shadow .12s ease;
  }
  .new-seq-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px color-mix(in srgb, var(--teal) 45%, transparent);}
  .new-seq-btn:active{transform:translateY(0) scale(.98);}
  .new-seq-btn.secondary{background:var(--panel);color:var(--teal);border:1.5px solid var(--teal);box-shadow:none;}
  .new-seq-btn.secondary:hover{background:var(--panel-alt);box-shadow:none;}

  .task-add-panel{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 26px -12px rgba(16,24,40,.12);
    animation:seqCardIn .2s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes seqCardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .task-add-panel .field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .task-add-panel label{font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;}
  .task-add-panel input, .task-add-panel select{
    font-family:'Inter',sans-serif;font-size:14px;padding:11px 13px;border:1.5px solid var(--border);
    border-radius:10px;background:var(--panel);color:var(--ink);width:100%;
    box-shadow:0 1px 2px rgba(16,24,40,0.04);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .task-add-panel input:hover, .task-add-panel select:hover{border-color:var(--slate-light);}
  .task-add-panel input:focus, .task-add-panel select:focus{
    outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb, var(--teal) 15%, transparent);
  }
  .task-add-row2{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;}
  @media (max-width:640px){.task-add-row2{grid-template-columns:1fr;}}
  .task-add-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .btn-cancel-task, .btn-save-task{
    padding:11px 20px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn-cancel-task{background:var(--panel);border:1.5px solid var(--border);color:var(--slate);}
  .btn-cancel-task:hover{background:var(--panel-alt);border-color:var(--slate-light);}
  .btn-save-task{background:linear-gradient(135deg, var(--teal), var(--teal-deep));border:none;color:#fff;box-shadow:0 3px 10px color-mix(in srgb, var(--teal) 35%, transparent);}
  .btn-save-task:hover{transform:translateY(-1px);box-shadow:0 5px 14px color-mix(in srgb, var(--teal) 45%, transparent);}
  .btn-save-task:active{transform:translateY(0) scale(.98);}

  .task-tabs{display:flex;gap:4px;background:var(--panel-alt, var(--paper));border-radius:12px;padding:4px;margin-bottom:20px;width:fit-content;}
  .task-tab{
    padding:9px 20px;border-radius:9px;border:none;background:none;cursor:pointer;
    font-size:12.5px;font-weight:700;color:var(--slate);font-family:'Inter',sans-serif;transition:background .13s ease, color .13s ease;
  }
  .task-tab.active{background:var(--panel);color:var(--teal);box-shadow:0 1px 2px rgba(16,24,40,.06);}

  .today-header{
    display:flex;align-items:baseline;gap:10px;margin-bottom:18px;flex-wrap:wrap;
  }
  .today-header-date{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:var(--ink);}
  .today-header-count{font-size:12.5px;color:var(--slate);font-family:'IBM Plex Mono',monospace;}
  .task-group-label{
    font-family:'Sora',sans-serif;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    color:var(--slate);margin:22px 0 10px;display:flex;align-items:center;gap:8px;
  }

  .task-toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:10px 12px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .task-search-wrap{flex:1;min-width:160px;}
  .task-toolbar-add{margin-left:auto;flex-shrink:0;}
  .task-status-row{margin-bottom:16px;}
  @media (max-width:640px){
    .task-toolbar-add{margin-left:0;width:100%;}
    .task-search-wrap{order:10;flex-basis:100%;}
  }
  .task-search-wrap{
    display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--border);
    border-radius:20px;padding:8px 14px;min-width:220px;color:var(--slate-light);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .task-search-wrap:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb, var(--teal) 15%, transparent);}
  .task-search-wrap input{
    border:none;outline:none;background:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);flex:1;min-width:0;
  }
  .task-search-wrap #taskSearchClear{background:none;border:none;color:var(--slate-light);cursor:pointer;font-size:12px;padding:2px;flex-shrink:0;}
  .task-search-wrap #taskSearchClear:hover{color:var(--ink);}
  .task-tab-count{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:700;opacity:.65;margin-left:2px;
  }

  /* ---------- Priority flag ---------- */
  .priority-flag{display:inline-flex;align-items:center;flex-shrink:0;}
  .priority-flag svg{width:12px;height:12px;}
  .priority-flag.high{color:var(--red);}
  .priority-flag.medium{color:var(--amber);}
  .priority-picker{display:flex;gap:6px;}
  .priority-btn{
    display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;border:1.5px solid var(--border);
    background:var(--panel);font-size:11.5px;font-weight:700;color:var(--slate);cursor:pointer;font-family:'Inter',sans-serif;
    transition:border-color .12s ease, background .12s ease, color .12s ease;
  }
  .priority-btn svg{width:12px;height:12px;}
  .priority-btn:hover{border-color:var(--slate-light);}
  .priority-btn.active[data-priority="high"]{background:var(--c-red-bg);border-color:var(--red);color:var(--red);}
  .priority-btn.active[data-priority="medium"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);}
  .priority-btn.active[data-priority="none"]{background:var(--panel-alt);border-color:var(--slate-light);color:var(--ink);}

  /* ---------- Drag and drop rescheduling ---------- */
  .calendar-chip[draggable="true"]{cursor:grab;}
  .calendar-chip.dragging{opacity:.4;}
  .calendar-cell.drag-over{background:color-mix(in srgb, var(--teal) 10%, var(--panel));outline:2px dashed var(--teal);outline-offset:-2px;}

  .team-progress-bar{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .team-progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .team-progress-label{font-size:13px;font-weight:700;color:var(--ink);}
  .team-progress-count{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--slate);}
  .team-progress-track{height:8px;border-radius:20px;background:var(--panel-alt, var(--paper));overflow:hidden;margin-bottom:14px;}
  .team-progress-fill{height:100%;background:linear-gradient(90deg, var(--teal), var(--teal-deep));border-radius:20px;transition:width .4s ease;}
  .team-progress-people{display:flex;flex-wrap:wrap;gap:16px;}
  .team-progress-person{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);}
  .team-progress-person-badge{
    width:22px;height:22px;border-radius:50%;background:var(--c-blue-tint, var(--panel-alt));color:var(--teal);
    font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .team-progress-person-stat{color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .task-owner-badge{
    width:18px;height:18px;border-radius:50%;background:var(--panel-alt, var(--paper));border:1px solid var(--border);
    color:var(--slate);font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;font-family:'Inter',sans-serif;
  }
  .task-row .task-owner-badge{margin-right:2px;}
  .calendar-chip .task-owner-badge{width:13px;height:13px;font-size:7px;}
  .task-detail-owner-badge{
    width:22px;height:22px;border-radius:50%;background:var(--c-blue-tint, var(--panel-alt));color:var(--teal);
    font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  .timeline-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .timeline-nav-btn{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--panel);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate);flex-shrink:0;
    transition:background .12s ease, border-color .12s ease;
  }
  .timeline-nav-btn:hover{background:var(--panel-alt);border-color:var(--slate-light);}
  .timeline-nav-label{font-family:'Sora',sans-serif;font-size:14px;font-weight:700;color:var(--ink);min-width:170px;text-align:center;}
  .timeline-today-btn{
    padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);
    color:var(--teal);font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
    transition:background .12s ease;
  }
  .timeline-today-btn:hover{background:var(--c-blue-tint);}

  /* ---------- Calendar view (month grid) ---------- */
  .calendar-wrap{
    background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .calendar-weekday-row{display:grid;grid-template-columns:repeat(7, 1fr);border-bottom:1px solid var(--border);background:var(--panel-alt, var(--paper));}
  .calendar-weekday{padding:14px 0;text-align:center;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);}
  .calendar-grid{display:grid;grid-template-columns:repeat(7, 1fr);}
  .calendar-cell{
    border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    min-height:158px;padding:9px 9px 10px;display:flex;flex-direction:column;gap:6px;
    transition:background .12s ease;cursor:pointer;
  }
  .calendar-cell:hover{background:color-mix(in srgb, var(--teal) 4%, var(--panel));}
  .calendar-cell:nth-child(7n){border-right:none;}
  .calendar-cell.other-month{background:color-mix(in srgb, var(--slate) 3%, var(--panel));}
  .calendar-cell.other-month:hover{background:color-mix(in srgb, var(--slate) 5%, var(--panel));}
  .calendar-cell.is-weekend:not(.other-month){background:color-mix(in srgb, var(--slate) 2%, var(--panel));}
  .calendar-daynum{
    font-family:'Sora',sans-serif;font-size:14.5px;font-weight:700;color:var(--ink);
    width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;flex-shrink:0;
  }
  .calendar-cell.other-month .calendar-daynum{color:var(--slate-light);}
  .calendar-cell.is-today .calendar-daynum{background:var(--teal);color:#fff;}
  .calendar-chip{
    display:flex;align-items:center;gap:6px;background:color-mix(in srgb, var(--task-color, var(--teal)) 11%, var(--panel));
    border-left:3px solid var(--task-color, var(--teal));border-radius:6px;padding:5px 8px;font-size:11.5px;font-weight:600;
    color:var(--ink);cursor:pointer;overflow:hidden;transition:transform .1s ease;
  }
  .calendar-chip:hover{transform:translateX(1px);}
  .calendar-chip.overdue{box-shadow:inset 0 0 0 1.5px var(--red);}
  .calendar-chip-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .calendar-more{font-size:11px;color:var(--slate);font-weight:700;padding:3px 7px;cursor:pointer;}
  .calendar-more:hover{color:var(--teal);}
  @media (max-width:760px){
    .calendar-cell{min-height:92px;}
    .calendar-chip, .calendar-more{display:none;}
  }

        setTimeout(after, toDark ? 700 : 420);  // stars / sunrise start while the wave is still rolling
      });
      t.finished.then(function(){ root.classList.remove('pt-wave'); root.style.removeProperty('--pt-x'); root.style.removeProperty('--pt-y'); if(aurora) aurora.remove(); });
    } else {
      var wipe = document.createElement('div'); wipe.className = 'pt-theme-wipe';
      wipe.style.background = toDark ? '#0D0F1F' : '#EFF5FC';
      document.body.appendChild(wipe);
      wipe.animate({clipPath:['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)']},
        {duration:650, easing:'cubic-bezier(.65,0,.25,1)', fill:'forwards'}).onfinish = function(){
          replay();
          wipe.animate({opacity:[1, 0]}, {duration:340, fill:'forwards'}).onfinish = function(){ wipe.remove(); };
          after();
        };
    }
  }, true);
})();
</script>

<style id="cal-styles">
  .shell.cal-shell{max-width:none;padding-top:18px;}

  .gc-mini-h button:hover{background:var(--panel-alt);}
  .gc-mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;}
  .gc-mini-g .w{font:600 10px 'Inter',sans-serif;color:var(--slate-light);padding:3px 0;}
  .gc-mini-g button{border:0;background:none;height:28px;border-radius:50%;font:500 11.5px 'Inter',sans-serif;color:var(--ink);cursor:pointer;}
  .gc-mini-g button:hover{background:var(--panel-alt);}
  .gc-mini-g button.o{color:var(--slate-light);}
  .gc-mini-g button.sel{background:rgba(55,48,179,.12);color:var(--teal);font-weight:700;}
  .gc-mini-g button.t{background:var(--teal);color:#fff;font-weight:700;}
  .gc-cals-h{font:700 12px 'Inter',sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-light);margin:0 4px 6px;}
  .gc-cal{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 6px;border-radius:9px;cursor:pointer;font:500 13.5px 'Inter',sans-serif;color:var(--ink);text-align:left;}
  .gc-cal:hover{background:var(--panel-alt);}

  .gc-cal.off .box{background:transparent;color:transparent;}
  .gc-cal .n{margin-left:auto;font:600 11px 'Inter',sans-serif;color:var(--slate-light);}
  .gc-scope{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
  .gc-scope button{border:0;background:none;border-radius:7px;padding:6px 11px;font:600 12.5px 'Inter',sans-serif;color:var(--slate);cursor:pointer;}
  .gc-scope button.on{background:var(--teal);color:#fff;}
  .gc-gbox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:12.5px;color:var(--slate);line-height:1.45;}

  .gc-gbox .gb:hover{border-color:#4285F4;}
  .gc-gbox .gb.dis:hover{border-color:#D83A52;color:#B42338;}

  .gc-main{min-width:0;}
  .gc-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .gc-toolbar h1{margin:0 auto 0 8px;font:500 22px 'Sora',sans-serif;color:var(--ink);}
  .gc-btn{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:8px 16px;font:600 13.5px 'Inter',sans-serif;color:var(--ink);cursor:pointer;}
  .gc-btn:hover{background:var(--panel-alt);}

  .gc-btn.round:hover{background:var(--panel-alt);}

  .gc-view{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
  /* Day / week */

  .gc-allday{display:grid;border-bottom:1px solid var(--border);min-height:28px;}
  .gc-allday .lab{font:600 10.5px 'Inter',sans-serif;color:var(--slate-light);text-align:right;padding:8px 8px 0 0;}
  .gc-ad{border-left:1px solid var(--border-soft);padding:3px;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .gc-ad.over{background:rgba(55,48,179,.07);}
  .gc-scroll{height:calc(100vh - 250px);min-height:420px;overflow-y:auto;position:relative;}
  .gc-grid{display:grid;position:relative;}
  .gc-hours .h{height:48px;position:relative;}
  .gc-hours .h span{position:absolute;top:-7px;right:8px;font:500 10.5px 'Inter',sans-serif;color:var(--slate-light);background:var(--panel);padding:0 2px;white-space:nowrap;}
  .gc-col{position:relative;border-left:1px solid var(--border-soft);touch-action:none;}
  .gc-col .s{height:48px;border-top:1px solid var(--border-soft);}

  // ---------- Full editor (events and tasks) ----------
  function openEditor(kind, id, data){
    closePops();
    if(kind !== 'task' && kind !== 'event'){ data = id; id = kind; kind = 'event'; }   // older calls: openEditor(id, data)
    data = data || {};
    const isTask = kind === 'task';

    editState = {kind, id, creator, guests: [...(data.guests || [])], color: isTask ? (data.calColor || null) : (data.color || null),

    $('eTitle').value = data.title && data.title !== '(No title)' ? data.title : '';

    $('eDate').value = date;

    $('eEnd').value = isTask ? (data.dueEndTime && data.dueTime && toMins(data.dueEndTime) > toMins(data.dueTime) ? data.dueEndTime : fromMins(Math.min(toMins(st) + 60, 24 * 60 - 1)))
      : (data.endTime || fromMins(toMins(st) + 60));
    $('eAllDay').checked = isTask ? !data.dueTime : !!data.allDay;
    const reps = isTask ? ['none', 'daily', 'weekdays', 'weekly', 'monthly'] : Object.keys(REPEATS);
    $('eRepeat').innerHTML = reps.map(k=> `<option value="${k}">${esc(k === 'none' ? REPEATS.none : repeatLabel(k, date))}</option>`).join('');
    $('eRepeat').value = reps.includes(data.repeat) ? data.repeat : 'none';

    editState.notif = !isTask && (id ? (rm !== null && rm !== undefined) : true);

    $('eNotifVal').value = unit === 1 ? mins : mins / unit; $('eNotifUnit').value = String(unit);

  function closeEditor(){ edOv.classList.remove('open'); edOv.setAttribute('aria-hidden', 'true'); editState = null; $('eGuestSuggest').hidden = true; closePalette(); }

    const ad = $('eAllDay').checked;

  function renderColorBtn(){ $('eColorBtn').style.setProperty('--c', editState.color || (editState.kind === 'task' ? TYPES.task.color : TYPES.event.color)); }
  function renderGuests(){
    const list = [{uid: myUid, org: true}].filter(()=> editState.creator).concat(editState.guests.map(u=> ({uid: u})));
    const AVC = u=> AV[Math.abs([...u].reduce((a, c)=> a + c.charCodeAt(0), 0)) % AV.length];
    $('eGuestList').innerHTML = (editState.creator ? '' : `<div class="ed-guest"><span class="av" style="background:${AVC('org')}">${esc(initials('Organiser'))}</span><span class="nm">Organiser</span></div>`) +
      list.map(g=>{ const m = members[g.uid] || {}, n = m.name || m.email || 'Teammate';
        return `<div class="ed-guest"><span class="av" style="background:${AVC(g.uid)}">${esc(initials(n))}</span><span class="nm">${esc(n)}${g.uid === myUid ? ' (you)' : ''}<small>${g.org ? 'Organiser' : esc(m.email || '')}</small></span>

  let sugPick = 0;

    const q = $('eGuestSearch').value.trim().toLowerCase(), box = $('eGuestSuggest');

    const hits = Object.entries(members).filter(([u, m])=> u !== myUid && !editState.guests.includes(u) && ((m.name || '') + ' ' + (m.email || '')).toLowerCase().includes(q)).slice(0, 6);

    box.innerHTML = hits.length ? hits.map(([u, m], k)=> `<button type="button" data-addguest="${u}" class="${k === sugPick ? 'on' : ''}"><span>${esc(m.name || m.email || 'Teammate')}</span><small style="color:var(--slate);font-weight:500">${esc(m.email || '')}</small></button>`).join('')
      : (()=>{ const already = Object.entries(members).filter(([u, m])=> editState.guests.includes(u) && ((m.name || '') + ' ' + (m.email || '')).toLowerCase().includes(q));
          return `<div class="none">${already.length ? esc(already.map(([u, m])=> m.name || m.email).join(', ')) + (already.length === 1 ? ' is' : ' are') + ' already invited.' : `No teammate matches "${esc(q)}".`}</div>`; })();
  }
  function addGuest(u){ if(!editState.guests.includes(u)) editState.guests.push(u); $('eGuestSearch').value = ''; $('eGuestSuggest').hidden = true; renderGuests(); $('eGuestSearch').focus(); }
  $('eGuestSearch').addEventListener('input', ()=>{ sugPick = 0; renderSuggest(); });

  $('eSave').addEventListener('click', ()=>{
    const st = editState; if(!st) return;
    const allDay = $('eAllDay').checked, date = $('eDate').value || todayISO(), title = $('eTitle').value.trim();
    if(st.kind === 'task'){
      const tStart = allDay ? null : ($('eStart').value || '09:00'), tEnd = allDay ? null : ($('eEnd').value || fromMins(Math.min(toMins(tStart) + 60, 24 * 60 - 1)));
      if(!allDay && toMins(tEnd) <= toMins(tStart)){ showToast('The end time must be after the start time.', true); $('eEnd').focus(); return; }
      const upd = {title: title || 'Untitled task', dueDate: date, dueTime: tStart, dueEndTime: tEnd, notes: $('eDesc').value.trim() || null,
        repeat: $('eRepeat').value, calColor: st.color || null, dueSoonNotifiedFor: FV.delete()};
      db.collection('tasks').doc(st.id).update(upd).then(()=>{ closeEditor(); showToast('Task saved.'); }).catch(err=> showToast('Could not save that: ' + (err.message || ''), true));

    const mins = Math.max(0, Math.round(+$('eNotifVal').value || 0)) * (+$('eNotifUnit').value || 1);
    const data = {title: title || '(No title)', date, endDate, allDay, startTime: allDay ? null : start, endTime: allDay ? null : end,

      color: st.color || null, reminderMinutes: st.notif ? mins : null};

  $('eDelete').addEventListener('click', ()=>{ const st = editState; if(!st || !st.id) return; closeEditor();

  async function deleteTask(id, title){
    const ok = await showConfirmModal({title: 'Delete this task?', message: `"${title}" is removed from Tasks for everyone on your team.`, confirmLabel: 'Delete'});
    if(!ok) return;
    const t = tasks.find(x=> x.id === id);
    db.collection('tasks').doc(id).delete().then(()=> showUndo('Task deleted.', ()=>{ if(t){ const {id: _, ...rest} = t; db.collection('tasks').doc(id).set(rest).catch(()=>{}); } }))
      .catch(err=> showToast('Could not delete that: ' + (err.message || ''), true));
  }

  // ---------- Saving ----------
  function saveEvent(id, data, opts){
    opts = opts || {};
    const before = id ? (events.find(e=> e.id === id) || {}) : {};
    const p = id ? db.collection('calendarEvents').doc(id).update(data).then(()=> id)
      : db.collection('calendarEvents').add({...data, workspaceId: wsId, createdBy: myUid, createdByName: myName, createdAt: FV.serverTimestamp()}).then(r=> r.id);
    return p.then(newId=>{
      const invited = (data.guests || []).filter(u=> !(before.guests || []).includes(u) && u !== myUid);
      invited.forEach(uid=> db.collection('userNotifications').add({workspaceId: wsId, uid, type: 'event', title: `${myName} invited you: ${data.title}`,

      db.collection('linkedinSequenceTemplates').where('workspaceId', '==', wsId).get().then(snap=>{ snap.docs.forEach(d=>{ templateOwners[d.id] = d.data().createdBy || null; }); soon(); }).catch(()=>{});
      loadCalls(); loadRuns();
      setInterval(()=>{ loadCalls(); loadRuns(); gEvents = {}; soon(); }, 5 * 60 * 1000);
      const r = new URLSearchParams(location.search).get('calendarConnect');
      if(r){
        showToast(r === 'success' ? '🗓 Google Calendar connected. Everything here is in the "PalaTrack" calendar in Google now.' : r === 'denied' ? 'Google Calendar was not connected.' : r === 'expired' ? 'That sign-in link expired. Please try again.' : 'Could not connect Google Calendar. Please try again.', r !== 'success' && r !== 'denied');
        history.replaceState(null, '', location.pathname);
      }
    }).catch(err=>{ console.error(err); showToast('Could not load your workspace.', true); reveal(); });
  });
  setInterval(()=>{ if(view !== 'month') soon(); }, 60000);   // the red "now" line
})();
</script>

<script>
// Shared side panel: the same links on every page. The current board (if the

(function(){
  var board = new URLSearchParams(location.search).get('board');
  var q = board ? '?board=' + encodeURIComponent(board) : '';

    navHome: 'home.html',
    navDashboard: board ? 'dashboard.html' + q : 'boards.html',

    navSettings: 'account.html'
  };

    if(a) a.setAttribute('href', links[id]);

<!-- LinkedIn badge: how many LinkedIn messages are due now (like an app badge on a phone) -->
<style>
  .pt-li-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#FF3B30;color:#fff;
    font:700 11px/20px -apple-system,BlinkMacSystemFont,'Inter',sans-serif;text-align:center;box-shadow:0 0 0 2px var(--panel,#fff);flex-shrink:0;
    animation:ptLiPop .45s cubic-bezier(.3,1.6,.5,1) both;}
  [data-li-badge],[data-tasks-badge]{position:relative;}
  [data-li-badge] > .pt-li-badge,[data-tasks-badge] > .pt-li-badge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;line-height:24px;font-size:12.5px;box-shadow:0 0 0 3px var(--paper,#EFF5FC),0 4px 10px -2px rgba(255,59,48,.55);}
  @keyframes ptLiPop{from{transform:scale(0);}to{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .pt-li-badge{animation:none;} }
</style>
<script>
(function(){
  function paint(n){
    document.querySelectorAll('#navLinkedinSeq, [data-li-badge]').forEach(function(el){
      var b = el.querySelector(':scope > .pt-li-badge');
      if(!n){ if(b) b.remove(); return; }
      if(!b){ b = document.createElement('span'); b.className = 'pt-li-badge'; el.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
      b.setAttribute('aria-label', n + (n === 1 ? ' LinkedIn message' : ' LinkedIn messages') + ' to send now');
      b.title = b.getAttribute('aria-label');
    });
  }
  function start(){
    if(!window.firebase || !firebase.apps || !firebase.apps.length) return;
    var db = firebase.firestore();
    firebase.auth().onAuthStateChanged(function(u){
      if(!u) return;
      db.doc('userDirectory/' + u.uid).get().then(function(d){
        var ws = d.exists && d.data().workspaceId; if(!ws) return;
        function load(){
          db.collection('linkedinSequenceRuns').where('workspaceId', '==', ws).where('status', '==', 'active').get().then(function(snap){
            var now = Date.now();
            paint(snap.docs.filter(function(x){
              var r = x.data(), t = r.nextDueAt && typeof r.nextDueAt.toMillis === 'function' ? r.nextDueAt.toMillis() : 0;
              return (r.currentStepIndex || 0) < (r.steps || []).length && t <= now;
            }).length);
          }).catch(function(){});
        }
        load(); setInterval(load, 5 * 60 * 1000);
        window.ptRefreshLinkedinBadge = load;
      }).catch(function(){});
    });
  }
  if(document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>

<!-- Tasks badge: unread task notifications (assigned, mentioned, due today, automations) -->
<script>
(function(){
  function paint(n){
    document.querySelectorAll('#navTasks, [data-tasks-badge]').forEach(function(el){
      var b = el.querySelector(':scope > .pt-li-badge');
      if(!n){ if(b) b.remove(); return; }
      if(!b){ b = document.createElement('span'); b.className = 'pt-li-badge'; el.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
      b.setAttribute('aria-label', n + (n === 1 ? ' unread task notification' : ' unread task notifications'));
      b.title = b.getAttribute('aria-label');
    });
  }
  function start(){
    if(!window.firebase || !firebase.apps || !firebase.apps.length) return;
    firebase.auth().onAuthStateChanged(function(u){
      if(!u) return;
      firebase.firestore().collection('userNotifications').where('uid', '==', u.uid).where('read', '==', false).limit(100)
        .onSnapshot(function(snap){ paint(snap.size); }, function(){});
    });
  }
  if(document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>
