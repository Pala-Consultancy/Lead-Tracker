<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATRACK - Email Sequences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#1C5B9E; --teal-deep:#0F3E72;
    --success:#1F6F5C; --success-soft:#DCEEE8;
    --fail:#B43B32; --fail-soft:#FAE1DE;
    --amber:#C97C00; --amber-soft:#FFF1DC;
    --shadow: 0 1px 2px rgba(16,32,55,0.04), 0 10px 28px -12px rgba(16,32,55,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .shell{max-width:820px;margin:0 auto;padding:0 22px 90px;}
  #appRoot.reveal{animation:pageFade .4s ease both;}
  @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:none;margin:24px 0 18px;}
  .back-link:hover{color:var(--teal);}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .page-title{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;margin:0 0 4px;}
  .page-sub{font-size:13.5px;color:var(--slate);margin:0;}
  .new-seq-btn{
    background:var(--teal);color:#fff;border:none;border-radius:10px;padding:12px 20px;
    font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;
  }
  .new-seq-btn:hover{background:var(--teal-deep);}

  .status-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .status-chip{padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--slate);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .status-chip:hover{border-color:var(--teal);}
  .status-chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}

  .seq-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;
    box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:16px;
    transition:border-color .12s, transform .12s;
  }
  .seq-card:hover{border-color:var(--teal);transform:translateY(-1px);}
  .seq-card-icon{
    width:42px;height:42px;border-radius:50%;background:var(--panel-alt);border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  }
  .seq-card-body{flex:1;min-width:0;}
  .seq-card-name{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;}
  .seq-card-meta{font-size:12px;color:var(--slate);margin-top:3px;}
  .seq-card-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;white-space:nowrap;}
  .seq-card-badge.draft{background:var(--border-soft);color:var(--slate);}
  .seq-card-badge.paused{background:var(--amber-soft);color:var(--amber);}
  .seq-card-badge.active{background:var(--amber-soft);color:var(--amber);}
  .seq-card-badge.completed{background:var(--success-soft);color:var(--success);}
  .seq-card-badge.stopped_replied{background:var(--success-soft);color:var(--success);}
  .seq-card-badge.needs_attention{background:var(--fail-soft);color:var(--fail);}
  .seq-card-chevron{color:var(--slate-light);flex-shrink:0;}

  .empty-state{text-align:center;padding:70px 20px;color:var(--slate);border:1px dashed var(--border);border-radius:16px;}
  .empty-state h3{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;color:var(--ink);margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0 0 16px;}

  /* ---------- Lead picker modal ---------- */
  .picker-overlay{
    position:fixed;inset:0;background:rgba(16,32,55,0.4);z-index:200;
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transition:opacity .18s ease, visibility 0s linear .18s;
  }
  .picker-overlay.open{opacity:1;visibility:visible;transition:opacity .18s ease;}
  .picker-modal{
    width:440px;max-width:92vw;max-height:78vh;background:var(--panel);border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);display:flex;flex-direction:column;
    transform:scale(.96);transition:transform .18s ease;
  }
  .picker-overlay.open .picker-modal{transform:scale(1);}
  .picker-head{padding:20px 22px 14px;border-bottom:1px solid var(--border-soft);}
  .picker-head h3{margin:0 0 4px;font-family:'Sora',sans-serif;font-size:17px;}
  .picker-head p{margin:0 0 12px;font-size:12.5px;color:var(--slate);}
  .picker-search{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:9px;font:inherit;font-size:13.5px;}
  .picker-search:focus{outline:none;border-color:var(--teal);}
  .picker-list{overflow-y:auto;padding:8px;flex:1;}
  .picker-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;
  }
  .picker-item:hover{background:var(--panel-alt);}
  .picker-item-avatar{
    width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .picker-item-name{font-size:13.5px;font-weight:600;}
  .picker-item-email{font-size:11.5px;color:var(--slate);}
  .picker-empty{padding:30px;text-align:center;color:var(--slate);font-size:13px;}
  .picker-close{padding:14px 22px;border-top:1px solid var(--border-soft);text-align:right;}
  .picker-close button{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:600;cursor:pointer;}

  .toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.danger{background:var(--fail);}
</style>
</head>
<body>
<div id="pageLoader"><div class="loader-spinner"></div></div>
<div class="toast-stack" id="toastStack"></div>

<div id="appRoot" style="display:none;">
<div class="shell">
  <a class="back-link" id="backBtn" href="boards.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Back
  </a>
  <div class="page-head">
    <div>
      <h1 class="page-title">Email sequences</h1>
      <p class="page-sub">Every follow-up sequence running for a lead on this board — click one to see how it's going.</p>
    </div>
    <button type="button" class="new-seq-btn" id="newSeqBtn">+ New sequence</button>
  </div>

  <div class="status-filters" id="statusFilters">
    <button type="button" class="status-chip active" data-filter="all">All</button>
    <button type="button" class="status-chip" data-filter="draft">Drafts</button>
    <button type="button" class="status-chip" data-filter="active">Active</button>
    <button type="button" class="status-chip" data-filter="paused">Paused</button>
    <button type="button" class="status-chip" data-filter="completed">Completed</button>
    <button type="button" class="status-chip" data-filter="needs_attention">Needs attention</button>
  </div>

  <div id="listHolder"></div>
</div>
</div>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-modal">
    <div class="picker-head">
      <h3>Start a new sequence</h3>
      <p>Pick which lead this is for.</p>
      <input type="text" class="picker-search" id="pickerSearch" placeholder="Search leads by name or company...">
    </div>
    <div class="picker-list" id="pickerList"></div>
    <div class="picker-close"><button type="button" id="pickerCloseBtn">Cancel</button></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

  function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function initials(name){
    const parts = (name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  function showToast(message, danger){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast' + (danger ? ' danger' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'opacity .2s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 200);
    }, 3200);
  }

  const params = new URLSearchParams(location.search);
  const boardId = params.get('board');
  document.getElementById('backBtn').href = boardId ? `dashboard.html?board=${encodeURIComponent(boardId)}` : 'boards.html';

  let currentWorkspaceId = null;
  let allScheduled = [];
  let leadNames = {}; // leadId -> {name, email}
  let activeFilter = 'all';
  let boardLeads = []; // for the picker

  function deriveActiveStatus(followUps){
    if(followUps.length === 0) return 'active';
    if(followUps.some(s=>s.status==='pending' || s.status==='sending')) return 'active';
    if(followUps.some(s=>s.status==='failed')) return 'needs_attention';
    if(followUps.some(s=>s.status==='cancelled_replied')) return 'stopped_replied';
    return 'completed';
  }
  const STATUS_LABEL = {
    draft:'Draft', paused:'Paused', active:'Active', completed:'Completed',
    stopped_replied:'They replied', needs_attention:'Needs attention'
  };

  function buildSequenceList(){
    const scheduledBySeq = {};
    allScheduled.forEach(e=>{
      if(!e.sequenceId) return;
      if(!scheduledBySeq[e.sequenceId]) scheduledBySeq[e.sequenceId] = [];
      scheduledBySeq[e.sequenceId].push(e);
    });
    return allSequenceDocs.map(seq=>{
      const followUps = (scheduledBySeq[seq.id] || []).sort((a,b)=>(a.stepNumber||0)-(b.stepNumber||0));
      const status = seq.status === 'active' ? deriveActiveStatus(followUps) : seq.status;
      return {
        sequenceId: seq.id, leadId: seq.leadId, boardId: seq.boardId,
        sentByName: seq.createdByName,
        updatedAt: seq.updatedAt || seq.createdAt,
        stepCount: Array.isArray(seq.steps) ? seq.steps.length : (followUps.length + 1),
        status
      };
    }).sort((a,b)=>{
      const at = a.updatedAt ? a.updatedAt.toMillis() : 0;
      const bt = b.updatedAt ? b.updatedAt.toMillis() : 0;
      return bt - at;
    });
  }

  function getLeadInfo(boardId, leadId){
    const key = `${boardId}/${leadId}`;
    if(leadNames[key]) return Promise.resolve(leadNames[key]);
    return db.doc(`workspaces/${currentWorkspaceId}/boards/${boardId}/leads/${leadId}`).get().then(doc=>{
      leadNames[key] = doc.exists ? {name: doc.data().name || 'Unnamed lead', email: doc.data().email || ''} : {name:'Deleted lead', email:''};
      return leadNames[key];
    }).catch(()=>({name:'Unknown lead', email:''}));
  }

  function renderList(){
    const holder = document.getElementById('listHolder');
    const sequences = buildSequenceList();
    const filtered = activeFilter === 'all' ? sequences : sequences.filter(s=>{
      if(activeFilter === 'completed') return s.status === 'completed' || s.status === 'stopped_replied';
      return s.status === activeFilter;
    });
    if(filtered.length === 0){
      holder.innerHTML = `<div class="empty-state">
        <h3>No sequences ${activeFilter === 'all' ? 'yet' : 'here'}</h3>
        <p>${activeFilter === 'all' ? "Start one from a lead's drawer, or click \"+ New sequence\" above." : "No sequences match this filter."}</p>
      </div>`;
      return;
    }
    holder.innerHTML = filtered.map((s, idx)=>`
      <div class="seq-card" data-idx="${idx}">
        <div class="seq-card-icon">📧</div>
        <div class="seq-card-body">
          <div class="seq-card-name" data-lead-name="${s.boardId}/${s.leadId}">Loading…</div>
          <div class="seq-card-meta">${s.stepCount} step${s.stepCount===1?'':'s'} &middot; started by ${esc(s.sentByName || 'Someone')}</div>
        </div>
        <span class="seq-card-badge ${esc(s.status)}">${esc(STATUS_LABEL[s.status] || s.status)}</span>
        <span class="seq-card-chevron">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </span>
      </div>
    `).join('');

    holder.querySelectorAll('.seq-card').forEach(card=>{
      const s = filtered[Number(card.dataset.idx)];
      card.addEventListener('click', ()=>{
        location.href = `sequence-builder.html?board=${encodeURIComponent(s.boardId)}&lead=${encodeURIComponent(s.leadId)}&sequenceId=${encodeURIComponent(s.sequenceId)}`;
      });
      const nameEl = card.querySelector('[data-lead-name]');
      getLeadInfo(s.boardId, s.leadId).then(info=>{ nameEl.textContent = info.name; });
    });
  }

  document.querySelectorAll('.status-chip[data-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeFilter = chip.dataset.filter;
      document.querySelectorAll('.status-chip[data-filter]').forEach(c=>c.classList.toggle('active', c===chip));
      renderList();
    });
  });

  // ---------- New sequence: lead picker ----------
  function openPicker(){
    document.getElementById('pickerSearch').value = '';
    renderPickerList('');
    document.getElementById('pickerOverlay').classList.add('open');
    document.getElementById('pickerSearch').focus();
  }
  function closePicker(){
    document.getElementById('pickerOverlay').classList.remove('open');
  }
  function renderPickerList(query){
    const list = document.getElementById('pickerList');
    const q = query.trim().toLowerCase();
    const filtered = !q ? boardLeads : boardLeads.filter(l=>
      (l.name||'').toLowerCase().includes(q) || (l.company||'').toLowerCase().includes(q));
    if(filtered.length === 0){
      list.innerHTML = `<div class="picker-empty">No leads match "${esc(query)}".</div>`;
      return;
    }
    list.innerHTML = filtered.slice(0, 50).map(l=>`
      <div class="picker-item" data-id="${esc(l.id)}">
        <div class="picker-item-avatar">${esc(initials(l.name))}</div>
        <div>
          <div class="picker-item-name">${esc(l.name || 'Unnamed lead')}</div>
          <div class="picker-item-email">${esc(l.email || 'No email on file')}</div>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.picker-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const lead = boardLeads.find(l=>l.id === item.dataset.id);
        if(lead && !lead.email){
          showToast('This lead has no email address on file.', true);
          return;
        }
        location.href = `sequence-builder.html?board=${encodeURIComponent(boardId)}&lead=${encodeURIComponent(item.dataset.id)}`;
      });
    });
  }
  document.getElementById('newSeqBtn').addEventListener('click', openPicker);
  document.getElementById('pickerCloseBtn').addEventListener('click', closePicker);
  document.getElementById('pickerOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'pickerOverlay') closePicker();
  });
  document.getElementById('pickerSearch').addEventListener('input', (e)=> renderPickerList(e.target.value));

  let unsubscribeSequences = null;
  let unsubscribeScheduled = null;
  let allSequenceDocs = [];
  let sequencesLoaded = false, scheduledLoaded = false;

  function revealAndRender(){
    if(!sequencesLoaded || !scheduledLoaded) return;
    document.getElementById('pageLoader').style.display = 'none';
    const appRoot = document.getElementById('appRoot');
    appRoot.style.display = 'block';
    appRoot.classList.add('reveal');
    renderList();
  }

  function startListening(workspaceId){
    currentWorkspaceId = workspaceId;
    unsubscribeSequences = db.collection('sequences')
      .where('workspaceId', '==', workspaceId)
      .where('boardId', '==', boardId)
      .orderBy('updatedAt', 'desc')
      .limit(300)
      .onSnapshot(snap=>{
        allSequenceDocs = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
        sequencesLoaded = true;
        revealAndRender();
      }, err=>{
        console.error('Could not load sequences', err);
        sequencesLoaded = true;
        revealAndRender();
      });
    unsubscribeScheduled = db.collection('scheduledEmails')
      .where('workspaceId', '==', workspaceId)
      .where('boardId', '==', boardId)
      .orderBy('sendAt', 'asc')
      .limit(500)
      .onSnapshot(snap=>{
        allScheduled = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
        scheduledLoaded = true;
        revealAndRender();
      }, err=>{
        console.error('Could not load scheduled emails', err);
        scheduledLoaded = true;
        revealAndRender();
      });
  }

  auth.onAuthStateChanged(user=>{
    if(!user){
      location.href = 'boards.html';
      return;
    }
    if(!boardId){
      document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:Inter,sans-serif;">This page needs a board specified in the link.</div>';
      return;
    }
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const workspaceId = doc.exists ? doc.data().workspaceId : null;
      if(!workspaceId){
        showToast('Could not find your workspace.', true);
        return;
      }
      startListening(workspaceId);
      db.collection(`workspaces/${workspaceId}/boards/${boardId}/leads`).get().then(snap=>{
        boardLeads = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(l=>!l.deleted);
      }).catch(err=>console.error('Could not load leads for picker', err));
    }).catch(err=>{
      console.error(err);
      showToast('Could not load your workspace.', true);
    });
  });
})();
</script>
</body>
</html>
