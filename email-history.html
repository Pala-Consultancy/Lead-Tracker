<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATRACK - Email History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430; --paper:#EFF5FC; --panel:#FFFFFF; --border:#D3E0EF;
    --teal:#1B59A5; --teal-dark:#123F78; --slate:#647084; --slate-light:#8A93A3;
    --shadow: 0 1px 2px rgba(27,59,110,0.05), 0 4px 14px rgba(27,59,110,0.07);
    --c-blue-fg:#1B59A5; --c-blue-bg:#E3EEFA; --c-blue-tint2:#F6FAFE;
    --c-green-fg:#1F5C4F; --c-green-bg:#DEF0EA;
    --c-red-fg:#C0392B; --c-red-bg:#FBE4E2;
    --c-toast-bg:#1B2430;
  }
  [data-theme="dark"]{
    --ink:#EAF0F8; --paper:#0F1620; --panel:#1A2430; --border:#2C3A4A;
    --teal:#4A90D9; --teal-dark:#6BA8E8; --slate:#9AAAB8; --slate-light:#6B7A88;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
    --c-blue-fg:#6FA8E8; --c-blue-bg:#1E2E42; --c-blue-tint2:#161F28;
    --c-green-fg:#5FBFA8; --c-green-bg:#173B33;
    --c-red-fg:#E87A6E; --c-red-bg:#3A2220;
    --c-toast-bg:#1B2430;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .app{max-width:760px;margin:0 auto;padding:28px 24px 80px;}
  #pageLoader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  .loader-logo img{width:56px;height:56px;border-radius:14px;}
  .loader-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--c-blue-fg);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .header-lead-name{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;margin:0 0 2px;}
  .header-lead-company{font-size:13px;color:var(--slate);}
  .btn{border:1px solid var(--border);background:var(--panel);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--c-blue-tint2);}
  .count-pill{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--slate);background:var(--c-blue-bg);padding:6px 12px;border-radius:20px;margin-bottom:16px;display:inline-block;}
  .history-item{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;}
  .history-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .history-subject{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;color:var(--ink);}
  .history-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0;}
  .history-status.sent{background:var(--c-green-bg);color:var(--c-green-fg);}
  .history-status.failed{background:var(--c-red-bg);color:var(--c-red-fg);}
  .history-meta{font-size:12px;color:var(--slate-light);margin-bottom:12px;line-height:1.6;}
  .history-meta strong{color:var(--slate);font-weight:600;}
  .history-body{font-size:13.5px;color:var(--ink);line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  .history-attachments{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;}
  .history-attachment-chip{font-size:11.5px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:var(--c-blue-tint2);color:var(--slate);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--slate);}
  .empty-state h3{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin:0 0 6px;}
  .toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--c-toast-bg);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.danger{background:var(--c-red-fg);}
</style>
</head>
<body>
<script>
  try{
    if(window.localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  }catch(e){}
</script>
<div id="pageLoader">
  <div class="loader-spinner"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<div id="appRoot" style="display:none;">
<div class="app">
  <header>
    <div>
      <div class="header-lead-name" id="headerLeadName">Loading...</div>
      <div class="header-lead-company" id="headerLeadCompany"></div>
    </div>
    <button type="button" class="btn" id="backBtn">← Back</button>
  </header>
  <div class="count-pill" id="countPill"></div>
  <div id="historyList"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

  function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function showToast(message, danger){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast' + (danger ? ' danger' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'opacity .2s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 200);
    }, 3200);
  }
  function formatEmailTime(date){
    return date.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'}) + ' at ' +
      date.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
  }

  const params = new URLSearchParams(location.search);
  const boardId = params.get('board');
  const leadId = params.get('lead');

  document.getElementById('backBtn').addEventListener('click', ()=>{
    if(boardId) location.href = `dashboard.html?board=${encodeURIComponent(boardId)}`;
    else history.back();
  });

  function loadHistory(workspaceId){
    if(!boardId || !leadId){
      document.getElementById('historyList').innerHTML = `<div class="empty-state"><h3>Missing link details</h3><p>This page needs a board and lead to be specified in the link.</p></div>`;
      return;
    }
    const leadRef = db.doc(`workspaces/${workspaceId}/boards/${boardId}/leads/${leadId}`);
    leadRef.get().then(leadDoc=>{
      if(!leadDoc.exists){
        document.getElementById('headerLeadName').textContent = 'Lead not found';
        return;
      }
      const lead = leadDoc.data();
      document.getElementById('headerLeadName').textContent = lead.name || 'Unnamed lead';
      document.getElementById('headerLeadCompany').textContent = lead.company || '';
      document.title = `${lead.name || 'Lead'} - Email History - PalaTrack`;
    }).catch(()=>{});

    leadRef.collection('emails').orderBy('sentAt', 'desc').limit(200).get().then(snap=>{
      const countPill = document.getElementById('countPill');
      const list = document.getElementById('historyList');
      if(snap.empty){
        countPill.style.display = 'none';
        list.innerHTML = `<div class="empty-state"><h3>No emails yet</h3><p>Nothing has been sent to this lead so far.</p></div>`;
        return;
      }
      countPill.textContent = `${snap.size} email${snap.size===1?'':'s'} sent`;
      list.innerHTML = snap.docs.map(doc=>{
        const e = doc.data();
        const time = (e.sentAt && typeof e.sentAt.toDate === 'function') ? formatEmailTime(e.sentAt.toDate()) : '—';
        const statusBadge = e.status === 'failed'
          ? `<span class="history-status failed">Failed to send</span>`
          : `<span class="history-status sent">Sent</span>`;
        const ccLine = (Array.isArray(e.cc) && e.cc.length) ? `<br><strong>Cc:</strong> ${esc(e.cc.join(', '))}` : '';
        const attachmentsHtml = (Array.isArray(e.attachmentNames) && e.attachmentNames.length)
          ? `<div class="history-attachments">${e.attachmentNames.map(n=>`<span class="history-attachment-chip">📎 ${esc(n)}</span>`).join('')}</div>`
          : '';
        return `<div class="history-item">
          <div class="history-item-head">
            <span class="history-subject">${esc(e.subject || '(no subject)')}</span>
            ${statusBadge}
          </div>
          <div class="history-meta">
            <strong>To:</strong> ${esc(e.to || '')}${ccLine}<br>
            <strong>From:</strong> ${esc(e.sentByName || '')} (${esc(e.fromEmail || '')})<br>
            <strong>Sent:</strong> ${esc(time)}
          </div>
          <div class="history-body">${esc(e.body || '')}</div>
          ${attachmentsHtml}
        </div>`;
      }).join('');
    }).catch(err=>{
      console.error(err);
      document.getElementById('historyList').innerHTML = `<div class="empty-state"><h3>Could not load history</h3><p>Please try again.</p></div>`;
    });
  }

  auth.onAuthStateChanged(user=>{
    document.getElementById('pageLoader').style.display = 'none';
    if(!user){
      location.href = 'boards.html';
      return;
    }
    document.getElementById('appRoot').style.display = 'block';
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const workspaceId = doc.exists ? doc.data().workspaceId : null;
      if(!workspaceId){
        showToast('Could not find your workspace.', true);
        return;
      }
      loadHistory(workspaceId);
    }).catch(err=>{
      console.error(err);
      showToast('Could not load your workspace.', true);
    });
  });
})();
</script>
</body>
</html>
