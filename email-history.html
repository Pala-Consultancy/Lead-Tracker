<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATRACK - Correspondence Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F6FC;
    --panel:#FFFFFF;
    --panel-alt:#F8FBFE;
    --ink:#16202C;
    --border:#DCE6F2;
    --border-soft:#E9F0F8;
    --slate:#5C6B7C;
    --slate-light:#8CA0B3;
    --teal:#1C5B9E;
    --teal-deep:#0F3E72;
    --clay:#A8632E;
    --clay-soft:#F3E5D6;
    --success:#1F6F5C;
    --success-soft:#DCEEE8;
    --fail:#B43B32;
    --fail-soft:#FAE1DE;
    --shadow: 0 1px 2px rgba(16,32,55,0.04), 0 10px 28px -12px rgba(16,32,55,0.14);
    --toast-bg:#16202C;
  }
  [data-theme="dark"]{
    --paper:#0E141C;
    --panel:#161E28;
    --panel-alt:#121821;
    --ink:#E9EFF6;
    --border:#26333F;
    --border-soft:#1D2833;
    --slate:#9BAAB8;
    --slate-light:#66788A;
    --teal:#5B9BE0;
    --teal-deep:#8FC0F2;
    --clay:#D69A6B;
    --clay-soft:#2C2115;
    --success:#5FBFA8;
    --success-soft:#16281F;
    --fail:#E58A80;
    --fail-soft:#2E1A18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 28px -12px rgba(0,0,0,0.55);
    --toast-bg:#161E28;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(28,91,158,0.18);}
  .serif{font-family:'Fraunces',serif;}

  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .shell{max-width:720px;margin:0 auto;padding:0 22px 90px;}
  #appRoot.reveal{animation:pageFade .5s ease both;}
  @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ #appRoot.reveal{animation:none;} }

  .letterhead{padding:34px 0 22px;}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--slate);
    text-decoration:none;margin-bottom:18px;
  }
  .back-link:hover{color:var(--teal);}
  .letterhead-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .lead-name{font-size:34px;font-weight:600;line-height:1.08;margin:0;letter-spacing:-0.01em;}
  .lead-company{font-size:14.5px;color:var(--slate);margin-top:5px;}
  .lead-crest{
    width:52px;height:52px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(145deg, var(--teal) 0%, var(--teal-deep) 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:20px;font-weight:600;
    box-shadow:0 8px 20px -6px rgba(15,62,114,0.5);overflow:hidden;
  }
  .lead-crest img{width:100%;height:100%;object-fit:cover;display:block;}
  .fact-row{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border-top:1px solid var(--border);}
  .fact{padding:14px 20px 0 0;margin-right:20px;border-right:1px solid var(--border-soft);}
  .fact:last-child{border-right:none;margin-right:0;}
  .fact-label{font-size:11px;color:var(--slate-light);margin-bottom:3px;}
  .fact-value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--ink);}
  .fact-value.fail{color:var(--fail);}

  .toolbar{
    display:flex;gap:10px;margin:26px 0 8px;flex-wrap:wrap;
    position:sticky;top:0;z-index:10;padding:14px 0;
    background:linear-gradient(var(--paper) 78%, transparent);
  }
  .search-wrap{position:relative;flex:1;min-width:200px;}
  .search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--slate-light);pointer-events:none;}
  #searchInput{
    width:100%;padding:10px 14px 10px 36px;border:1px solid var(--border);border-radius:10px;
    background:var(--panel);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;
  }
  #searchInput:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,91,158,0.13);}
  .status-filters{display:flex;gap:6px;}
  .status-chip{
    padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);
    color:var(--slate);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .status-chip:hover{border-color:var(--teal);}
  .status-chip.active{background:var(--teal);border-color:var(--teal);color:#fff;}
  .status-chip:focus-visible, #searchInput:focus-visible, .back-link:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  .timeline{position:relative;margin-top:26px;padding-left:30px;}
  .timeline::before{
    content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1.5px;
    background:linear-gradient(var(--border), var(--border) 92%, transparent);
  }
  .date-marker{position:relative;display:flex;align-items:center;gap:12px;margin:30px 0 14px;}
  .date-marker:first-child{margin-top:0;}
  .date-marker::before{
    content:"";position:absolute;left:-30px;width:15px;height:15px;border-radius:50%;
    background:var(--paper);border:2px solid var(--slate-light);
  }
  .date-marker-label{font-size:12px;font-weight:600;color:var(--slate);letter-spacing:0.01em;}

  .entry{position:relative;margin-bottom:20px;}
  .entry-pip{
    position:absolute;left:-30px;top:4px;width:15px;height:15px;border-radius:50%;
    border:2px solid var(--panel);box-shadow:0 0 0 1.5px var(--border);
  }
  .entry-pip.sent{background:var(--success);}
  .entry-pip.failed{background:var(--fail);}

  .letter{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease;}
  .letter:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(16,32,55,0.06), 0 16px 32px -12px rgba(16,32,55,0.2);}
  mark{background:var(--clay-soft);color:var(--clay);border-radius:3px;padding:0 2px;}
  .copy-icon{
    cursor:pointer;opacity:.55;margin-left:4px;font-size:11px;color:var(--slate);
    transition:opacity .12s;
  }
  .copy-icon:hover{opacity:1;color:var(--teal);}
  .letter-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px;}
  .letter-subject{font-size:17px;font-weight:500;line-height:1.35;margin:0;}
  .postmark{
    flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:4px 11px 4px 8px;
    border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;
  }
  .postmark svg{width:12px;height:12px;}
  .postmark.sent{background:var(--success-soft);color:var(--success);}
  .postmark.failed{background:var(--fail-soft);color:var(--fail);}

  .letter-meta{font-size:12.5px;color:var(--slate);line-height:1.9;margin-bottom:14px;}
  .letter-meta b{color:var(--ink);font-weight:600;}

  .letter-body{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word;position:relative;}
  .letter-body.clamped{max-height:168px;overflow:hidden;}
  .letter-body.clamped::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:52px;
    background:linear-gradient(transparent, var(--panel));
  }
  .expand-btn{margin-top:10px;background:none;border:none;padding:0;color:var(--teal);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .expand-btn:hover{text-decoration:underline;}

  .letter-attachments{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px;}
  .attachment-tag{font-size:11.5px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:var(--clay-soft);color:var(--clay);font-weight:600;}

  .letter-actions{margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);display:flex;gap:8px;flex-wrap:wrap;}
  .letter-action-btn{
    display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel-alt);color:var(--slate);
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
    transition:background .12s, color .12s, border-color .12s;
  }
  .letter-action-btn svg{width:13px;height:13px;}
  .letter-action-btn:hover{border-color:var(--teal);color:var(--teal);}
  .letter-action-btn.resend{border-color:var(--fail);color:var(--fail);}
  .letter-action-btn.resend:hover{background:var(--fail-soft);}
  .letter-action-btn:disabled{opacity:.55;cursor:default;}

  /* ---------- Collapsible day groups ---------- */
  .day-group{margin:0;}
  .date-marker{
    all:unset;position:relative;display:flex;align-items:center;gap:10px;margin:30px 0 14px;
    cursor:pointer;width:100%;box-sizing:border-box;
  }
  .day-group:first-child .date-marker{margin-top:0;}
  .date-marker-chevron{
    display:inline-flex;color:var(--slate-light);font-size:11px;transition:transform .15s ease;flex-shrink:0;
  }
  .day-group.collapsed .date-marker-chevron{transform:rotate(-90deg);}
  .date-marker-count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate-light);
    background:var(--panel-alt);border:1px solid var(--border);border-radius:20px;padding:1px 8px;margin-left:2px;
  }
  .day-entries{overflow:hidden;}
  .day-group.collapsed .day-entries{display:none;}

  /* ---------- Thread badges ---------- */
  .thread-badge{
    font-size:11px;color:var(--clay);background:var(--clay-soft);border-radius:20px;
    padding:2px 9px;font-weight:600;display:inline-block;margin-bottom:8px;
  }

  /* ---------- Keyboard focus ---------- */
  .letter.kbd-focus{outline:2px solid var(--teal);outline-offset:3px;}

  /* ---------- Frequency sparkline ---------- */
  .freq-chart{display:flex;align-items:flex-end;gap:4px;height:36px;margin-top:18px;}
  .freq-bar-col{flex:1;max-width:14px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;}
  .freq-bar{width:100%;border-radius:3px 3px 1px 1px;background:var(--border);min-height:3px;transition:background .12s, transform .12s;}
  .freq-bar-col:hover .freq-bar{background:var(--teal);transform:scaleY(1.05);}
  .freq-bar-col.best .freq-bar{background:var(--clay);}
  .freq-bar-col.best:hover .freq-bar{background:var(--clay);}

  .share-modal-overlay{
    position:fixed;inset:0;background:rgba(16,32,55,0.45);z-index:200;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .share-modal-overlay.open{display:flex;}
  .share-modal{
    background:var(--panel);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,0.28);
    width:100%;max-width:440px;padding:26px 26px 22px;
  }
  .share-modal h3{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:0 0 8px;}
  .share-modal p{font-size:13px;color:var(--slate);line-height:1.5;margin:0 0 16px;}
  .share-link-row{
    display:flex;gap:8px;margin-bottom:16px;
  }
  .share-link-row input{
    flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--panel-alt);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12.5px;
  }
  .share-modal-actions{display:flex;justify-content:space-between;gap:10px;}
  .share-modal-btn{
    padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;border:1px solid var(--border);background:var(--panel-alt);color:var(--ink);
  }
  .share-modal-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .share-modal-btn.danger{color:var(--fail);border-color:var(--fail);}
  .share-modal-btn.danger:hover{background:var(--fail-soft);}
  .share-modal-loading{color:var(--slate);font-size:13px;padding:10px 0;}

  .empty-state{text-align:center;padding:70px 20px;color:var(--slate);border:1px dashed var(--border);border-radius:16px;margin-top:20px;}
  .empty-state h3{font-family:'Fraunces',serif;font-size:20px;font-weight:500;color:var(--ink);margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0;}

  .toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--toast-bg);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.danger{background:var(--fail);}

  .back-to-top{
    position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;
    background:var(--teal);color:#fff;border:none;cursor:pointer;
    box-shadow:0 8px 20px -4px rgba(15,62,114,0.5);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease, visibility .2s;
  }
  .back-to-top.show{opacity:1;visibility:visible;transform:translateY(0);}
  .back-to-top:hover{background:var(--teal-deep);}

  @media (max-width:520px){
    .lead-name{font-size:27px;}
    .fact{padding-right:14px;margin-right:14px;}
    .timeline{padding-left:24px;}
    .timeline::before{left:5px;}
    .date-marker::before, .entry-pip{left:-24px;}
  }

  /* ---------- Print / PDF export ---------- */
  @media print{
    :root{
      --paper:#fff; --panel:#fff; --panel-alt:#fff; --ink:#16202C;
      --border:#D8D8D8; --border-soft:#E8E8E8; --slate:#444; --slate-light:#777;
      --teal:#1C5B9E; --success:#1F6F5C; --success-soft:#fff; --fail:#B43B32; --fail-soft:#fff;
      --shadow:none;
    }
    body{background:#fff;}
    .back-link, .back-to-top, .toolbar, .letter-actions, .copy-icon,
    .expand-btn, .toast-stack, .share-modal-overlay{display:none !important;}
    .letterhead{padding-top:0;}
    .timeline{padding-left:0;margin-top:16px;}
    .timeline::before, .date-marker::before, .entry-pip{display:none;}
    .date-marker{margin:22px 0 10px;}
    .letter{box-shadow:none;border:1px solid var(--border);break-inside:avoid;}
    .letter-body.clamped{max-height:none !important;overflow:visible !important;}
    .letter-body.clamped::after{display:none !important;}
    .lead-crest{box-shadow:none;}
  }
</style>
</head>
<body>
<script>
  try{
    if(window.localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  }catch(e){}
</script>
<div id="pageLoader"><div class="loader-spinner"></div></div>

<div class="toast-stack" id="toastStack"></div>

<div id="appRoot" style="display:none;">
<div class="shell">
  <div class="letterhead">
    <a class="back-link" id="backBtn" href="#">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Back to lead
    </a>
    <div class="letterhead-top">
      <div>
        <h1 class="lead-name serif" id="headerLeadName">Loading…</h1>
        <div class="lead-company" id="headerLeadCompany"></div>
      </div>
      <div class="lead-crest" id="leadCrest">—</div>
    </div>
    <div class="fact-row" id="factRow" style="display:none;">
      <div class="fact"><div class="fact-label">Sent</div><div class="fact-value" id="factSent">0</div></div>
      <div class="fact"><div class="fact-label">Failed</div><div class="fact-value fail" id="factFailed">0</div></div>
      <div class="fact"><div class="fact-label">First contact</div><div class="fact-value" id="factFirst">—</div></div>
      <div class="fact"><div class="fact-label">Last contact</div><div class="fact-value" id="factLast">—</div></div>
    </div>
    <div id="freqChartHolder"></div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="Search subject or message text...">
    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-functions-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

  function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function playSuccessSound(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      function tone(freq, startTime, duration, volume){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      tone(880, now, 0.12, 0.13);
      tone(1318.5, now + 0.09, 0.2, 0.13);
    }catch(e){}
  }
  function showToast(message, danger){
    if(!danger) playSuccessSound();
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast' + (danger ? ' danger' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'opacity .2s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 200);
    }, 3200);
  }
  function initials(name){
    if(!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase() || '?';
  }
  function formatTime(date){
    return date.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
  }
  function formatDayLabel(date){
    return date.toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  }
  function formatShortDate(date){
    return date.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
  }
  function dayKey(date){
    return date.toISOString().slice(0,10);
  }

  const params = new URLSearchParams(location.search);
  const boardId = params.get('board');
  const leadId = params.get('lead');
  let allEmails = [];
  let currentWorkspaceId = null;
  let sendLeadEmailFn = null;
  try{
    sendLeadEmailFn = firebase.functions().httpsCallable('sendLeadEmail');
  }catch(err){
    console.error('Could not set up email sending (this will not affect the rest of the page):', err);
  }

  // Same conversion used in the compose window: escape first, then turn
  // newlines into <br> ourselves so blank lines in quoted text survive.
  function plainTextToHtml(text){
    const escaped = esc(text).replace(/\r\n/g, '\n');
    return escaped.split('\n').join('<br>');
  }
  function quotePrefixedHtml(text){
    const escaped = esc(text).replace(/\r\n/g, '\n');
    return escaped.split('\n').map(line => '&gt; ' + line).join('<br>');
  }
  let activeStatusFilter = 'all';

  document.getElementById('backBtn').addEventListener('click', (e)=>{
    e.preventDefault();
    if(boardId) location.href = `dashboard.html?board=${encodeURIComponent(boardId)}`;
    else history.back();
  });

  // Escapes first, then wraps matches of the current search query in <mark>
  // — safe against HTML injection since escaping always runs first.
  function highlightText(text, query){
    const escaped = esc(text);
    if(!query) return escaped;
    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp(`(${escapedQuery})`, 'ig'), '<mark>$1</mark>');
  }
  function copyText(text, label){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>showToast(`${label} copied`))
        .catch(()=>showToast('Could not copy', true));
    }
  }

  // Groups emails whose subject is the same once Re:/Fwd: prefixes are
  // stripped, so a reply chain can show "2 of 4 in this thread" instead of
  // looking like four unrelated emails.
  function normalizeSubjectForThreading(subject){
    let s = (subject || '').trim();
    let stripped = true;
    while(stripped){
      const m = s.match(/^(re|fwd|fw)\s*:\s*/i);
      stripped = !!m;
      if(m) s = s.slice(m[0].length).trim();
    }
    return s.toLowerCase();
  }
  function computeThreadInfo(){
    const groups = {};
    allEmails.forEach(e=>{
      const key = normalizeSubjectForThreading(e.subject);
      if(!key) return;
      (groups[key] = groups[key] || []).push(e);
    });
    Object.values(groups).forEach(group=>{
      if(group.length < 2) return;
      const chronological = group.slice().sort((a,b)=>(a.date?a.date.getTime():0) - (b.date?b.date.getTime():0));
      chronological.forEach((e, i)=>{
        e.threadPosition = i + 1;
        e.threadTotal = chronological.length;
      });
    });
  }

  function updateFilterChipCounts(sentCount, failedCount){
    document.querySelector('.status-chip[data-filter="all"]').textContent = `All (${allEmails.length})`;
    document.querySelector('.status-chip[data-filter="sent"]').textContent = `Sent (${sentCount})`;
    document.querySelector('.status-chip[data-filter="failed"]').textContent = `Failed (${failedCount})`;
  }

  // A small "how often did we email them" sparkline, grouped by week.
  // Clicking a bar clears any active search/filter and scrolls to that
  // week's first email — a quick way to jump around a long thread.
  function mondayOfWeek(date){
    const d = new Date(date);
    const day = (d.getDay() + 6) % 7; // 0 = Monday
    d.setDate(d.getDate() - day);
    d.setHours(0,0,0,0);
    return d;
  }
  function renderFrequencySparkline(){
    const dated = allEmails.filter(e=>e.date);
    const holder = document.getElementById('freqChartHolder');
    if(dated.length < 2){ holder.innerHTML = ''; return; }
    const buckets = {};
    dated.forEach(e=>{
      const key = mondayOfWeek(e.date).getTime();
      buckets[key] = (buckets[key] || 0) + 1;
    });
    const weekKeys = Object.keys(buckets).map(Number).sort((a,b)=>a-b);
    const maxCount = Math.max(...weekKeys.map(k=>buckets[k]));
    holder.innerHTML = `<div class="freq-chart">${weekKeys.map(k=>{
      const count = buckets[k];
      const h = Math.max(3, Math.round((count / maxCount) * 34));
      const isBest = count === maxCount;
      const label = new Date(k).toLocaleDateString(undefined, {month:'short', day:'numeric'});
      return `<div class="freq-bar-col ${isBest?'best':''}" data-weekkey="${k}" title="Week of ${esc(label)}: ${count} email${count===1?'':'s'}">
        <div class="freq-bar" style="height:${h}px"></div>
      </div>`;
    }).join('')}</div>`;
    holder.querySelectorAll('.freq-bar-col').forEach(col=>{
      col.addEventListener('click', ()=>{
        const weekStart = Number(col.dataset.weekkey);
        const weekEnd = weekStart + 7*24*60*60*1000;
        const target = allEmails.find(e=>e.date && e.date.getTime() >= weekStart && e.date.getTime() < weekEnd);
        if(!target) return;
        document.getElementById('searchInput').value = '';
        activeStatusFilter = 'all';
        document.querySelectorAll('.status-chip[data-filter]').forEach(c=>c.classList.toggle('active', c.dataset.filter==='all'));
        renderTimeline();
        const marker = document.querySelector(`.date-marker[data-daykey="${dayKey(target.date)}"]`);
        if(marker){
          marker.closest('.day-group').classList.remove('collapsed');
          marker.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'});
        }
      });
    });
  }

  // ---------- Keyboard navigation ----------
  let kbdFocusIdx = -1;
  function isTypingInField(){
    const tag = document.activeElement && document.activeElement.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA';
  }
  function setKbdFocus(idx){
    const letters = document.querySelectorAll('#historyList .letter');
    if(letters.length === 0) return;
    kbdFocusIdx = Math.max(0, Math.min(letters.length - 1, idx));
    letters.forEach((el, i)=> el.classList.toggle('kbd-focus', i === kbdFocusIdx));
    letters[kbdFocusIdx].scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'});
  }
  document.addEventListener('keydown', (e)=>{
    if(e.key === '/' && !isTypingInField()){
      e.preventDefault();
      document.getElementById('searchInput').focus();
      return;
    }
    if(e.key === 'Escape'){
      const input = document.getElementById('searchInput');
      if(document.activeElement === input && input.value){
        input.value = '';
        renderTimeline();
      }
      return;
    }
    if(isTypingInField()) return;
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      setKbdFocus(kbdFocusIdx + 1);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      setKbdFocus(kbdFocusIdx - 1);
    } else if(e.key === 'Enter' && kbdFocusIdx >= 0){
      const letters = document.querySelectorAll('#historyList .letter');
      const btn = letters[kbdFocusIdx] && letters[kbdFocusIdx].querySelector('.expand-btn');
      if(btn) btn.click();
    }
  });

  let lastFilteredList = [];

  function renderTimeline(){
    const list = document.getElementById('historyList');
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = allEmails.filter(e=>{
      if(activeStatusFilter === 'sent' && e.status === 'failed') return false;
      if(activeStatusFilter === 'failed' && e.status !== 'failed') return false;
      if(query){
        const hay = (e.subject + ' ' + e.body).toLowerCase();
        if(!hay.includes(query)) return false;
      }
      return true;
    });
    lastFilteredList = filtered;

    if(allEmails.length === 0){
      list.innerHTML = `<div class="empty-state"><h3>No correspondence yet</h3><p>Nothing has been sent to this lead so far.</p></div>`;
      return;
    }
    if(filtered.length === 0){
      list.innerHTML = `<div class="empty-state"><h3>No matches</h3><p>Try a different search term or filter.</p></div>`;
      return;
    }

    let html = '<div class="timeline">';
    let currentGroup = null;
    const groups = [];
    filtered.forEach((e, idx)=>{
      const dk = e.date ? dayKey(e.date) : 'unknown';
      if(!currentGroup || currentGroup.dk !== dk){
        currentGroup = {dk, label: e.date ? formatDayLabel(e.date) : 'Unknown date', items: []};
        groups.push(currentGroup);
      }
      currentGroup.items.push({e, idx});
    });

    groups.forEach(group=>{
      html += `<div class="day-group">
        <button type="button" class="date-marker" data-daykey="${esc(group.dk)}">
          <span class="date-marker-chevron">▾</span>
          <span class="date-marker-label">${esc(group.label)}</span>
          <span class="date-marker-count">${group.items.length}</span>
        </button>
        <div class="day-entries">`;
      group.items.forEach(({e, idx})=>{
        const isFailed = e.status === 'failed';
        const timeLabel = e.date ? formatTime(e.date) : '—';
        const ccLine = (e.cc && e.cc.length) ? `<br><b>Cc</b> ${esc(e.cc.join(', '))}` : '';
        const attachmentsHtml = (e.attachmentNames && e.attachmentNames.length)
          ? `<div class="letter-attachments">${e.attachmentNames.map(n=>`<span class="attachment-tag">📎 ${esc(n)}</span>`).join('')}</div>`
          : '';
        const bodyText = e.body || '(no message body)';
        const isLong = bodyText.length > 480;
        const bodyId = `letterBody${idx}`;
        const toAddr = e.to || '';
        const threadBadge = e.threadTotal ? `<span class="thread-badge">${e.threadPosition} of ${e.threadTotal} in this thread</span>` : '';
        const statusIcon = isFailed
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
        const replyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17l-5-5 5-5"/><path d="M4 12h11a4 4 0 0 1 4 4v1"/></svg>';
        const forwardIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"/><path d="M20 12H9a4 4 0 0 0-4 4v1"/></svg>';
        const resendIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>';
        const downloadIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
        html += `<div class="entry">
          <span class="entry-pip ${isFailed?'failed':'sent'}"></span>
          <div class="letter" tabindex="-1">
            <div class="letter-head">
              <h3 class="letter-subject serif">${highlightText(e.subject || '(no subject)', query)}</h3>
              <span class="postmark ${isFailed?'failed':'sent'}">${statusIcon}${isFailed?'Failed':'Sent'}</span>
            </div>
            ${threadBadge}
            <div class="letter-meta">
              <b>To</b> ${esc(toAddr)}<span class="copy-icon" data-copy="${esc(toAddr)}" title="Copy email">⧉</span>${ccLine}<br>
              <b>From</b> ${esc(e.sentByName || '')}${e.fromEmail ? ' ('+esc(e.fromEmail)+')' : ''} · ${esc(timeLabel)}
            </div>
            <div class="letter-body ${isLong?'clamped':''}" id="${bodyId}">${highlightText(bodyText, query)}</div>
            ${isLong ? `<button type="button" class="expand-btn" data-target="${bodyId}">Show full email</button>` : ''}
            ${attachmentsHtml}
            <div class="letter-actions">
              <button type="button" class="letter-action-btn" data-action="reply" data-idx="${idx}">${replyIcon} Reply</button>
              <button type="button" class="letter-action-btn" data-action="forward" data-idx="${idx}">${forwardIcon} Forward</button>
              ${isFailed ? `<button type="button" class="letter-action-btn resend" data-action="resend" data-idx="${idx}">${resendIcon} Resend</button>` : ''}
              <button type="button" class="letter-action-btn" data-action="download" data-idx="${idx}">${downloadIcon} Download</button>
            </div>
          </div>
        </div>`;
      });
      html += `</div></div>`;
    });
    html += '</div>';
    list.innerHTML = html;

    list.querySelectorAll('.date-marker').forEach(marker=>{
      marker.addEventListener('click', ()=>{
        marker.closest('.day-group').classList.toggle('collapsed');
      });
    });

    list.querySelectorAll('.copy-icon').forEach(icon=>{
      icon.addEventListener('click', ()=> copyText(icon.dataset.copy, 'Email'));
    });

    list.querySelectorAll('.expand-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const target = document.getElementById(btn.dataset.target);
        const collapsing = !target.classList.contains('clamped');
        target.classList.toggle('clamped');
        btn.textContent = collapsing ? 'Show full email' : 'Show less';
      });
    });

    list.querySelectorAll('.letter-action-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const email = lastFilteredList[Number(btn.dataset.idx)];
        if(!email) return;
        if(btn.dataset.action === 'reply') startReply(email);
        else if(btn.dataset.action === 'forward') startForward(email);
        else if(btn.dataset.action === 'resend') resendEmail(email, btn);
        else if(btn.dataset.action === 'download') downloadEmailAsEml(email);
      });
    });
  }

  // Reply/Forward need the real compose window (rich text, attachments,
  // signature) which only exists on dashboard.html — so we stash what to
  // prefill and hand off there, instead of rebuilding that editor here.
  function goToComposeWithPrefill(prefill){
    try{
      sessionStorage.setItem('palatrack_compose_prefill', JSON.stringify(prefill));
    }catch(e){
      showToast('Could not prepare that — please try again.', true);
      return;
    }
    location.href = `dashboard.html?board=${encodeURIComponent(boardId)}&lead=${encodeURIComponent(leadId)}&composePrefill=1`;
  }

  function startReply(email){
    const whenWho = `${email.sentByName || 'They'} on ${email.date ? formatDayLabel(email.date) : 'an earlier date'}`;
    const quoteHeader = `On ${whenWho} wrote:`;
    const bodyHtml = '<br><br>' + esc(quoteHeader) + '<br>' + quotePrefixedHtml(email.body || '');
    const subject = /^re:/i.test(email.subject || '') ? email.subject : `Re: ${email.subject || ''}`;
    const prefill = {
      subject, bodyHtml,
      to: email.to || '',
      cc: (email.cc && email.cc.length) ? email.cc.join(', ') : ''
    };
    if(email.attachmentNames && email.attachmentNames.length){
      prefill.attachmentNote = "Heads up: the original attachments can't be carried over automatically — you'll need to re-attach them if you want to include them again.";
    }
    goToComposeWithPrefill(prefill);
  }

  function startForward(email){
    const headerBlock = [
      '---------- Forwarded message ---------',
      `From: ${email.sentByName || ''}${email.fromEmail ? ' <'+email.fromEmail+'>' : ''}`,
      `Date: ${email.date ? formatDayLabel(email.date) : ''}`,
      `Subject: ${email.subject || ''}`,
      `To: ${email.to || ''}`
    ].join('\n');
    const bodyHtml = '<br><br>' + plainTextToHtml(headerBlock) + '<br><br>' + plainTextToHtml(email.body || '');
    const subject = /^fwd:/i.test(email.subject || '') ? email.subject : `Fwd: ${email.subject || ''}`;
    const prefill = { subject, bodyHtml, to: '' };
    if(email.attachmentNames && email.attachmentNames.length){
      prefill.attachmentNote = "Heads up: the original attachments can't be carried over automatically — you'll need to re-attach them if you want to forward them too.";
    }
    goToComposeWithPrefill(prefill);
  }

  function resendEmail(email, btn){
    if(!sendLeadEmailFn || !currentWorkspaceId){
      showToast('Not ready to send yet — please try again in a moment.', true);
      return;
    }
    btn.disabled = true;
    const originalLabel = btn.innerHTML;
    btn.textContent = 'Resending...';
    sendLeadEmailFn({
      workspaceId: currentWorkspaceId,
      boardId,
      leadId,
      to: email.to,
      cc: email.cc || [],
      subject: email.subject,
      body: email.body || ''
    }).then(()=>{
      showToast('Resent!');
      // Reflect the fresh attempt without a full page reload.
      const leadRef = db.doc(`workspaces/${currentWorkspaceId}/boards/${boardId}/leads/${leadId}`);
      leadRef.collection('emails').orderBy('sentAt', 'desc').limit(1).get().then(snap=>{
        if(snap.empty) return;
        const doc = snap.docs[0].data();
        allEmails.unshift({
          subject: doc.subject, to: doc.to, cc: doc.cc, sentByName: doc.sentByName,
          fromEmail: doc.fromEmail, status: doc.status, body: doc.body,
          attachmentNames: doc.attachmentNames,
          date: (doc.sentAt && typeof doc.sentAt.toDate === 'function') ? doc.sentAt.toDate() : new Date()
        });
        renderTimeline();
      });
    }).catch(err=>{
      console.error(err);
      showToast('Could not resend: ' + (err.message || 'please try again.'), true);
      btn.disabled = false;
      btn.innerHTML = originalLabel;
    });
  }

  // Saves one email as a standard .eml file — the same format Outlook,
  // Apple Mail, and Gmail's own import all understand, so it opens as a
  // real email elsewhere, not just a text dump.
  function emlHeaderEncode(text){
    // Wraps non-ASCII header text (subject, names) per RFC 2047, the same
    // way real mail servers do, so accented characters etc. survive.
    return /^[\x00-\x7F]*$/.test(text) ? text : `=?UTF-8?B?${btoa(unescape(encodeURIComponent(text)))}?=`;
  }
  function downloadEmailAsEml(email){
    const fromName = email.sentByName || 'PalaTrack';
    const fromAddr = email.fromEmail || 'no-reply@palatrack.com';
    const dateStr = email.date ? email.date.toUTCString() : new Date().toUTCString();
    const lines = [
      `From: ${emlHeaderEncode(fromName)} <${fromAddr}>`,
      `To: ${email.to || ''}`,
    ];
    if(email.cc && email.cc.length) lines.push(`Cc: ${email.cc.join(', ')}`);
    lines.push(
      `Subject: ${emlHeaderEncode(email.subject || '(no subject)')}`,
      `Date: ${dateStr}`,
      'MIME-Version: 1.0',
      'Content-Type: text/plain; charset="UTF-8"',
      '',
      email.body || ''
    );
    const blob = new Blob([lines.join('\r\n')], {type: 'message/rfc822'});
    const url = URL.createObjectURL(blob);
    const safeName = (email.subject || 'email').replace(/[^a-z0-9\-_ ]/gi, '').trim().slice(0, 60) || 'email';
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safeName}.eml`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Downloaded!');
  }

  document.getElementById('searchInput').addEventListener('input', renderTimeline);
  document.querySelectorAll('.status-chip[data-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeStatusFilter = chip.dataset.filter;
      document.querySelectorAll('.status-chip[data-filter]').forEach(c=>c.classList.toggle('active', c===chip));
      renderTimeline();
    });
  });

  function loadHistory(workspaceId, user){
    if(!boardId || !leadId){
      document.getElementById('historyList').innerHTML = `<div class="empty-state"><h3>Missing link details</h3><p>This page needs a board and lead to be specified in the link.</p></div>`;
      return;
    }
    const leadRef = db.doc(`workspaces/${workspaceId}/boards/${boardId}/leads/${leadId}`);
    leadRef.get().then(leadDoc=>{
      if(!leadDoc.exists){
        document.getElementById('headerLeadName').textContent = 'Lead not found';
        return;
      }
      const lead = leadDoc.data();
      document.getElementById('headerLeadName').textContent = lead.name || 'Unnamed lead';
      document.getElementById('headerLeadCompany').textContent = lead.company || '';
      document.title = `${lead.name || 'Lead'} — Correspondence Log · PalaTrack`;
    }).catch(()=>{});

    // The crest shows the signed-in user's own photo — a letterhead carries
    // the sender's mark, not the recipient's.
    db.doc(`workspaces/${workspaceId}/members/${user.uid}`).get().then(memberDoc=>{
      const crest = document.getElementById('leadCrest');
      const data = memberDoc.exists ? memberDoc.data() : {};
      if(data.photoURL){
        crest.innerHTML = `<img src="${data.photoURL}" alt="">`;
      } else {
        crest.textContent = initials(data.name || user.email);
      }
    }).catch(()=>{
      document.getElementById('leadCrest').textContent = initials(user.email);
    });

    leadRef.collection('emails').orderBy('sentAt', 'desc').limit(200).get().then(snap=>{
      if(snap.empty){
        renderTimeline();
        return;
      }
      allEmails = snap.docs.map(doc=>{
        const e = doc.data();
        return {
          subject: e.subject, to: e.to, cc: e.cc, sentByName: e.sentByName,
          fromEmail: e.fromEmail, status: e.status, body: e.body,
          attachmentNames: e.attachmentNames,
          date: (e.sentAt && typeof e.sentAt.toDate === 'function') ? e.sentAt.toDate() : null
        };
      });
      const sentCount = allEmails.filter(e=>e.status !== 'failed').length;
      const failedCount = allEmails.filter(e=>e.status === 'failed').length;
      const dated = allEmails.filter(e=>e.date);
      document.getElementById('factRow').style.display = '';
      document.getElementById('toolbar').style.display = '';
      document.getElementById('factSent').textContent = sentCount;
      document.getElementById('factFailed').textContent = failedCount;
      if(dated.length){
        document.getElementById('factFirst').textContent = formatShortDate(dated[dated.length-1].date);
        document.getElementById('factLast').textContent = formatShortDate(dated[0].date);
      }
      computeThreadInfo();
      updateFilterChipCounts(sentCount, failedCount);
      renderFrequencySparkline();
      renderTimeline();
    }).catch(err=>{
      console.error(err);
      document.getElementById('historyList').innerHTML = `<div class="empty-state"><h3>Could not load history</h3><p>Please try again.</p></div>`;
    });
  }

  const backToTopBtn = document.getElementById('backToTopBtn');
  window.addEventListener('scroll', ()=>{
    backToTopBtn.classList.toggle('show', window.scrollY > 500);
  }, {passive:true});
  backToTopBtn.addEventListener('click', ()=>{
    window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  });

  document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
    window.print();
  });

  // ---------- Share link ----------
  const shareModalOverlay = document.getElementById('shareModalOverlay');
  const shareModalBody = document.getElementById('shareModalBody');

  function buildShareUrl(token){
    return `${location.origin}${location.pathname.replace('email-history.html', 'shared-history.html')}?token=${encodeURIComponent(token)}`;
  }
  function randomToken(){
    if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID().replace(/-/g, '');
    return Array.from({length:32}, ()=>Math.floor(Math.random()*16).toString(16)).join('');
  }
  function renderShareModalLink(token){
    const url = buildShareUrl(token);
    shareModalBody.innerHTML = `
      <div class="share-link-row">
        <input type="text" id="shareLinkInput" readonly value="${esc(url)}">
        <button type="button" class="share-modal-btn primary" id="shareCopyBtn">Copy</button>
      </div>
      <button type="button" class="share-modal-btn danger" id="shareRevokeBtn">Revoke this link</button>
    `;
    document.getElementById('shareCopyBtn').addEventListener('click', ()=>{
      copyText(url, 'Link');
    });
    document.getElementById('shareRevokeBtn').addEventListener('click', ()=>{
      db.doc(`shareLinks/${token}`).update({revoked: true}).then(()=>{
        showToast('Share link revoked.');
        shareModalOverlay.classList.remove('open');
      }).catch(err=>{
        console.error(err);
        showToast('Could not revoke that link.', true);
      });
    });
  }

  document.getElementById('shareLinkBtn').addEventListener('click', ()=>{
    if(!currentWorkspaceId){
      showToast('Not ready yet — please try again in a moment.', true);
      return;
    }
    shareModalBody.innerHTML = `<div class="share-modal-loading">Preparing link...</div>`;
    shareModalOverlay.classList.add('open');
    db.collection('shareLinks')
      .where('workspaceId', '==', currentWorkspaceId)
      .where('boardId', '==', boardId)
      .where('leadId', '==', leadId)
      .where('revoked', '==', false)
      .limit(1).get().then(snap=>{
        if(!snap.empty){
          renderShareModalLink(snap.docs[0].id);
          return;
        }
        const token = randomToken();
        db.doc(`shareLinks/${token}`).set({
          workspaceId: currentWorkspaceId, boardId, leadId,
          createdBy: auth.currentUser.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          revoked: false
        }).then(()=>{
          renderShareModalLink(token);
        }).catch(err=>{
          console.error(err);
          shareModalBody.innerHTML = `<p style="color:var(--fail)">Could not create a share link. Please try again.</p>`;
        });
      }).catch(err=>{
        console.error(err);
        shareModalBody.innerHTML = `<p style="color:var(--fail)">Could not create a share link. Please try again.</p>`;
      });
  });
  document.getElementById('shareModalCloseBtn').addEventListener('click', ()=>{
    shareModalOverlay.classList.remove('open');
  });
  shareModalOverlay.addEventListener('click', (e)=>{
    if(e.target === shareModalOverlay) shareModalOverlay.classList.remove('open');
  });

  auth.onAuthStateChanged(user=>{
    document.getElementById('pageLoader').style.display = 'none';
    if(!user){
      location.href = 'boards.html';
      return;
    }
    const appRoot = document.getElementById('appRoot');
    appRoot.style.display = 'block';
    appRoot.classList.add('reveal');
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const workspaceId = doc.exists ? doc.data().workspaceId : null;
      if(!workspaceId){
        showToast('Could not find your workspace.', true);
        return;
      }
      loadHistory(workspaceId, user);
      currentWorkspaceId = workspaceId;
    }).catch(err=>{
      console.error(err);
      showToast('Could not load your workspace.', true);
    });
  });
})();
</script>
</body>
</html>
