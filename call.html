  // a published call page: palatrack.com/call?p=<link name>

      firebase.initializeApp({apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM", authDomain: "lead-tracker-c5c3a.firebaseapp.com", projectId: "lead-tracker-c5c3a",

    } catch(e){ /* already started */ }
    firebase.firestore().doc('publicCallPages/' + slug).get().then(function(d){
      if(!d.exists || !d.data().page){ state('Page not found', 'This page doesn’t exist or isn’t published anymore.'); return; }
