<!DOCTYPE html>
<html lang="en">
<head>
<script>/* clean addresses: palatrack.com/dashboard instead of /dashboard.html */(function(){try{var p=location.pathname;if(/\.html$/i.test(p)&&location.protocol!=='file:'){var c=p.replace(/(^|\/)index\.html$/i,'$1').replace(/\.html$/i,'');history.replaceState(history.state,'',c+location.search+location.hash);}}catch(e){}})();</script>
<script src="smooth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your Call Is Confirmed</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png"><link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png"><link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0A0B0E;}
  #cpRoot{min-height:100vh;}
  .cp-state{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:Montserrat,system-ui,sans-serif;color:#A7ADB8;background:#0A0B0E}
  .cp-state b{color:#fff;font-size:22px}
  .cp-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .cp-made{display:block;text-align:center;padding:22px 16px 30px;font:500 12.5px Montserrat,system-ui,sans-serif;color:#6B7280;text-decoration:none;background:inherit}
  .cp-made:hover{color:#9CA3AF}
</style>
</head>
<body>
<div id="cpRoot"><div class="cp-state"><div class="cp-spin"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="callpage.js"></script>
<script>
  // a published call page: palatrack.com/call?p=<link name>
  (function(){
    var root = document.getElementById('cpRoot');
    function state(title, text){ root.className = ''; root.innerHTML = '<div class="cp-state"><b>' + title + '</b><span>' + text + '</span></div>'; }
    var slug = (new URLSearchParams(location.search).get('p') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
    if(!slug){ state('Page not found', 'This link is incomplete. Please check the link you received.'); return; }
    try {
      firebase.initializeApp({apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM", authDomain: "lead-tracker-c5c3a.firebaseapp.com", projectId: "lead-tracker-c5c3a",
        storageBucket: "lead-tracker-c5c3a.firebasestorage.app", messagingSenderId: "720572896285", appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"});
    } catch(e){ /* already started */ }
    firebase.firestore().doc('publicCallPages/' + slug).get().then(function(d){
      if(!d.exists || !d.data().page){ state('Page not found', 'This page doesn’t exist or isn’t published anymore.'); return; }
      var page = d.data().page;
      CallPage.render(page, root);
      document.body.style.background = getComputedStyle(root).backgroundColor;
      var t = (page.hero && page.hero.title) ? CallPage.plain(page.hero.title) : 'Your Call Is Confirmed'; document.title = t.replace(/\s+/g, ' ').trim();
      var made = document.createElement('a'); made.className = 'cp-made'; made.href = 'https://www.palatrack.com/'; made.target = '_blank'; made.rel = 'noopener'; made.textContent = 'Made with PalaTrack';
      root.after(made);
    }).catch(function(e){ if(e && e.code === 'permission-denied') state('This page is currently unavailable', 'Please contact the person who sent you this link.'); else state('Something went wrong', 'Please check your connection and refresh the page.'); });
  })();
</script>
</body>
</html>
