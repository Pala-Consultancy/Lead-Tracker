<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATRACK - Email Sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#1C5B9E; --teal-deep:#0F3E72;
    --success:#1F6F5C; --success-soft:#DCEEE8;
    --fail:#B43B32; --fail-soft:#FAE1DE;
    --amber:#C97C00;
    --shadow: 0 1px 2px rgba(16,32,55,0.05), 0 8px 20px -8px rgba(16,32,55,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #appRoot{display:none;height:100vh;flex-direction:row;}
  .seq-sidebar{
    width:200px;flex-shrink:0;height:100%;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;
  }
  .seq-sidebar-logo{
    width:34px;height:34px;border-radius:10px;overflow:hidden;
    margin-bottom:20px;box-shadow:0 3px 8px rgba(28,91,158,0.28);
  }
  .seq-sidebar-user{display:flex;align-items:center;gap:9px;padding:6px 8px;margin-bottom:22px;}
  .seq-sidebar-avatar{
    width:30px;height:30px;border-radius:50%;background:var(--panel-alt);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0;
  }
  .seq-sidebar-user span{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seq-sidebar-nav{display:flex;flex-direction:column;gap:2px;}
  .seq-sidebar-link{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
    text-decoration:none;color:var(--slate);font-size:13px;font-weight:600;transition:background .12s, color .12s;
  }
  .seq-sidebar-link .icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
  .seq-sidebar-link:hover{background:var(--panel-alt);color:var(--ink);}
  .seq-sidebar-link.active{background:var(--panel-alt);color:var(--teal);}
  .seq-sidebar-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}

  .seq-main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;}
  .seq-header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;
    box-shadow:0 1px 0 rgba(16,32,55,0.03);
  }
  .seq-header-left{display:flex;align-items:center;gap:14px;}
  .back-link{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:none;transition:color .12s, transform .12s;}
  .back-link:hover{color:var(--teal);transform:translateX(-2px);}
  .seq-lead-avatar{
    width:38px;height:38px;border-radius:50%;flex-shrink:0;color:#fff;font-size:13.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    box-shadow:0 3px 8px rgba(28,91,158,0.28);
  }
  .seq-lead-name{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;}
  .seq-lead-email{font-size:12px;color:var(--slate);}
  .seq-step-pill{
    font-size:11px;font-weight:700;color:var(--teal);background:var(--panel-alt);
    border:1px solid var(--border-soft);border-radius:20px;padding:3px 10px;margin-left:8px;
  }
  .seq-start-btn{
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));color:#fff;border:none;border-radius:10px;padding:11px 22px;
    font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
    box-shadow:0 4px 14px rgba(28,91,158,0.32);transition:transform .12s ease, box-shadow .12s ease;
  }
  .seq-start-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(28,91,158,0.4);}
  .seq-start-btn:active{transform:translateY(0) scale(.98);}
  .seq-start-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
  .seq-secondary-btn{
    background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:10px 18px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .12s;
  }
  .seq-secondary-btn:hover{border-color:var(--teal);color:var(--teal);}
  .seq-secondary-btn.danger:hover{border-color:var(--fail);color:var(--fail);background:var(--fail-soft);}
  .seq-secondary-btn.warn{background:var(--amber-soft);border-color:var(--amber-soft);color:var(--amber);}
  .seq-secondary-btn:disabled{opacity:.5;cursor:default;}

  .seq-node[draggable="true"]{cursor:grab;}
  .seq-node.dragging{opacity:.4;}
  .seq-node.drag-over{border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,91,158,0.18);}
  @keyframes seqSavedFlash{0%{box-shadow:0 0 0 4px rgba(31,111,92,0.35);border-color:var(--success);}100%{box-shadow:var(--shadow);border-color:var(--border);}}
  .seq-node.just-saved{animation:seqSavedFlash .9s ease;}
  .seq-node-handle{color:var(--slate-light);font-size:15px;cursor:grab;flex-shrink:0;line-height:1;letter-spacing:-2px;}
  .seq-node-handle:active{cursor:grabbing;}
  .seq-start-btn.launching{animation:seqPulse 1s ease-in-out infinite;}
  @keyframes seqPulse{0%,100%{box-shadow:0 4px 14px rgba(28,91,158,0.32);}50%{box-shadow:0 4px 22px rgba(28,91,158,0.6);}}

  .seq-canvas-wrap{flex:1;position:relative;overflow:auto;}
  .seq-canvas-wrap.grabbing{cursor:grabbing;user-select:none;}
  .seq-canvas{
    min-height:100%;min-width:100%;padding:60px 40px 140px;
    background-image:radial-gradient(circle, #C9D8EA 1.4px, transparent 1.4px);
    background-size:22px 22px;
    display:flex;flex-direction:column;align-items:center;cursor:grab;
    transform-origin:top center;transition:transform .18s ease;
  }

  .seq-zoom-controls{
    position:absolute;right:18px;top:18px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:5;
  }
  .seq-zoom-controls button{
    width:34px;height:34px;border:none;background:none;cursor:pointer;font-size:16px;color:var(--slate);
    border-bottom:1px solid var(--border-soft);transition:background .1s, color .1s;
  }
  .seq-zoom-controls button:last-child{border-bottom:none;}
  .seq-zoom-controls button:hover{background:var(--panel-alt);color:var(--teal);}

  @keyframes seqNodeIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .seq-node{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
    padding:13px 17px;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:250px;
    transition:border-color .15s, box-shadow .15s, transform .15s;
    animation:seqNodeIn .35s cubic-bezier(.2,.8,.3,1) both;
  }
  .seq-node:hover{border-color:var(--teal);box-shadow:0 4px 18px -4px rgba(28,91,158,0.3);transform:translateY(-2px);}
  .seq-node-icon{
    width:36px;height:36px;border-radius:50%;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    box-shadow:0 2px 8px rgba(28,91,158,0.3);
  }
  .seq-node-body{flex:1;min-width:0;}
  .seq-node-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .seq-node-subject{font-size:11.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
  .seq-node-edit{background:none;border:none;color:var(--slate-light);cursor:pointer;font-size:14px;flex-shrink:0;transition:color .12s, transform .12s;}
  .seq-node-edit:hover{color:var(--teal);transform:scale(1.15);}

  @keyframes seqFlow{to{background-position:0 -16px;}}
  .seq-connector{
    width:2px;height:30px;
    background-image:linear-gradient(var(--teal) 45%, transparent 0%);
    background-size:2px 8px;background-repeat:repeat-y;
    animation:seqFlow 1.1s linear infinite;
    opacity:.55;
  }

  @keyframes seqChipIn{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
  .seq-delay-chip{
    display:flex;align-items:center;gap:7px;background:linear-gradient(135deg, var(--panel-alt), #EAF2FB);
    border:1px solid var(--border);border-radius:20px;padding:7px 15px;font-size:12.5px;font-weight:700;color:var(--teal);
    box-shadow:0 2px 6px rgba(28,91,158,0.08);animation:seqChipIn .3s ease both;
  }
  .seq-delay-chip input{width:36px;border:none;background:none;font:inherit;font-weight:700;color:var(--teal);text-align:center;padding:0;}

  .seq-condition-node{
    display:flex;align-items:center;gap:8px;background:#EFE9FE;border:1px solid #D9CBFB;color:#6D4FD1;
    border-radius:20px;padding:8px 16px;font-size:12.5px;font-weight:700;animation:seqChipIn .3s ease both;
    box-shadow:0 2px 6px rgba(109,79,209,0.12);
  }
  .seq-condition-node .icon{font-size:14px;}

  .seq-branches{display:flex;gap:70px;margin-top:0;align-items:flex-start;position:relative;}
  .seq-branches::before{
    content:"";position:absolute;top:-30px;left:50%;transform:translateX(-50%);
    width:calc(100% - 40px);height:30px;border-top:2px dotted var(--border);
  }
  .seq-branch{display:flex;flex-direction:column;align-items:center;position:relative;animation:seqNodeIn .35s cubic-bezier(.2,.8,.3,1) both;}
  .seq-branch::before{content:"";width:2px;height:20px;background-image:linear-gradient(var(--border) 40%, transparent 0%);background-size:2px 8px;background-repeat:repeat-y;margin-bottom:4px;}
  .seq-branch-label{font-size:12.5px;font-weight:700;margin-bottom:11px;white-space:nowrap;}
  .seq-branch-label.replied{color:var(--success);}
  .seq-branch-label.noreply{color:var(--fail);}
  .seq-branch-end{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
    padding:13px 17px;display:flex;align-items:center;gap:12px;min-width:200px;
  }
  .seq-branch-end-icon{
    width:36px;height:36px;border-radius:50%;background:var(--border-soft);color:var(--slate);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  }
  .seq-branch-end-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .seq-branch-end-sub{font-size:11px;color:var(--slate);}
  .seq-add-end-row{display:flex;gap:8px;margin-top:4px;animation:seqNodeIn .35s cubic-bezier(.2,.8,.3,1) both;}
  .seq-add-btn, .seq-end-btn{
    display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    border:1.5px dashed var(--border);border-radius:11px;padding:11px 18px;cursor:pointer;
    background:var(--panel);color:var(--ink);font-family:'Inter',sans-serif;transition:all .15s;
  }
  .seq-add-btn:hover{border-color:var(--teal);border-style:solid;color:var(--teal);background:var(--panel-alt);transform:translateY(-1px);}
  .seq-end-btn:hover{border-color:var(--fail);color:var(--fail);}

  .seq-branch-column{display:flex;flex-direction:column;align-items:center;}

  /* ---------- Edit panel ---------- */
  .seq-panel-overlay{
    position:fixed;inset:0;background:rgba(16,32,55,0.4);z-index:200;
    display:flex;align-items:stretch;justify-content:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s ease, visibility 0s linear .2s;
  }
  .seq-panel-overlay.open{opacity:1;visibility:visible;transition:opacity .2s ease;}
  .seq-panel{
    width:420px;max-width:92vw;background:var(--panel);height:100%;box-shadow:-14px 0 40px rgba(16,32,55,0.18);
    overflow-y:auto;display:flex;flex-direction:column;
    transform:translateX(24px);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.3,1), opacity .18s ease;
  }
  .seq-panel-overlay.open .seq-panel{transform:translateX(0);opacity:1;}
  .seq-panel-head{
    display:flex;align-items:flex-start;gap:12px;padding:24px 24px 18px;
    background:linear-gradient(180deg, var(--panel-alt), var(--panel));border-bottom:1px solid var(--border-soft);
  }
  .seq-panel-head-icon{
    width:38px;height:38px;border-radius:50%;background:var(--teal);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:17px;
  }
  .seq-panel-head h3{margin:0 0 3px;font-family:'Sora',sans-serif;font-size:17px;}
  .seq-panel-head p{margin:0;font-size:12px;color:var(--slate);line-height:1.4;}
  .seq-panel-close{
    margin-left:auto;background:none;border:none;font-size:20px;line-height:1;color:var(--slate-light);
    cursor:pointer;padding:2px 4px;flex-shrink:0;
  }
  .seq-panel-close:hover{color:var(--ink);}
  .seq-panel-body{padding:20px 24px;display:flex;flex-direction:column;gap:16px;flex:1;}
  .seq-panel label{font-size:11.5px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .seq-panel label .seq-char-count{font-weight:600;text-transform:none;letter-spacing:0;color:var(--slate-light);font-size:11px;}
  .seq-panel input[type="text"], .seq-panel textarea, .seq-panel input[type="number"]{
    width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;font:inherit;font-size:13.5px;
    transition:border-color .12s, box-shadow .12s;
  }
  .seq-panel input:focus, .seq-panel textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,91,158,0.12);}
  .seq-panel textarea{min-height:150px;resize:vertical;font-family:inherit;line-height:1.55;}

  .seq-unit-toggle{display:flex;gap:8px;align-items:center;}
  .seq-unit-toggle input[type="number"]{width:76px;flex-shrink:0;}
  .seq-unit-chips{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .seq-unit-chip{
    padding:10px 14px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--slate);
    border:none;border-right:1px solid var(--border);font-family:'Inter',sans-serif;
  }
  .seq-unit-chip:last-child{border-right:none;}
  .seq-unit-chip.active{background:var(--teal);color:#fff;}

  .seq-var-row{display:flex;flex-wrap:wrap;gap:7px;}
  .seq-var-chip{
    font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:16px;
    border:1px solid var(--border);background:var(--panel-alt);color:var(--teal);cursor:pointer;
    font-family:'Inter',sans-serif;transition:all .12s;
  }
  .seq-var-chip:hover{background:var(--teal);color:#fff;border-color:var(--teal);transform:translateY(-1px);}
  .seq-var-chip:active{transform:scale(.95);}

  .seq-timing-preview{
    display:flex;align-items:center;gap:9px;background:var(--panel-alt);border:1px solid var(--border-soft);
    border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--slate);
  }
  .seq-timing-preview b{color:var(--teal);font-weight:700;}

  .seq-panel-actions{
    display:flex;justify-content:space-between;gap:10px;padding:16px 24px 22px;
    border-top:1px solid var(--border-soft);background:var(--panel-alt);
  }
  .seq-panel-btn{padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--panel);font-family:'Inter',sans-serif;transition:transform .1s ease;}
  .seq-panel-btn:active{transform:scale(.96);}
  .seq-panel-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .seq-panel-btn.primary:hover{background:var(--teal-deep);}
  .seq-panel-btn.danger{color:var(--fail);border-color:var(--fail);}
  .seq-panel-btn.danger:hover{background:var(--fail-soft);}

  .toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const sendLeadEmailFn = firebase.functions().httpsCallable('sendLeadEmail');
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

  function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function initials(name){
    const parts = (name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }
  function showToast(message, danger){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast' + (danger ? ' danger' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'opacity .2s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 200);
    }, 3200);
  }

  const params = new URLSearchParams(location.search);
  const boardId = params.get('board');
  const leadId = params.get('lead');
  const sequenceIdParam = params.get('sequenceId');
  // 'create' = building a brand new sequence, nothing saved yet.
  // 'draft'  = editing a previously-saved-but-not-started sequence.
  // 'view'   = looking at a sequence that's already active/paused/done —
  //            read-only content, but Pause/Resume/Delete controls apply.
  let pageMode = sequenceIdParam ? null : 'create'; // null = "not yet determined, fetching"
  let currentSequenceDocId = sequenceIdParam || null;
  let currentSequenceStatus = null;
  let viewSteps = []; // populated in view mode from existing scheduledEmails docs
  document.getElementById('backBtn').href = boardId ? `dashboard.html?board=${encodeURIComponent(boardId)}` : 'boards.html';
  const boardQS = boardId ? `?board=${encodeURIComponent(boardId)}` : '';
  document.getElementById('navDashboard').href = `dashboard.html${boardQS}`;
  document.getElementById('navSequences').href = `sequences.html${boardQS}`;
  document.getElementById('navScheduled').href = `scheduled-emails.html${boardQS}`;
  document.getElementById('navTrash').href = `trash.html${boardQS}`;

  let currentWorkspaceId = null;
  let leadData = null;
  const MAX_STEPS = 5;
  // steps[0] = {subject, body} (sends immediately). steps[1..] additionally
  // have delayValue + delayUnit ('hours'|'days') — if no reply since the
  // previous step, wait this long before sending.
  let steps = [{subject:'', body:''}];
  let editingIndex = null;
  let zoomLevel = 1;
  let dragSrcIndex = null;

  function nodeIconFor(index){ return index === 0 ? '✉️' : '↻'; }
  function nodeTitleFor(index){ return index === 0 ? 'Send email' : `Follow-up ${index+1}`; }
  function delayMs(step){
    const unitMs = step.delayUnit === 'hours' ? 60*60*1000 : 24*60*60*1000;
    return (step.delayValue || 1) * unitMs;
  }

  function renderCanvas(){
    const canvas = document.getElementById('seqCanvas');
    let html = '';
    steps.forEach((step, i)=>{
      const isLast = i === steps.length - 1;
      const delay = `${i * 70}ms`;
      const draggable = i > 0; // step 1 (the immediate send) stays fixed as the anchor
      html += `<div class="seq-node" data-idx="${i}" style="animation-delay:${delay}" ${draggable ? 'draggable="true"' : ''}>
        ${draggable ? `<span class="seq-node-handle" title="Drag to reorder">⠿</span>` : ''}
        <div class="seq-node-icon">${nodeIconFor(i)}</div>
        <div class="seq-node-body">
          <div class="seq-node-title">${esc(nodeTitleFor(i))}</div>
          <div class="seq-node-subject">${esc(step.subject) || 'Click to write this email'}</div>
        </div>
        <button type="button" class="seq-node-edit" data-idx="${i}" title="Edit">✎</button>
      </div>`;
      if(isLast){
        html += `<div class="seq-connector"></div>
        <div class="seq-add-end-row" style="animation-delay:${delay}">
          <button type="button" class="seq-add-btn" id="seqAddStepBtn">+ Add follow-up</button>
        </div>`;
      } else {
        const next = steps[i+1];
        const unitLabel = next.delayUnit === 'hours' ? 'hrs' : 'days';
        html += `<div class="seq-connector"></div>
        <div class="seq-delay-chip" style="animation-delay:${delay}">
          🕒 <input type="number" class="seq-delay-input" data-idx="${i+1}" min="1" value="${next.delayValue || 2}"> ${unitLabel}
        </div>
        <div class="seq-connector"></div>
        <div class="seq-condition-node" style="animation-delay:${delay}"><span class="icon">✉️</span> If email replied</div>
        <div class="seq-branches">
          <div class="seq-branch" style="animation-delay:${delay}">
            <div class="seq-branch-label replied">Yes</div>
            <div class="seq-branch-end">
              <div class="seq-branch-end-icon">⊘</div>
              <div>
                <div class="seq-branch-end-title">End of sequence</div>
                <div class="seq-branch-end-sub">No more follow-ups sent</div>
              </div>
            </div>
          </div>
          <div class="seq-branch" style="animation-delay:${delay}">
            <div class="seq-branch-label noreply">No</div>
          </div>
        </div>`;
      }
    });
    canvas.innerHTML = html;
    document.getElementById('seqStepPill').textContent = `${steps.length} step${steps.length>1?'s':''}`;
    document.getElementById('seqStepPill').style.display = '';

    canvas.querySelectorAll('.seq-node, .seq-node-edit').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        openEditPanel(Number(el.dataset.idx));
      });
    });
    // ---------- Drag-and-drop reordering (follow-up steps only) ----------
    canvas.querySelectorAll('.seq-node[draggable="true"]').forEach(node=>{
      node.addEventListener('dragstart', (e)=>{
        e.stopPropagation();
        dragSrcIndex = Number(node.dataset.idx);
        node.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      node.addEventListener('dragend', ()=>{
        node.classList.remove('dragging');
        canvas.querySelectorAll('.seq-node').forEach(n=>n.classList.remove('drag-over'));
      });
      node.addEventListener('dragover', (e)=>{
        if(Number(node.dataset.idx) === 0) return; // never drop onto the fixed first step
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        node.classList.add('drag-over');
      });
      node.addEventListener('dragleave', ()=> node.classList.remove('drag-over'));
      node.addEventListener('drop', (e)=>{
        e.preventDefault();
        node.classList.remove('drag-over');
        const targetIdx = Number(node.dataset.idx);
        if(dragSrcIndex === null || targetIdx === 0 || targetIdx === dragSrcIndex) return;
        const [moved] = steps.splice(dragSrcIndex, 1);
        steps.splice(targetIdx, 0, moved);
        dragSrcIndex = null;
        renderCanvas();
      });
    });
    const addBtn = document.getElementById('seqAddStepBtn');
    if(addBtn) addBtn.addEventListener('click', ()=>{
      if(steps.length >= MAX_STEPS){ showToast(`You can add up to ${MAX_STEPS} steps.`, true); return; }
      steps.push({subject:'', body:'', delayValue:2, delayUnit:'days'});
      renderCanvas();
      openEditPanel(steps.length - 1);
    });
    canvas.querySelectorAll('.seq-delay-input').forEach(input=>{
      input.addEventListener('change', ()=>{
        const idx = Number(input.dataset.idx);
        const val = parseInt(input.value, 10);
        steps[idx].delayValue = (val && val > 0) ? val : 1;
        input.value = steps[idx].delayValue;
      });
    });
  }

  function updateSubjectCount(){
    const v = document.getElementById('seqPanelSubject').value;
    document.getElementById('seqSubjectCount').textContent = `${v.length}/150`;
  }
  function updateBodyCount(){
    const v = document.getElementById('seqPanelBody').value;
    document.getElementById('seqBodyCount').textContent = `${v.length} character${v.length===1?'':'s'}`;
  }
  function activeUnit(){
    const chip = document.querySelector('.seq-unit-chip.active');
    return chip ? chip.dataset.unit : 'days';
  }
  function updateTimingPreview(){
    if(editingIndex === null || editingIndex === 0) return;
    const delayVal = parseInt(document.getElementById('seqPanelDelay').value, 10) || 1;
    const unit = activeUnit();
    let ms = 0;
    for(let i=1; i<editingIndex; i++) ms += delayMs(steps[i]);
    ms += delayVal * (unit === 'hours' ? 60*60*1000 : 24*60*60*1000);
    const when = new Date(Date.now() + ms);
    document.getElementById('seqTimingWhen').textContent =
      when.toLocaleString(undefined, {weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  }

  function openEditPanel(index){
    editingIndex = index;
    const step = steps[index];
    document.getElementById('seqPanelIcon').textContent = nodeIconFor(index);
    document.getElementById('seqPanelTitle').textContent = nodeTitleFor(index);
    document.getElementById('seqPanelSubtitle').textContent = index === 0
      ? 'Sends right away when the sequence starts.'
      : "Only sends if this lead still hasn't replied by then.";
    document.getElementById('seqPanelSubject').value = step.subject || '';
    const bodyEl = document.getElementById('seqPanelBody');
    bodyEl.value = step.body || '';
    bodyEl.style.height = 'auto';
    bodyEl.style.height = Math.min(bodyEl.scrollHeight, 380) + 'px';
    updateSubjectCount();
    updateBodyCount();
    const delayRow = document.getElementById('seqPanelDelayRow');
    if(index === 0){
      delayRow.style.display = 'none';
    } else {
      delayRow.style.display = '';
      document.getElementById('seqPanelDelay').value = step.delayValue || 2;
      document.querySelectorAll('.seq-unit-chip').forEach(chip=>{
        chip.classList.toggle('active', chip.dataset.unit === (step.delayUnit || 'days'));
      });
      updateTimingPreview();
    }
    document.getElementById('seqPanelRemoveBtn').style.display = (index > 0) ? '' : 'none';
    document.getElementById('seqPanelOverlay').classList.add('open');
    document.getElementById('seqPanelSubject').focus();
  }
  function closeEditPanel(){
    document.getElementById('seqPanelOverlay').classList.remove('open');
    editingIndex = null;
  }
  document.getElementById('seqPanelSubject').addEventListener('input', updateSubjectCount);
  document.getElementById('seqPanelBody').addEventListener('input', (e)=>{
    updateBodyCount();
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 380) + 'px';
  });

  // ---------- Merge-tag variables ----------
  let lastFocusedField = 'body';
  document.getElementById('seqPanelSubject').addEventListener('focus', ()=>{ lastFocusedField = 'subject'; });
  document.getElementById('seqPanelBody').addEventListener('focus', ()=>{ lastFocusedField = 'body'; });
  function insertAtCursor(el, text){
    const start = el.selectionStart != null ? el.selectionStart : el.value.length;
    const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
    const val = el.value;
    el.value = val.slice(0, start) + text + val.slice(end);
    const newPos = start + text.length;
    el.focus();
    el.setSelectionRange(newPos, newPos);
    el.dispatchEvent(new Event('input', {bubbles: true}));
  }
  document.querySelectorAll('.seq-var-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const targetEl = lastFocusedField === 'subject' ? document.getElementById('seqPanelSubject') : document.getElementById('seqPanelBody');
      insertAtCursor(targetEl, chip.dataset.tag);
    });
  });

  document.getElementById('seqPanelDelay').addEventListener('input', updateTimingPreview);
  document.querySelectorAll('.seq-unit-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.seq-unit-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      updateTimingPreview();
    });
  });
  document.getElementById('seqPanelCloseX').addEventListener('click', closeEditPanel);
  document.getElementById('seqPanelCancelBtn').addEventListener('click', closeEditPanel);
  document.getElementById('seqPanelOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'seqPanelOverlay') closeEditPanel();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && document.getElementById('seqPanelOverlay').classList.contains('open')) closeEditPanel();
  });
  document.getElementById('seqPanelDoneBtn').onclick = ()=>{
    if(editingIndex === null) return;
    const subject = document.getElementById('seqPanelSubject').value.trim();
    const body = document.getElementById('seqPanelBody').value.trim();
    steps[editingIndex].subject = subject;
    steps[editingIndex].body = body;
    if(editingIndex > 0){
      const d = parseInt(document.getElementById('seqPanelDelay').value, 10);
      steps[editingIndex].delayValue = (d && d > 0) ? d : 1;
      steps[editingIndex].delayUnit = activeUnit();
    }
    const savedIndex = editingIndex;
    closeEditPanel();
    renderCanvas();
    const savedNode = document.querySelector(`.seq-node[data-idx="${savedIndex}"]`);
    if(savedNode){
      savedNode.classList.add('just-saved');
      setTimeout(()=> savedNode.classList.remove('just-saved'), 900);
    }
  };
  document.getElementById('seqPanelSubject').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('seqPanelDoneBtn').click();
  });
  document.getElementById('seqPanelRemoveBtn').addEventListener('click', ()=>{
    if(editingIndex === null || editingIndex === 0) return;
    steps.splice(editingIndex, 1);
    closeEditPanel();
    renderCanvas();
  });

  // ---------- View mode: looking at a sequence that's already running ----------
  const STATUS_META = {
    pending: {icon:'🕒', color:'var(--amber)', label:'Upcoming'},
    sending: {icon:'🕒', color:'var(--amber)', label:'Sending now'},
    sent: {icon:'✓', color:'var(--success)', label:'Sent'},
    failed: {icon:'✕', color:'var(--fail)', label:'Failed to send'},
    cancelled: {icon:'—', color:'var(--slate)', label:'Cancelled'},
    cancelled_replied: {icon:'✓', color:'var(--success)', label:'Stopped — they replied'}
  };
  function loadExistingSequence(){
    return db.collection('scheduledEmails')
      .where('sequenceId', '==', sequenceIdParam)
      .orderBy('stepNumber', 'asc')
      .get()
      .then(snap=>{
        viewSteps = snap.docs.map(doc=>({id: doc.id, ...doc.data()}));
        renderViewCanvas();
      });
  }
  function renderViewCanvas(){
    const canvas = document.getElementById('seqCanvas');
    let html = `<div class="seq-node" style="cursor:default;">
      <div class="seq-node-icon" style="background:var(--success);">✓</div>
      <div class="seq-node-body">
        <div class="seq-node-title">Send email</div>
        <div class="seq-node-subject">Sent when the sequence started — <a href="email-history.html?board=${encodeURIComponent(boardId)}&lead=${encodeURIComponent(leadId)}" style="color:var(--teal);">view in history</a></div>
      </div>
    </div>`;
    viewSteps.forEach((step, i)=>{
      const meta = STATUS_META[step.status] || {icon:'?', color:'var(--slate)', label:step.status};
      const delay = `${(i+1) * 70}ms`;
      html += `<div class="seq-connector"></div>
      <div class="seq-node" data-view-idx="${i}" style="animation-delay:${delay}">
        <div class="seq-node-icon" style="background:${meta.color};">${meta.icon}</div>
        <div class="seq-node-body">
          <div class="seq-node-title">Follow-up ${step.stepNumber} — ${esc(meta.label)}</div>
          <div class="seq-node-subject">${esc(step.subject) || '(no subject)'}</div>
        </div>
      </div>`;
    });
    canvas.innerHTML = html;
    document.getElementById('seqStepPill').textContent = `${viewSteps.length + 1} step${viewSteps.length ? 's' : ''}`;
    document.getElementById('seqStepPill').style.display = '';
    canvas.querySelectorAll('[data-view-idx]').forEach(el=>{
      el.addEventListener('click', ()=> openViewStepPanel(Number(el.dataset.viewIdx)));
    });
  }
  function openViewStepPanel(index){
    const step = viewSteps[index];
    const meta = STATUS_META[step.status] || {icon:'?', label:step.status};
    document.getElementById('seqPanelIcon').textContent = meta.icon;
    document.getElementById('seqPanelTitle').textContent = `Follow-up ${step.stepNumber}`;
    document.getElementById('seqPanelSubtitle').textContent = meta.label +
      (step.sendAt && typeof step.sendAt.toDate === 'function' ? ' · ' + step.sendAt.toDate().toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'}) : '');
    const subjectEl = document.getElementById('seqPanelSubject');
    const bodyEl = document.getElementById('seqPanelBody');
    subjectEl.value = step.subject || '';
    subjectEl.disabled = true;
    bodyEl.value = step.body || '';
    bodyEl.disabled = true;
    bodyEl.style.height = 'auto';
    bodyEl.style.height = Math.min(bodyEl.scrollHeight, 380) + 'px';
    document.getElementById('seqSubjectCount').style.display = 'none';
    document.getElementById('seqBodyCount').style.display = 'none';
    document.getElementById('seqVarRowWrap').style.display = 'none';
    document.getElementById('seqPanelDelayRow').style.display = 'none';
    document.getElementById('seqPanelRemoveBtn').style.display = 'none';
    const doneBtn = document.getElementById('seqPanelDoneBtn');
    if(step.status === 'pending'){
      doneBtn.textContent = 'Cancel this step';
      doneBtn.classList.add('danger');
      doneBtn.classList.remove('primary');
      doneBtn.onclick = ()=>{
        doneBtn.disabled = true;
        db.doc(`scheduledEmails/${step.id}`).update({status: 'cancelled'}).then(()=>{
          showToast('That step was cancelled.');
          closeEditPanel();
          loadExistingSequence();
        }).catch(err=>{
          console.error(err);
          showToast('Could not cancel that: ' + (err.message || ''), true);
          doneBtn.disabled = false;
        });
      };
    } else {
      doneBtn.textContent = 'Close';
      doneBtn.classList.remove('danger');
      doneBtn.classList.add('primary');
      doneBtn.onclick = closeEditPanel;
    }
    document.getElementById('seqPanelOverlay').classList.add('open');
  }

  // ---------- Zoom (cosmetic, matches the reference tool's controls) ----------
  function applyZoom(){
    document.getElementById('seqCanvas').style.transform = `scale(${zoomLevel})`;
    document.getElementById('seqZoomLevel').textContent = `${Math.round(zoomLevel * 100)}%`;
  }
  document.getElementById('seqZoomIn').addEventListener('click', ()=>{ zoomLevel = Math.min(1.6, zoomLevel + 0.1); applyZoom(); });
  document.getElementById('seqZoomOut').addEventListener('click', ()=>{ zoomLevel = Math.max(0.5, zoomLevel - 0.1); applyZoom(); });
  document.getElementById('seqZoomReset').addEventListener('click', ()=>{ zoomLevel = 1; applyZoom(); });

  // ---------- Click-and-drag panning ----------
  (function(){
    const wrap = document.getElementById('seqCanvasWrap') || document.querySelector('.seq-canvas-wrap');
    let dragging = false, startX = 0, startY = 0, startScrollX = 0, startScrollY = 0;
    wrap.addEventListener('mousedown', (e)=>{
      if(e.target.closest('.seq-node, .seq-delay-chip, .seq-add-btn, .seq-branch-end')) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      startScrollX = wrap.scrollLeft; startScrollY = wrap.scrollTop;
      wrap.classList.add('grabbing');
    });
    window.addEventListener('mousemove', (e)=>{
      if(!dragging) return;
      wrap.scrollLeft = startScrollX - (e.clientX - startX);
      wrap.scrollTop = startScrollY - (e.clientY - startY);
    });
    window.addEventListener('mouseup', ()=>{
      dragging = false;
      wrap.classList.remove('grabbing');
    });
  })();

  // ---------- Start sequence ----------
  function buildSequencePayload(status){
    const payload = {
      workspaceId: currentWorkspaceId, boardId, leadId,
      status, steps,
      createdBy: auth.currentUser.uid,
      createdByName: (leadData.__senderName) || (auth.currentUser && auth.currentUser.email) || 'Someone',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if(!currentSequenceDocId) payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    return payload;
  }

  document.getElementById('seqSaveDraftBtn').addEventListener('click', ()=>{
    if(!leadData || !currentWorkspaceId) return;
    const saveBtn = document.getElementById('seqSaveDraftBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    const sequenceRef = currentSequenceDocId ? db.collection('sequences').doc(currentSequenceDocId) : db.collection('sequences').doc();
    sequenceRef.set(buildSequencePayload('draft'), {merge: true}).then(()=>{
      currentSequenceDocId = sequenceRef.id;
      showToast('Saved as draft.');
      setTimeout(()=>{ location.href = boardId ? `sequences.html?board=${encodeURIComponent(boardId)}` : 'boards.html'; }, 900);
    }).catch(err=>{
      console.error(err);
      showToast('Could not save draft: ' + (err.message || 'please try again.'), true);
    }).finally(()=>{
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save as draft';
    });
  });

  document.getElementById('seqStartBtn').addEventListener('click', ()=>{
    if(!leadData || !currentWorkspaceId) return;
    for(let i=0; i<steps.length; i++){
      if(!steps[i].subject || !steps[i].body){
        showToast(`Please finish writing ${i===0 ? 'the first email' : 'step '+(i+1)} before starting.`, true);
        openEditPanel(i);
        return;
      }
    }
    const startBtn = document.getElementById('seqStartBtn');
    startBtn.disabled = true;
    startBtn.textContent = '🚀 Launching...';
    startBtn.classList.add('launching');
    const leadEmail = leadData.email;
    const sequenceRef = currentSequenceDocId ? db.collection('sequences').doc(currentSequenceDocId) : db.collection('sequences').doc();
    const sequenceId = sequenceRef.id;

    sequenceRef.set({...buildSequencePayload('active'), startedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge: true}).then(()=>{
      return sendLeadEmailFn({
        workspaceId: currentWorkspaceId, boardId, leadId,
        to: leadEmail, cc: [], subject: steps[0].subject, body: steps[0].body, htmlBody: '', attachments: []
      });
    }).then(()=>{
      if(steps.length === 1) return Promise.resolve();
      let cumulativeMs = Date.now();
      const writes = [];
      for(let i=1; i<steps.length; i++){
        cumulativeMs += delayMs(steps[i]);
        writes.push(db.collection('scheduledEmails').add({
          workspaceId: currentWorkspaceId, boardId, leadId,
          to: leadEmail, cc: [], subject: steps[i].subject, body: steps[i].body, htmlBody: '', attachments: [],
          sentBy: auth.currentUser.uid,
          sentByName: (leadData.__senderName) || (auth.currentUser && auth.currentUser.email) || 'Someone',
          status: 'pending',
          sendAt: firebase.firestore.Timestamp.fromDate(new Date(cumulativeMs)),
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          sequenceId, stepNumber: i+1, cancelIfReplied: true
        }));
      }
      return Promise.all(writes);
    }).then(()=>{
      startBtn.classList.remove('launching');
      startBtn.textContent = '✓ Sequence live';
      startBtn.style.background = 'linear-gradient(135deg, var(--success), #164F41)';
      showToast(`Sequence started — ${steps.length} email${steps.length>1?'s':''}, first one sent now.`);
      setTimeout(()=>{ location.href = boardId ? `dashboard.html?board=${encodeURIComponent(boardId)}` : 'boards.html'; }, 1200);
    }).catch(err=>{
      console.error(err);
      showToast('Could not start the sequence: ' + (err.message || 'please try again.'), true);
      startBtn.classList.remove('launching');
      startBtn.disabled = false;
      startBtn.textContent = 'Start sequence';
    });
  });

  // ---------- Pause / Resume ----------
  document.getElementById('seqPauseBtn').addEventListener('click', ()=>{
    if(!currentSequenceDocId) return;
    const btn = document.getElementById('seqPauseBtn');
    const resuming = currentSequenceStatus === 'paused';
    btn.disabled = true;
    db.collection('sequences').doc(currentSequenceDocId)
      .update({status: resuming ? 'active' : 'paused', updatedAt: firebase.firestore.FieldValue.serverTimestamp()})
      .then(()=>{
        currentSequenceStatus = resuming ? 'active' : 'paused';
        btn.textContent = resuming ? '⏸ Pause' : '▶ Resume';
        btn.classList.toggle('warn', !resuming);
        showToast(resuming ? 'Sequence resumed.' : 'Sequence paused — nothing more will send until you resume it.');
      })
      .catch(err=>{
        console.error(err);
        showToast('Could not update that: ' + (err.message || 'please try again.'), true);
      })
      .finally(()=>{ btn.disabled = false; });
  });

  // ---------- Delete sequence entirely ----------
  document.getElementById('seqDeleteBtn').addEventListener('click', ()=>{
    if(!currentSequenceDocId) return;
    if(!confirm('Delete this sequence entirely? Any emails already sent stay in the lead\'s history, but everything still scheduled will be cancelled and removed. This can\'t be undone.')) return;
    const btn = document.getElementById('seqDeleteBtn');
    btn.disabled = true;
    btn.textContent = 'Deleting...';
    db.collection('scheduledEmails').where('sequenceId', '==', currentSequenceDocId).get()
      .then(snap => Promise.all(snap.docs.map(d => d.ref.delete())))
      .then(()=> db.collection('sequences').doc(currentSequenceDocId).delete())
      .then(()=>{
        showToast('Sequence deleted.');
        setTimeout(()=>{ location.href = boardId ? `sequences.html?board=${encodeURIComponent(boardId)}` : 'boards.html'; }, 700);
      })
      .catch(err=>{
        console.error(err);
        showToast('Could not delete that: ' + (err.message || 'please try again.'), true);
        btn.disabled = false;
        btn.textContent = '🗑️ Delete sequence';
      });
  });

  function setupCreateOrDraftMode(){
    if(!leadData.email){
      showToast('This lead has no email address on file.', true);
      document.getElementById('seqStartBtn').disabled = true;
    }
    document.getElementById('seqDeleteBtn').style.display = currentSequenceDocId ? '' : 'none';
    renderCanvas();
  }
  function setupViewMode(){
    document.getElementById('seqStartBtn').style.display = 'none';
    document.getElementById('seqSaveDraftBtn').style.display = 'none';
    document.getElementById('seqDeleteBtn').style.display = '';
    const pauseBtn = document.getElementById('seqPauseBtn');
    if(currentSequenceStatus === 'active' || currentSequenceStatus === 'paused'){
      pauseBtn.style.display = '';
      const paused = currentSequenceStatus === 'paused';
      pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
      pauseBtn.classList.toggle('warn', paused);
    }
    return loadExistingSequence();
  }

  auth.onAuthStateChanged(user=>{
    document.getElementById('pageLoader').style.display = 'none';
    if(!user){
      location.href = 'boards.html';
      return;
    }
    if(!boardId || !leadId){
      document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:Inter,sans-serif;">This page needs a board and lead specified in the link.</div>';
      return;
    }
    document.getElementById('appRoot').style.display = 'flex';
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const workspaceId = doc.exists ? doc.data().workspaceId : null;
      if(!workspaceId){ showToast('Could not find your workspace.', true); return; }
      currentWorkspaceId = workspaceId;
      const lookups = [
        db.doc(`workspaces/${workspaceId}/boards/${boardId}/leads/${leadId}`).get(),
        db.doc(`workspaces/${workspaceId}/members/${user.uid}`).get()
      ];
      if(sequenceIdParam) lookups.push(db.collection('sequences').doc(sequenceIdParam).get());
      return Promise.all(lookups);
    }).then(results=>{
      if(!results) return;
      const [leadDoc, memberDoc, sequenceDoc] = results;
      if(!leadDoc.exists){
        document.getElementById('seqLeadName').textContent = 'Lead not found';
        return;
      }
      leadData = leadDoc.data();
      leadData.__senderName = memberDoc.exists ? memberDoc.data().name : null;
      const myName = leadData.__senderName || (user.email || 'You');
      document.getElementById('seqSidebarUserName').textContent = myName;
      document.getElementById('seqSidebarAvatar').textContent = initials(myName);
      document.getElementById('seqLeadName').textContent = leadData.name || 'Unnamed lead';
      document.getElementById('seqLeadAvatar').textContent = initials(leadData.name);
      document.getElementById('seqLeadEmail').textContent = leadData.email || '';
      document.title = `Email sequence for ${leadData.name || 'lead'} · PalaTrack`;

      if(sequenceIdParam){
        if(!sequenceDoc || !sequenceDoc.exists){
          showToast('That sequence could not be found — it may have been deleted.', true);
          document.getElementById('seqCanvas').innerHTML = '<div style="padding:40px;color:var(--slate);">This sequence no longer exists.</div>';
          document.getElementById('seqStartBtn').style.display = 'none';
          document.getElementById('seqSaveDraftBtn').style.display = 'none';
          return;
        }
        const seqData = sequenceDoc.data();
        currentSequenceStatus = seqData.status;
        if(seqData.status === 'draft'){
          pageMode = 'draft';
          steps = Array.isArray(seqData.steps) && seqData.steps.length ? seqData.steps : steps;
          setupCreateOrDraftMode();
        } else {
          pageMode = 'view';
          return setupViewMode();
        }
      } else {
        pageMode = 'create';
        setupCreateOrDraftMode();
      }
    }).catch(err=>{
      console.error(err);
      showToast('Could not load this lead.', true);
    });
  });
})();
</script>
</body>
</html>
