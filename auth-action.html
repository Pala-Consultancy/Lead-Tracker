<style>
  html,body{margin:0;padding:0;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#0F172A;
    background:linear-gradient(180deg,#070B1F 0%,#0E1640 55%,#1B1F5C 100%);}
  .card{position:relative;width:100%;max-width:500px;background:#fff;border-radius:26px;padding:42px 40px 34px;box-sizing:border-box;text-align:center;
    box-shadow:0 40px 100px -30px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08);}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px;font-weight:800;letter-spacing:.14em;font-size:12.5px;color:#64748B;}
  .brand img{width:34px;height:34px;border-radius:10px;}
  .card{box-shadow:0 40px 100px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.10),inset 0 1px 0 rgba(255,255,255,.9) !important;}
  .ic svg{width:28px;height:28px;}

    background:linear-gradient(135deg,#3B49C9,#6D3BDB);box-shadow:0 14px 30px -12px rgba(91,75,230,.75);}

  .ic.bad{background:linear-gradient(135deg,#E11D48,#B42318);box-shadow:0 14px 30px -12px rgba(225,29,72,.55);}

  @keyframes sp{to{transform:rotate(360deg)}}
  .small{margin-top:20px;font-size:13px;color:#64748B;} .small a{color:#3730B3;font-weight:600;}
  /* fields with show/hide, password strength, a button with an arrow and a spinner, the success check, the trust line */
  .pw{position:relative;} .pw input{padding-right:48px;}

  .wrap{position:relative;width:100%;max-width:500px;}

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
  // The page behind every account email from PalaTrack (Firebase sends people here):
  //   verifyEmail          → the email address is confirmed → into PalaTrack
  //   resetPassword        → choose a new password (typed twice) → sign in
  //   recoverEmail         → an email change is undone (the old address is back)
  //   verifyAndChangeEmail → a new email address is confirmed
  firebase.initializeApp({
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  });
  const auth = firebase.auth(), q = new URLSearchParams(location.search);
  const mode = q.get('mode'), code = q.get('oobCode') || '';
  const LOGIN = 'boards.html?login=1';
  // where to go after: only pages on this website
  const cont = (() => { try { const u = new URL(q.get('continueUrl') || '', location.origin); return u.origin === location.origin ? u.pathname + u.search : 'home.html'; } catch (e) { return 'home.html'; } })();
  const esc = (t) => String(t || '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  const brand = document.querySelector('.brand').outerHTML;
  const show = (html) => { document.getElementById('card').innerHTML = brand + html; };
  const problem = (title, text, btn) => show(`<div class="ic bad" aria-hidden="true">!</div><h1>${title}</h1><p>${text}</p>${btn || `<a class="btn pri" href="${LOGIN}">Go to sign in</a>`}`);
  const expired = (what) => problem('This link has expired', `This ${what} link is too old or has already been used. Links in these emails work once, for a limited time.`,
    what === 'password reset' ? `<a class="btn pri" href="${LOGIN}">Ask for a new link</a><p class="small">On the sign-in page, click “Forgot password?”.</p>`
      : `<a class="btn pri" href="verify-email.html">Send me a new link</a>`);

  async function verifyEmail() {
    try {
      await auth.applyActionCode(code);
      try { if (auth.currentUser) { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); } } catch (e) { /* not signed in here */ }
      show(`<div class="ic ok" aria-hidden="true">✓</div><h1>Your email is confirmed</h1><p>Thanks! Your PalaTrack account is ready to use.</p>
        <a class="btn pri" href="${esc(cont)}">Continue to PalaTrack</a>
        <p class="small">Still had PalaTrack open in another tab? It continues by itself.</p>`);
      setTimeout(() => { location.href = cont; }, 4000);
    } catch (e) { expired('confirmation'); }
  }

  async function resetPassword() {
    let email = '';
    try { email = await auth.verifyPasswordResetCode(code); } catch (e) { expired('password reset'); return; }
    show(`<div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3" fill="#fff" stroke="none"/></svg></div><h1>Choose a new password</h1><p>For <b>${esc(email)}</b></p>
      <form id="f" novalidate>
        <label for="p1">New password</label>
        <div class="pw"><input id="p1" type="password" autocomplete="new-password" minlength="6" required><button type="button" class="eye" data-eye aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="mlabel"><span>Password strength</span><b id="mword">–</b></div>
        <ul class="checks" id="checks"><li data-c="len">8+ characters</li><li data-c="num">A number</li><li data-c="up">A capital letter</li><li data-c="sym">A symbol (!?#…)</li></ul>
        <label for="p2">Confirm new password</label>
        <div class="pw"><input id="p2" type="password" autocomplete="new-password" required><button type="button" class="eye" data-eye aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="hint" id="h2"></div>
        <button class="btn pri" id="go" type="submit">Save new password<span class="arr">→</span></button>
        <div class="err" id="err"></div>
      </form>`);
    const p1 = document.getElementById('p1'), p2 = document.getElementById('p2'), h2 = document.getElementById('h2');
    const match = () => { if (!p2.value) { h2.className = 'hint'; h2.textContent = ''; return; } const ok = p1.value === p2.value;
      h2.className = 'hint ' + (ok ? 'ok' : 'bad'); h2.textContent = ok ? '✓ Passwords match' : 'Passwords don’t match yet'; };
    const meter = document.getElementById('meter'), mword = document.getElementById('mword');
    const strength = () => { const v = p1.value, c = {len: v.length >= 8, num: /\d/.test(v), up: /[A-Z]/.test(v), sym: /[^A-Za-z0-9]/.test(v)};
      document.querySelectorAll('#checks li').forEach((li) => li.classList.toggle('ok', c[li.dataset.c]));
      const n = !v ? 0 : Math.max(1, Object.values(c).filter(Boolean).length - (v.length < 6 ? 1 : 0));
      meter.className = 'meter' + (n ? ' s' + n : ''); mword.textContent = ['–', 'Weak', 'Fair', 'Good', 'Strong'][n]; };
    p1.addEventListener('input', () => { strength(); match(); }); p2.addEventListener('input', match); p1.focus();
    document.querySelectorAll('[data-eye]').forEach((b) => b.addEventListener('click', () => { const show = p1.type === 'password';
      [p1, p2].forEach((x) => { x.type = show ? 'text' : 'password'; }); document.querySelectorAll('[data-eye]').forEach((e) => e.setAttribute('aria-label', show ? 'Hide password' : 'Show password')); }));
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault(); const err = document.getElementById('err'), go = document.getElementById('go'); err.textContent = '';
      if (p1.value.length < 6) { err.textContent = 'Use at least 6 characters.'; p1.focus(); return; }
      if (p1.value !== p2.value) { err.textContent = 'The two passwords don’t match. Type the same password twice.'; p2.focus(); return; }
      go.disabled = true; go.innerHTML = '<span class="sp"></span>Saving…';
      try {
        await auth.confirmPasswordReset(code, p1.value);
        show(`<div class="ic ok" aria-hidden="true">✓</div><h1>Password changed</h1><p>You can now sign in to PalaTrack with your new password.</p><a class="btn pri" href="${LOGIN}">Sign in</a>`);
      } catch (e) {
        go.disabled = false; go.innerHTML = 'Save new password<span class="arr">→</span>';
        if (e && e.code === 'auth/weak-password') err.textContent = 'That password is too weak. Try a longer one.';
        else if (e && /expired|invalid-action-code/.test(e.code || '')) expired('password reset');
        else err.textContent = 'Couldn’t save it right now. Please try again.';
      }
    });
  }

  async function recoverEmail() {
    try {
      const info = await auth.checkActionCode(code); const back = info && info.data && info.data.email;
      await auth.applyActionCode(code);
      show(`<div class="ic ok" aria-hidden="true">✓</div><h1>Your email address is back</h1>
        <p>Your account uses <b>${esc(back || 'your previous email address')}</b> again. If you didn’t ask to change it, we recommend choosing a new password too.</p>
        <button class="btn pri" id="rp" type="button">Send me a password reset email</button><a class="btn sec" href="${LOGIN}">Go to sign in</a><div class="err" id="err"></div>`);
      document.getElementById('rp').addEventListener('click', async (ev) => { ev.target.disabled = true;
        try { await auth.sendPasswordResetEmail(back); ev.target.textContent = 'Sent. Check your inbox.'; } catch (e) { document.getElementById('err').textContent = 'Couldn’t send it right now. Use “Forgot password?” on the sign-in page.'; } });
    } catch (e) { expired('email change'); }
  }

  async function changeEmail() {
    try { await auth.applyActionCode(code);
      show(`<div class="ic ok" aria-hidden="true">✓</div><h1>Your new email is confirmed</h1><p>From now on you sign in to PalaTrack with your new email address.</p><a class="btn pri" href="${LOGIN}">Sign in</a>`);
    } catch (e) { expired('email change'); }
  }

  if (!code) problem('This link isn’t complete', 'Open the link straight from the email, or copy the whole link into your browser.');
  else if (mode === 'verifyEmail') verifyEmail();
  else if (mode === 'resetPassword') resetPassword();
  else if (mode === 'recoverEmail') recoverEmail();
  else if (mode === 'verifyAndChangeEmail') changeEmail();
  else if (mode === 'signIn') {
    // an invitation: pass straight on to PalaTrack with the sign-in code, exactly like Firebase's own page does
    let target; try { target = new URL(q.get('continueUrl') || 'boards.html', location.href); } catch (e) { target = new URL('boards.html', location.href); }
    if (target.origin !== location.origin) target = new URL('boards.html', location.href);
    ['apiKey', 'oobCode', 'mode', 'lang'].forEach((k) => { if (q.get(k)) target.searchParams.set(k, q.get(k)); });
    show(`<div class="spin" aria-hidden="true"></div><h1>Opening your invitation…</h1><p>One moment, we’re taking you into PalaTrack.</p>`);
    location.replace(target.toString());
  }
  else problem('This link isn’t valid', 'Open the link straight from the email you received.');
</script>
</body>
</html>
