<style>
  :root{
    --paper:#F1F6FC; --panel:#FFFFFF; --panel-alt:#F8FBFE; --ink:#16202C;
    --border:#DCE6F2; --border-soft:#E9F0F8; --slate:#5C6B7C; --slate-light:#8CA0B3;
    --teal:#3730B3; --teal-deep:#191659;
    --success:#1F6F5C; --success-soft:#DCEEE8;
    --fail:#B43B32; --fail-soft:#FAE1DE;
    --amber:#C97C00; --amber-soft:#FFF1DC;
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 2px 6px rgba(16,24,40,0.05), 0 10px 24px -8px rgba(16,24,40,0.09);
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.05);
    --shadow-lg: 0 4px 10px rgba(16,24,40,0.06), 0 20px 40px -12px rgba(16,24,40,0.16);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --toast-bg:#16202C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden;}
  #pageLoader{min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .loader-spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #appRoot{display:none;height:100vh;}
  #appRoot.reveal{animation:pageFade .4s ease both;}
  @keyframes pageFade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .seq-sidebar{
    width:200px;flex-shrink:0;height:100%;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto;
  }
  .seq-sidebar-logo{width:34px;height:34px;border-radius:10px;overflow:hidden;margin-bottom:20px;box-shadow:0 3px 8px rgba(28,91,158,0.28);}
  .seq-sidebar-user{display:flex;align-items:center;gap:9px;padding:6px 8px;margin-bottom:22px;}
  .seq-sidebar-avatar{
    width:30px;height:30px;border-radius:50%;background:var(--panel-alt);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--teal);flex-shrink:0;
  }
  .seq-sidebar-user span{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seq-sidebar-nav{display:flex;flex-direction:column;gap:2px;}
  .seq-sidebar-link{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
    text-decoration:none;color:var(--slate);font-size:13px;font-weight:600;transition:background .12s, color .12s;
  }
  .seq-sidebar-link .icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
  .seq-sidebar-link:hover{background:var(--panel-alt);color:var(--ink);}
  .seq-sidebar-link.active{background:var(--panel-alt);color:var(--teal);}
  /* Section labels in the shared side panel */
  .seq-sidebar-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-light,#8CA0B3);padding:14px 10px 4px;}
  .seq-sidebar-nav .seq-sidebar-label:first-child{padding-top:0;}
  .seq-sidebar-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}

  .seq-main{flex:1;min-width:0;height:100%;overflow-y:auto;}
  .shell{max-width:760px;margin:0 auto;padding:36px 22px 90px;}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:none;margin:0 0 18px;transition:color .12s, transform .12s;}
  .back-link:hover{color:var(--teal);transform:translateX(-2px);}
  .page-title{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;margin:0 0 4px;}
  .page-sub{font-size:13.5px;color:var(--slate);margin:0 0 20px;}

  .sched-search-row{position:relative;margin-bottom:14px;}
  .sched-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--slate-light);pointer-events:none;}
  #schedSearchInput{
    width:100%;padding:11px 14px 11px 38px;border:1px solid var(--border);border-radius:10px;
    font:inherit;font-size:13.5px;background:var(--panel);transition:border-color .12s, box-shadow .12s;
  }
  #schedSearchInput:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,91,158,0.12);}

  .status-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .status-chip{padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--slate);font-size:12.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;}
  .status-chip:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px);}
  .status-chip.active{background:linear-gradient(135deg, var(--teal), var(--teal-deep));border-color:var(--teal);color:#fff;box-shadow:0 3px 10px rgba(28,91,158,0.28);}

  @keyframes schedItemIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  @keyframes leadGroupIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .lead-group{margin-bottom:10px;}
  .lead-group-header{
    width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:13px 16px;cursor:pointer;font-family:'Inter',sans-serif;text-align:left;
    transition:border-color .12s, background .12s;animation:leadGroupIn .3s cubic-bezier(.2,.8,.3,1) both;
  }
  .lead-group-header:hover{border-color:var(--teal);}
  .lead-group-header.open{border-bottom-left-radius:0;border-bottom-right-radius:0;background:var(--panel-alt);}
  .lead-group-chevron{color:var(--slate-light);font-size:11px;transition:transform .15s;flex-shrink:0;}
  .lead-group-header.open .lead-group-chevron{transform:rotate(90deg);color:var(--teal);}
  .lead-group-name{font-family:'Sora',sans-serif;font-size:14.5px;font-weight:700;flex:1;}
  .lead-group-count{
    flex-shrink:0;background:var(--panel-alt);color:var(--slate);font-size:11.5px;font-weight:700;
    padding:2px 10px;border-radius:20px;
  }
  .lead-group-header.open .lead-group-count{background:var(--panel);}
  .lead-group-items{
    border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:14px 14px 4px;
    background:var(--paper);
  }
  .lead-group-items .sched-item{animation:none;}
  .sched-item{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);
    margin-bottom:12px;display:flex;gap:14px;transition:border-color .15s, transform .15s, box-shadow .15s;
    animation:schedItemIn .3s cubic-bezier(.2,.8,.3,1) both;
  }
  .sched-item:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 8px 22px -8px rgba(28,91,158,0.25);}
  .sched-item-icon{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;color:#fff;
  }
  .sched-item-icon.pending, .sched-item-icon.sending{background:linear-gradient(135deg, var(--amber), #A8650A);}
  .sched-item-icon.sent, .sched-item-icon.cancelled_replied{background:linear-gradient(135deg, var(--success), #164F41);}
  .sched-item-icon.failed{background:linear-gradient(135deg, var(--fail), #8A2A24);}
  .sched-item-icon.cancelled{background:linear-gradient(135deg, var(--slate), #46525F);}
  .sched-item-body{flex:1;min-width:0;}
  .sched-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;}
  .sched-subject{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;margin:0;}
  .sched-badge{flex-shrink:0;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .sched-badge.pending{background:var(--amber-soft);color:var(--amber);}
  .sched-badge.sending{background:var(--amber-soft);color:var(--amber);}
  .sched-badge.sent{background:var(--success-soft);color:var(--success);}
  .sched-badge.failed{background:var(--fail-soft);color:var(--fail);}
  .sched-badge.cancelled{background:var(--border-soft);color:var(--slate);}
  .sched-badge.cancelled_replied{background:var(--success-soft);color:var(--success);}
  .sched-meta{font-size:12.5px;color:var(--slate);line-height:1.8;margin-bottom:10px;}
  .sched-meta b{color:var(--ink);font-weight:600;}
  .sched-meta a{color:var(--teal);font-weight:600;text-decoration:none;}
  .sched-meta a:hover{text-decoration:underline;}
  .sched-when{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);}
  .sched-actions{display:flex;gap:8px;}
  .sched-cancel-btn{
    font-size:12px;font-weight:600;color:var(--fail);background:none;border:1px solid var(--fail);
    border-radius:8px;padding:6px 13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .12s;
  }
  .sched-cancel-btn:hover{background:var(--fail-soft);transform:translateY(-1px);}
  .sched-cancel-btn:disabled{opacity:.6;cursor:default;transform:none;}

  .empty-state{text-align:center;padding:70px 20px;color:var(--slate);border:1px dashed var(--border);border-radius:16px;}
  .empty-state h3{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;color:var(--ink);margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0;}

  .toast-stack{position:fixed;top:18px;right:18px;z-index:400;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--toast-bg);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .toast.danger{background:var(--fail);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--c-border-alt, var(--border));border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--slate-light);background-clip:padding-box;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
</style>

<script>window.addEventListener('storage',function(e){if(e.key!=='theme')return;if(e.newValue==='dark')document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');});</script>
<style>
  /* The new theme flows out from the button as a soft, glowing wave: a round,
     soft-edged mask whose size and position are animated from the button. */
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;}
  ::view-transition-old(root){z-index:1;}
  html.pt-wave::view-transition-new(root){z-index:2;
    -webkit-mask-image:radial-gradient(circle closest-side, #000 86%, transparent 100%);
            mask-image:radial-gradient(circle closest-side, #000 86%, transparent 100%);
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-size:0 0; mask-size:0 0;}
  .pt-theme-fx{position:fixed;inset:0;pointer-events:none;z-index:2147483647;overflow:hidden;}
  .pt-star{position:absolute;border-radius:50%;background:#fff;opacity:0;}
  .pt-star.glow{box-shadow:0 0 6px 2px rgba(190,185,255,.9), 0 0 18px 6px rgba(122,115,255,.35);}
  .pt-sun{position:absolute;border-radius:50%;opacity:0;
    background:radial-gradient(circle, rgba(255,214,140,.55) 0%, rgba(255,181,71,.25) 30%, rgba(255,181,71,0) 70%);}
  .pt-theme-wipe{position:fixed;inset:0;z-index:2147483646;pointer-events:none;}
  /* Going dark: a glowing aurora band rides the front of the wave. It's its own
     layer in the transition, masked to a ring that grows with the wave. */
  #ptAurora{position:fixed;inset:0;pointer-events:none;z-index:2147483647;view-transition-name:pt-aurora;filter:blur(14px);opacity:.8;
    background:conic-gradient(from 200deg at var(--pt-x,50%) var(--pt-y,50%), #6D65F6, #A77BFF, #FF7EB6, #7DB7FF, #5FD3E8, #6D65F6);}
  ::view-transition-group(pt-aurora){animation:none;}
  ::view-transition-new(pt-aurora){animation:none;z-index:3;mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(circle closest-side, transparent 80%, rgba(0,0,0,.95) 89%, rgba(0,0,0,.95) 93%, transparent 99%);
            mask-image:radial-gradient(circle closest-side, transparent 80%, rgba(0,0,0,.95) 89%, rgba(0,0,0,.95) 93%, transparent 99%);
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-size:0 0; mask-size:0 0;}
  .theme-toggle-btn.pt-sound-btn{flex:0 0 auto;width:38px;padding:9px 0;}
  .pt-sound-btn svg{display:block;}
  .pt-meteor{position:absolute;height:2px;width:170px;border-radius:2px;opacity:0;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(214,211,255,.55) 60%, #fff);
    box-shadow:0 0 10px 1px rgba(190,185,255,.7);transform-origin:right center;}
</style>
<script>
(function(){
  function reduced(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function layer(){ var d = document.createElement('div'); d.className = 'pt-theme-fx'; document.body.appendChild(d); return d; }
  // Going dark: stars come out across the whole screen, nearest to the button first.
  function starfield(x, y){
    var fx = layer(), n = Math.round(Math.min(90, (innerWidth * innerHeight) / 14000)), maxD = Math.hypot(innerWidth, innerHeight);
    for(var i = 0; i < n; i++){
      var s = document.createElement('i'), sx = Math.random() * innerWidth, sy = Math.random() * innerHeight;
      var size = Math.random() < 0.18 ? 3 : 1 + Math.random() * 1.6;
      s.className = 'pt-star' + (size >= 3 ? ' glow' : '');
      s.style.cssText = 'left:' + sx + 'px;top:' + sy + 'px;width:' + size + 'px;height:' + size + 'px;';
      fx.appendChild(s);
      var delay = (Math.hypot(sx - x, sy - y) / maxD) * 520 + Math.random() * 260;
      s.animate([{opacity:0, transform:'scale(.2)'}, {opacity:1, transform:'scale(1)', offset:.35}, {opacity:.85, offset:.7}, {opacity:0, transform:'scale(.6)'}],
        {duration:1300 + Math.random() * 700, delay:delay, easing:'ease-out', fill:'both'});
    }
    setTimeout(function(){ fx.remove(); }, 2700);
  }
  // ---------- Transition sounds (Web Audio, no files) ----------
  // Going dark: an airy whoosh sweeping down with the wave, a deep warm swell as
  // night settles, crystal twinkles timed with the stars and a shimmering glide
  // for each shooting star. Going light: a rising whoosh and a bright, warm
  // chord like the sunrise. Soft by design; the speaker button turns it off.
  var SOUND_KEY = 'ptThemeSound', AC = null, NOISE = null;
  function soundOn(){ try{ return localStorage.getItem(SOUND_KEY) !== 'off'; }catch(e){ return true; } }
  function audio(){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    if(!AC){
      AC = new C();
      var comp = AC.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
      AC.master = AC.createGain(); AC.master.gain.value = 0.9;
      AC.master.connect(comp); comp.connect(AC.destination);
      addSpace(AC, AC.master);
    }
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }
  // Deep space: a generated reverb (a long, dark, stereo tail) that voices can send into.
  function addSpace(ac, dest){
    var sec = 3.2, len = Math.floor(ac.sampleRate * sec), ir = ac.createBuffer(2, len, ac.sampleRate);
    for(var ch = 0; ch < 2; ch++){
      var d = ir.getChannelData(ch), lp = 0;
      for(var i = 0; i < len; i++){ lp = lp * 0.72 + (Math.random() * 2 - 1) * 0.28; d[i] = lp * Math.pow(1 - i / len, 3.2); }
    }
    var conv = ac.createConvolver(); conv.buffer = ir;
    ac.space = ac.createGain(); ac.space.gain.value = 0.55;
    ac.space.connect(conv); conv.connect(dest);
  }
  function send(ac, node, amount){   // also send a voice into the space reverb
    if(!ac.space) return;
    var g = ac.createGain(); g.gain.value = amount; node.connect(g); g.connect(ac.space);
  }
  function noise(ac){
    if(NOISE) return NOISE;
    var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return (NOISE = buf);
  }
  function env(ac, g, t, peak, attack, hold, release){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
  }
  function whoosh(ac, t, dur, from, to, level, panFrom){
    var src = ac.createBufferSource(); src.buffer = noise(ac); src.loop = true;

  }
  // A metallic, otherworldly shimmer: ring modulation (two tones multiplied) gives inharmonic partials.
  function ringShimmer(ac, t, dur, f1, f2, level, pan){

  // A warp "zip" for each shooting star: an FM sweep that phases past from one side to the other.
  function warp(ac, t, level, pan){

    mod.frequency.setValueAtTime(420 * 2.47, t); mod.frequency.exponentialRampToValueAtTime(140 * 2.47, t + 0.55);

    var g = ac.createGain(); env(ac, g, t, level, 0.04, 0.08, 0.45);
    var out = g;
    if(ac.createStereoPanner){ var pn = ac.createStereoPanner(); pn.pan.setValueAtTime(pan, t); pn.pan.linearRampToValueAtTime(-pan, t + 0.55); g.connect(pn); out = pn; }
    car.connect(bp); bp.connect(g); out.connect(ac.master); send(ac, out, 0.8);

  // An alien choir: synthetic "voices" (saws through two moving formant filters)
  // singing an off-kilter chord, their vowel morphing from "ooh" to "aah".
  var VOWELS = {oo:[300, 870], aa:[730, 1090], ee:[290, 2250], ah:[650, 1400]};
  function alienChoir(ac, t, dur, freqs, level, from, to){
    var mix = ac.createGain(); mix.gain.value = 1;
    var f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter();
    [f1, f2].forEach(function(f, k){ f.type = 'bandpass'; f.Q.value = k ? 9 : 7;
      f.frequency.setValueAtTime(VOWELS[from][k], t); f.frequency.exponentialRampToValueAtTime(VOWELS[to][k], t + dur * 0.8); });
    var g = ac.createGain(); env(ac, g, t, level, dur * 0.35, dur * 0.25, dur * 0.4);
    mix.connect(f1); mix.connect(f2); f1.connect(g); f2.connect(g); g.connect(ac.master); send(ac, g, 0.9);
    freqs.forEach(function(f){
      [-14, 0, 13].forEach(function(c){
        var o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = c;
        var vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 4.6 + Math.random(); vg.gain.value = 3.5;
        vib.connect(vg); vg.connect(o.detune);

    });

  // A theremin wail: a pure tone gliding with a wide, wavering vibrato (1950s UFO).
  function theremin(ac, t, dur, fFrom, fTo, level, pan){
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(fFrom, t); o.frequency.exponentialRampToValueAtTime(fTo, t + dur * 0.7);
    var vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.setValueAtTime(4.2, t); vib.frequency.linearRampToValueAtTime(6.8, t + dur);

  // A sub drop: a very low tone sinking like a ship touching down.

  function playThemeSound(toDark, x){
    if(!soundOn()) return;
    var ac = audio(); if(!ac) return;
    var t = ac.currentTime + 0.02, pan = Math.max(-0.8, Math.min(0.8, (x / innerWidth) * 2 - 1));
    if(toDark){
      whoosh(ac, t, 1.3, 2600, 240, 0.22, pan);                                     // night rolls in
      pad(ac, t + 0.35, [110, 164.81, 220, 261.63], 0.04, 0.6, 0.5, 1.4, false);   // the deep, warm swell
      alienChoir(ac, t + 0.3, 2.3, [110, 155.56, 233.08, 311.13], 0.042, 'oo', 'aa'); // alien voices, an off-kilter chord
      alienHum(ac, t + 0.55, 1.9, 55, 0.03, 140, 1500, 320);                         // an alien energy hum wakes up
      subDrop(ac, t + 1.0, 0.11);                                                     // the ship touches down as the wave lands
      ringShimmer(ac, t + 0.85, 1.3, 740, 1130, 0.04, -pan);                         // metallic, otherworldly shimmer as the stars appear

      alienHum(ac, t + 0.15, 1.1, 110, 0.028, 220, 3200, 1800);                      // a rising power-up
      alienChoir(ac, t + 0.1, 1.3, [261.63, 369.99, 466.16], 0.04, 'oo', 'ee');       // alien voices opening up into the light
      theremin(ac, t + 0.3, 0.9, 440, 990, 0.022, pan * 0.6);                         // a quick upward theremin glide
      ringShimmer(ac, t + 0.45, 0.8, 1180, 1710, 0.035, pan);                        // a bright metallic glint
    }
  }
  // Speaker button next to the light/dark switch (remembered per browser).
  function addSoundButton(){
    var light = document.getElementById('themeLightBtn');
    if(!light || document.getElementById('ptSoundBtn')) return;
    var b = document.createElement('button'); b.type = 'button'; b.id = 'ptSoundBtn';
    b.className = (light.className || '').replace(/\bactive\b/g, '').trim() + ' pt-sound-btn';
    var on = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
    var off = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';

      b.title = s ? 'Transition sound on (click to mute)' : 'Transition sound off (click to turn on)'; b.setAttribute('aria-label', b.title); }

      e.stopPropagation();

    var fx = layer();

      var m = document.createElement('i'); m.className = 'pt-meteor';
      var sx = innerWidth * (0.55 + Math.random() * 0.4), sy = innerHeight * (0.05 + Math.random() * 0.3), ang = 155 + Math.random() * 15;

        root.animate(grow(S), {duration:WAVE, easing:ease, fill:'forwards', pseudoElement:'::view-transition-new(root)'});

            {duration:WAVE, easing:'ease-in', fill:'forwards', pseudoElement:'::view-transition-old(root)'});

        }

    } else {

        {duration:650, easing:'cubic-bezier(.65,0,.25,1)', fill:'forwards'}).onfinish = function(){
          replay();
          wipe.animate({opacity:[1, 0]}, {duration:340, fill:'forwards'}).onfinish = function(){ wipe.remove(); };

})();

  html[data-theme="dark"] ::selection{background:rgba(122,115,255,.45);color:#fff;}
  html[data-theme="dark"] input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),
  html[data-theme="dark"] select, html[data-theme="dark"] textarea{
    background-color:#1C2042; color:var(--ink); border-color:var(--border);
  }
  html[data-theme="dark"] input::placeholder, html[data-theme="dark"] textarea::placeholder{color:#767CA6;}
  html[data-theme="dark"] input:focus, html[data-theme="dark"] select:focus, html[data-theme="dark"] textarea:focus{
    border-color:#7A73FF; box-shadow:0 0 0 3px rgba(122,115,255,.25);
  }
  html[data-theme="dark"] [style*="background:#fff"], html[data-theme="dark"] [style*="background: #fff"],
  html[data-theme="dark"] [style*="background:#FFF"], html[data-theme="dark"] [style*="background:white"]{background:#161934 !important;}
  html[data-theme="dark"] *{scrollbar-color:#2B3060 transparent;}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#2B3060;border-radius:8px;}
  html[data-theme="dark"] ::-webkit-scrollbar-track{background:transparent;}
  html[data-theme="dark"] img[src$=".svg"]:not([data-keep-color]){filter:none;}
  /* The old dark design put a grain texture + glow box behind the page title
     (dashboard, trash, also in LinkedIn mode). It doesn't fit indigo night. */
  html[data-theme="dark"] .title-block{box-shadow:none !important;overflow:visible !important;}
  html[data-theme="dark"] .title-block::after{content:none !important;display:none !important;}
  /* Source icons (LinkedIn "in", YouTube play button) draw their cut-out in the
     chip's background colour. In dark mode those backgrounds are translucent,
     so the cut-out would vanish; draw it in a solid dark colour instead. */
  html[data-theme="dark"] svg [fill^="var(--c-"][fill$="-bg)"]{fill:#161934;}
  /* "Contacted" is the strong black dot in light mode; its dark-mode twin is a
     strong light dot, so it reads as clearly "on" as the coloured ones. */
  html[data-theme="dark"] .step-dot.on.contacted, html[data-theme="dark"] .outreach-chip.on.contacted{
    background:#E4E6FA !important; color:#161934 !important; box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 2px 8px -2px rgba(0,0,0,.6) !important;
  }
  /* Post composer: its LinkedIn-style parts (calendar, dialogs, compare, ideas)
     define their own colors locally; switch those to the dark theme. */
  html[data-theme="dark"] .lk{--lk-blue:#71B7FB;--lk-blue-dark:#A8D4FF;--lk-text:rgba(236,238,255,.92);--lk-muted:rgba(236,238,255,.62);--lk-line:rgba(255,255,255,.1);--lk-feed:#0D0F1F;}
  /* The LinkedIn feed preview switches to LinkedIn's own dark mode, so it still
     shows exactly how the post looks for people using LinkedIn in dark mode. */
  html[data-theme="dark"]{--li-blue:#71B7FB;}
  html[data-theme="dark"] .li-device, html[data-theme="dark"] .cmp-wrap{--feed:#000000;--li-text:rgba(255,255,255,.9);--li-muted:rgba(255,255,255,.6);--li-faint:rgba(255,255,255,.45);}
  /* ...on a dark "desk" backdrop instead of a light box. */
  html[data-theme="dark"] .li-stage{
    background:radial-gradient(700px 360px at 50% 0%, rgba(122,115,255,.18), transparent 70%), #12152C !important;
    border-color:#2B3060 !important;
  }

</style>
<!-- pt-dark-theme:end -->
</head>
<body>
<div id="pageLoader"><div class="loader-spinner"></div></div>
<div class="toast-stack" id="toastStack"></div>

<div id="appRoot">
  <div class="seq-sidebar" data-pt-sidebar></div>
  <script src="sidebar.js"></script>

<div class="seq-main">
  <div class="shell">
  <a class="back-link" id="backBtn" href="boards.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span class="back-label">Back</span>
  </a>
  <h1 class="page-title">Scheduled emails</h1>
  <p class="page-sub">Every "send later" email across your workspace, so nobody on the team emails the same lead twice.</p>

  <div class="sched-search-row">
    <svg class="sched-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="schedSearchInput" placeholder="Search by lead, subject, or email address...">
  </div>

  <div class="status-filters" id="statusFilters">
    <button type="button" class="status-chip active" data-filter="pending">Upcoming</button>
    <button type="button" class="status-chip" data-filter="sent">Sent</button>
    <button type="button" class="status-chip" data-filter="failed">Failed</button>
    <button type="button" class="status-chip" data-filter="cancelled">Cancelled</button>
    <button type="button" class="status-chip" data-filter="all">All</button>
  </div>

  <div id="listHolder"></div>
  </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
  const faviconLink = document.querySelector('link[rel="icon"]');
  if(faviconLink) document.getElementById('sidebarLogoImg').src = faviconLink.href;

  function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function showToast(message, danger){
    const stack = document.getElementById('toastStack');
    const el = document.createElement('div');
    el.className = 'toast' + (danger ? ' danger' : '');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(()=>{
      el.style.transition = 'opacity .2s ease';
      el.style.opacity = '0';
      setTimeout(()=>el.remove(), 200);
    }, 3200);
  }
  function formatWhen(date){
    return date.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}) + ' at ' +
      date.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
  }

  let currentWorkspaceId = null;
  let allScheduled = [];
  let activeFilter = 'pending';
  let searchQuery = '';
  const expandedGroups = new Set(); // which lead groups the user has opened, kept open across re-renders

  // Cached lead names, fetched lazily as they show up in results — avoids
  // fetching every lead in the workspace up front just to show a name.
  const leadNameCache = {};
  function getLeadName(workspaceId, boardId, leadId){
    const key = `${boardId}/${leadId}`;
    if(leadNameCache[key] !== undefined) return Promise.resolve(leadNameCache[key]);
    return db.doc(`workspaces/${workspaceId}/boards/${boardId}/leads/${leadId}`).get().then(doc=>{
      leadNameCache[key] = doc.exists ? (doc.data().name || 'Unnamed lead') : 'Deleted lead';
      return leadNameCache[key];
    }).catch(()=>{
      leadNameCache[key] = 'Unknown lead';
      return leadNameCache[key];
    });
  }

  function renderSchedItemHTML(e){
    const when = e.sendAt ? formatWhen(e.sendAt) : '—';
    const statusLabel = {pending:'Upcoming', sending:'Sending', sent:'Sent', failed:'Failed', cancelled:'Cancelled', cancelled_replied:'Stopped (replied)'}[e.status] || e.status;
    const statusIcon = {pending:'🕒', sending:'🕒', sent:'✓', failed:'✕', cancelled:'—', cancelled_replied:'✓'}[e.status] || '?';
    return `<div class="sched-item">
      <div class="sched-item-icon ${esc(e.status)}">${statusIcon}</div>
      <div class="sched-item-body">
      <div class="sched-item-head">
        <h3 class="sched-subject">${esc(e.subject || '(no subject)')}</h3>
        <span class="sched-badge ${esc(e.status)}">${esc(statusLabel)}</span>
      </div>
      <div class="sched-meta">
        <b>To</b> ${esc(e.to || '')}<br>
        <b>Scheduled by</b> ${esc(e.sentByName || 'Someone')} &middot; <span class="sched-when">${esc(when)}</span>
        ${e.sequenceId ? `<br><b>Sequence</b> step ${esc(e.stepNumber || '?')}` : ''}
        ${e.status === 'failed' && e.error ? `<br><b>Error</b> ${esc(e.error)}` : ''}
      </div>
      ${e.status === 'pending' ? `<div class="sched-actions"><button type="button" class="sched-cancel-btn" data-id="${esc(e.id)}">Cancel</button></div>` : ''}
      </div>
    </div>`;
  }

  // Groups scheduled emails by lead, so the page reads as "here's
  // everything for this lead" instead of one long undifferentiated list.
  function buildLeadGroups(items){
    const groups = {};
    items.forEach(e=>{
      const key = `${e.boardId}/${e.leadId}`;
      if(!groups[key]) groups[key] = {boardId: e.boardId, leadId: e.leadId, key, items: []};
      groups[key].items.push(e);
    });
    return Object.values(groups)
      .map(g=>({...g, leadName: leadNameCache[g.key] || 'Loading…'}))
      .sort((a,b)=> a.leadName.localeCompare(b.leadName));
  }

  function renderList(){
    const holder = document.getElementById('listHolder');
    let filtered = activeFilter === 'all' ? allScheduled
      : activeFilter === 'cancelled' ? allScheduled.filter(e=>e.status === 'cancelled' || e.status === 'cancelled_replied')
      : allScheduled.filter(e=>e.status === activeFilter);

    if(searchQuery){
      filtered = filtered.filter(e=>{
        const leadName = (leadNameCache[`${e.boardId}/${e.leadId}`] || '').toLowerCase();
        return leadName.includes(searchQuery) ||
          (e.subject || '').toLowerCase().includes(searchQuery) ||
          (e.to || '').toLowerCase().includes(searchQuery);
      });
    }

    if(filtered.length === 0){
      holder.innerHTML = `<div class="empty-state"><h3>Nothing here</h3><p>${searchQuery ? "No scheduled emails match your search." : (activeFilter === 'pending' ? "No emails currently scheduled to send." : "No emails match this filter.")}</p></div>`;
      return;
    }

    const groups = buildLeadGroups(filtered);
    holder.innerHTML = groups.map((g, gIdx)=>{
      const wasOpen = expandedGroups.has(g.key) || !!searchQuery; // auto-expand while searching, so matches are visible
      return `<div class="lead-group">
        <button type="button" class="lead-group-header ${wasOpen ? 'open' : ''}" data-key="${esc(g.key)}" style="animation-delay:${gIdx * 40}ms">
          <span class="lead-group-chevron">▸</span>
          <span class="lead-group-name" data-lead-name="${esc(g.key)}">${esc(g.leadName)}</span>
          <span class="lead-group-count">${g.items.length}</span>
        </button>
        <div class="lead-group-items" data-group="${esc(g.key)}" style="display:${wasOpen ? 'block' : 'none'};">
          ${g.items.map(e=>renderSchedItemHTML(e)).join('')}
        </div>
      </div>`;
    }).join('');

    // Resolve any lead names we don't have cached yet, then refresh once
    // they're in so the group headers and search both work off real names.
    const missing = groups.filter(g=>g.leadName === 'Loading…');
    if(missing.length){
      Promise.all(missing.map(g=>getLeadName(currentWorkspaceId, g.boardId, g.leadId).then(name=>{ leadNameCache[g.key] = name; })))
        .then(()=>renderList());
    }

    holder.querySelectorAll('.lead-group-header').forEach(header=>{
      header.addEventListener('click', ()=>{
        const key = header.dataset.key;
        const itemsEl = holder.querySelector(`.lead-group-items[data-group="${CSS.escape(key)}"]`);
        const nowOpen = itemsEl.style.display === 'none';
        itemsEl.style.display = nowOpen ? 'block' : 'none';
        header.classList.toggle('open', nowOpen);
        if(nowOpen) expandedGroups.add(key); else expandedGroups.delete(key);
      });
    });

    holder.querySelectorAll('.sched-cancel-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        btn.disabled = true;
        btn.textContent = 'Cancelling...';
        db.doc(`scheduledEmails/${id}`)
          .update({status: 'cancelled'})
          .then(()=> showToast('Scheduled email cancelled.'))
          .catch(err=>{
            console.error(err);
            showToast('Could not cancel that: ' + (err.message || 'please try again.'), true);
            btn.disabled = false;
            btn.textContent = 'Cancel';
          });
      });
    });
  }

  document.querySelectorAll('.status-chip[data-filter]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      activeFilter = chip.dataset.filter;
      document.querySelectorAll('.status-chip[data-filter]').forEach(c=>c.classList.toggle('active', c===chip));
      renderList();
    });
  });

  let searchDebounceTimer = null;
  document.getElementById('schedSearchInput').addEventListener('input', (e)=>{
    clearTimeout(searchDebounceTimer);
    const value = e.target.value;
    searchDebounceTimer = setTimeout(()=>{
      searchQuery = value.trim().toLowerCase();
      renderList();
    }, 150);
  });

  let unsubscribe = null;
  function startListening(workspaceId){
    currentWorkspaceId = workspaceId;
    unsubscribe = db.collection('scheduledEmails')
      .where('workspaceId', '==', workspaceId)
      .orderBy('sendAt', 'asc')
      .limit(300)
      .onSnapshot(snap=>{
        allScheduled = snap.docs.map(doc=>{
          const d = doc.data();
          return {
            id: doc.id,
            workspaceId: d.workspaceId, boardId: d.boardId, leadId: d.leadId,
            to: d.to, subject: d.subject, status: d.status || 'pending',
            sentByName: d.sentByName, error: d.error,
            sequenceId: d.sequenceId, stepNumber: d.stepNumber,
            sendAt: (d.sendAt && typeof d.sendAt.toDate === 'function') ? d.sendAt.toDate() : null
          };
        });
        document.getElementById('pageLoader').style.display = 'none';
        const appRoot = document.getElementById('appRoot');
        appRoot.style.display = 'flex';
        appRoot.classList.add('reveal');
        renderList();
      }, err=>{
        console.error('Could not load scheduled emails', err);
        document.getElementById('pageLoader').style.display = 'none';
        document.getElementById('appRoot').style.display = 'flex';
        document.getElementById('listHolder').innerHTML = `<div class="empty-state"><h3>Could not load this</h3><p>Please try again later.</p></div>`;
      });
  }

  const params = new URLSearchParams(location.search);
  const boardId = params.get('board');
  if(params.get('from') === 'home'){ try{ sessionStorage.setItem('ptFromHome', '1'); }catch(e){} }
  let cameFromHome = params.get('from') === 'home';
  try{ cameFromHome = cameFromHome || sessionStorage.getItem('ptFromHome') === '1'; }catch(e){}
  document.getElementById('backBtn').href = boardId ? `dashboard.html?board=${encodeURIComponent(boardId)}` : 'boards.html';
  document.getElementById('backBtn').onclick = function(){ if(history.length>1){ history.back(); return false; } };
  const boardQS = boardId ? `?board=${encodeURIComponent(boardId)}` : '';
  document.getElementById('navDashboard').href = `dashboard.html${boardQS}`;
  document.getElementById('navSequences').href = `sequences.html${boardQS}`;
  document.getElementById('navCampaigns').href = `campaigns.html${boardQS}`;
  document.getElementById('navTrash').href = `trash.html${boardQS}`;

  auth.onAuthStateChanged(user=>{
    if(!user){
      location.href = 'home.html';
      return;
    }
    db.doc(`userDirectory/${user.uid}`).get().then(doc=>{
      const workspaceId = doc.exists ? doc.data().workspaceId : null;
      if(!workspaceId){
        showToast('Could not find your workspace.', true);
        return;
      }
      startListening(workspaceId);
      db.doc(`workspaces/${workspaceId}/members/${user.uid}`).get().then(memberDoc=>{
        const myName = (memberDoc.exists && memberDoc.data().name) || user.email || 'You';
        document.getElementById('seqSidebarUserName').textContent = myName;
        document.getElementById('seqSidebarAvatar').textContent = myName.trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '?';
      }).catch(()=>{});
    }).catch(err=>{
      console.error(err);
      showToast('Could not load your workspace.', true);
    });
  });
})();
</script>

<script>
// Shared side panel: the same links on every page. The current board (if the
// page was opened for one) is carried along, the same way these pages always did.
(function(){
  var board = new URLSearchParams(location.search).get('board');
  var q = board ? '?board=' + encodeURIComponent(board) : '';

</script>

<!-- LinkedIn badge: how many LinkedIn messages are due now (like an app badge on a phone) -->
<style>
  .pt-li-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#FF3B30;color:#fff;
    font:700 11px/20px -apple-system,BlinkMacSystemFont,'Inter',sans-serif;text-align:center;box-shadow:0 0 0 2px var(--panel,#fff);flex-shrink:0;
    animation:ptLiPop .45s cubic-bezier(.3,1.6,.5,1) both;}
  [data-li-badge]{position:relative;}
  [data-li-badge] > .pt-li-badge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;line-height:24px;font-size:12.5px;box-shadow:0 0 0 3px var(--paper,#EFF5FC),0 4px 10px -2px rgba(255,59,48,.55);}
  @keyframes ptLiPop{from{transform:scale(0);}to{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .pt-li-badge{animation:none;} }
</style>
<script>
(function(){
  function paint(n){
    document.querySelectorAll('#navLinkedinSeq, [data-li-badge]').forEach(function(el){
      var b = el.querySelector(':scope > .pt-li-badge');
      if(!n){ if(b) b.remove(); return; }
      if(!b){ b = document.createElement('span'); b.className = 'pt-li-badge'; el.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
      b.setAttribute('aria-label', n + (n === 1 ? ' LinkedIn message' : ' LinkedIn messages') + ' to send now');
      b.title = b.getAttribute('aria-label');
    });
  }
  function start(){
    if(!window.firebase || !firebase.apps || !firebase.apps.length) return;
    var db = firebase.firestore();
    firebase.auth().onAuthStateChanged(function(u){
      if(!u) return;
      db.doc('userDirectory/' + u.uid).get().then(function(d){
        var ws = d.exists && d.data().workspaceId; if(!ws) return;
        function load(){
          db.collection('linkedinSequenceRuns').where('workspaceId', '==', ws).where('status', '==', 'active').get().then(function(snap){
            var now = Date.now();
            paint(snap.docs.filter(function(x){
              var r = x.data(), t = r.nextDueAt && typeof r.nextDueAt.toMillis === 'function' ? r.nextDueAt.toMillis() : 0;
              return (r.currentStepIndex || 0) < (r.steps || []).length && t <= now;
            }).length);
          }).catch(function(){});
        }
        load(); setInterval(load, 5 * 60 * 1000);
        window.ptRefreshLinkedinBadge = load;
      }).catch(function(){});
    });
  }
  if(document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>

<!-- Tasks badge: unread task notifications (assigned, mentioned, due today, automations) -->
<script>
(function(){
  function paint(n){
    document.querySelectorAll('#navTasks, [data-tasks-badge]').forEach(function(el){
      var b = el.querySelector(':scope > .pt-li-badge');
      if(!n){ if(b) b.remove(); return; }
      if(!b){ b = document.createElement('span'); b.className = 'pt-li-badge'; el.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
      b.setAttribute('aria-label', n + (n === 1 ? ' unread task notification' : ' unread task notifications'));
      b.title = b.getAttribute('aria-label');
    });
  }
  function start(){
    if(!window.firebase || !firebase.apps || !firebase.apps.length) return;
    firebase.auth().onAuthStateChanged(function(u){
      if(!u) return;
      firebase.firestore().collection('userNotifications').where('uid', '==', u.uid).where('read', '==', false).limit(100)
        .onSnapshot(function(snap){ paint(snap.size); }, function(){});
    });
  }
  if(document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>
