<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALATRACK - Confirm your email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="smooth.js"></script>
<style>
  html,body{margin:0;padding:0;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#0F172A;
    background:linear-gradient(180deg,#070B1F 0%,#0E1640 55%,#1B1F5C 100%);}
  /* the same still night sky as the sign-up page */
  .sky{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.9) 50%,transparent 51%),radial-gradient(1px 1px at 27% 62%,rgba(255,255,255,.7) 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 41% 28%,rgba(255,255,255,.85) 50%,transparent 51%),radial-gradient(1px 1px at 58% 12%,rgba(255,255,255,.6) 50%,transparent 51%),
      radial-gradient(1px 1px at 66% 44%,rgba(255,255,255,.75) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 79% 22%,rgba(255,255,255,.9) 50%,transparent 51%),
      radial-gradient(1px 1px at 88% 58%,rgba(255,255,255,.6) 50%,transparent 51%),radial-gradient(1px 1px at 6% 76%,rgba(255,255,255,.55) 50%,transparent 51%),
      radial-gradient(120% 60% at 50% 125%,rgba(99,132,255,.45),rgba(99,102,241,.12) 45%,transparent 70%);}
  .card{position:relative;width:100%;max-width:520px;background:#fff;border-radius:26px;padding:44px 40px 36px;box-sizing:border-box;text-align:center;
    box-shadow:0 40px 100px -30px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08);}
  .ic{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;
    background:linear-gradient(135deg,#3B49C9,#6D3BDB);box-shadow:0 14px 30px -12px rgba(91,75,230,.75);}
  h1{margin:0 0 10px;font-family:Sora,Inter,sans-serif;font-size:26px;letter-spacing:-.02em;}
  p{margin:0 0 14px;font-size:15px;line-height:1.6;color:#475569;}
  p b{color:#0F172A;}
  .btn{display:block;width:100%;height:50px;margin-top:10px;border:0;border-radius:12px;font:700 15px Inter,sans-serif;cursor:pointer;}
  .btn.pri{color:#fff;background:linear-gradient(135deg,#3B49C9,#6D3BDB);box-shadow:0 14px 30px -12px rgba(91,75,230,.75);}
  .btn.sec{color:#0F172A;background:#F1F4FA;}
  .btn:disabled{opacity:.6;cursor:default;}
  .note{min-height:22px;margin:14px 0 0;font-size:13.5px;color:#475569;}
  .note.ok{color:#15803D;} .note.bad{color:#B42318;}
  .small{margin-top:22px;font-size:13px;color:#64748B;}
  .small a{color:#3730B3;font-weight:600;}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main class="card">
  <div class="ic" aria-hidden="true">✉️</div>
  <h1>Confirm your email</h1>
  <p>We sent a confirmation link to <b id="who">your email address</b>. Click the link in that email to start using PalaTrack.</p>
  <p>Can’t find it? Check your spam or promotions folder.</p>
  <button type="button" class="btn pri" id="done">I’ve confirmed my email</button>
  <button type="button" class="btn sec" id="again">Send the email again</button>
  <div class="note" id="note" aria-live="polite"></div>
  <div class="small">Wrong email address? <a href="#" id="out">Sign out and create your account again</a></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
  // New accounts confirm their email address before they use PalaTrack. This page waits for that: it checks every few
  // seconds, and as soon as the link in the email has been clicked, it takes them into PalaTrack.
  firebase.initializeApp({
    apiKey: "AIzaSyD4f-ko4mhSIcc0RHC0pq370tccpTSzIGM",
    authDomain: "lead-tracker-c5c3a.firebaseapp.com",
    projectId: "lead-tracker-c5c3a",
    storageBucket: "lead-tracker-c5c3a.firebasestorage.app",
    messagingSenderId: "720572896285",
    appId: "1:720572896285:web:db5d8f4fc9cccb3ab3a2f4"
  });
  const auth = firebase.auth(), $ = (id) => document.getElementById(id);
  const say = (t, cls) => { $('note').className = 'note ' + (cls || ''); $('note').textContent = t; };
  const next = new URLSearchParams(location.search).get('next') || 'home.html';
  const goIn = () => { location.href = /^[a-z0-9-]+\.html(\?[\w=&.-]*)?$/i.test(next) ? next : 'home.html'; };
  let timer = null;
  async function check(quiet) {
    const u = auth.currentUser; if (!u) return;
    try { await u.reload(); } catch (e) { /* offline for a moment */ }
    if (auth.currentUser && auth.currentUser.emailVerified) {
      clearInterval(timer); say('✓ Confirmed! Taking you into PalaTrack…', 'ok');
      try { await auth.currentUser.getIdToken(true); } catch (e) { /* ignore */ }
      setTimeout(goIn, 600); return true;
    }
    if (!quiet) say('Not confirmed yet. Click the link in the email first (it can take a minute to arrive).', 'bad');
    return false;
  }
  auth.onAuthStateChanged((u) => {
    if (!u) { location.href = 'signup.html'; return; }
    $('who').textContent = u.email || 'your email address';
    if (u.emailVerified) { goIn(); return; }
    clearInterval(timer); timer = setInterval(() => check(true), 4000);       // goes in by itself once confirmed
  });
  $('done').addEventListener('click', () => check(false));
  $('again').addEventListener('click', async () => {
    const b = $('again'); b.disabled = true;
    try { await auth.currentUser.sendEmailVerification({url: location.origin + '/home.html'}); say('A new confirmation email is on its way.', 'ok'); }
    catch (e) { say(e && e.code === 'auth/too-many-requests' ? 'We just sent one. Please wait a minute before asking again.' : 'Couldn’t send it right now. Please try again in a moment.', 'bad'); }
    setTimeout(() => { b.disabled = false; }, 30000);
  });
  $('out').addEventListener('click', (e) => { e.preventDefault(); auth.signOut().then(() => { location.href = 'signup.html'; }); });
</script>
</body>
</html>
