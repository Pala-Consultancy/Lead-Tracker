<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALA CONSULTANCY - Statistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --paper:#EFF5FC;
    --panel:#FFFFFF;
    --border:#D3E0EF;
    --teal:#1B59A5;
    --teal-dark:#123F78;
    --amber:#FF9D00;
    --red:#C0392B;
    --slate:#647084;
    --slate-light:#8A93A3;
    --shadow: 0 1px 2px rgba(27,59,110,0.05), 0 4px 14px rgba(27,59,110,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:26px;flex-wrap:wrap;gap:16px;
  }
  .title-block{
    background:linear-gradient(135deg, #1B59A5 0%, #123F78 100%);
    padding:18px 26px;border-radius:14px;
    display:inline-block;box-shadow:0 4px 16px rgba(18,63,120,0.3), var(--shadow);
  }
  .title-row{display:flex;align-items:center;gap:16px;}
  .logo-badge{
    width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-logo{height:30px;width:auto;flex-shrink:0;}
  .title-divider{width:1px;height:44px;background:rgba(255,255,255,0.18);flex-shrink:0;}
  .title-text{display:flex;flex-direction:column;gap:3px;}
  .eyebrow{
    font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);
  }
  h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:24px;font-weight:800;margin:0;
    letter-spacing:-0.015em;line-height:1.2;
    color:#fff;
  }
  .sub{
    color:rgba(255,255,255,0.6);font-size:13px;font-weight:500;margin-top:3px;
  }
  .btn{
    padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:700;
    background:var(--panel);border:1px solid var(--border);color:var(--ink);
    text-decoration:none;display:inline-flex;align-items:center;gap:7px;
    cursor:pointer;transition:background .15s, transform .1s;font-family:'Inter',sans-serif;
    box-shadow:var(--shadow);
  }
  .btn:hover{background:#F3F8FD;transform:translateY(-1px);}

  .section{margin-bottom:30px;}
  .section-title{
    font-family:'Sora',sans-serif;font-size:16.5px;font-weight:700;color:var(--ink);
    margin:0 0 14px;display:flex;align-items:center;gap:10px;
  }
  .section-icon{
    width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .section-icon svg{width:15px;height:15px;}

  .headline-card{
    background:linear-gradient(135deg, #1B59A5 0%, #123F78 100%);
    border-radius:14px;padding:26px 30px;margin-bottom:28px;color:#fff;
    box-shadow:0 4px 16px rgba(18,63,120,0.25), var(--shadow);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;
  }
  .headline-text{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.5;max-width:640px;}
  .headline-text strong{color:#FFB338;font-weight:800;}
  .headline-stats{display:flex;gap:26px;flex-wrap:wrap;}
  .headline-stat{text-align:center;}
  .headline-stat-value{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:700;}
  .headline-stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,0.6);margin-top:2px;}

  .stats-grid{
    display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;
  }
  .stat-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    display:flex;flex-direction:column;gap:10px;transition:transform .15s ease,box-shadow .15s ease;
  }
  .stat-card:hover{transform:translateY(-5px);box-shadow:0 10px 22px rgba(27,36,48,0.16);}
  .stat-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--stat-accent, var(--teal));
  }
  .stat-top{display:flex;align-items:center;gap:8px;}
  .stat-icon{
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    background:var(--stat-accent-soft, #EAF0F9);color:var(--stat-accent, var(--teal));flex-shrink:0;
  }
  .stat-icon svg{width:15px;height:15px;}
  .stat-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--slate);font-weight:600;
  }
  .stat-value{
    font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--ink);
    line-height:1;
  }
  .stat-value.small{font-size:17px;}
  .stat-sub{
    font-size:11.5px;color:var(--slate-light);font-family:'IBM Plex Mono',monospace;
  }

  .ring-row{display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;}
  .ring-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .ring-card:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(27,36,48,0.14);}
  .ring{position:relative;width:56px;height:56px;flex-shrink:0;}
  .ring svg{width:56px;height:56px;transform:rotate(-90deg);}
  .ring .ring-bg{fill:none;stroke:#E1EAF5;stroke-width:5;}
  .ring .ring-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring .ring-value{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:700;color:var(--ink);
  }
  .ring-body{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .ring-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:700;}
  .ring-sub{font-size:11.5px;color:var(--slate-light);font-family:'IBM Plex Mono',monospace;}

  .funnel{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    box-shadow:var(--shadow);padding:26px 28px;position:relative;overflow:hidden;
  }
  .funnel::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,
      #1D5FA8 0%, #1D5FA8 20%,
      #A9660F 20%, #A9660F 40%,
      #7A4FB5 40%, #7A4FB5 60%,
      #1F5C4F 60%, #1F5C4F 80%,
      #C0392B 80%, #C0392B 100%);
  }
  .funnel-row{display:flex;align-items:center;gap:16px;margin-bottom:14px;}
  .funnel-row:last-child{margin-bottom:0;}
  .funnel-label{width:110px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--ink);}
  .funnel-track{
    flex:1;height:32px;border-radius:7px;background:#F3F8FD;overflow:hidden;position:relative;
  }
  .funnel-fill{
    height:100%;border-radius:7px;transition:width .5s ease;display:flex;align-items:center;
    padding-left:12px;white-space:nowrap;min-width:2px;
  }
  .funnel-fill span{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:#fff;}
  .funnel-count{width:100px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);}

  .table-wrap{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);position:relative;
  }
  .table-wrap::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--table-accent, var(--teal));}
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--slate);font-weight:700;padding:13px 16px 12px;border-bottom:1px solid var(--border);
    background:#F8FBFE;
  }
  tbody td{
    padding:11px 16px;font-size:13.5px;border-bottom:1px solid #EEF4FC;vertical-align:middle;
  }
  tbody tr:nth-child(even){background:#FBFDFF;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#EEF5FC;}
  .name-cell{font-weight:700;display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .bar-cell{display:flex;align-items:center;gap:10px;}
  .bar-track{flex:1;height:6px;background:#EEF4FC;border-radius:3px;overflow:hidden;max-width:120px;}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .rank-badge{
    width:20px;height:20px;border-radius:50%;background:#F3F8FD;color:var(--slate);
    display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
    font-family:'IBM Plex Mono',monospace;flex-shrink:0;
  }
  .rank-badge.gold{background:#FFF1DC;color:#A9660F;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:900px){
    .two-col{grid-template-columns:1fr;}
    .stats-grid{grid-template-columns:repeat(2, 1fr);}
    .ring-row{grid-template-columns:repeat(2, 1fr);}
    .headline-card{flex-direction:column;align-items:flex-start;}
  }
  .empty-state{
    text-align:center;padding:80px 20px;color:var(--slate);
    background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  }
  .empty-state h3{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:var(--ink);margin:0 0 6px;}

  /* ---------- Login screen ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    box-shadow:0 10px 30px rgba(27,59,110,0.12), var(--shadow);
    padding:36px 34px;width:100%;max-width:380px;
  }
  .login-logo-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .login-logo-badge{
    width:44px;height:44px;border-radius:10px;background:#1B59A5;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .login-logo-badge img{height:24px;width:auto;}
  .login-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;color:var(--ink);}
  .login-sub{font-size:12.5px;color:var(--slate);margin-top:2px;}
  #loginForm{margin-top:0;}
  #loginForm .field{margin-bottom:14px;display:flex;flex-direction:column;gap:5px;}
  #loginForm label{
    font-size:11.5px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;
  }
  #loginForm input{
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 11px;
    border:1px solid var(--border);border-radius:6px;background:#F6FAFE;color:var(--ink);width:100%;
  }
  #loginForm input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(27,89,165,0.14);}
  .login-error{
    background:#FBE4E2;color:#C0392B;font-size:12.5px;font-weight:600;
    padding:9px 12px;border-radius:7px;margin-bottom:14px;display:none;
  }
  .login-error.show{display:block;}
  #loginForm .btn-primary{
    width:100%;justify-content:center;padding:11px;margin-top:4px;
    background:var(--teal);color:#fff;border:1px solid var(--teal);border-radius:8px;
    font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;
  }
  .login-footer-note{
    text-align:center;font-size:11.5px;color:var(--slate-light);margin-top:18px;
  }
  #appRoot{display:none;}
  footer{text-align:center;color:var(--slate-light);font-size:12px;margin-top:30px;}
</style>
</head>

    Other:    {bg:"#EDEDED", fg:"#5A5A5A", dot:"#5A5A5A"}
  };
  const STATUS_COLORS = {
    New:{fg:"#1D5FA8",bg:"#E3EEFA"},
    Contacted:{fg:"#A9660F",bg:"#FBEEDC"},
    "Call booked":{fg:"#7A4FB5",bg:"#EFE5FA"},
    Won:{fg:"#1F5C4F",bg:"#DEF0EA"},
    Lost:{fg:"#C0392B",bg:"#FBE4E2"}
  };
  const BOARD_STATUSES = ['New','Contacted','Call booked','Won','Lost'];

  const ICONS = {
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    funnel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    coin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>',
    xCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 11 3.83a2 2 0 0 0-1.42-.58H4a1 1 0 0 0-1 1v5.58a2 2 0 0 0 .58 1.42l9.59 9.59a2 2 0 0 0 2.82 0l5.6-5.6a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1"/></svg>'
  };

  let leads = [];
  let currency = "EUR";
  function initFirebaseSync(){
    if(!firebaseConnected){
      document.getElementById("content").innerHTML = `<div class="empty-state">
        <h3>Not connected to shared database</h3>
        <p>Add your Firebase project config near the top of this page's script (the same one used in the tracker) to see live statistics.</p>
      </div>`;
      return;
    }
    leadsCollection.onSnapshot(snapshot=>{
      leads = snapshot.docs.map(doc=>({id:doc.id, ...doc.data()}));
      render();
    }, err=>{
      console.error("Firestore sync error", err);
      document.getElementById("content").innerHTML = `<div class="empty-state">
        <h3>Could not load data</h3>
        <p>${esc(err.message)}</p>
      </div>`;
    });
  }
  function loadCurrency(){
    try{ currency = localStorage.getItem(CURRENCY_KEY) || "EUR"; } catch(e){ currency = "EUR"; }
  }
  function esc(s){ return (s||"").toString().replace(/[&<>"\']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\'":"&#39;"}[c])); }
  function formatMoney(n){
    const num = parseFloat(n)||0;
    try{
      return new Intl.NumberFormat("en-US", {
        style:"currency", currency: currency, currencyDisplay:"narrowSymbol",
        minimumFractionDigits: num%1===0?0:2, maximumFractionDigits:2
      }).format(num);
    }catch(e){
      return num.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    }
  }

  function ringSVG(pct, color){
    const r = 20, c = 2*Math.PI*r;
    const p = pct===null ? 0 : Math.max(0,Math.min(100,pct));
    const offset = c * (1 - p/100);
    return `<div class="ring">
      <svg viewBox="0 0 48 48">
        <circle class="ring-bg" cx="24" cy="24" r="${r}"/>
        <circle class="ring-fg" cx="24" cy="24" r="${r}" style="stroke:${color};stroke-dasharray:${c.toFixed(2)};stroke-dashoffset:${offset.toFixed(2)}"/>
      </svg>
      <span class="ring-value">${pct===null?"—":pct+"%"}</span>
    </div>`;
  }

  function statCard({icon, accent, accentSoft, label, value, sub, small}){
    return `<div class="stat-card" style="--stat-accent:${accent};--stat-accent-soft:${accentSoft}">
      <div class="stat-top">
        <div class="stat-icon">${ICONS[icon]}</div>
        <div class="stat-label">${label}</div>
      </div>
      <div class="stat-value${small?" small":""}">${value}</div>
      ${sub ? `<div class="stat-sub">${sub}</div>` : ""}
    </div>`;
  }

  function ringCard({pct, accent, accentSoft, label, sub}){
    return `<div class="ring-card">
      ${ringSVG(pct, accent)}
      <div class="ring-body">
        <div class="ring-label">${label}</div>
        ${sub ? `<div class="ring-sub">${sub}</div>` : ""}
      </div>
    </div>`;
  }

  function render(){
    const container = document.getElementById("content");
    if(leads.length===0){
      container.innerHTML = `<div class="empty-state">
        <h3>No data yet</h3>
        <p>Add some leads in the tracker first, then come back here to see the full breakdown.</p>
      </div>`;
      return;
    }

    const total = leads.length;
    const wonCount = leads.filter(l=>l.status==="Won").length;
    const lostCount = leads.filter(l=>l.status==="Lost").length;
    const activeCount = leads.filter(l=>["New","Contacted","Call booked"].includes(l.status)).length;
    const totalRevenue = leads.reduce((s,l)=>s+(parseFloat(l.revenue)||0),0);
    const avgDealSize = wonCount>0 ? totalRevenue/wonCount : null;
    const avgAllLeads = total>0 ? totalRevenue/total : null;

    const sentCount = leads.filter(l=>l.requestSent).length;
    const acceptedCount = leads.filter(l=>l.requestAccepted).length;
    const contactedCount = leads.filter(l=>l.contacted).length;
    const repliedCount = leads.filter(l=>l.replied).length;
    const callReached = leads.filter(l=>["Call booked","Won","Lost"].includes(l.status));
    const showedUpCount = callReached.filter(l=>l.showedUp).length;

    const acceptRate = sentCount>0 ? Math.round((acceptedCount/sentCount)*100) : null;
    const replyRate = contactedCount>0 ? Math.round((repliedCount/contactedCount)*100) : null;
    const showUpRate = callReached.length>0 ? Math.round((showedUpCount/callReached.length)*100) : null;
    const winRate = total>0 ? Math.round((wonCount/total)*100) : null;
    const lostRate = total>0 ? Math.round((lostCount/total)*100) : null;

    // Headline
    const headlineHTML = `<div class="headline-card">
      <div class="headline-text">
        You've closed <strong>${wonCount} of ${total}</strong> leads (<strong>${winRate??0}%</strong>) worth <strong>${formatMoney(totalRevenue)}</strong> in total revenue.
      </div>
      <div class="headline-stats">
        <div class="headline-stat"><div class="headline-stat-value">${activeCount}</div><div class="headline-stat-label">Still active</div></div>
        <div class="headline-stat"><div class="headline-stat-value">${acceptRate??"—"}${acceptRate!==null?"%":""}</div><div class="headline-stat-label">Accept rate</div></div>
        <div class="headline-stat"><div class="headline-stat-value">${showUpRate??"—"}${showUpRate!==null?"%":""}</div><div class="headline-stat-label">Show up rate</div></div>
      </div>
    </div>`;

    // KPI row
    const kpiHTML = `<div class="section">
      <h2 class="section-title"><div class="section-icon" style="background:#E3EEFA;color:#1B59A5">${ICONS.users}</div>Overview</h2>
      <div class="stats-grid">
        ${statCard({icon:"users", accent:"#1B59A5", accentSoft:"#E3EEFA", label:"Total leads", value:total})}
        ${statCard({icon:"funnel", accent:"#FF9D00", accentSoft:"#FFF1DC", label:"Active pipeline", value:activeCount, sub:"New · Contacted · Call booked"})}
        ${statCard({icon:"check", accent:"#1F5C4F", accentSoft:"#DEF0EA", label:"Won", value:wonCount, sub: winRate!==null?`${winRate}% of all leads`:null})}
        ${statCard({icon:"xCircle", accent:"#C0392B", accentSoft:"#FBE4E2", label:"Lost", value:lostCount, sub: lostRate!==null?`${lostRate}% of all leads`:null})}
        ${statCard({icon:"coin", accent:"#7A4FB5", accentSoft:"#EFE5FA", label:"Total revenue", value:formatMoney(totalRevenue), small:true})}
        ${statCard({icon:"coin", accent:"#1B59A5", accentSoft:"#E3EEFA", label:"Avg. won deal", value: avgDealSize!==null?formatMoney(avgDealSize):"—", small:true})}
        ${statCard({icon:"coin", accent:"#FF9D00", accentSoft:"#FFF1DC", label:"Avg. value per lead", value: avgAllLeads!==null?formatMoney(avgAllLeads):"—", small:true, sub:"across every lead, won or not"})}
        ${statCard({icon:"tag", accent:"#1F5C4F", accentSoft:"#DEF0EA", label:"Leads sourced", value: leads.filter(l=>l.source).length, sub:"with a source recorded"})}
        ${statCard({icon:"tag", accent:"#7A4FB5", accentSoft:"#EFE5FA", label:"Calls booked", value: callReached.length, sub:"reached Call booked or beyond"})}
      </div>
    </div>`;

    // Rings
    const ringsHTML = `<div class="section">
      <h2 class="section-title"><div class="section-icon" style="background:#EFE5FA;color:#7A4FB5">${ICONS.tag}</div>Outreach performance</h2>
      <div class="ring-row">
        ${ringCard({pct:acceptRate, accent:"#1B59A5", accentSoft:"#E3EEFA", label:"Accept rate", sub:`${acceptedCount}/${sentCount} sent`})}
        ${ringCard({pct:replyRate, accent:"#FF9D00", accentSoft:"#FFF1DC", label:"Reply rate", sub:`${repliedCount}/${contactedCount} contacted`})}
        ${ringCard({pct:showUpRate, accent:"#7A4FB5", accentSoft:"#EFE5FA", label:"Show up rate", sub:`${showedUpCount}/${callReached.length} calls booked`})}
        ${ringCard({pct:winRate, accent:"#1F5C4F", accentSoft:"#DEF0EA", label:"Closing rate", sub:`${wonCount}/${total} total leads`})}
      </div>
    </div>`;

    // Funnel
    const stages = [
      {label:"New", count: leads.filter(l=>l.status==="New").length, color:"#1D5FA8"},
      {label:"Contacted", count: leads.filter(l=>l.status==="Contacted").length, color:"#A9660F"},
      {label:"Call booked", count: leads.filter(l=>l.status==="Call booked").length, color:"#7A4FB5"},
      {label:"Won", count: wonCount, color:"#1F5C4F"},
      {label:"Lost", count: lostCount, color:"#C0392B"}
    ];
    const maxStage = Math.max(1, ...stages.map(s=>s.count));
    const funnelRowsHTML = stages.map(s=>{
      const widthPct = Math.max(Math.round((s.count/maxStage)*100), s.count>0?4:0);
      return `<div class="funnel-row">
        <div class="funnel-label">${s.label}</div>
        <div class="funnel-track"><div class="funnel-fill" style="width:${widthPct}%;background:${s.color}"><span>${s.count>0?s.count:""}</span></div></div>
        <div class="funnel-count">${total>0?Math.round((s.count/total)*100):0}% of total</div>
      </div>`;
    }).join("");
    const funnelHTML = `<div class="section">
      <h2 class="section-title"><div class="section-icon" style="background:#FFF1DC;color:#A9660F">${ICONS.funnel}</div>Pipeline funnel</h2>
      <div class="funnel">
        ${funnelRowsHTML}
      </div>
    </div>`;

    // Breakdown by source
    const bySource = {};
    leads.forEach(l=>{
      const s = l.source || "Other";
      if(!bySource[s]) bySource[s] = {count:0, revenue:0, won:0};
      bySource[s].count++;
      bySource[s].revenue += parseFloat(l.revenue)||0;
      if(l.status==="Won") bySource[s].won++;
    });
    const sourceRows = Object.entries(bySource).sort((a,b)=>b[1].count-a[1].count);
    const maxSourceCount = Math.max(1, ...sourceRows.map(r=>r[1].count));
    const sourceTableHTML = sourceRows.map(([name, d])=>{
      const sc = SOURCE_COLORS[name] || SOURCE_COLORS.Other;
      const winPct = d.count>0 ? Math.round((d.won/d.count)*100) : 0;
      return `<tr>
        <td><div class="name-cell"><span class="dot" style="background:${sc.dot}"></span>${esc(name)}</div></td>
        <td class="bar-cell"><span class="mono">${d.count}</span><div class="bar-track"><div class="bar-fill" style="width:${(d.count/maxSourceCount)*100}%;background:${sc.dot}"></div></div></td>
        <td class="mono">${formatMoney(d.revenue)}</td>
        <td class="mono">${winPct}%</td>
      </tr>`;
    }).join("");

    // Breakdown by industry
    const byIndustry = {};
    leads.forEach(l=>{
      const ind = l.industry || "Not specified";
      if(!byIndustry[ind]) byIndustry[ind] = {count:0, revenue:0};
      byIndustry[ind].count++;
      byIndustry[ind].revenue += parseFloat(l.revenue)||0;
    });
    const industryRows = Object.entries(byIndustry).sort((a,b)=>b[1].count-a[1].count);
    const maxIndustryCount = Math.max(1, ...industryRows.map(r=>r[1].count));
    const industryTableHTML = industryRows.map(([name, d])=>{
      return `<tr>
        <td><div class="name-cell">${esc(name)}</div></td>
        <td class="bar-cell"><span class="mono">${d.count}</span><div class="bar-track"><div class="bar-fill" style="width:${(d.count/maxIndustryCount)*100}%;background:#7A4FB5"></div></div></td>
        <td class="mono">${formatMoney(d.revenue)}</td>
      </tr>`;
    }).join("");

    // Breakdown by country
    const byCountry = {};
    leads.forEach(l=>{
      const c = l.country || "Not specified";
      if(!byCountry[c]) byCountry[c] = {count:0, revenue:0};
      byCountry[c].count++;
      byCountry[c].revenue += parseFloat(l.revenue)||0;
    });
    const countryRows = Object.entries(byCountry).sort((a,b)=>b[1].count-a[1].count).slice(0,10);
    const maxCountryCount = Math.max(1, ...countryRows.map(r=>r[1].count));
    const countryTableHTML = countryRows.map(([name, d])=>{
      return `<tr>
        <td><div class="name-cell">${esc(name)}</div></td>
        <td class="bar-cell"><span class="mono">${d.count}</span><div class="bar-track"><div class="bar-fill" style="width:${(d.count/maxCountryCount)*100}%;background:#FF9D00"></div></div></td>
        <td class="mono">${formatMoney(d.revenue)}</td>
      </tr>`;
    }).join("");

    // Revenue by month
    function monthKey(dateStr){ if(!dateStr || dateStr.length<7) return "0000-00"; return dateStr.slice(0,7); }
    const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    function monthLabel(key){
      if(key==="0000-00") return "No date";
      const [y,m] = key.split("-");
      return `${MONTH_NAMES[parseInt(m,10)-1]||"?"} ${y}`;
    }
    const byMonth = {};
    leads.forEach(l=>{
      const k = monthKey(l.dateAdded);
      if(!byMonth[k]) byMonth[k] = {revenue:0, count:0, won:0};
      byMonth[k].revenue += parseFloat(l.revenue)||0;
      byMonth[k].count++;
      if(l.status==="Won") byMonth[k].won++;
    });
    const monthKeys = Object.keys(byMonth).sort();
    const maxMonthRevenue = Math.max(1, ...monthKeys.map(k=>byMonth[k].revenue));
    const monthTableHTML = monthKeys.slice().reverse().map(k=>{
      const d = byMonth[k];
      const rate = d.count>0 ? Math.round((d.won/d.count)*100) : 0;
      return `<tr>
        <td><div class="name-cell">${esc(monthLabel(k))}</div></td>
        <td class="mono">${d.count}</td>
        <td class="bar-cell"><span class="mono">${formatMoney(d.revenue)}</span><div class="bar-track"><div class="bar-fill" style="width:${(d.revenue/maxMonthRevenue)*100}%;background:#1B59A5"></div></div></td>
        <td class="mono">${rate}%</td>
      </tr>`;
    }).join("");

    // Top won deals
    const topWon = leads.filter(l=>l.status==="Won" && parseFloat(l.revenue)>0)
      .sort((a,b)=>(parseFloat(b.revenue)||0)-(parseFloat(a.revenue)||0)).slice(0,8);
    const topWonHTML = topWon.length>0 ? topWon.map((l,i)=>{
      const sc = SOURCE_COLORS[l.source]||SOURCE_COLORS.Other;
      return `<tr>
        <td><div class="name-cell"><span class="rank-badge${i===0?' gold':''}">${i+1}</span>${esc(l.name)||"Unnamed"}</div></td>
        <td>${esc(l.company)||"—"}</td>
        <td><div class="name-cell"><span class="dot" style="background:${sc.dot}"></span>${esc(l.source)}</div></td>
        <td class="mono">${formatMoney(l.revenue)}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--slate-light);padding:24px;">No won deals with revenue recorded yet</td></tr>`;

    const tablesHTML = `
      <div class="section">
        <h2 class="section-title"><div class="section-icon" style="background:#E3EEFA;color:#1B59A5">${ICONS.coin}</div>Revenue by month</h2>
        <div class="table-wrap" style="--table-accent:#1B59A5">
          <table>
            <thead><tr><th>Month</th><th>Leads</th><th>Revenue</th><th>Closing rate</th></tr></thead>
            <tbody>${monthTableHTML}</tbody>
          </table>
        </div>
      </div>

      <div class="section two-col">
        <div>
          <h2 class="section-title"><div class="section-icon" style="background:#E3EEFA;color:#1B59A5">${ICONS.tag}</div>By source</h2>
          <div class="table-wrap" style="--table-accent:#1B59A5">
            <table>
              <thead><tr><th>Source</th><th>Leads</th><th>Revenue</th><th>Win rate</th></tr></thead>
              <tbody>${sourceTableHTML}</tbody>
            </table>
          </div>
        </div>
        <div>
          <h2 class="section-title"><div class="section-icon" style="background:#EFE5FA;color:#7A4FB5">${ICONS.tag}</div>By industry</h2>
          <div class="table-wrap" style="--table-accent:#7A4FB5">
            <table>
              <thead><tr><th>Industry</th><th>Leads</th><th>Revenue</th></tr></thead>
              <tbody>${industryTableHTML}</tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="section two-col">
        <div>
          <h2 class="section-title"><div class="section-icon" style="background:#FFF1DC;color:#A9660F">${ICONS.tag}</div>Top countries</h2>
          <div class="table-wrap" style="--table-accent:#FF9D00">
            <table>
              <thead><tr><th>Country</th><th>Leads</th><th>Revenue</th></tr></thead>
              <tbody>${countryTableHTML}</tbody>
            </table>
          </div>
        </div>
        <div>
          <h2 class="section-title"><div class="section-icon" style="background:#DEF0EA;color:#1F5C4F">${ICONS.check}</div>Top won deals</h2>
          <div class="table-wrap" style="--table-accent:#1F5C4F">
            <table>
              <thead><tr><th>Lead</th><th>Company</th><th>Source</th><th>Revenue</th></tr></thead>
              <tbody>${topWonHTML}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    container.innerHTML = headlineHTML + kpiHTML + ringsHTML + funnelHTML + tablesHTML;
  }

  loadCurrency();

  // ---------- Authentication gate ----------
  const loginScreen = document.getElementById('loginScreen');
  const appRoot = document.getElementById('appRoot');
  const loginError = document.getElementById('loginError');

  function showLoginError(msg){
    loginError.textContent = msg;
    loginError.classList.add('show');
  }
  function clearLoginError(){
    loginError.classList.remove('show');
    loginError.textContent = '';
  }

  if(!firebaseConnected){
    loginScreen.innerHTML = `<div class="login-card">
      <div class="login-title">Not connected</div>
      <div class="login-sub" style="margin-top:8px;line-height:1.5">This page isn't connected to Firebase yet. Add your Firebase project config near the top of this file's script.</div>
    </div>`;
    loginScreen.style.display = 'flex';
    appRoot.style.display = 'none';
  } else {
    document.getElementById('loginForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      clearLoginError();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';
      auth.signInWithEmailAndPassword(email, password).catch(err=>{
        showLoginError('Could not sign in: ' + err.message);
      }).finally(()=>{
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      });
    });
    auth.onAuthStateChanged(user=>{
      if(user){
        loginScreen.style.display = 'none';
        appRoot.style.display = '';
        clearLoginError();
        initFirebaseSync();
      } else {
        loginScreen.style.display = 'flex';
        appRoot.style.display = 'none';
      }
    });
  }
})();
</script>
</body>
</html>
